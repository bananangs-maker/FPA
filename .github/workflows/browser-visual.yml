name: FPA browser and PDF visual QA
on:
  push:
    branches:
      - main
      - 'feature/fpa-decision-completion-*'
      - 'quality/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install open-source browser test tools
        run: npm install --no-save --ignore-scripts playwright@1.58.2 pdf-lib@1.17.1
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Build FPA Studio
        run: npm run build
      - name: Validate desktop, mobile, dark, exported tables and 1-page A4 report
        run: node scripts/verify-browser-visual.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fpa-visual-qa
          path: artifacts/browser-visual/*
          if-no-files-found: ignore
          retention-days: 7
