<style>

function validateState(s){if(!s||s.version!==VERSION||!Array.isArray(s.cases)||!s.cases.length||s.cases.length>100)return false;let caseIds=new Set();for(const c of s.cases){if(!c.id||caseIds.has(c.id)||!['계획','실적','추정'].includes(c.kind)||typeof c.scenario!=='string'||typeof c.name!=='string'||!Number.isInteger(c.year)||c.year<2000||c.year>2200)return false;caseIds.add(c.id);if(!validScenarioMeta(c))return false;for(const k of ['products','rows','bom','labor','mfgPools','sgPools'])if(!Array.isArray(c[k])||c[k].length>100000)return false;if(!Array.isArray(c.sites))return false;let siteNames=new Set(),siteIds=new Set();for(const site of c.sites){if(!site||typeof site.id!=='string'||!site.id||siteIds.has(site.id)||typeof site.name!=='string'||!site.name.trim()||site.name!==site.name.trim()||site.name.length>80||siteNames.has(site.name))return false;siteNames.add(site.name);siteIds.add(site.id);}if(c.products.some(p=>!siteNames.has(p.site)))return false;let ps=new Set(),rs=new Set();for(const p of c.products){if(!p.id||ps.has(p.id)||typeof p.name!=='string'||!p.name.trim()||typeof p.site!=='string'||!p.site.trim())return false;ps.add(p.id);for(const k of ['openingQty','openingValue','openingDA'])if(p[k]!==null&&(typeof p[k]!=='number'||!Number.isFinite(p[k])||p[k]<0))return false;if(p.openingDA>p.openingValue)return false;}for(const r of c.rows){if(!ps.has(r.product)||!Number.isInteger(r.m)||r.m<1||r.m>12||rs.has(r.product+':'+r.m))return false;rs.add(r.product+':'+r.m);for(const k of ['qty','usd','fx','krw','production','yield','days','towers','powerUse','powerPrice','steamUse','steamPrice','fuelUse','fuelPrice','waterUse','waterPrice','repair','consumable','freightRate','packRate'])if(r[k]!==null&&(typeof r[k]!=='number'||!Number.isFinite(r[k])||r[k]<0))return false;if((r.yield!==null&&(r.yield<=0||r.yield>1))||r.days>31||!['USD','KRW'].includes(r.currency))return false;}if(c.rows.length!==c.products.length*12)return false;for(const b of c.bom){if(!ps.has(b.product)||!Number.isInteger(b.m)||b.m<1||b.m>12||typeof b.material!=='string'||!['USD','KRW'].includes(b.currency))return false;for(const k of ['ratio','usd','fx','krw'])if(b[k]!==null&&(typeof b[k]!=='number'||!Number.isFinite(b[k])||b[k]<0))return false;if(b.ratio>1)return false;}for(const key of ['labor','mfgPools','sgPools'])for(const p of c[key]){if(!Number.isInteger(p.m)||p.m<1||p.m>12||!['shared','site','product'].includes(p.scope)||typeof p.account!=='string'||typeof p.target!=='string'||(p.amount!==null&&(typeof p.amount!=='number'||!Number.isFinite(p.amount)||p.amount<0))||!BASES[p.basisSite]||!BASES[p.basisProduct]||(p.scope==='site'&&!siteNames.has(p.target)))return false;}for(const key of ['rows','bom','labor','mfgPools','sgPools']){let ids=new Set();for(const r of c[key]){if(typeof r.id!=='string'||ids.has(r.id))return false;ids.add(r.id)}}}return true;}
function driver(r,b){if(b==='production')return r.production;if(b==='days')return r.days;if(b==='towerDays')return r.towers*r.days;if(b==='revenue')return r.revenue;return 1;}
function calculate(c){let out=[],warnings=[],allocations=[],poolChecks=[];const products=new Map(c.products.map(p=>[p.id,p]));const bomMap=new Map();c.bom.forEach(b=>{let k=b.product+':'+b.m;if(!bomMap.has(k))bomMap.set(k,[]);bomMap.get(k).push(b)});
for(const r of c.rows){let p=products.get(r.product);if(!p)continue;const bom=bomMap.get(r.product+':'+r.m)||[];let price=r.currency==='USD'?r.usd*r.fx:r.krw;let input=r.yield>0?num(r.production)/r.yield:0;if(r.production>0&&!(r.yield>0))warnings.push({level:'error',m:r.m,product:p.name,message:'수율 미입력 · 생산량에 해당하는 수율을 입력하세요. 현재 원가는 가계산입니다.'});if(r.qty>0&&((r.currency==='USD'&&(!(r.usd>0)||!(r.fx>0)))||(r.currency==='KRW'&&!(r.krw>0))))warnings.push({level:'error',m:r.m,product:p.name,message:'매출단가 또는 적용환율 미입력 · 현재 매출액은 가계산입니다.'});let material=sum(bom.map(b=>input*b.ratio*(b.currency==='USD'?b.usd*b.fx:b.krw)));if((r.production>0||bom.some(b=>b.ratio!==null))&&Math.abs(sum(bom.map(b=>b.ratio))-1)>1e-7)warnings.push({level:'warning',m:r.m,product:p.name,message:'BOM 투입비율 합계 '+percent(sum(bom.map(b=>b.ratio)))+' · 100%로 맞추세요.'});let utility=r.production*(r.powerUse*r.powerPrice+r.steamUse*r.steamPrice+r.fuelUse*r.fuelPrice+r.waterUse*r.waterPrice);out.push({...r,name:p.name,site:p.site,price,revenue:r.qty*price,input,material,utility,laborCost:0,mfgFixed:0,mfgDA:0,sgFixed:0,sgDA:0,freight:r.qty*price*r.freightRate,packing:r.qty*price*r.packRate});}
function allocate(pools,key){for(const pool of pools){let monthRows=out.filter(r=>r.m===pool.m), shares=[];const spread=(rows,amount,basis,stage)=>{let den=sum(rows.map(r=>driver(r,basis)));if(den<=0){if(amount>0)warnings.push({level:'error',m:pool.m,product:pool.account,message:stage+' 배부 기준이 0이거나 대상이 없어 '+fmt(amount)+'원 미배부'});return}rows.forEach(r=>shares.push({r,amount:amount*driver(r,basis)/den,productRate:driver(r,basis)/den,stage}));};
if(pool.scope==='product'){let rows=monthRows.filter(r=>r.product===pool.target);if(rows.length)shares.push({r:rows[0],amount:pool.amount,productRate:1,stage:'제품 직접비'});else if(pool.amount)warnings.push({level:'error',m:pool.m,product:pool.account,message:'직접비 대상 제품 없음 · '+fmt(pool.amount)+'원 미배부'});}else if(pool.scope==='site'){spread(monthRows.filter(r=>r.site===pool.target),pool.amount,pool.basisProduct,'공장→제품');}else {let sites=[...new Set(monthRows.map(r=>r.site))];let d=sum(monthRows.map(r=>driver(r,pool.basisSite)));if(d<=0){if(pool.amount)warnings.push({level:'error',m:pool.m,product:pool.account,message:'공통비 공장 배부 기준 0 · '+fmt(pool.amount)+'원 미배부'});}else for(const site of sites){let rows=monthRows.filter(r=>r.site===site);let siteRate=sum(rows.map(r=>driver(r,pool.basisSite)))/d;spread(rows,pool.amount*siteRate,pool.basisProduct,'공통→공장→제품');}}
for(const a of shares){let r=a.r;r[key]+=a.amount;if(pool.account==='감가상각비'){if(key==='mfgFixed')r.mfgDA+=a.amount;if(key==='sgFixed')r.sgDA+=a.amount;}let siteRows=monthRows.filter(x=>x.site===r.site);let siteRate=pool.scope==='shared'?(sum(siteRows.map(x=>driver(x,pool.basisSite)))/(sum(monthRows.map(x=>driver(x,pool.basisSite)))||1)):1;allocations.push({key,poolId:pool.id,m:pool.m,account:pool.account,scope:pool.scope,target:pool.target,product:r.product,name:r.name,site:r.site,total:pool.amount,siteRate,siteAmount:pool.amount*siteRate,productRate:a.productRate,allocated:a.amount,stage:a.stage});}poolChecks.push({key,id:pool.id,m:pool.m,account:pool.account,total:pool.amount,allocated:sum(shares.map(a=>a.amount))});}}
allocate(c.labor,'laborCost');allocate(c.mfgPools,'mfgFixed');allocate(c.sgPools,'sgFixed');
for(const p of c.products){let qty=p.openingQty,value=p.openingValue,da=p.openingDA;for(let m=1;m<=12;m++){let r=out.find(x=>x.product===p.id&&x.m===m);if(!r)continue;r.openQty=qty;r.openValue=value;r.openDA=da;r.repairCost=r.repair+r.consumable;r.mfgExpense=r.utility+r.repairCost+r.mfgFixed;r.mfgCost=r.material+r.laborCost+r.mfgExpense;r.availableQty=qty+r.production;r.availableValue=value+r.mfgCost;let availableDA=da+r.mfgDA;r.unitCost=r.availableQty>0?r.availableValue/r.availableQty:0;r.cogs=r.qty*r.unitCost;r.cogsDA=r.availableQty>0?availableDA*r.qty/r.availableQty:0;r.closeQty=r.availableQty-r.qty;r.closeValue=r.availableValue-r.cogs;r.closeDA=availableDA-r.cogsDA;
// COGS component mix for opening inventory is tracked separately; current material/labor/overhead are incurred costs.
r.gross=r.revenue-r.cogs;r.logistics=r.freight+r.packing;r.sg=r.sgFixed+r.logistics;r.op=r.gross-r.sg;r.ebitda=r.op+r.cogsDA+r.sgDA;r.opMargin=r.revenue?r.op/r.revenue:0;r.ebitdaMargin=r.revenue?r.ebitda/r.revenue:0;r.matPerKg=r.production?r.material/r.production:0;r.inventoryChange=r.closeValue-r.openValue;
if(r.closeQty < -1e-6)warnings.push({level:'error',m,product:p.name,message:'재고 부족 '+fmt(-r.closeQty,1)+'kg · 생산량/판매량을 수정하세요. 현재 손익은 가계산입니다.'});if(r.availableQty<=0&&r.availableValue>0)warnings.push({level:'error',m,product:p.name,message:'수량 없는 재고/제조원가 '+fmt(r.availableValue)+'원 · 매출원가에 반영되지 않음'});if(r.qty===0&&r.revenue===0&&r.sg>0){}qty=r.closeQty;value=r.closeValue;da=r.closeDA;}}
return {rows:out,warnings,allocations,poolChecks};}

function aggregate(rows){let a={};for(const k of ['qty','revenue','material','laborCost','mfgExpense','mfgCost','cogs','gross','sg','op','ebitda','mfgDA','sgDA','cogsDA','production','utility','repairCost','mfgFixed','sgFixed','logistics','freight','packing','inventoryChange','openValue','closeValue','openQty','closeQty'])a[k]=sum(rows.map(r=>r[k]));a.opMargin=a.revenue?a.op/a.revenue:0;a.ebitdaMargin=a.revenue?a.ebitda/a.revenue:0;a.matPerKg=a.production?a.material/a.production:0;return a;}

function inventoryScreen(){return '<div class="note">기초재고는 제품 관리에서 입력합니다. 월평균 단가 = (기초재고액 + 당월 제조원가)÷(기초수량 + 생산량). 음수 재고가 발생하면 검산 화면에 표시하며, 해당 시나리오 손익은 가계산입니다.</div>'+summaryByRow('월별 재고 회전',[['openQty','기초수량 kg','qty'],['openValue','기초재고액'],['production','생산량 kg','qty'],['mfgCost','당월 제조원가'],['qty','판매량 kg','qty'],['unitCost','월평균단가 원/kg','unitCost'],['cogs','매출원가'],['closeQty','기말수량 kg','qty'],['closeValue','기말재고액'],['mfgDA','당월 제조감가'],['cogsDA','매출원가 반영 제조감가'],['closeDA','기말재고 포함 감가']]);}
function checksScreen(){const m=model();let rows=m.warnings.map(w=>[w.level==='error'?'오류':'확인',w.m+'월',w.product,w.message]);let diff=sum(m.poolChecks.map(x=>x.total-x.allocated));let residual=Math.max(0,...m.rows.map(r=>Math.abs(r.openValue+r.mfgCost-r.cogs-r.closeValue)));let html='<div class="cards"><div class="card"><div class="card-label">확인 / 오류</div><div class="card-value">'+rows.length+'<small>건</small></div></div><div class="card"><div class="card-label">미배부 비용</div><div class="card-value">'+display(diff)+'<small>'+unitLabel()+'</small></div></div><div class="card"><div class="card-label">재고 흐름 최대 오차</div><div class="card-value">'+fmt(residual,6)+'<small>원</small></div></div><div class="card"><div class="card-label">제품 × 월</div><div class="card-value">'+m.rows.length+'<small>개</small></div></div></div>';html+=rows.length?panel('정합성 점검 내역',readonlyTable(['구분','월','대상','내용'],rows)):panel('정합성 점검','<div class="validation-ok"><b>✓</b><div><strong>현재 입력값의 계산 정합성을 통과했습니다.</strong><p class="muted">BOM 100% · 재고수량 · 배부 기준 · 비용 풀 합계</p></div></div>');return html+'<div class="note">검산은 계산 구조를 확인합니다. 입력한 단가·수율·계정 귀속의 업무 적정성은 사용자가 확인해야 합니다. 모든 비용은 매출원가 또는 판관비에 한 번만 반영하도록 등록하세요.</div>';}
function masterScreen(){let html=grid('sites',active().sites,[col('name','공장명','text'),col('products','연결 제품 수','ro',{value:r=>siteUsage(active(),r.name).products}),col('pools','공장 직접 비용 풀 수','ro',{value:r=>siteUsage(active(),r.name).pools})],'공장',{canDelete:true,action:'<button class="mini-button" onclick="addSiteDialog()">+ 공장 추가</button>'});html+='<div class="note">SITE 이름을 직접 수정할 수 있습니다. 이름을 바꾸면 현재 CASE의 제품과 공장 직접 비용 풀에도 반영됩니다. 사용 중인 SITE를 삭제할 때는 이동할 SITE를 선택합니다. 이 목록은 CASE별로 독립 저장됩니다.</div>';html+=grid('products',active().products,[col('name','제품명','text'),col('site','SITE','select',{choices:()=>active().sites.map(site=>site.name)}),col('openingQty','1월 기초수량 kg'),col('openingValue','1월 기초재고액 원'),col('openingDA','기초재고 포함 감가 원')],'제품·기초재고',{canDelete:true,action:'<button class="mini-button" onclick="addProduct()">+ 제품</button>'});html+='<details class="advanced-section"><summary>시나리오 관리</summary><div class="advanced-content">'+panel('시나리오 목록',readonlyTable(['시나리오','CASE','실적구분','연도','제품수','현재 선택'],state.cases.map(c=>[c.scenario,c.name,c.kind,c.year,c.products.length,c.id===state.active?'사용 중':''])),'<div class="tools"><button class="mini-button" onclick="editCaseDialog()">현재 CASE 이름 / 연도</button><button class="mini-button" onclick="deleteCase()">현재 CASE 삭제</button></div>')+'</div></details>';html+='<div class="note">제품과 기초재고는 CASE마다 독립적으로 보관됩니다. 제품을 추가하면 12개월 입력행이 생성됩니다. 제품의 SITE 변경은 해당 제품만 이동시키며 공장 직접 비용 풀은 기존 SITE에 유지됩니다. 제품을 삭제하면 해당 제품의 월별 입력과 제품 직접비도 삭제됩니다.</div><details class="advanced-section"><summary>데이터 초기화</summary><div class="advanced-content"><button onclick="resetSample()">전체 데이터를 빈 양식으로 초기화</button></div></details>';return html;}
function migrateSites(s){if(!s||!Array.isArray(s.cases))return;for(const c of s.cases){if(!c||Object.prototype.hasOwnProperty.call(c,'sites'))continue;const names=[...(Array.isArray(c.products)?c.products.map(p=>p?.site):[]),...['labor','mfgPools','sgPools'].flatMap(k=>Array.isArray(c[k])?c[k].filter(p=>p?.scope==='site').map(p=>p.target):[])].filter(n=>typeof n==='string'&&n.trim());c.sites=[...new Set(names)].map(name=>({id:uid(),name}));}}
function siteUsage(c,name){return {products:c.products.filter(p=>p.site===name).length,pools:sum(['labor','mfgPools','sgPools'].map(k=>c[k].filter(p=>p.scope==='site'&&p.target===name).length))};}
function checkedSiteName(c,name,exceptId=''){const value=String(name).trim();if(!value||value.length>80)throw Error('SITE명은 1~80자로 입력하세요.');if(c.sites.some(site=>site.id!==exceptId&&site.name===value))throw Error('동일한 SITE명이 이미 있습니다.');return value;}
function addSite(c,name){const value=checkedSiteName(c,name);const site={id:uid(),name:value};c.sites.push(site);return site;}
function renameSite(c,id,name){const site=c.sites.find(site=>site.id===id);if(!site)throw Error('SITE를 찾을 수 없습니다.');const value=checkedSiteName(c,name,id),old=site.name;site.name=value;c.products.filter(p=>p.site===old).forEach(p=>p.site=value);for(const k of ['labor','mfgPools','sgPools'])c[k].filter(p=>p.scope==='site'&&p.target===old).forEach(p=>p.target=value);return {old,name:value};}
function removeSite(c,id,replacement=''){const site=c.sites.find(site=>site.id===id);if(!site)throw Error('SITE를 찾을 수 없습니다.');const usage=siteUsage(c,site.name);if(c.sites.length===1&&(usage.products||usage.pools))throw Error('연결된 제품과 직접 비용 풀을 먼저 이동하거나 삭제하세요.');if(usage.products||usage.pools){if(!c.sites.some(s=>s.id!==id&&s.name===replacement))throw Error('제품과 비용 풀을 이동할 SITE를 선택하세요.');c.products.filter(p=>p.site===site.name).forEach(p=>p.site=replacement);for(const k of ['labor','mfgPools','sgPools'])c[k].filter(p=>p.scope==='site'&&p.target===site.name).forEach(p=>p.target=replacement);}c.sites=c.sites.filter(s=>s.id!==id);return {old:site.name,replacement:usage.products||usage.pools?replacement:''};}
function addSiteDialog(){modal('공장 추가','<p class="hint" style="margin-bottom:15px">현재 CASE의 SITE 목록에 추가합니다. 제품이 없어도 먼저 등록할 수 있습니다.</p>'+field('siteName','공장명','','text','required maxlength="80"'),data=>{try{checkedSiteName(active(),data.get('siteName'));rememberEdit('공장 추가');const site=addSite(active(),data.get('siteName'));save();closeModal();render();toast(site.name+' SITE를 추가했습니다.')}catch(e){toast(e.message)}},'추가');}
function deleteSiteDialog(id){const c=active(),site=c.sites.find(s=>s.id===id);const usage=siteUsage(c,site.name),used=usage.products||usage.pools;if(c.sites.length===1&&used){toast('연결된 제품과 직접 비용 풀을 먼저 이동하거나 삭제하세요.');return}const body='<p><strong>'+esc(site.name)+'</strong> SITE를 삭제합니다.</p>'+(used?'<div class="note">연결된 제품 '+usage.products+'개와 공장 직접 비용 풀 '+usage.pools+'개를 아래 SITE로 이동합니다. 월별 입력과 비용 금액은 보존됩니다.</div><label class="field">이동할 SITE<select name="replacement">'+c.sites.filter(s=>s.id!==id).map(s=>'<option value="'+esc(s.name)+'">'+esc(s.name)+'</option>').join('')+'</select></label>':'<div class="note">연결된 제품과 공장 직접 비용 풀이 없습니다.</div>');modal('공장 삭제',body,data=>{try{rememberEdit('공장 이동');const result=removeSite(c,id,String(data.get('replacement')||''));if(siteFilter===result.old){siteFilter=result.replacement;productFilter='';}save();closeModal();render();toast('SITE를 삭제했습니다.')}catch(e){toast(e.message)}},used?'이동하고 삭제':'SITE 삭제');}

function helpScreen(){return '<div class="help-grid">'+[
['01 / 기본 입력 순서','기준정보 → 매출·생산 → 제조원가 → 판관비 → 손익·검산 순서로 진행합니다. 상단에서 시나리오·CASE·실적구분을 바꾸면 해당 데이터만 계산합니다.'],
['SITE / 목록 편집','기준정보의 공장·제품 탭에서 SITE를 추가하고 이름을 변경할 수 있습니다. 사용 중인 SITE를 삭제하면 제품과 공장 직접 비용 풀을 선택한 다른 SITE로 이동합니다. 제품만 공장을 바꾸려면 제품 표의 SITE를 선택합니다. 기존 JSON 백업의 SITE 목록은 제품 및 공장 직접 비용 풀에서 자동 구성합니다.'],
['시나리오 설정','상단 작업 시나리오 옆 설정 버튼 또는 기준정보의 시나리오 설정 탭에서 현재 입력값을 확인합니다. 기준 시나리오를 선택하면 기준값·현재값·변동을 비교합니다. 변경된 변수만 모아보거나 공장·제품·월·계정 구분으로 좁힐 수 있습니다. 일괄 조정 기록은 이 버전 이후 실행한 조정부터 저장합니다.'],
['02 / 시나리오와 실적구분','시나리오 복제는 현재 CASE 전체를 독립 복사합니다. 새 시나리오명·CASE명·계획/실적/추정·연도를 지정합니다. 다른 CASE를 비교 기준으로 고르면 연간 손익 증감을 확인할 수 있습니다.'],
['03 / 재료비와 유틸리티','총투입량 = 양품 생산량 ÷ 수율. 자재비 = 총투입량 × 투입비율 × 적용 원화단가. 투입비율 합계는 100%입니다. 유틸리티 = 생산량 × kg당 사용량 × 단가. 원화 거래는 KRW 입력값, 달러 거래는 USD×환율을 적용합니다.'],
['04 / 2단계 비용 배부','공통비는 먼저 공장별 기준 합계 비율로 나누고, 각 공장에서 다시 제품 기준 비율로 나눕니다. 공장 직접비는 그 공장 제품만 대상으로, 제품 직접비는 해당 제품에 전액 귀속합니다. 기준이 0이면 미배부로 표시합니다. 설비×가동일수는 각 제품의 입력값을 사용합니다.'],
['05 / 재고와 매출원가','월별 총평균법을 적용합니다. 매출원가 = 판매량 × (기초재고액+당월제조원가)÷(기초수량+생산량). 기말재고는 다음 달 기초로 이월합니다. 재료비·노무비·제조경비 행은 발생액이며, 발생원가에서 재고 증감을 차감하면 매출원가가 됩니다.'],
['06 / 영업이익과 EBITDA','영업이익 = 매출액−매출원가−판관비. EBITDA = 영업이익+매출원가에 반영된 제조감가+판관감가. 제조감가는 재고에 포함된 부분을 이월 추적합니다. 무형자산 상각은 별도 분류하지 않으므로 필요 시 감가상각비 계정에 포함하여 관리합니다.'],
['07 / 연간 합계와 표시 단위','연간 이익률 = 연간 이익÷연간 매출. kg당 재료비 = 연간 발생재료비÷연간 생산량. 월별 비율의 단순 평균을 사용하지 않습니다. 내부 계산은 원이며 원/천원/백만원/억원 선택은 보고서 표시만 바꿉니다. 입력값은 항상 원입니다.'],
['08 / 저장과 독립 실행','자동 저장은 같은 기기·같은 브라우저에 한정됩니다. 백업 저장은 전체 시나리오가 포함된 JSON 파일입니다. HTML 받기는 외부 라이브러리 없는 독립 프로그램이며 현재 입력값을 포함합니다. 내려받은 HTML을 열어 인터넷 없이 사용할 수 있습니다. 데이터를 옮기거나 보관할 때 JSON 백업도 함께 저장하세요.'],
['09 / 일괄 조정과 표 붙여넣기','변수 조정에서 제품·기간별 판매량, 생산량, 매출 환율, 자재별 환율, 유틸리티별 사용량·단가, 노무 조직·제조·판관 계정별 비용을 독립 설정합니다. 조정값은 저장되며 1%를 2%로 바꾸면 최초 기준의 2%가 됩니다. 같은 값은 중복 적용되지 않습니다. 표의 열 제목을 누르면 표시 중인 행 전체가 선택됩니다. 범위 선택 버튼을 켜고 드래그하거나 Shift로 부분 범위를, Ctrl(맥: ⌘)로 떨어진 셀을 선택한 뒤 하단에서 같은 값을 적용하세요. 전체 월은 월 필터를 전체로 바꾼 후 선택합니다. Esc로 선택을 해제하면 개별 입력할 수 있습니다. 탭·줄바꿈 붙여넣기와 한 번에 되돌리기도 지원합니다.'],
['10 / 운영 범위','단일 사용자의 연간 시뮬레이션 버전입니다. 서버 DB·사용자 권한·동시 편집·수정 이력·ERP 자동 연동은 포함하지 않습니다. VAT·금융손익·법인세·재공품·부산물·표준원가차이·공정 간 대체는 별도 모델이 필요합니다. 기초재고는 제품 완제품만 입력합니다.']
].map(([t,p])=>'<section><h3>'+t.replace(/^\d+ \/ /,'')+'</h3><p>'+p+'</p></section>').join('')+'</div>';}
function cellValue(col,value){if(col.kind==='select'){let choices=typeof col.choices==='function'?null:col.choices;if(col.key==='m')return Number(value);return String(value)}if(col.kind==='n'){if(String(value).trim()==='')return null;let n=Number(String(value).replace(/,/g,'').trim());if(!Number.isFinite(n)||String(value).trim()==='')throw Error(col.label+'에 유효한 숫자를 입력하세요.');if(n<(col.min??0)||(col.max!==undefined&&n>col.max))throw Error(col.label+'의 범위를 확인하세요.');return col.percent?n/100:n;}let s=String(value).trim();if((col.key==='name'||col.key==='site'||col.key==='material'||col.key==='account')&&!s)throw Error(col.label+'은 비울 수 없습니다.');return s;}
function commitCell(reg,row,col,value){if(reg.source==='sites'&&col.key==='name'){const result=renameSite(active(),row.id,value);if(siteFilter===result.old)siteFilter=result.name;return}let v=cellValue(col,value);if(col.key==='scope'&&((v==='site'&&!active().sites.length)||(v==='product'&&!active().products.length)))throw Error('귀속 대상인 공장 또는 제품을 먼저 등록하세요.');if(reg.source==='products'&&col.key==='openingDA'&&v>row.openingValue)throw Error('기초 감가는 기초재고액보다 클 수 없습니다.');if(reg.source==='products'&&col.key==='openingValue'&&v<row.openingDA)throw Error('기초재고액은 포함 감가보다 작을 수 없습니다.');if(reg.source==='products'&&col.key==='site'&&!active().sites.some(s=>s.name===v))throw Error('등록된 SITE를 선택하세요.');row[col.key]=v;if(col.key==='scope'){row.target=v==='shared'?'':v==='site'?(active().sites[0]?.name||''):(active().products[0]?.id||'');}}

function editCell(el){let reg=gridRegistry[el.dataset.grid],r=reg.rows[Number(el.dataset.row)],c=reg.cols[Number(el.dataset.col)],historyBefore=editHistory.slice();try{if(r[c.key]!==cellValue(c,el.value))rememberEdit();commitCell(reg,r,c,el.value);save();render();if(lastPointerCell&&(lastPointerCell.grid!==el.dataset.grid||lastPointerCell.row!==el.dataset.row||lastPointerCell.col!==el.dataset.col))document.querySelector('[data-grid="'+lastPointerCell.grid+'"][data-row="'+lastPointerCell.row+'"][data-col="'+lastPointerCell.col+'"]')?.focus();}catch(e){editHistory=historyBefore;toast(e.message);render()}}

function searchFixedAdjustments(el,event){fixedUI.query=el.value;clearTimeout(fixedSearchTimer);if(event?.isComposing)return;fixedSearchTimer=setTimeout(()=>{if(!fixedUI.open)return;const focus=document.activeElement?.id==='fixed-search',position=el.selectionStart;renderFixedAdjustment();if(focus){const next=document.getElementById('fixed-search');next?.focus();next?.setSelectionRange(position,position);}},220);}
function fixedDefinition(key){return fixedUI.defs.find(d=>d.key===key);}
function setFixedDraftValue(key,raw){const def=fixedDefinition(key);if(!def)return;if(def.kind==='n'&&String(raw).trim()===''){def.cells.forEach(cell=>delete fixedUI.draft[cell.key]);updateFixedPending();return}if(raw==='__KEEP__')return;const value=def.kind==='n'?Number(raw):String(raw);if(def.kind==='n'&&!Number.isFinite(value))return;def.cells.forEach(cell=>{const old=fixedUI.draft[cell.key]||adjustmentSetting(active(),cell);fixedUI.draft[cell.key]={...old,mode:def.kind==='n'&&old.mode==='mixed'?cell.defaultMode:old.mode,value,label:def.label,group:def.group,unit:def.unit,detail:def.detail};});updateFixedPending();}
function setFixedDraftMode(key,mode){const def=fixedDefinition(key);if(!def)return;def.cells.forEach(cell=>{const current=fixedUI.draft[cell.key]||adjustmentSetting(active(),cell);fixedUI.draft[cell.key]={...current,mode,value:mode==='set'?(cell.unit==='%'?cell.value*100:cell.value):0,label:def.label,group:def.group,unit:def.unit,detail:def.detail};});renderFixedAdjustment();}
function updateFixedPending(){document.getElementById('fixed-pending').textContent=fixedDraftCount()+'개 입력 변경 대기';}
function applyFixedOperators(c,draft,scope){const work=clone(c),all=adjustmentCatalog(work,{site:'',product:'',months:Array.from({length:12},(_,i)=>i+1)},true),cells=new Map(all.flatMap(d=>d.cells.map(cell=>[cell.key,cell])));const operations=[];for(const [key,requested] of Object.entries(draft)){const cell=cells.get(key);if(!cell)throw Error('조정할 입력 항목을 찾을 수 없습니다.');if(cell.kind==='n'){if(!Object.hasOwn(ADJUST_MODES,requested.mode)||!Number.isFinite(requested.value))throw Error(cell.label+'의 조정값을 확인하세요.');if(requested.mode==='percent'&&requested.value<-100)throw Error(cell.label+'은 -100% 이상이어야 합니다.');}else if(requested.mode!=='set')throw Error('거래·배부 조건은 값을 지정하세요.');if(cell.choices&&!cell.choices.some(ch=>String(typeof ch==='object'?ch.value:ch)===String(requested.value)))throw Error(cell.label+'에 등록된 값을 선택하세요.');const effective=adjustmentSetting(work,cell),setting={mode:requested.mode,value:requested.value,base:effective.base===null&&requested.mode==='set'?(cell.unit==='%'?requested.value/100:requested.value):effective.base};const value=operatorValue(cell,setting);if(typeof value==='number'&&!Number.isFinite(value))throw Error(cell.label+'의 결과가 유효하지 않습니다.');if(equalScalar(cell.value,value)&&effective.mode===setting.mode&&equalScalar(effective.value,setting.value))continue;operations.push({cell,setting,value,request:requested});}
 if(!operations.length)return {data:work,count:0};
 work.variableSettings=work.variableSettings||{version:1,cells:{}};const explicitTargets=new Set(operations.filter(o=>o.cell.field==='target').map(o=>o.cell.table+':'+o.cell.id));for(const op of operations){const {cell,setting,value}=op;const row=work[cell.table].find(r=>r.id===cell.id);if(cell.table==='sites'&&cell.field==='name')renameSite(work,row.id,value);else row[cell.field]=value;if(cell.field==='scope'&&!explicitTargets.has(cell.table+':'+cell.id))row.target=value==='shared'?'':value==='site'?(work.sites[0]?.name||''):(work.products[0]?.id||'');work.variableSettings.cells[cell.key]={...setting,applied:value};}
 if(!validateState({version:VERSION,active:work.id,cases:[work]}))throw Error('조정 결과의 입력 범위를 확인하세요. 수율은 0% 초과~100%, 가동일수는 0~31일이며 기초재고 포함 감가는 기초재고액을 넘을 수 없습니다.');for(const table of ['labor','mfgPools','sgPools'])for(const row of work[table])if(row.scope==='product'&&!work.products.some(p=>p.id===row.target))throw Error('제품 직접비의 귀속 대상을 선택하세요.');

function applyFixedDraft(){try{const result=applyFixedOperators(active(),fixedUI.draft,fixedUI.scope);if(!result.count){closeModal();toast('저장된 조정값과 같습니다.');return}rememberEdit('세부 변수 조정');state.cases[state.cases.findIndex(c=>c.id===result.data.id)]=result.data;save();closeModal();render();toast(result.count+'개 입력에 조정값을 저장했습니다.');}catch(e){toast(e.message);}}
function migrateLegacyAdjustmentSettings(c){if(c.variableSettings||!c.adjustments?.length)return;const base=state.cases.find(x=>x.id===c.referenceId);if(!base)return;const all=adjustmentCatalog(c,{site:'',product:'',months:Array.from({length:12},(_,i)=>i+1)},true),baseCells=new Map(adjustmentCatalog(base,{site:'',product:'',months:Array.from({length:12},(_,i)=>i+1)},true).flatMap(d=>d.cells.map(cell=>[cell.key,cell]))),ledger={version:1,cells:{}};for(const def of all)for(const cell of def.cells){if(cell.kind!=='n')continue;const prior=baseCells.get(cell.key);if(!prior)continue;let multiplier=1,pp=0,touched=false;for(const log of c.adjustments){if(log.mode==='fixed')continue;const p=c.products.find(p=>p.id===cell.product);if(log.scope.product&&p?.name!==log.scope.product)continue;if(log.scope.site&&cell.site!==log.scope.site)continue;const r=log.rates;if(!r)continue;let rate=0;if(cell.table==='rows'){if(cell.field==='qty'||cell.field==='production')rate=r.volume;else if(cell.field==='usd'||cell.field==='krw')rate=r.price;else if(cell.field==='fx')rate=r.fx;else if(cell.field==='yield'){pp+=r.yield/100;touched=touched||r.yield!==0;continue;}else if(['powerPrice','steamPrice','fuelPrice','waterPrice'].includes(cell.field))rate=r.utility;}else if(cell.table==='bom'){if(cell.field==='usd'||cell.field==='krw')rate=r.raw;else if(cell.field==='fx')rate=r.fx;}else if(['labor','mfgPools','sgPools'].includes(cell.table)&&cell.field==='amount'){if((log.scope.site||log.scope.product)&&!cell.product)continue;rate=cell.table==='labor'?r.labor:r.fixed;}if(Number.isFinite(rate)&&rate!==0){multiplier*=1+rate/100;touched=true;}}
 if(!touched)continue;const mode=cell.field==='yield'?'pp':'percent',value=mode==='pp'?pp*100:(multiplier-1)*100,expected=mode==='pp'?prior.value+pp:prior.value*multiplier;if(equalScalar(expected,cell.value))ledger.cells[cell.key]={mode,value:Number(value.toPrecision(12)),base:prior.value,applied:cell.value};}if(Object.keys(ledger.cells).length)c.variableSettings=ledger;}
function formatAdjustmentRequest(log){if(log.mode==='fixed')return log.changes.map(change=>change.detail+' / '+change.label+' '+(change.mode==='set'?'= ':'')+(typeof change.value==='number'?signed(change.value):change.value)+(change.mode==='percent'?'%':change.mode==='pp'?'%p':change.mode==='delta'?' '+change.unit:'')).join(' · ');return Object.entries(SHOCK_LABELS).filter(([key])=>log.rates[key]!==0).map(([key,label])=>label+' '+signed(log.rates[key])+(key==='yield'?'%p':'%')).join(' · ')||'변경 없음';}
function validVariableSettings(c){const s=c.variableSettings;if(s===undefined)return true;if(!s||s.version!==1||!s.cells||typeof s.cells!=='object'||Array.isArray(s.cells)||Object.keys(s.cells).length>300000)return false;return Object.values(s.cells).every(v=>v&&['percent','pp','delta','set'].includes(v.mode)&&['value','base','applied'].every(key=>(typeof v[key]==='number'&&Number.isFinite(v[key]))||typeof v[key]==='string'||(key==='base'&&v[key]===null)));}

let rangeState={grid:'',signature:'',cells:new Set(),anchor:null,mode:false,dragging:false,base:new Set(),fillValue:''};

function resetRange(){rangeState={grid:'',signature:'',cells:new Set(),anchor:null,mode:false,dragging:false,base:new Set(),fillValue:''};refreshRangeUI();}
function activateRange(key){if(rangeState.grid!==key||rangeState.signature!==rangeSignature(key)){rangeState={grid:key,signature:rangeSignature(key),cells:new Set(),anchor:null,mode:false,dragging:false,base:new Set(),fillValue:''};}}

function rectangleCells(reg,a,b){const result=new Set();for(let r=Math.min(a.r,b.r);r<=Math.max(a.r,b.r);r++)for(let c=Math.min(a.c,b.c);c<=Math.max(a.c,b.c);c++)if(reg.rows[r]&&reg.cols[c]&&reg.cols[c].kind!=='ro')result.add(r+':'+c);return result;}
function selectRangeColumn(key,col,additive=false,extend=false){activateRange(key);const reg=gridRegistry[key];if(!reg||reg.cols[col]?.kind==='ro')return;const selected=extend&&rangeState.anchor?rectangleCells(reg,{r:0,c:rangeState.anchor.c},{r:reg.rows.length-1,c:col}):new Set(reg.rows.map((_,r)=>r+':'+col));if(additive){const all=[...selected].every(cell=>rangeState.cells.has(cell));for(const cell of selected)all?rangeState.cells.delete(cell):rangeState.cells.add(cell);}else rangeState.cells=selected;rangeState.anchor={r:0,c:col};rangeState.mode=true;rangeState.fillValue='';refreshRangeUI();}

function gridPointerOver(e){if(!rangeState.dragging||!rangeState.anchor)return;const td=e.target.closest?.('td[data-range-grid]');if(!td||td.dataset.rangeGrid!==rangeState.grid)return;const reg=gridRegistry[rangeState.grid];rangeState.cells=rectangleCells(reg,rangeState.anchor,{r:Number(td.dataset.rangeRow),c:Number(td.dataset.rangeCol)});refreshRangeUI();}

function refreshRangeUI(){if(!document.querySelectorAll)return;const toolbar=document.getElementById('range-toolbar');if(!toolbar)return;if(rangeState.grid&&rangeState.signature!==rangeSignature(rangeState.grid)){rangeState={grid:'',signature:'',cells:new Set(),anchor:null,mode:false,dragging:false,base:new Set(),fillValue:''};}document.querySelectorAll('td[data-range-grid]').forEach(td=>td.classList.toggle('range-selected',td.dataset.rangeGrid===rangeState.grid&&rangeState.cells.has(td.dataset.rangeRow+':'+td.dataset.rangeCol)));document.querySelectorAll('[data-range-toggle]').forEach(button=>{const active=button.dataset.rangeToggle===rangeState.grid&&rangeState.mode;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));});document.body?.classList?.toggle('has-range-selection',rangeState.cells.size>0);if(!rangeState.cells.size){toolbar.hidden=true;return;}const reg=gridRegistry[rangeState.grid],positions=selectedRangePositions(),cols=[...new Set(positions.map(p=>p[1]))];let choices=null;if(cols.every(c=>reg.cols[c].kind==='select')){for(const [r,c] of positions){const source=typeof reg.cols[c].choices==='function'?reg.cols[c].choices(reg.rows[r]):reg.cols[c].choices;const list=source.map(x=>({value:String(typeof x==='object'?x.value:x),label:String(typeof x==='object'?x.label:x)}));choices=choices===null?list:choices.filter(x=>list.some(y=>x.value===y.value));}}
 const editor=choices?.length?'<select id="range-value" aria-label="선택 셀 입력값" onchange="rangeState.fillValue=this.value">'+option('','값 선택',!rangeState.fillValue)+choices.map(x=>option(x.value,x.label,x.value===rangeState.fillValue)).join('')+'</select>':'<input id="range-value" type="text" aria-label="선택 셀 입력값" placeholder="선택 셀에 넣을 값" value="'+esc(rangeState.fillValue)+'" oninput="rangeState.fillValue=this.value" onkeydown="if(event.key===\'Enter\'){event.preventDefault();applyRangeValue()}">';toolbar.hidden=false;toolbar.innerHTML='<div class="range-summary"><strong>'+positions.length+'개 셀 선택</strong><span>'+esc(cols.map(c=>reg.cols[c].label).join(' · '))+'</span></div><div class="range-edit">'+editor+'<button class="primary" onclick="applyRangeValue()">같은 값 적용</button><button onclick="copySelectedRange()">복사</button><button class="ghost" onclick="resetRange()">선택 해제</button></div>';}
function buildGridBatch(c,reg,positions,raw){const work=clone(c),changes=[],seen=new Set();for(const [r,col] of positions){const descriptor=reg.cols[col],row=reg.rows[r];if(!descriptor||!row||descriptor.kind==='ro')continue;const unique=row.id+':'+descriptor.key;if(seen.has(unique))continue;seen.add(unique);const value=cellValue(descriptor,raw);if(descriptor.kind==='select'){const choices=typeof descriptor.choices==='function'?descriptor.choices(row):descriptor.choices;if(!choices.some(x=>String(typeof x==='object'?x.value:x)===String(value)))throw Error(descriptor.label+'에서 선택할 수 없는 값입니다.');}if(!equalScalar(row[descriptor.key],value))changes.push({id:row.id,field:descriptor.key,value});}const targets=new Set(changes.filter(x=>x.field==='target').map(x=>x.id));for(const change of changes){const row=work[reg.source].find(r=>r.id===change.id);if(!row)throw Error('입력 행을 찾을 수 없습니다.');if(reg.source==='sites'&&change.field==='name')renameSite(work,row.id,change.value);else row[change.field]=change.value;if(change.field==='scope'&&!targets.has(row.id))row.target=change.value==='shared'?'':change.value==='site'?(work.sites[0]?.name||''):(work.products[0]?.id||'');}
 if(!validateState({version:VERSION,active:work.id,cases:[work]}))throw Error('선택 범위의 입력값을 확인하세요. 통화·월 중복·수율·기초재고 조건을 모두 만족해야 합니다.');return {data:work,count:changes.length};}
function applyRangeValue(raw=rangeState.fillValue){const reg=gridRegistry[rangeState.grid];if(!reg||!rangeState.cells.size)return;if(String(raw).trim()===''){toast('적용할 값을 입력하세요.');return;}try{const result=buildGridBatch(active(),reg,selectedRangePositions(),raw);if(!result.count){toast('현재 값과 같습니다.');return;}rememberEdit('선택 셀 일괄 입력');state.cases[state.cases.findIndex(c=>c.id===result.data.id)]=result.data;save();render();toast(result.count+'개 입력값을 변경했습니다.');}catch(e){toast(e.message);}}
async function copySelectedRange(){const reg=gridRegistry[rangeState.grid],positions=selectedRangePositions();if(!reg||!positions.length)return;const minR=Math.min(...positions.map(p=>p[0])),maxR=Math.max(...positions.map(p=>p[0])),minC=Math.min(...positions.map(p=>p[1])),maxC=Math.max(...positions.map(p=>p[1]));const lines=[];for(let r=minR;r<=maxR;r++){const values=[];for(let c=minC;c<=maxC;c++){if(!rangeState.cells.has(r+':'+c)){values.push('');continue;}const col=reg.cols[c],row=reg.rows[r];values.push(col.percent?row[col.key]*100:row[col.key]);}lines.push(values.join('\t'));}const value=lines.join('\n');try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(value);else{const area=document.createElement('textarea');area.value=value;area.style.position='fixed';area.style.left='-9999px';document.body.append(area);area.select();document.execCommand('copy');area.remove();}toast('선택한 셀을 복사했습니다.');}catch{toast('복사를 허용한 브라우저에서 다시 시도하세요.');}}
document.addEventListener('pointerdown',gridPointerDown,true);
document.addEventListener('pointerover',gridPointerOver);
document.addEventListener('pointerup',()=>{rangeState.dragging=false;});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&rangeState.mode){resetRange();return;}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'&&rangeState.cells.size&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){e.preventDefault();copySelectedRange();}});
document.addEventListener('paste',e=>{if(!rangeState.cells.size||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;const text=e.clipboardData.getData('text/plain');if(text.includes('\t')||text.includes('\n')){const [row,col]=selectedRangePositions()[0];pasteCells(e,{dataset:{grid:rangeState.grid,row:String(row),col:String(col)}});}else{e.preventDefault();applyRangeValue(text);}});

document.getElementById('modal').addEventListener('cancel',()=>{fixedUI.open=false;document.getElementById('modal').classList?.remove('adjustment-dialog')});

const FPA_KNOWLEDGE=[{"title":"BOM","aliases":["bom","비오엠","자재명세서","bill of materials"],"body":"제품을 만들 때 필요한 자재와 각 자재의 투입비율을 정리한 목록입니다. FPA에서는 제품·월별 자재, 투입비율, 통화, 단가, 환율을 입력합니다.","formula":"총투입량 × 자재 투입비율 × 원화 단가","view":"materials","group":"원가"},{"title":"수율","aliases":["yield","수율"],"body":"투입한 양 중 제품으로 얻은 양의 비율입니다. FPA의 생산량은 산출 제품량이며, 수율은 0% 초과 100% 이하로 입력합니다. 순도와는 다른 개념입니다.","formula":"총투입량 = 생산량 ÷ 수율","view":"materials","group":"원가"},{"title":"투입비율","aliases":["배합비","조성비","투입비율"],"body":"총투입량에서 해당 자재가 차지하는 비율입니다. FPA는 제품·월별 BOM 투입비율 합계가 100%인지 검산합니다.","formula":"자재 투입량 = 총투입량 × 투입비율","view":"materials","group":"원가"},{"title":"판관비","aliases":["sga","sg&a","판매비와관리비","판관비"],"body":"판매 활동과 회사 관리에 드는 비용입니다. FPA에서는 판관고정비와 운반·포장비를 합산합니다. 생산에 쓰이는 제조경비와 구분합니다.","formula":"판관비 = 판관고정비 + 운반비 + 포장비","view":"sgSum","group":"회계"},{"title":"매출액","aliases":["revenue","매출액"],"body":"제품 판매로 발생하는 금액입니다. FPA는 월별 판매수량과 적용 판매단가를 곱합니다. 부가가치세 입력 항목은 없으므로 세전 공급가액 기준으로 일관되게 입력하세요.","formula":"매출수량 × 원화 판매단가","view":"sales","group":"회계"},{"title":"매출수량","aliases":["판매량","판매수량","매출수량"],"body":"판매한 제품의 수량입니다. FPA 수량 기준은 kg이며 생산량과 별도로 입력합니다. 판매량을 바꿔도 생산량은 자동으로 바뀌지 않습니다.","formula":"매출액 = 매출수량 × 원화 판매단가","view":"sales","group":"운영"},{"title":"생산량","aliases":["생산수량","생산량"],"body":"해당 월에 생산한 완제품 수량입니다. FPA에서는 kg 단위로 재료비·유틸리티 계산과 배부 기준에 사용합니다. 판매량과 다르면 재고가 변합니다.","formula":"기말재고 수량 = 기초재고 + 생산량 − 판매량","view":"drivers","group":"운영"},{"title":"판매단가","aliases":["판가","asp","판매가격","판매단가"],"body":"제품 1kg의 판매가격입니다. USD 거래는 USD/kg와 원/USD 환율, KRW 거래는 원/kg를 사용합니다. 선택하지 않은 통화의 단가는 매출 계산에 사용되지 않습니다.","formula":"USD 거래 원화단가 = USD/kg × 원/USD","view":"sales","group":"원가"},{"title":"매출원가","aliases":["cogs","매출원가"],"body":"판매된 제품에 해당하는 원가입니다. FPA에서는 기초재고와 당월 생산원가의 총평균단가를 구한 뒤 판매수량에 적용합니다. 당월 제조원가 전부가 곧바로 매출원가가 되는 것은 아닙니다.","formula":"매출수량 × 월별 총평균 원가단가","view":"inventory","group":"회계"},{"title":"제조원가","aliases":["생산원가","당월제조원가","제조원가"],"body":"제품을 생산하는 데 발생한 원가입니다. FPA에서는 재료비·배부 노무비·유틸리티·수선/소모품비·제조고정비를 합산합니다.","formula":"재료비 + 노무비 + 제조경비","view":"mfg","group":"원가"},{"title":"재료비","aliases":["원재료비","재료비"],"body":"생산을 위해 투입한 자재의 원가입니다. FPA는 생산량과 수율로 총투입량을 구하고 BOM 투입비율과 자재 단가를 적용합니다.","formula":"Σ(생산량 ÷ 수율 × 투입비율 × 자재 원화단가)","view":"materials","group":"원가"},{"title":"노무비","aliases":["인건비","급여","노무비"],"body":"생산 인력 등에 발생한 비용입니다. FPA에서는 조직·직무별 비용 풀을 등록하고 귀속 구분과 배부 기준에 따라 제품에 반영합니다. 관리부문 직원급여는 판관비로 구분할 수 있습니다.","formula":"월 발생액 × 배부율","view":"labor","group":"원가"},{"title":"제조경비","aliases":["제조간접경비","제조경비"],"body":"재료비와 노무비 외에 제조에 드는 경비입니다. FPA에서는 유틸리티, 수선·소모품비, 제조고정비를 합산합니다.","formula":"유틸리티 + 수선/소모품비 + 제조고정비","view":"mfg","group":"원가"},{"title":"매출총이익","aliases":["gross profit","매출총이익","매출이익"],"body":"매출액에서 판매된 제품의 원가를 뺀 금액입니다. 아직 판관비를 차감하기 전의 이익입니다.","formula":"매출액 − 매출원가","view":"pnl","group":"회계"},{"title":"매출총이익률","aliases":["gross margin","매출총이익률"],"body":"매출액 중 매출총이익의 비중입니다. 기간 합계는 월별 비율의 단순평균보다 합계 매출과 합계 이익으로 계산해야 합니다.","formula":"매출총이익 ÷ 매출액 × 100","view":"pnl","group":"회계"},{"title":"영업이익","aliases":["ebit","영업이익"],"body":"FPA에서는 매출총이익에서 판관비를 차감한 금액입니다. 금융손익과 법인세는 계산 범위에 포함하지 않습니다.","formula":"매출액 − 매출원가 − 판관비","view":"pnl","group":"회계"},{"title":"영업이익률","aliases":["operating margin","영업이익률"],"body":"매출액에 대한 영업이익의 비율입니다. 매출액이 0인 경우 FPA는 계산 오류를 막기 위해 비율을 0으로 표시합니다.","formula":"영업이익 ÷ 매출액 × 100","view":"pnl","group":"회계"},{"title":"EBITDA","aliases":["에비타","에비따","ebitda"],"body":"이자·법인세·감가상각 전 이익을 뜻하는 지표입니다. FPA는 영업이익에 판매분 원가에 포함된 제조감가와 판관감가를 더합니다. 현금흐름 그 자체와 같지는 않습니다.","formula":"영업이익 + 매출원가 포함 제조감가 + 판관감가","view":"pnl","group":"회계"},{"title":"EBITDA율","aliases":["ebitda margin","에비따율","ebitda율"],"body":"매출액에 대한 EBITDA의 비중입니다. 연간 값은 연간 EBITDA를 연간 매출액으로 나눠 계산합니다.","formula":"EBITDA ÷ 매출액 × 100","view":"pnl","group":"회계"},{"title":"감가상각비","aliases":["depreciation","감가상각","감가상각비"],"body":"설비 등 장기 사용 자산의 원가를 사용기간에 걸쳐 비용으로 나누는 것입니다. FPA는 감가상각비를 직접 입력받으며 자산별 상각 스케줄은 계산하지 않습니다. 비용 풀 계정명은 정확히 ‘감가상각비’여야 별도로 집계됩니다.","formula":"제조감가는 재고와 매출원가로 나뉘고 판관감가는 당월 판관비에 포함","view":"mfgFixed","group":"회계"},{"title":"제조감가","aliases":["제조감가상각비","제조감가"],"body":"제조고정비에 포함된 감가상각비입니다. FPA는 당월 제조감가를 생산원가에 포함하고 재고 회전에 따라 판매분 감가와 기말재고 감가로 나눕니다.","formula":"판매분 제조감가 = 가용 감가총액 × 판매수량 ÷ 가용수량","view":"inventory","group":"원가"},{"title":"판관감가","aliases":["판관감가상각비","판관감가"],"body":"판관고정비 중 감가상각비 계정으로 입력한 금액입니다. FPA에서는 판관비에 포함하고 EBITDA 계산 때 가산합니다.","formula":"EBITDA 가산 대상 = 판관감가 + 판매분 제조감가","view":"sgFixed","group":"회계"},{"title":"재고자산","aliases":["inventory","재고자산","재고"],"body":"아직 판매되지 않은 제품 등의 자산입니다. FPA는 완제품 기초재고와 생산·판매에 따른 월별 재고를 관리합니다. 원재료 재고 수불을 별도로 추적하는 시스템은 아닙니다.","formula":"기말재고액 = 가용재고액 − 매출원가","view":"inventory","group":"회계"},{"title":"기초재고","aliases":["기초재고액","기초재고"],"body":"시뮬레이션 첫 달 시작 시 보유한 완제품 수량과 원가액입니다. FPA에서는 제품별로 수량·금액·그 금액에 포함된 제조감가를 입력합니다.","formula":"기초재고 포함 감가 ≤ 기초재고액","view":"master","group":"운영"},{"title":"기말재고","aliases":["기말재고액","기말재고"],"body":"월말에 남은 제품 수량과 원가액입니다. FPA에서는 다음 달 기초재고로 이월합니다. 음수이면 판매량에 비해 재고·생산량이 부족하다는 뜻입니다.","formula":"기초재고 + 당월생산 − 당월판매","view":"inventory","group":"원가"},{"title":"총평균법","aliases":["가중평균법","월별총평균법","총평균법"],"body":"기초재고 원가와 당월 제조원가를 합산한 후 가용수량으로 나누는 방식입니다. FPA는 월 단위 총평균법을 사용하며 매입 때마다 단가를 바꾸는 이동평균법과 다릅니다.","formula":"(기초재고액 + 당월 제조원가) ÷ (기초수량 + 생산량)","view":"inventory","group":"원가"},{"title":"이동평균법","aliases":["moving average","이동평균법"],"body":"재고 입고가 발생할 때마다 평균단가를 다시 구하는 재고 평가 방식입니다. 현재 FPA의 월별 총평균법과 계산 시점이 다르므로 다른 시스템 결과와 비교할 때 기준을 맞춰야 합니다.","formula":"","view":"inventory","group":"원가"},{"title":"선입선출법","aliases":["fifo","선입선출법"],"body":"먼저 입고한 재고가 먼저 판매된 것으로 보고 원가를 대응시키는 방식입니다. 현재 FPA는 이 방식 대신 월별 총평균법을 사용합니다.","formula":"","view":"inventory","group":"원가"},{"title":"재고증감","aliases":["재고변동","재고증감"],"body":"FPA에서는 당월 제조원가와 매출원가의 차이로 표시합니다. 생산원가 중 재고로 남거나 과거 재고가 판매되는 영향을 보여줍니다.","formula":"재고증감 = 당월 제조원가 − 매출원가","view":"inventory","group":"원가"},{"title":"kg당 재료비","aliases":["kg당재료비","재료비원단위"],"body":"FPA 화면의 kg당 재료비는 당월 재료비를 생산량으로 나눈 값입니다. 자재 구매단가와 다르며 수율과 배합비 변화도 영향을 줍니다.","formula":"재료비 ÷ 생산량","view":"pnl","group":"원가"},{"title":"원단위","aliases":["unit consumption","원단위"],"body":"제품 1단위를 생산하는 데 필요한 자재·전력·용수 등의 양입니다. FPA 유틸리티 사용량은 완제품 kg당 기준입니다. 단위를 맞추지 않으면 비용이 크게 달라집니다.","formula":"총사용량 = 생산량 kg × kg당 사용량","view":"utility","group":"원가"},{"title":"직접비","aliases":["direct cost","직접비"],"body":"특정 공장이나 제품에 바로 귀속할 수 있는 비용입니다. FPA의 공장 직접비는 공장 안에서 제품에 배부하고, 제품 직접비는 지정 제품에 전액 반영합니다.","formula":"","view":"mfgFixed","group":"원가"},{"title":"간접비","aliases":["overhead","간접비"],"body":"여러 대상이 함께 사용해 직접 대응시키기 어려운 비용입니다. 생산량·가동일수 등 목적에 맞는 기준으로 배부합니다. FPA에서는 비용 풀별로 기준을 지정할 수 있습니다.","formula":"","view":"mfgFixed","group":"원가"},{"title":"공통비","aliases":["전사공통비","공통비"],"body":"여러 공장과 제품이 함께 부담하는 비용입니다. FPA는 전사 공통비를 공장으로 나눈 다음 각 공장 안에서 제품으로 배부합니다.","formula":"공통비 × 공장배부율 × 제품배부율","view":"mfgFixed","group":"원가"},{"title":"공장 배부 기준","aliases":["공장배부기준","공장배부율"],"body":"전사 공통비를 공장 간에 나누는 기준입니다. 생산량·가동일수·설비×가동일수·매출액·균등 중 선택합니다. 가동일수는 제품별 입력값을 공장 안에서 합산하며 공장 달력 일수와 다릅니다.","formula":"해당 공장 기준값 합계 ÷ 전체 공장 기준값 합계","view":"drivers","group":"원가"},{"title":"제품 배부 기준","aliases":["제품배부기준","제품배부율"],"body":"공장에 귀속된 비용을 그 공장 제품끼리 나누는 기준입니다. 제품 직접비에는 적용하지 않습니다. 공장 배부 기준과 서로 다르게 지정할 수 있습니다.","formula":"해당 제품 기준값 ÷ 같은 공장 제품 기준값 합계","view":"drivers","group":"원가"},{"title":"균등배부","aliases":["균등","균등배부"],"body":"동일한 가중치를 적용해 나누는 방법입니다. 현재 FPA는 제품·월 행 하나당 가중치 1을 사용하므로 공장 단계에서는 공장별 제품 수 비중으로 나뉩니다. 공장마다 무조건 동일 금액이 되는 방식은 아닙니다.","formula":"","view":"mfgFixed","group":"원가"},{"title":"배부 기준 0","aliases":["미배부","배부기준0","배부기준이0"],"body":"기준값 합계가 0이거나 대상이 없으면 비율을 계산할 수 없습니다. FPA는 임의로 나누지 않고 미배부 금액과 경고를 표시합니다. 생산량·가동일수·귀속 대상을 확인하세요.","formula":"","view":"checks","group":"사용법"},{"title":"비용 풀","aliases":["cost pool","비용풀"],"body":"배부할 비용을 계정·월·귀속 단위로 묶은 입력 행입니다. 동일한 원천 비용을 공통비와 직접비에 중복 등록하면 원가가 중복됩니다.","formula":"","view":"mfgFixed","group":"사용법"},{"title":"고정비","aliases":["fixed cost","고정비"],"body":"관련 조업 범위 안에서 생산량 변화와 관계없이 총액이 대체로 일정한 비용입니다. FPA 고정비는 입력한 월 발생액을 배부하며 생산량에 자동 비례하지 않습니다.","formula":"","view":"mfgFixed","group":"원가"},{"title":"변동비","aliases":["variable cost","변동비"],"body":"생산량이나 판매량 등 활동량에 따라 총액이 변하는 비용입니다. FPA에서는 BOM 재료비와 kg당 유틸리티 사용량 등이 생산량에 연동됩니다.","formula":"","view":"mfg","group":"원가"},{"title":"혼합원가","aliases":["준변동비","혼합원가"],"body":"기본요금처럼 고정 부분과 사용량에 따른 변동 부분이 함께 있는 원가입니다. FPA에서는 고정 부분은 비용 풀, 변동 부분은 원단위 항목으로 구분 입력할 수 있습니다.","formula":"","view":"utility","group":"원가"},{"title":"공헌이익","aliases":["contribution margin","공헌이익"],"body":"매출액에서 변동비를 차감한 금액입니다. 고정비를 충당하고 이익을 만드는 데 기여하는 금액입니다. FPA 현재 영업이익은 공헌이익과 다르며 변동비·고정비 재분류가 필요합니다.","formula":"매출액 − 변동비","view":"pnl","group":"원가"},{"title":"손익분기점","aliases":["bep","손익분기점"],"body":"매출과 총비용이 같아 이익이 0이 되는 수준입니다. 단순한 단일 제품·일정 원가 가정에서는 고정비를 단위당 공헌이익으로 나눕니다. 재고·제품 믹스·배부가 변하면 추가 분석이 필요합니다.","formula":"고정비 ÷ (단위 판매가격 − 단위 변동비)","view":"pnl","group":"원가"},{"title":"가격전가","aliases":["pass through","판가전가","가격전가"],"body":"원재료비·환율 등 원가 변화를 판매가격에 반영하는 것입니다. 비용 증가율과 필요한 판가 증가율은 같은 값이 아닐 수 있습니다. 목표 이익액과 목표 이익률도 구분해야 합니다.","formula":"","view":"scenario","group":"원가"},{"title":"마진과 마크업","aliases":["markup","마크업","마진과마크업"],"body":"마진율은 판매가격이 분모이고 마크업은 원가가 분모입니다. 같은 비율을 입력해도 판매가격이 달라집니다.","formula":"마진율=(판가−원가)/판가; 마크업=(판가−원가)/원가","view":"pnl","group":"원가"},{"title":"민감도 분석","aliases":["sensitivity","민감도"],"body":"다른 조건을 고정하고 특정 변수가 변할 때 결과가 얼마나 달라지는지 보는 분석입니다. 시나리오와 기준 CASE를 비교해 환율·단가·수율의 손익 영향을 확인할 수 있습니다.","formula":"","view":"scenario","group":"사용법"},{"title":"시나리오","aliases":["scenario","시나리오"],"body":"수량·단가·환율·수율·배부 가정 등을 모아 둔 분석 단위입니다. FPA에서는 현재 CASE를 복제하고 기준 CASE를 지정해 변경 가정과 손익을 비교할 수 있습니다.","formula":"","view":"scenario","group":"사용법"},{"title":"CASE","aliases":["케이스","case"],"body":"한 시나리오의 구체적인 입력 묶음입니다. FPA는 시나리오명·CASE명·연도·실적구분을 함께 관리합니다. 변경 전에 복제하면 기준 값을 보존할 수 있습니다.","formula":"","view":"master","group":"사용법"},{"title":"실적과 계획","aliases":["실적구분","경영계획","실적과계획"],"body":"계획은 목표·가정, 실적은 실제 발생 내역, 추정은 현재까지의 정보로 예상한 결과입니다. FPA의 실적구분은 분류값이며 원천 실적을 자동 수집하지는 않습니다.","formula":"","view":"master","group":"사용법"},{"title":"변수 조정 기준값","aliases":["앵커","기준값","변수조정"],"body":"FPA의 상대 조정은 처음 조정 기준값을 기준으로 저장됩니다. 같은 항목에 10%를 다시 적용해도 중복 상승하지 않습니다. 10%를 20%로 바꾸면 처음 기준의 20%가 적용됩니다. 개별 셀 직접 수정은 해당 셀의 새 기준이 됩니다.","formula":"","view":"scenario","group":"사용법"},{"title":"퍼센트포인트","aliases":["%p","pp","퍼센트포인트"],"body":"비율 간의 차이입니다. 수율 90%에서 2%p 개선은 92%입니다. 상대적으로 2% 개선하면 91.8%이므로 구분해야 합니다.","formula":"%p 조정 = 기존 비율 + 조정값/100","view":"drivers","group":"사용법"},{"title":"빈칸과 0","aliases":["미입력","빈칸","빈칸과0"],"body":"빈칸은 아직 값을 넣지 않았다는 뜻이고 0은 실제 값이 0이라는 뜻입니다. 빈칸에 상대 증가율을 적용할 수 없으므로 먼저 값을 지정해야 합니다.","formula":"","view":"scenario","group":"사용법"},{"title":"SITE","aliases":["사이트","site","공장등록"],"body":"FPA에서 공장이나 비용을 구분하는 생산 거점 이름입니다. 기본 공장값은 없으며 직접 등록합니다. 제품은 하나의 SITE에 소속됩니다.","formula":"","view":"master","group":"사용법"},{"title":"백업","aliases":["json","백업","복원"],"body":"입력 데이터는 현재 브라우저 저장소에 저장됩니다. 파일 메뉴에서 JSON 백업을 저장하면 전체 CASE를 보관하거나 복원할 수 있습니다. 배포 서버가 개인 입력 데이터를 저장하는 것은 아닙니다.","formula":"","view":"master","group":"사용법"},{"title":"CSV","aliases":["csv","엑셀내보내기"],"body":"CSV는 행·열 데이터를 텍스트로 저장한 형식입니다. FPA의 CSV 내보내기는 표시 중인 표를 옮기는 용도이고, 전체 시나리오 복원에는 JSON 백업을 사용하세요.","formula":"","view":"help","group":"사용법"},{"title":"일괄 선택","aliases":["범위선택","일괄선택","엑셀선택"],"body":"표의 열 머리글이나 범위 선택 기능으로 여러 입력 셀을 골라 같은 값을 넣을 수 있습니다. 부분 선택과 Ctrl/Command 추가 선택을 지원하며 계산 셀은 수정 대상에서 제외합니다.","formula":"","view":"sales","group":"사용법"},{"title":"검산","aliases":["정합성","검산","오류확인"],"body":"입력과 계산이 서로 맞는지 점검합니다. FPA는 재고 부족, 수율 누락, BOM 합계, 미배부 비용 등을 표시합니다. 경고가 남아 있으면 관련 결과는 가계산으로 해석하세요.","formula":"","view":"checks","group":"사용법"},{"title":"전력비","aliases":["전기요금","전력비"],"body":"FPA는 완제품 kg당 전력 사용량과 kWh 단가를 곱해 전력비를 계산합니다. 기본요금이나 피크요금을 포함하려면 중복 없이 별도 고정비로 관리하세요.","formula":"생산량 × kWh/kg × 원/kWh","view":"utility","group":"원가"},{"title":"스팀비","aliases":["증기비","가스비","스팀비","도시가스비"],"body":"FPA는 스팀/가스 사용량과 단가를 곱합니다. 현재 화면 단위는 t/kg와 원/t이므로 도시가스의 Nm³·열량 단위를 그대로 넣지 말고 동일 기준으로 환산해야 합니다.","formula":"생산량 × kg당 사용량 × 단가","view":"utility","group":"원가"},{"title":"연료비","aliases":["연료비"],"body":"FPA는 생산량에 kg당 연료 사용량(L/kg)과 단가(원/L)를 곱합니다. 유가 티커가 움직여도 연료 단가는 자동으로 변경되지 않습니다.","formula":"생산량 × L/kg × 원/L","view":"utility","group":"원가"},{"title":"용수비","aliases":["수도비","용수비"],"body":"FPA는 생산량에 kg당 용수 사용량(m³/kg)과 단가(원/m³)를 곱합니다. 사용량의 kg·t·m³ 단위를 구분하세요.","formula":"생산량 × m³/kg × 원/m³","view":"utility","group":"원가"},{"title":"유틸리티","aliases":["utilities","유틸리티"],"body":"공정 운영에 필요한 전력·스팀/가스·연료·용수 등입니다. FPA는 네 항목의 사용량과 단가를 각각 입력하며 서로 독립적으로 조정할 수 있습니다.","formula":"전력비 + 스팀/가스비 + 연료비 + 용수비","view":"utility","group":"원가"},{"title":"운반비","aliases":["물류비","운반비"],"body":"제품 운송에 드는 비용입니다. FPA의 운반·포장 화면은 판매 매출액에 운반비율을 곱합니다. 제조고정비의 운반비 계정과 중복 등록하지 않도록 원천 비용을 구분하세요.","formula":"매출액 × 운반비율","view":"logistics","group":"원가"},{"title":"포장비","aliases":["포장비"],"body":"제품을 포장하는 비용입니다. FPA의 운반·포장 화면에서는 매출액 비율로 계산하므로 kg당 포장비와 입력 기준이 다릅니다.","formula":"매출액 × 포장비율","view":"logistics","group":"원가"},{"title":"복리후생비","aliases":["복리후생비"],"body":"직원 복지와 관련된 비용입니다. 생산·관리 등 비용이 발생한 기능에 맞춰 제조비 또는 판관비에 귀속합니다. 같은 비용을 두 곳에 중복 등록하지 마세요.","formula":"","view":"sgFixed","group":"회계"},{"title":"접대비","aliases":["접대비"],"body":"업무상 거래관계 유지 등을 위해 지출하는 비용 계정입니다. FPA는 원가·손익 시뮬레이션용 발생액을 입력받으며 세무상 손금 한도를 계산하지 않습니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"지급임차료","aliases":["임대료","리스료","지급임차료"],"body":"건물·장비 등을 빌려 쓰는 데 지급하는 금액입니다. 재무회계상 리스 회계처리와 관리손익의 현금 임차료는 다를 수 있으므로 입력 기준을 정해 중복을 피해야 합니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"시험비","aliases":["분석비","시험비"],"body":"제품·자재의 품질이나 성능을 시험·분석하는 비용입니다. FPA에서는 발생액을 제조 비용 풀 등 적절한 계정으로 입력할 수 있습니다.","formula":"","view":"mfgFixed","group":"원가"},{"title":"세금과공과","aliases":["제세공과금","세금과공과"],"body":"각종 세금과 공적 부담금에 쓰는 계정입니다. 법인세비용과 구분해 회사의 계정 분류 기준에 맞게 입력하세요. FPA는 법인세 계산을 하지 않습니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"보험료","aliases":["보험료"],"body":"자산·시설·업무 등에 대한 보험 비용입니다. 공장 또는 제품에 직접 대응되는지에 따라 귀속 범위를 지정할 수 있습니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"여비교통비","aliases":["출장비","여비교통비"],"body":"업무 출장과 이동 등에 드는 비용입니다. 발생 기능에 맞게 제조비 또는 판관비에 구분합니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"통신비","aliases":["통신비"],"body":"전화·인터넷 등 통신 서비스 사용 비용입니다. 직접 귀속할 수 없는 공통 부분은 정한 배부 기준을 적용할 수 있습니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"차량유지비","aliases":["차량유지비"],"body":"업무용 차량의 운영·유지에 드는 비용입니다. 제품 운반비 등 다른 계정과 중복되지 않게 원천 비용을 구분하세요.","formula":"","view":"sgFixed","group":"회계"},{"title":"교육훈련비","aliases":["교육비","교육훈련비"],"body":"임직원 업무 교육·훈련에 드는 비용입니다. FPA에서는 계정별 월 발생액을 입력해 배부합니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"도서인쇄비","aliases":["도서비","인쇄비","도서인쇄비"],"body":"업무용 도서·간행물 구입과 인쇄 등에 드는 비용입니다. 회사의 회계 계정 분류를 기준으로 입력하세요.","formula":"","view":"sgFixed","group":"회계"},{"title":"지급수수료","aliases":["수수료","지급수수료"],"body":"외부 기관이나 전문가 등의 서비스를 이용한 수수료입니다. 금융비용·매출 차감 등으로 처리되는 항목과 구분해야 합니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"용역비","aliases":["용역비"],"body":"외부 업체로부터 제공받는 업무·서비스의 대가입니다. 수행 기능에 따라 제조비 또는 판관비로 구분하고 외주가공비와 중복 등록하지 마세요.","formula":"","view":"sgFixed","group":"회계"},{"title":"외주가공비","aliases":["외주비","외주가공비"],"body":"제품 제조 과정의 일부를 외부 업체에 맡긴 대가입니다. FPA는 발생액을 제조고정비 계정으로 입력할 수 있으나 실제 원가 성격은 계약·조업 방식에 따라 달라집니다.","formula":"","view":"mfgFixed","group":"원가"},{"title":"경상연구개발비","aliases":["r&d","연구개발비","경상연구개발비"],"body":"연구·개발 활동과 관련된 비용입니다. 비용 처리와 자산 인식의 판단은 별도 회계 기준에 따르며 FPA는 판관비로 입력한 금액을 계산에 반영합니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"광고선전비","aliases":["광고비","광고선전비"],"body":"제품이나 기업을 알리는 광고·홍보 비용입니다. FPA에서는 판관고정비 비용 풀의 월 발생액으로 관리할 수 있습니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"수선비","aliases":["수리비","수선비"],"body":"설비·시설 등의 성능을 유지하거나 복구하는 비용입니다. FPA는 제품별 직접 수선비와 비용 풀 계정을 지원하므로 같은 지출을 양쪽에 중복 입력하지 마세요.","formula":"","view":"repair","group":"원가"},{"title":"소모품비","aliases":["소모품비"],"body":"업무·생산 과정에서 소모되는 물품 비용입니다. 원재료 BOM에 포함한 자재와 중복 처리하지 않도록 구분하세요.","formula":"","view":"repair","group":"원가"},{"title":"직원급여","aliases":["직원급여"],"body":"관리·판매 등 직원의 급여 계정입니다. FPA에서는 판관고정비로 입력하며 생산직 노무비와 역할을 구분합니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"수도광열비","aliases":["광열비","수도광열비"],"body":"수도·전기·가스 등 사용 비용에 쓰는 계정입니다. 제품 유틸리티에 이미 반영한 비용과 중복 입력하지 않도록 적용 범위를 구분하세요.","formula":"","view":"sgFixed","group":"회계"},{"title":"매출 환율","aliases":["매출환율","수출환율"],"body":"USD 판매단가를 원화로 환산할 때 쓰는 원/USD 환율입니다. USD 거래 매출에만 영향을 주며 원화 거래에는 적용하지 않습니다.","formula":"","view":"sales","group":"환율"},{"title":"원재료 환율","aliases":["재료환율","수입환율","원재료환율"],"body":"USD 자재 구매단가를 원화로 환산할 때 쓰는 원/USD 환율입니다. FPA에서는 매출 환율과 독립적으로 조정합니다.","formula":"","view":"materials","group":"환율"},{"title":"환율 상승","aliases":["원화약세","환율상승"],"body":"원/USD 환율 상승은 같은 1달러를 원화로 환산한 금액이 커지는 뜻입니다. FPA에서는 USD 매출의 원화액과 USD 원재료의 원화원가에 각각 영향을 주며 순효과는 거래구조에 따라 달라집니다.","formula":"","view":"scenario","group":"환율"},{"title":"환율 하락","aliases":["원화강세","환율하락"],"body":"원/USD 환율 하락은 같은 달러 금액의 원화 환산액이 줄어드는 뜻입니다. 매출과 원재료 환율 중 어디에 적용하는지 구분해 시나리오를 만드세요.","formula":"","view":"scenario","group":"환율"},{"title":"매매기준율","aliases":["매매기준율","기준환율"],"body":"환율 비교·환산에 쓰는 기준값입니다. 은행의 실제 송금·환전 적용 환율이나 회사의 계약 환율과 같다고 볼 수는 없습니다. FPA 시장창의 ECB 환율은 원화 교차환산 참고값입니다.","formula":"","view":"sales","group":"환율"},{"title":"교차환율","aliases":["cross rate","교차환율"],"body":"두 통화의 환율을 제3통화 기준 환율로부터 계산한 값입니다. FPA의 ECB 데이터는 EUR 기준 통화값과 KRW 값을 이용해 표시 통화당 원화값으로 환산합니다.","formula":"원/통화 = 원/EUR ÷ 통화/EUR","view":"sales","group":"환율"},{"title":"환율 표시 단위","aliases":["100엔","100동","환율단위"],"body":"티커는 원/1통화를 기본으로 하되 JPY·VND·IDR은 원/100통화로 표시합니다. 시나리오에 적용 가능한 USD 환율은 원/1USD 기준입니다.","formula":"","view":"sales","group":"환율"},{"title":"당일 환율 적용","aliases":["오늘환율","최신환율","당일환율"],"body":"시장창에서 최신 공표 USD 참고환율의 기준일을 확인한 뒤 매출·원재료·제품·기간을 선택해 적용할 수 있습니다. 주말이나 공표 전에는 최근 공표일 자료가 표시됩니다. 적용된 가정은 이후 시세가 바뀌어도 고정됩니다.","formula":"","view":"sales","group":"사용법"},{"title":"환차손익","aliases":["외환차손익","환차손","환차익"],"body":"외화 거래의 결제나 평가 과정에서 환율 차이로 생기는 손익입니다. FPA는 매출·원재료 환산을 시뮬레이션하며 채권·채무 결제 시점별 환차손익은 별도로 계산하지 않습니다.","formula":"","view":"help","group":"회계"},{"title":"환헤지","aliases":["헤징","선물환","환헤지"],"body":"환율 변동에 따른 위험을 줄이는 활동입니다. 선물환 등 계약 조건은 거래와 만기에 따라 다릅니다. FPA에는 헤지 계약 손익·헤지회계 계산 기능이 포함되어 있지 않습니다.","formula":"","view":"help","group":"환율"},{"title":"WTI","aliases":["wti","서부텍사스유"],"body":"미국을 대표하는 원유 가격 지표 중 하나입니다. FPA는 EIA 원천·FRED 제공의 Cushing WTI 일별 현물가격을 USD/bbl로 표시합니다. 선물가격과는 다른 자료입니다.","formula":"","view":"total","group":"시장"},{"title":"Brent","aliases":["brent","브렌트","브렌트유"],"body":"국제 원유 가격의 대표 지표 중 하나입니다. FPA는 EIA 원천·FRED 제공의 Europe Brent 일별 현물가격을 표시합니다. 다른 지역 원유나 개별 자재 계약가격과 같지 않습니다.","formula":"","view":"total","group":"시장"},{"title":"현물과 선물","aliases":["선물가격","현물가격","현물과선물"],"body":"현물은 현재 인도되는 상품의 가격이고 선물은 정한 미래 시점의 인도·결제를 조건으로 한 계약가격입니다. 만기와 거래 조건이 다르므로 서로 섞어 비교하지 마세요.","formula":"","view":"total","group":"시장"},{"title":"배럴","aliases":["bbl","배럴"],"body":"석유의 부피 단위이며 미국 석유 배럴은 42 US gallon, 약 158.987리터입니다. kg으로 바꾸려면 물질의 밀도가 필요합니다. 원유 배럴 가격을 자재 kg단가로 바로 사용할 수 없습니다.","formula":"","view":"total","group":"시장"},{"title":"유가 연동","aliases":["유가연동","원유연동"],"body":"유가 변화가 개별 원재료 가격에 영향을 줄 수 있지만 연동 비율·시차·계약 구조가 따로 필요합니다. 현재 FPA 티커는 참고 정보이며 BOM 단가나 연료 단가를 자동으로 바꾸지 않습니다.","formula":"","view":"materials","group":"시장"},{"title":"전일 대비","aliases":["등락률","전일대비"],"body":"FPA는 같은 시계열의 최근 유효 관측값과 직전 유효 관측값을 비교합니다. 휴일·결측일은 건너뛰며 비교 기준일을 상세창에 표시합니다. 보충 환율처럼 비교자료가 없으면 등락을 표시하지 않습니다.","formula":"(최근값 ÷ 직전값 − 1) × 100","view":"total","group":"시장"},{"title":"시세 기준일","aliases":["기준일","시세기준일","갱신지연"],"body":"가격이 관측·공표된 날짜와 앱이 조회한 시각은 다릅니다. FPA는 둘을 구분해 표시하고, 조회 실패 시 이전 자료임을 표시합니다. 최근 조회에 성공해도 원자료가 오래되면 최신 시세로 표시하지 않습니다.","formula":"","view":"total","group":"사용법"},{"title":"타워","aliases":["tower","타워","탑"],"body":"공정에서 쓰는 탑 형태의 설비를 통칭하는 말입니다. 증류탑·흡수탑 등 역할이 다르므로 이름만으로 세부 기능을 단정할 수 없습니다. FPA의 설비 수는 배부를 위한 입력값이며 실제 처리용량과 같지는 않습니다.","formula":"","view":"drivers","group":"공정"},{"title":"증류","aliases":["distillation","증류"],"body":"혼합물 성분의 휘발도 차이를 이용해 기화와 응축을 반복하며 분리하는 조작입니다. 분리 난이도는 성분·압력·조성 등에 따라 달라지고 단순한 끓는점 차이만으로 모든 운전 조건이 정해지지는 않습니다.","formula":"","view":"help","group":"공정"},{"title":"증류탑","aliases":["distillation column","증류탑"],"body":"증기와 액체의 접촉을 이용해 혼합물 성분을 분리하는 설비입니다. 일반적으로 탑·재비기·응축기 등이 연결되며 에너지 사용량이 원가에 영향을 줍니다.","formula":"","view":"help","group":"공정"},{"title":"흡수탑","aliases":["absorber","흡수탑"],"body":"기체 속 특정 성분을 액체에 흡수시켜 분리하는 설비입니다. 증류탑과 외형이 비슷해도 분리 원리와 비용 동인이 다릅니다.","formula":"","view":"help","group":"공정"},{"title":"탈거","aliases":["stripping","스트리핑","탈거"],"body":"액체에 녹아 있는 성분을 기체 쪽으로 이동시켜 제거하는 조작입니다. 용매·가열·가스 사용량 등 운전 조건이 비용에 영향을 줍니다.","formula":"","view":"help","group":"공정"},{"title":"추출","aliases":["extraction","추출"],"body":"성분이 두 상 사이에 다르게 분배되는 성질을 이용해 분리하는 조작입니다. 사용하는 용매와 회수 공정까지 포함해 원가를 평가해야 합니다.","formula":"","view":"help","group":"공정"},{"title":"흡착","aliases":["adsorption","흡착"],"body":"특정 성분이 고체 등의 표면에 붙는 성질을 이용하는 조작입니다. 흡수와 구분하며 흡착제 교체·재생 비용이 발생할 수 있습니다.","formula":"","view":"help","group":"공정"},{"title":"반응기","aliases":["reactor","반응기"],"body":"원료를 화학 반응시켜 제품을 만드는 설비입니다. 반응 방식·체류시간·열관리 등에 따라 생산능력과 원가 구조가 달라집니다. 실제 운전 조건은 설비별 절차를 따릅니다.","formula":"","view":"help","group":"공정"},{"title":"배치 공정","aliases":["batch","배치","회분식"],"body":"일정량을 투입해 한 회차씩 처리하는 방식입니다. 투입·반응·배출·세정 등 전체 회차 시간이 생산능력에 영향을 줍니다.","formula":"","view":"help","group":"공정"},{"title":"연속 공정","aliases":["continuous","연속공정"],"body":"원료 공급과 제품 배출을 지속하는 방식입니다. 안정 운전 시간·정지·기동 손실을 고려해야 하며 가동일수만으로 실제 생산능력이 결정되지는 않습니다.","formula":"","view":"help","group":"공정"},{"title":"열교환기","aliases":["heat exchanger","열교환기"],"body":"온도가 다른 유체 사이에 열을 전달하는 설비입니다. 가열·냉각·응축·증발 등에 쓰이며 열회수 효율과 오염이 유틸리티 비용에 영향을 줄 수 있습니다.","formula":"","view":"help","group":"공정"},{"title":"재비기","aliases":["reboiler","리보일러","재비기"],"body":"증류 계통 등에서 액체를 가열해 증기를 만드는 열교환 설비입니다. 열원 사용이 스팀·연료 원단위에 영향을 줍니다.","formula":"","view":"help","group":"공정"},{"title":"응축기","aliases":["condenser","콘덴서","응축기"],"body":"증기를 냉각해 액체로 바꾸는 설비입니다. 냉각수나 다른 냉각원이 사용되며 냉각 부하가 관련 비용에 영향을 줍니다.","formula":"","view":"help","group":"공정"},{"title":"환류","aliases":["reflux","환류"],"body":"증류 계통에서 응축된 액체의 일부를 탑으로 돌려보내는 것입니다. 분리와 에너지 사용에 영향을 주지만 최적값은 설비·조성 조건에 따라 달라집니다.","formula":"","view":"help","group":"공정"},{"title":"진공증류","aliases":["감압증류","진공증류"],"body":"압력을 낮춘 조건에서 증류하는 방식입니다. 온도 부담을 줄일 수 있지만 진공계통의 에너지·유지비도 고려해야 합니다.","formula":"","view":"help","group":"공정"},{"title":"트레이","aliases":["tray","트레이"],"body":"탑 안에서 기체와 액체의 접촉을 돕는 판 형태의 내부 구조물입니다. 처리량·압력강하·분리 성능과 관련되며 FPA는 내부 구조를 직접 모델링하지 않습니다.","formula":"","view":"help","group":"공정"},{"title":"충전물","aliases":["packing","패킹","충전물"],"body":"탑 안에서 접촉 면적을 제공하는 내부 재료입니다. 물류 화면의 제품 포장비와는 다른 뜻입니다.","formula":"","view":"help","group":"공정"},{"title":"압력강하","aliases":["pressure drop","차압","압력강하"],"body":"유체가 배관·장치 등을 지나며 압력이 낮아지는 현상입니다. 막힘·오염·유량 변화 등 여러 원인이 있으므로 비용 분석과 설비 진단을 구분해야 합니다.","formula":"","view":"help","group":"공정"},{"title":"열부하","aliases":["heat duty","열부하"],"body":"가열·냉각 등에서 전달해야 하는 열량의 속도 또는 지정 기간 열량입니다. 단위 kW와 kWh는 각각 일률과 에너지로 다릅니다.","formula":"","view":"help","group":"공정"},{"title":"스팀","aliases":["steam","증기","스팀"],"body":"공정 가열 등에 사용하는 수증기입니다. 압력·온도·응축수 회수 등에 따라 유효 열량과 원가가 달라질 수 있습니다.","formula":"","view":"utility","group":"공정"},{"title":"응축수","aliases":["condensate","응축수"],"body":"증기가 열을 전달한 뒤 액체 물로 변한 것입니다. 회수 상태는 보일러 보충수와 에너지 수요에 영향을 줄 수 있습니다.","formula":"","view":"help","group":"공정"},{"title":"냉각수","aliases":["cooling water","냉각수"],"body":"설비의 열을 제거하는 데 쓰이는 물입니다. 순환량과 실제 보충수량은 다르므로 원가 입력의 사용량 기준을 맞춰야 합니다.","formula":"","view":"utility","group":"공정"},{"title":"칠러","aliases":["chiller","냉동기","칠러"],"body":"냉매 사이클 등으로 냉각 유체를 낮은 온도로 만드는 설비입니다. 냉각수 공급 설비와 구분하며 전력 사용이 중요한 비용 동인이 될 수 있습니다.","formula":"","view":"help","group":"공정"},{"title":"펌프","aliases":["pump","펌프"],"body":"주로 액체에 에너지를 주어 이송하는 장치입니다. 유량·양정·효율 등이 전력 소비에 영향을 줍니다.","formula":"","view":"help","group":"공정"},{"title":"압축기","aliases":["compressor","컴프레서","압축기"],"body":"기체의 압력을 높이는 장치입니다. 유량·압력비·효율과 운전 상태가 에너지 사용량에 영향을 줍니다.","formula":"","view":"help","group":"공정"},{"title":"여과","aliases":["filtration","필터","여과"],"body":"여재 등을 이용해 입자나 부유물을 분리하는 조작입니다. 필터 교체·압력손실·제품 손실을 비용 측면에서 함께 볼 수 있습니다.","formula":"","view":"help","group":"공정"},{"title":"건조","aliases":["drying","건조"],"body":"물이나 용매 등 휘발 성분을 제거하는 조작입니다. 열원·전력·배출 처리 비용과 제품 손실 등이 원가에 영향을 줍니다.","formula":"","view":"help","group":"공정"},{"title":"농축","aliases":["concentration","농축"],"body":"용매 등을 제거해 특정 성분의 농도를 높이는 조작입니다. 농도가 높아지는 것과 불순물이 줄어 순도가 높아지는 것은 다를 수 있습니다.","formula":"","view":"help","group":"공정"},{"title":"정제","aliases":["purification","정제"],"body":"원하는 성분에서 불순물을 줄여 품질 조건을 맞추는 과정입니다. 순도 개선과 수율·에너지·검사비 사이의 관계를 함께 분석할 수 있습니다.","formula":"","view":"help","group":"공정"},{"title":"순도","aliases":["purity","순도"],"body":"물질 중 원하는 성분이 차지하는 비중입니다. 질량·몰·면적 등 분석 기준이 다를 수 있습니다. FPA의 수율 입력값을 순도로 대신 입력하면 안 됩니다.","formula":"","view":"help","group":"공정"},{"title":"회수율","aliases":["recovery","회수율"],"body":"기준 투입물 중 목표 성분 등을 회수한 비율입니다. 전체 질량 기준 생산수율과 정의가 다를 수 있으므로 분자·분모를 명시해야 합니다.","formula":"","view":"help","group":"공정"},{"title":"물질수지","aliases":["mass balance","질량수지","물질수지"],"body":"지정한 계 안의 투입·산출·축적을 맞추는 계산입니다. FPA BOM은 완제품·수율 기반의 단순 투입 모델이며 공정 전체의 반응·부산물 물질수지 해석기는 아닙니다.","formula":"투입 − 산출 + 생성 − 소멸 = 축적","view":"materials","group":"공정"},{"title":"에너지수지","aliases":["energy balance","열수지","에너지수지"],"body":"계 안으로 들어오고 나가는 에너지와 축적을 맞추는 계산입니다. FPA는 실제 설비 열수지를 풀지 않고 사용자가 입력한 유틸리티 원단위로 비용을 계산합니다.","formula":"","view":"utility","group":"공정"},{"title":"체류시간","aliases":["residence time","체류시간"],"body":"물질이 장치나 공정 안에 머무는 대표 시간입니다. 반응·분리·생산능력에 영향을 주며 설비별 운전 조건에 따라 정의가 달라질 수 있습니다.","formula":"","view":"help","group":"공정"},{"title":"병목","aliases":["bottleneck","병목공정","병목"],"body":"전체 공정의 처리량을 제한하는 단계나 자원입니다. 설비 수가 많아도 병목 단계의 능력이 낮으면 전체 생산량이 제한될 수 있습니다.","formula":"","view":"drivers","group":"운영"},{"title":"생산능력","aliases":["capacity","캐파","생산능력"],"body":"주어진 설비·시간·제품 조건에서 생산할 수 있는 양입니다. 명목능력과 실제 달성능력은 정지·교체·수율 등으로 달라질 수 있습니다.","formula":"","view":"drivers","group":"운영"},{"title":"가동률","aliases":["utilization","가동률"],"body":"정한 가용시간이나 생산능력 중 실제 사용한 비율입니다. 시간 기준과 생산량 기준이 다르므로 분모를 명시해야 합니다. FPA는 가동률을 자동 산출하는 별도 설비 달력을 갖고 있지 않습니다.","formula":"","view":"drivers","group":"운영"},{"title":"가동일수","aliases":["조업일수","가동일수"],"body":"FPA에서는 제품·월별로 입력하는 가동 일수입니다. 각 값은 0~31일이며 공장 배부 시 제품별 값이 합산될 수 있습니다.","formula":"","view":"drivers","group":"운영"},{"title":"설비 수","aliases":["타워수량","타워수","설비수"],"body":"FPA에서 배부 가중치에 사용하는 제품별 설비 수입니다. 설비 크기·처리용량의 차이를 자동 보정하지 않으므로 입력 기준을 일관되게 관리해야 합니다.","formula":"설비×가동일수 = 설비 수 × 가동일수","view":"drivers","group":"운영"},{"title":"OEE","aliases":["oee","설비종합효율"],"body":"가용성·성능·품질 요인을 결합해 설비 효율을 보는 지표입니다. FPA 현재 입력만으로 OEE를 정확히 산출할 수는 없습니다.","formula":"가용성 × 성능 × 품질","view":"drivers","group":"운영"},{"title":"정기보수","aliases":["turnaround","셧다운","정기보수"],"body":"계획한 설비 점검·보수를 위해 생산을 멈추는 활동입니다. 생산량·가동일수 감소와 수선비 증가를 각각 입력해 손익 영향을 비교할 수 있습니다.","formula":"","view":"repair","group":"운영"},{"title":"기동과 정지","aliases":["스타트업","기동","정지손실"],"body":"공정을 시작하거나 멈출 때 정상 운전과 다른 에너지 사용·제품 손실 등이 발생할 수 있습니다. FPA에서는 실제 수율·원단위·비용 가정에 반영합니다.","formula":"","view":"drivers","group":"운영"},{"title":"제품 믹스","aliases":["product mix","제품믹스"],"body":"전체 판매·생산 중 제품별 구성 비중입니다. 제품별 단가·수율·배부 기준이 다르면 믹스 변화만으로도 총수익성이 바뀔 수 있습니다.","formula":"","view":"items","group":"원가"},{"title":"기회비용","aliases":["opportunity cost","기회비용"],"body":"하나를 선택하면서 포기한 다른 대안의 가치입니다. 장부에 기록된 발생비용과 구분하며 FPA 기본 손익에 자동 포함되지 않습니다.","formula":"","view":"help","group":"원가"},{"title":"매몰원가","aliases":["sunk cost","매몰원가"],"body":"이미 발생해 현재 선택으로 되돌릴 수 없는 원가입니다. 앞으로 바뀔 수 있는 비용과 구분해 의사결정해야 합니다.","formula":"","view":"help","group":"원가"},{"title":"표준원가","aliases":["standard cost","표준원가"],"body":"정한 정상 조건의 수량·단가 등을 기준으로 계산한 원가입니다. 실제 원가와 비교하면 가격·수량·효율 차이를 분석할 수 있습니다. FPA에서 계획과 실적 CASE를 따로 관리할 수 있습니다.","formula":"","view":"scenario","group":"원가"},{"title":"실제원가","aliases":["actual cost","실제원가"],"body":"실제로 발생한 수량과 금액에 따른 원가입니다. 계획 가정과 비교할 때 평가 방법·기간·비용 범위를 같게 맞춰야 합니다.","formula":"","view":"scenario","group":"원가"},{"title":"원가 차이분석","aliases":["variance","원가차이","차이분석"],"body":"계획과 실적 차이를 가격·수량·수율·믹스 등 요인으로 나누는 분석입니다. 여러 변수가 함께 바뀌면 교차 효과가 생길 수 있어 분석 순서를 명확히 해야 합니다.","formula":"","view":"scenario","group":"원가"},{"title":"재무상태표","aliases":["b/s","bs","대차대조표","재무상태표"],"body":"특정 시점의 자산·부채·자본을 보여주는 재무제표입니다. FPA는 제품별 손익 모델로 완전한 재무상태표를 작성하지 않습니다.","formula":"자산 = 부채 + 자본","view":"help","group":"회계"},{"title":"손익계산서","aliases":["i/s","is","손익계산서"],"body":"일정 기간의 수익과 비용, 이익을 보여주는 재무제표입니다. FPA는 제품·공장별 영업손익 중심이며 금융손익·법인세·당기순이익 전체를 구성하지 않습니다.","formula":"","view":"pnl","group":"회계"},{"title":"현금흐름표","aliases":["cash flow","현금흐름표"],"body":"현금의 유입·유출을 영업·투자·재무 활동 등으로 구분해 보여주는 재무제표입니다. 손익과 현금흐름은 매출채권·재고·투자 등 때문에 달라질 수 있습니다.","formula":"","view":"help","group":"회계"},{"title":"발생주의","aliases":["accrual","발생주의"],"body":"현금 수수 시점만이 아니라 수익·비용이 발생한 기간에 인식하는 회계 원칙입니다. FPA에 월 비용을 넣을 때 지급월과 발생월을 구분하세요.","formula":"","view":"help","group":"회계"},{"title":"매출채권","aliases":["accounts receivable","매출채권"],"body":"제품 등을 판매했지만 아직 받지 못한 금액입니다. 매출 인식과 현금 회수의 시차를 만들며 FPA는 회수 일정과 대손을 별도로 모델링하지 않습니다.","formula":"","view":"help","group":"회계"},{"title":"매입채무","aliases":["accounts payable","매입채무"],"body":"원재료 등을 구매하고 아직 지급하지 않은 금액입니다. 원가 발생과 현금 지급 시점은 다를 수 있습니다. FPA에는 지급 일정 모델이 없습니다.","formula":"","view":"help","group":"회계"},{"title":"운전자본","aliases":["working capital","운전자본"],"body":"일상 영업에 묶이는 자금 규모를 보는 개념입니다. 분석 목적에 따라 유동자산−유동부채 또는 영업 관련 항목만을 사용하므로 정의를 먼저 정해야 합니다.","formula":"","view":"help","group":"회계"},{"title":"CAPEX","aliases":["capex","설비투자","자본적지출"],"body":"장기간 사용할 자산의 취득·개선 등에 쓰는 투자 지출입니다. 전액을 즉시 비용 처리하는 운영비와 구분합니다. FPA에서는 투자·상각 스케줄을 직접 생성하지 않습니다.","formula":"","view":"help","group":"회계"},{"title":"OPEX","aliases":["opex","운영비"],"body":"일상 운영에 드는 지출·비용을 뜻하는 표현입니다. 사용 목적에 따라 포함 범위가 달라질 수 있으므로 제조비·판관비 등 구체 계정으로 구분하세요.","formula":"","view":"help","group":"회계"},{"title":"순이익","aliases":["당기순이익","순이익"],"body":"영업손익 외 손익과 법인세 등을 반영한 최종 기간 이익입니다. FPA 화면의 영업이익이나 EBITDA를 순이익으로 해석하면 안 됩니다.","formula":"","view":"pnl","group":"회계"},{"title":"부가가치세","aliases":["vat","부가세","부가가치세"],"body":"거래의 공급가액과 별도로 부과되는 세금입니다. FPA는 부가세 신고·공제 모델이 없으므로 수익·비용 입력 기준을 세전 금액 등으로 일관되게 맞춰야 합니다.","formula":"","view":"help","group":"회계"},{"title":"순현재가치","aliases":["npv","순현재가치"],"body":"미래 현금흐름을 할인해 현재가치로 환산한 뒤 투자금 등을 반영하는 지표입니다. FPA 영업손익만으로는 현금흐름·할인율이 없어 NPV를 계산할 수 없습니다.","formula":"","view":"help","group":"회계"},{"title":"내부수익률","aliases":["irr","내부수익률"],"body":"투자 현금흐름의 순현재가치를 0으로 만드는 할인율입니다. 현금흐름 부호가 여러 번 바뀌면 해석에 주의가 필요하며 FPA 기본 계산 범위에는 없습니다.","formula":"","view":"help","group":"회계"},{"title":"ppm","aliases":["ppm","피피엠"],"body":"백만분율을 뜻합니다. 질량 기준인지 부피·몰 기준인지 명시해야 합니다. 분석값 ppm을 FPA BOM 투입비율의 %와 혼동하지 마세요.","formula":"1% = 10,000 ppm","view":"help","group":"공정"},{"title":"ppb","aliases":["ppb","피피비"],"body":"십억분율을 뜻합니다. ppm보다 작은 비율 단위이며 질량·몰 등 기준을 함께 확인해야 합니다.","formula":"1 ppm = 1,000 ppb","view":"help","group":"공정"},{"title":"밀도","aliases":["density","밀도"],"body":"단위 부피당 질량입니다. 온도와 조성에 따라 달라질 수 있으므로 L·m³와 kg·t를 환산할 때 대상 물질의 조건에 맞는 값을 사용해야 합니다.","formula":"질량 = 밀도 × 부피","view":"help","group":"공정"},{"title":"Nm³","aliases":["nm3","노말루베","표준체적"],"body":"정한 기준 온도·압력으로 환산한 기체 체적입니다. Nm³의 기준 조건은 적용 규격에 따라 확인해야 하며 실제 운전 체적 m³와 다를 수 있습니다.","formula":"","view":"help","group":"공정"},{"title":"kW와 kWh","aliases":["kwh","kw","kW와kWh"],"body":"kW는 순간 전력 등 일률, kWh는 기간 동안 사용한 전기에너지입니다. FPA의 kg당 전력 사용량은 kWh/kg이고 단가는 원/kWh입니다.","formula":"에너지 kWh = 평균전력 kW × 시간 h","view":"utility","group":"공정"},{"title":"공정 안전","aliases":["psm","공정안전","위험물"],"body":"공정 위험을 체계적으로 관리하는 활동입니다. 이 도움말은 용어 이해와 원가 분석을 위한 것으로 실제 운전·정비 조건은 승인된 현장 절차와 담당 전문가를 통해 확인해야 합니다.","formula":"","view":"help","group":"공정"},{"title":"SDS","aliases":["msds","sds","물질안전보건자료"],"body":"물질의 유해성·취급·저장·응급조치 등을 담은 자료입니다. 실제 제품·제조사·버전에 맞는 SDS를 사용해야 하며 FPA는 제품별 안전자료를 제공하지 않습니다.","formula":"","view":"help","group":"공정"},{"title":"세정과 전환","aliases":["세척","세정","제품전환"],"body":"제품 교체 시 설비를 청소·준비하는 과정입니다. 시간·세정제·폐기물·수율 손실을 나눠 보면 제품 믹스와 생산계획의 비용 영향을 분석할 수 있습니다.","formula":"","view":"help","group":"운영"},{"title":"폐기물 처리비","aliases":["폐수처리","폐기물","폐기물처리비"],"body":"공정 배출물 등을 처리하는 비용입니다. 처리량 비례분과 고정비를 구분하고 실제 발생비용을 별도 계정이나 적절한 비용 풀로 입력할 수 있습니다.","formula":"","view":"mfgFixed","group":"원가"},{"title":"부산물","aliases":["byproduct","부산물"],"body":"주제품과 함께 발생하는 부수적인 산출물입니다. FPA는 부산물 수불과 가치 차감 규칙을 자동 계산하지 않으므로 원가 입력·다른 제품 등록 방식의 일관성을 확인해야 합니다.","formula":"","view":"help","group":"원가"},{"title":"재공품","aliases":["wip","재공품"],"body":"생산 중이며 아직 완제품이 되지 않은 재고입니다. FPA 현재 모델은 완제품 월별 재고 중심으로, 공정별 완성도에 따른 재공품 원가 계산은 지원하지 않습니다.","formula":"","view":"inventory","group":"원가"},{"title":"제품 직접비","aliases":["제품직접비"],"body":"특정 제품에 바로 귀속되는 비용입니다. FPA에서는 공장·제품 배부 기준을 모두 거치지 않고 지정 제품에 전액 반영합니다.","formula":"","view":"mfgFixed","group":"사용법"},{"title":"공장 직접비","aliases":["공장직접비"],"body":"특정 공장에 바로 귀속되는 비용입니다. FPA에서는 공장 간 배부를 생략하고 그 공장 제품들에 제품 배부 기준을 적용합니다.","formula":"","view":"mfgFixed","group":"사용법"},{"title":"시나리오 비교","aliases":["기준시나리오","시나리오비교"],"body":"시나리오 설정에서 기준 CASE를 지정하면 입력 차이와 조정 기록을 확인할 수 있습니다. 비교 기준은 저장된 다른 CASE이며 시세가 갱신되어도 자동 변경되지 않습니다.","formula":"","view":"scenario","group":"사용법"},{"title":"필터와 배부","aliases":["필터배부","필터와배부"],"body":"화면에서 공장·제품을 필터링해도 원래 비용 풀의 배부 분모는 바뀌지 않습니다. 보이는 제품만으로 공통비를 다시 나누면 전체 손익과 달라질 수 있어 FPA는 이를 분리합니다.","formula":"","view":"mfgFixed","group":"사용법"},{"title":"입력 순서","aliases":["시작방법","입력순서","어떻게시작"],"body":"공장·제품과 기초재고를 등록한 뒤 매출, 생산량·수율·가동일수, BOM, 유틸리티, 노무비·고정비·판관비를 입력합니다. 마지막으로 검산과 제품별 손익을 확인하세요.","formula":"","view":"master","group":"사용법"},{"title":"채팅 명령","aliases":["명령어","채팅명령","명령사용법"],"body":"항목·변경값·기간·대상을 입력하면 적용 전에 변경 내역과 손익 영향을 보여줍니다. 예: ‘3분기 전력 단가 5% 상승’. 입력 문장은 외부 AI로 보내지 않습니다. 모호한 항목은 선택하고 이해하지 못한 문장은 실행하지 않습니다.","formula":"","view":"scenario","group":"사용법"},{"title":"지원 범위","aliases":["답변범위","챗봇한계","지원범위"],"body":"이 도우미는 검토된 용어 설명 검색, FPA 계산 근거 설명, 정해진 시나리오 수정 명령을 처리합니다. 자유로운 전문가 판단이나 임의의 공정 최적화 답변을 생성하지 않습니다. 연결된 자료와 계산 근거를 확인할 수 있습니다.","formula":"","view":"help","group":"사용법"}];
const chatNorm=s=>String(s).normalize('NFKC').toLowerCase().replace(/[\s_·/()\-]/g,'');
const chatAllMonths=()=>Array.from({length:12},(_,i)=>i+1);
const CHAT_SOURCES={회계:[['IFRS · 재무제표 기준 안내','https://www.ifrs.org/issued-standards/list-of-standards/']],원가:[['IAS 2 · 재고자산','https://www.ifrs.org/issued-standards/list-of-standards/ias-2-inventories/']],공정:[['안전보건공단 · 설비 안내','https://miis.kosha.or.kr/oshci/busi/viewMiisSafetyMachandiseInfo.do']],환율:[['ECB · 기준환율','https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html']],시장:[['EIA · 공개 데이터','https://www.eia.gov/opendata/'],['FRED · 원유 현물','https://fred.stlouisfed.org/series/DCOILBRENTEU']]};
function searchKnowledge(query,limit=5){const q=chatNorm(query).replace(/(무엇인가요|무엇이야|무슨뜻인가요|무슨뜻|알려주세요|설명해주세요|설명해줘|뭐예요|뭐에요|뭔가요|뭐야|이란|란|인가요|대해|궁금해요|\?|？|뜻)$/g,'');if(!q)return [];return FPA_KNOWLEDGE.map((e,index)=>{const keys=[e.title,...e.aliases].map(chatNorm);let score=Math.max(...keys.map(k=>q===k?100:q.includes(k)&&k.length>=2?Math.min(80,k.length*5):k.includes(q)&&q.length>=2?35:0));if(!score){const terms=String(query).toLowerCase().split(/\s+/).filter(t=>t.length>=2);score=terms.reduce((v,t)=>v+(e.body.includes(t)?1:0),0);if(score<2)score=0;}return {entry:e,score,index};}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.index-b.index).slice(0,limit);}
function commandSpecs(c){const rows=ROW_VARIABLES.filter(v=>!['currency'].includes(v[0])).map(([field,group,label,unit])=>({id:'rows:'+field,table:'rows',field,group,label,unit,aliases:[label]}));const aliases={qty:['판매량','판매수량','매출수량'],usd:['판매단가 USD','매출단가 USD','달러 판가'],krw:['판매단가 KRW','매출단가 KRW','원화 판가'],fx:['매출 환율','판매 환율','수출 환율'],production:['생산량','생산수량'],yield:['수율'],days:['가동일수','조업일수'],towers:['타워 수','타워 수량','설비 수'],powerUse:['전력 사용량','전력 원단위','전기 사용량'],powerPrice:['전력 단가','전기 단가'],steamUse:['스팀 사용량','가스 사용량','스팀 원단위'],steamPrice:['스팀 단가','가스 단가'],fuelUse:['연료 사용량','연료 원단위'],fuelPrice:['연료 단가'],waterUse:['용수 사용량','용수 원단위'],waterPrice:['용수 단가'],repair:['제품 수선비','수선비'],consumable:['제품 소모품비','소모품비'],freightRate:['운반비율','운반 비율'],packRate:['포장비율','포장 비율']};rows.forEach(r=>r.aliases=[...(aliases[r.field]||[]),r.label]);rows.find(r=>r.field==='fx').label='매출 적용환율';rows.find(r=>r.field==='fx').aliases=aliases.fx;
const defs=[...rows,{id:'bom:fx',table:'bom',field:'fx',group:'재료비',label:'원재료 적용환율',unit:'원/USD',aliases:['원재료 환율','재료 환율','자재 환율','수입 환율']},{id:'bom:ratio',table:'bom',field:'ratio',group:'재료비',label:'투입비율',unit:'%',aliases:['투입비율','배합비']},{id:'bom:usd',table:'bom',field:'usd',group:'재료비',label:'자재 단가 USD',unit:'USD/kg',aliases:['자재 단가 USD','원재료 단가 USD']},{id:'bom:krw',table:'bom',field:'krw',group:'재료비',label:'자재 단가 KRW',unit:'원/kg',aliases:['자재 단가 KRW','원재료 단가 KRW']},{id:'labor:amount',table:'labor',field:'amount',group:'노무비',label:'노무비',unit:'원',aliases:['노무비','생산 인건비']},{id:'mfgPools:amount',table:'mfgPools',field:'amount',group:'제조고정비',label:'제조고정비 전체',unit:'원',aliases:['제조고정비','제조 고정비']},{id:'sgPools:amount',table:'sgPools',field:'amount',group:'판관고정비',label:'판관고정비 전체',unit:'원',aliases:['판관고정비','판관 고정비']}];
for(const [table,group,prefix] of [['mfgPools','제조고정비','제조'],['sgPools','판관고정비','판관'],['labor','노무비','노무']])for(const account of new Set(c[table].map(p=>p.account)))defs.push({id:table+':'+account,table,field:'amount',account,group,label:prefix+' '+account,unit:'원',aliases:[prefix+' '+account]});return defs;}
function parseChatScope(text,c,defaults){let rest=text,scope={site:defaults.site||'',product:defaults.product||'',months:[...(defaults.months||chatAllMonths())]};const remove=r=>{rest=rest.replace(r,' ')};const explicitMonths=[];let match;

let assistantUI={open:false,mode:'command',scope:{site:'',product:'',months:chatAllMonths()},messages:[],pending:null,choices:{},original:'',draftText:''};

function safeTable(headers,rows){return '<div class="chat-table"><table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function knowledgeCard(entry){const index=FPA_KNOWLEDGE.indexOf(entry);return '<article class="knowledge-card"><strong>'+esc(entry.title)+'</strong><p>'+esc(entry.body)+'</p>'+(entry.formula?'<div class="chat-formula">'+esc(entry.formula)+'</div>':'')+'<div class="chat-links"><button type="button" class="mini-button" onclick="navigate(\''+entry.view+'\')">관련 화면</button>'+((CHAT_SOURCES[entry.group]||[]).map(([label,url])=>'<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>').join('')||'<span>FPA 계산·입력 기준</span>')+'</div></article>';}
function showKnowledge(index){assistantSay(knowledgeCard(FPA_KNOWLEDGE[index]));}
