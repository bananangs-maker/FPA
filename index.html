원가가 될 수 있고, 판매수수료는 직접 추적 가능해도 통상 판매 기간원가 성격입니다.","check":"직접비=변동비, 간접비=고정비로 등치하지 않습니다. 무엇에 대한 직접비인지 원가대상을 먼저 정합니다.","ref":"cost"}},{"title":"제조원가의 흐름","aliases":["당기총제조원가","당기제품제조원가","재공품흐름"],"body":"재료·노무·제조간접원가는 재공품을 거쳐 완성품으로 대체되고 판매분은 매출원가가 됩니다.","formula":"제품제조원가 = 기초재공품 + 당기총제조원가 − 기말재공품","view":"help","group":"원가","lesson":{"section":"원가관리 · 기초","principle":"재료·노무·제조간접원가는 재공품을 거쳐 완성품으로 대체되고 판매분은 매출원가가 됩니다.","example":"기초 재공 20 + 당기 투입 100 − 기말 재공 30이면 완성품 제조원가 90입니다.","check":"완성품 제조원가와 판매된 제품의 매출원가를 구분합니다. FPA는 재공품을 별도 계산하지 않습니다.","ref":"cost"}},{"title":"제조간접비 예정배부","aliases":["예정배부율","배부차이","정상원가계산"],"body":"예정 제조간접비를 예정 배부기준량으로 나눈 배부율에 실제 기준량을 곱해 배부합니다. 실제 발생액과의 차이를 조정합니다.","formula":"예정배부액 = 예정배부율 × 실제 배부기준량","view":"help","group":"원가","lesson":{"section":"원가관리 · 배부","principle":"예정 제조간접비를 예정 배부기준량으로 나눈 배부율에 실제 기준량을 곱해 배부합니다. 실제 발생액과의 차이를 조정합니다.","example":"예정간접비 1억원 / 예정 2만시간 = 시간당 5천원. 실제 1만8천시간이면 배부 9천만원입니다.","check":"과소·과대배부의 처리와 재고·매출원가 배분은 중요성과 회계정책을 봅니다. 실제배부와 혼용하지 않습니다.","ref":"cost"}},{"title":"보조부문 직접배분법","aliases":["직접배분법","보조부문배분"],"body":"보조부문 상호 용역을 무시하고 제조부문에만 원가를 직접 배분합니다.","formula":"","view":"help","group":"원가","lesson":{"section":"원가관리 · 배부","principle":"보조부문 상호 용역을 무시하고 제조부문에만 원가를 직접 배분합니다.","example":"보전부문이 관리부문에도 서비스를 제공해도 제조부문 A·B의 사용량만으로 정규화해 나눕니다.","check":"계산이 간단하지만 보조부문 상호 이용을 반영하지 않습니다. 기준량과 분모에서 보조부문을 제외하는지 확인합니다.","ref":"cost"}},{"title":"보조부문 단계배분법","aliases":["단계배분법","계단식배분"],"body":"배분 순서를 정해 앞 부문 원가를 후속 보조·제조부문에 배분하고 이미 닫힌 부문에는 다시 배분하지 않습니다.","formula":"","view":"help","group":"원가","lesson":{"section":"원가관리 · 배부","principle":"배분 순서를 정해 앞 부문 원가를 후속 보조·제조부문에 배분하고 이미 닫힌 부문에는 다시 배분하지 않습니다.","example":"전력→보전 순이면 보전은 전력 배분액을 받은 후 제조부문으로 배분하지만 전력으로 역배분하지 않습니다.","check":"순서가 결과에 영향을 줍니다. 상호배분법과 달리 쌍방 서비스를 완전히 반영하지 않습니다.","ref":"cost"}},{"title":"보조부문 상호배분법","aliases":["상호배분법","연립방정식배부"],"body":"보조부문 간 상호 서비스를 연립방정식 등으로 반영한 총원가를 구한 뒤 제조부문에 배분합니다.","formula":"","view":"help","group":"원가","lesson":{"section":"원가관리 · 배부","principle":"보조부문 간 상호 서비스를 연립방정식 등으로 반영한 총원가를 구한 뒤 제조부문에 배분합니다.","example":"A = 자체원가 A + B가 제공한 비율×B, B = 자체원가 B + A가 제공한 비율×A로 풀 수 있습니다.","check":"내부 상호배부액을 최종 제조부문 배부액과 중복 합산하지 않습니다. 모든 총원가의 외부 제조부문 귀속 합계를 대사합니다.","ref":"cost"}},{"title":"개별원가계산","aliases":["작업원가","작업지시서","개별원가"],"body":"주문·작업별로 직접원가를 추적하고 제조간접비를 배부해 작업 원가를 계산합니다.","formula":"","view":"help","group":"원가","lesson":{"section":"원가관리 · 계산","principle":"주문·작업별로 직접원가를 추적하고 제조간접비를 배부해 작업 원가를 계산합니다.","example":"주문 A 직접재료 100 + 노무 60 + 간접비 40이면 작업 원가 200입니다.","check":"완료된 작업과 미완료 작업을 완성품·재공품으로 구분하고 배부차이 조정을 확인합니다.","ref":"cost"}},{"title":"종합원가계산 평균법","aliases":["완성품환산량","종합평균법","가중평균 종합원가"],"body":"동질 제품의 연속 생산에서 기초 재공과 당기 원가를 합쳐 완성품환산량 단위당 원가를 계산합니다.","formula":"평균법 환산량 = 완성수량 + 기말재공수량 × 완성도","view":"help","group":"원가","lesson":{"section":"원가관리 · 계산","principle":"동질 제품의 연속 생산에서 기초 재공과 당기 원가를 합쳐 완성품환산량 단위당 원가를 계산합니다.","example":"완성 800개, 기말 200개 가공완성도 50%면 가공원가 환산량은 900개입니다. 재료 전량 초기에 투입하면 재료 환산량은 1,000개입니다.","check":"수량 흐름과 원가 흐름을 별도로 대사하고 재료·가공원가의 완성도를 나눕니다.","ref":"cost"}},{"title":"종합원가계산 선입선출법","aliases":["종합FIFO","당기작업량","선입선출 종합"],"body":"당기에 수행한 작업량과 당기 원가를 대응시키고 기초 재공에 이미 포함된 원가는 별도로 이월합니다.","formula":"","view":"help","group":"원가","lesson":{"section":"원가관리 · 계산","principle":"당기에 수행한 작업량과 당기 원가를 대응시키고 기초 재공에 이미 포함된 원가는 별도로 이월합니다.","example":"기초 재공 100개 가공 40%라면 당기 완성에 필요한 가공환산량은 60개입니다.","check":"완성품 전부를 당기 작업량으로 넣으면 기초 작업을 중복 계산합니다. 평균법과 분자·분모를 섞지 않습니다.","ref":"cost"}},{"title":"연산품 원가배분","aliases":["결합원가","연산품","분리점판매가치","순실현가치법"],"body":"분리점 이전 공동 원가를 물량·판매가치·NRV 등 적절한 기준으로 배분합니다. 분리 후 원가는 개별 제품에 직접 귀속합니다.","formula":"","view":"help","group":"원가","lesson":{"section":"원가관리 · 계산","principle":"분리점 이전 공동 원가를 물량·판매가치·NRV 등 적절한 기준으로 배분합니다. 분리 후 원가는 개별 제품에 직접 귀속합니다.","example":"공동원가 100을 판매가치 A 60, B 40 비율로 배분하면 A 60, B 40입니다.","check":"추가 가공 의사결정에는 분리 이전 공동원가는 통상 매몰입니다. 배분 방식으로 제품 중단 여부를 단정하지 않습니다.","ref":"cost"}},{"title":"표준원가 설정","aliases":["이상적표준","현실적표준","표준수량"],"body":"표준 단가와 표준 투입량을 정하고 실제 산출량에 허용되는 표준량을 기준으로 차이를 분석합니다.","formula":"","view":"help","group":"원가","lesson":{"section":"원가관리 · 표준","principle":"표준 단가와 표준 투입량을 정하고 실제 산출량에 허용되는 표준량을 기준으로 차이를 분석합니다.","example":"제품당 재료 2kg, 실제 양품 100개면 허용 표준수량은 200kg입니다. 예산 생산량 120개 기준 240kg을 쓰지 않습니다.","check":"정상 감손·작업조건을 표준에 어떻게 반영했는지 확인하고 이상적 표준과 달성 가능한 표준을 구분합니다.","ref":"cost"}},{"title":"변동제조간접비 차이","aliases":["변동간접비 소비차이","변동간접비 능률차이"],"body":"소비차이는 실제 변동간접비와 실제 기준량×표준율 차이, 능률차이는 실제 기준량과 허용 표준 기준량 차이×표준율입니다.","formula":"소비차이 = 실제 변동비 − 실제기준량×표준율; 능률차이 = (실제−허용표준 기준량)×표준율","view":"help","group":"원가","lesson":{"section":"원가관리 · 표준","principle":"소비차이는 실제 변동간접비와 실제 기준량×표준율 차이, 능률차이는 실제 기준량과 허용 표준 기준량 차이×표준율입니다.","example":"실제시간 110, 허용 100, 표준율 2이면 능률차이 20 불리입니다.","check":"간접비 발생 원인이 기계시간이 아니면 해당 기준의 능률차이를 경제적 비효율로 바로 해석하지 않습니다.","ref":"cost"}},{"title":"고정제조간접비 차이","aliases":["고정간접비 예산차이","조업도차이","생산량차이"],"body":"예산차이는 실제 고정간접비와 예산액 차이, 조업도차이는 예산액과 실제 산출량 기준 표준배부액 차이로 구분합니다.","formula":"총차이 = 실제고정비 − 표준배부액 = 예산차이 + 조업도차이","view":"help","group":"원가","lesson":{"section":"원가관리 · 표준","principle":"예산차이는 실제 고정간접비와 예산액 차이, 조업도차이는 예산액과 실제 산출량 기준 표준배부액 차이로 구분합니다.","example":"예산 100, 실제 110, 표준배부 80이면 예산차이 10 불리, 조업도차이 20 불리입니다.","check":"고정비를 더 지출한 효과와 생산능력 미활용 효과를 나눕니다. 3·4분법 문제는 정의와 기준량을 추가 확인합니다.","ref":"cost"}},{"title":"원가차이의 배분","aliases":["표준원가차이조정","차이배분","과소배부"],"body":"표준과 실제 원가 차이를 매출원가로 일괄 조정하거나 관련 재공·완성품·매출원가에 배분하는 방법 등을 중요성과 발생 원인에 맞게 검토합니다.","formula":"","view":"help","group":"원가","lesson":{"section":"원가관리 · 표준","principle":"표준과 실제 원가 차이를 매출원가로 일괄 조정하거나 관련 재공·완성품·매출원가에 배분하는 방법 등을 중요성과 발생 원인에 맞게 검토합니다.","example":"기말 재고가 크고 원가차이도 중요하면 전부 매출원가로 보내는 처리의 적정성을 확인합니다.","check":"비정상 낭비를 재고에 배분해 자산화하지 않으며 재무보고용 재고 측정 기준과 연결합니다.","ref":"cost"}},{"title":"전부원가와 변동원가 이익 조정","aliases":["전부변동이익차이","재고증가와이익"],"body":"전부원가계산은 고정제조간접비를 제품원가에 포함하고 변동원가계산은 발생 기간 비용으로 처리합니다. 고정 판매관리비는 양쪽 모두 기간비용입니다.","formula":"전부이익 − 변동이익 = 기말재고 고정제조비 − 기초재고 고정제조비","view":"help","group":"원가","lesson":{"section":"원가관리 · 변동원가","principle":"전부원가계산은 고정제조간접비를 제품원가에 포함하고 변동원가계산은 발생 기간 비용으로 처리합니다. 고정 판매관리비는 양쪽 모두 기간비용입니다.","example":"기초 재고 0, 생산 1,000개, 판매 800개, 단위 고정제조비 10원이면 다른 조건이 같을 때 전부원가 이익이 2,000원 큽니다.","check":"기초·기말 단위 고정비가 다르면 단순 수량 차이 대신 각 재고에 이연·방출된 고정비 금액을 비교합니다.","ref":"cost"}},{"title":"공헌이익과 영업이익","aliases":["공헌이익","공헌이익률","contribution margin","CM"],"body":"공헌이익은 매출에서 변동비를 차감한 금액이며 고정비 회수와 이익 창출에 기여합니다. 매출총이익과 다릅니다.","formula":"영업이익 = 수량 × 단위공헌이익 − 고정비","view":"help","group":"원가","lesson":{"section":"원가관리 · CVP","principle":"공헌이익은 매출에서 변동비를 차감한 금액이며 고정비 회수와 이익 창출에 기여합니다. 매출총이익과 다릅니다.","example":"단가 100, 단위 변동비 60이면 단위 공헌이익 40, 공헌이익률 40%입니다.","check":"판매수수료·변동 물류비도 관련 변동비에 포함합니다. 제조원가 전체를 변동비로 가정하지 않습니다.","ref":"managerial"}},{"title":"목표 마진과 마크업","aliases":["목표판가","원가가산율","마크업과마진"],"body":"매출액 기준 마진과 원가 기준 가산율은 분모가 다릅니다. 같은 20%라도 필요한 판가는 다릅니다.","formula":"단순 목표판가 = 단위원가 ÷ (1−목표마진−매출연동비율)","view":"help","group":"원가","lesson":{"section":"원가관리 · CVP","principle":"매출액 기준 마진과 원가 기준 가산율은 분모가 다릅니다. 같은 20%라도 필요한 판가는 다릅니다.","example":"단위원가 100에 마크업 20%면 판가 120, 매출 마진 20% 목표면 판가 125입니다.","check":"변동 판매비율이 있으면 분모에서 함께 차감합니다. FPA 목표 판가는 재고·배부를 포함해 실제 엔진으로 역산합니다.","ref":"managerial"}},{"title":"다품목 CVP","aliases":["가중평균공헌이익률","판매믹스BEP"],"body":"품목별 공헌이익률에 매출 비중을 가중해 전체 공헌이익률을 구하거나 일정 판매 묶음의 공헌이익을 계산합니다.","formula":"가중공헌이익률 = Σ(매출비중 × 품목 공헌이익률)","view":"help","group":"원가","lesson":{"section":"원가관리 · CVP","principle":"품목별 공헌이익률에 매출 비중을 가중해 전체 공헌이익률을 구하거나 일정 판매 묶음의 공헌이익을 계산합니다.","example":"매출비중 A 60%, B 40%, 공헌이익률 30%, 50%면 가중률 38%입니다.","check":"수량 비중에 단위 공헌이익을 가중하는 방법과 매출 비중에 비율을 가중하는 방법을 혼용하지 않습니다.","ref":"managerial"}},{"title":"활동기준경영","aliases":["ABM","비부가가치활동","활동관리"],"body":"활동별 원가 정보를 이용해 비부가가치 활동·비효율을 줄이고 프로세스를 개선합니다. ABC는 측정, ABM은 활용에 중점이 있습니다.","formula":"","view":"help","group":"원가","lesson":{"section":"원가관리 · 활동","principle":"활동별 원가 정보를 이용해 비부가가치 활동·비효율을 줄이고 프로세스를 개선합니다. ABC는 측정, ABM은 활용에 중점이 있습니다.","example":"재검사·대기·반복 운반을 줄일 때 고객 가치·품질·법적 필요성도 함께 봅니다.","check":"활동량 감소가 곧바로 현금 고정비 절감이라는 뜻은 아닙니다. 실제 회피 가능한 자원과 해소 기간을 따집니다.","ref":"managerial"}},{"title":"관련원가와 기회비용","aliases":["관련원가","기회원가","차액원가","매몰원가"],"body":"대안 간 달라지는 미래 원가·수익이 관련 정보이며 과거 매몰원가와 변하지 않는 배부 고정비는 통상 제외합니다. 포기한 최선 대안 효익은 기회비용입니다.","formula":"","view":"help","group":"원가","lesson":{"section":"원가관리 · 의사결정","principle":"대안 간 달라지는 미래 원가·수익이 관련 정보이며 과거 매몰원가와 변하지 않는 배부 고정비는 통상 제외합니다. 포기한 최선 대안 효익은 기회비용입니다.","example":"유휴설비를 특별주문에 쓰면 기회비용이 없을 수 있지만 기존 주문을 밀어내면 포기 공헌이익을 포함합니다.","check":"장부상 비용 인식 여부와 의사결정 관련성은 다릅니다. 기회비용을 단순 지급 현금만으로 한정하지 않습니다.","ref":"managerial"}},{"title":"분리 후 추가가공","aliases":["추가가공","분리점추가가공","판매대가차이"],"body":"추가가공의 증분 판매수익과 추가가공원가를 비교합니다. 분리점 이전 결합원가는 이미 발생한 공통원가로 통상 비관련입니다.","formula":"","view":"help","group":"원가","lesson":{"section":"원가관리 · 의사결정","principle":"추가가공의 증분 판매수익과 추가가공원가를 비교합니다. 분리점 이전 결합원가는 이미 발생한 공통원가로 통상 비관련입니다.","example":"분리점 판매 100, 가공 후 150, 추가원가 30이면 증분이익 20입니다.","check":"공정능력 제약으로 다른 제품을 포기하면 기회비용도 포함합니다. 배부 결합원가를 다시 더하지 않습니다.","ref":"managerial"}},{"title":"종합예산과 현금예산","aliases":["종합예산","판매예산","생산예산","현금예산"],"body":"판매예산에서 생산·재료·노무·간접비·판관비 예산을 연결하고 현금·자금조달·예산 재무제표로 종합합니다.","formula":"생산예산 = 판매예산 + 목표기말제품 − 기초제품","view":"help","group":"원가","lesson":{"section":"원가관리 · 예산","principle":"판매예산에서 생산·재료·노무·간접비·판관비 예산을 연결하고 현금·자금조달·예산 재무제표로 종합합니다.","example":"판매 1,000개, 목표 기말제품 200, 기초 150이면 생산예산은 1,050개입니다.","check":"손익의 매출·비용과 회수·지급 시점은 다릅니다. 투자·차입·상환·최저 현금 잔액도 현금예산에 포함합니다.","ref":"managerial"}},{"title":"변동예산과 고정예산","aliases":["유연예산","고정예산차이","예산통제"],"body":"변동예산은 실제 활동량에 맞춰 허용 원가를 조정합니다. 고정예산과 실제만 비교하면 물량 효과와 지출·능률 효과가 섞입니다.","formula":"변동예산원가 = 실제활동량×예산변동비율 + 예산고정비","view":"help","group":"원가","lesson":{"section":"원가관리 · 예산","principle":"변동예산은 실제 활동량에 맞춰 허용 원가를 조정합니다. 고정예산과 실제만 비교하면 물량 효과와 지출·능률 효과가 섞입니다.","example":"예산 1,000개, 단위변동비 10, 고정비 5천이면 실제 1,200개 기준 변동예산은 1만7천입니다.","check":"고정비도 관련 범위 밖에서는 변할 수 있습니다. 실제 단가로 예산을 재작성하면 지출 차이를 감춥니다.","ref":"managerial"}},{"title":"판매부문 가격과 수량 차이","aliases":["판매가격차이","판매수량차이","매출차이"],"body":"기본 모형에서 가격차이는 실제수량×단가 차이, 수량차이는 수량 차이×기준단가입니다. 이익 분석이면 공헌이익 기준 등 정의를 바꿔 적용합니다.","formula":"","view":"help","group":"원가","lesson":{"section":"원가관리 · 성과","principle":"기본 모형에서 가격차이는 실제수량×단가 차이, 수량차이는 수량 차이×기준단가입니다. 이익 분석이면 공헌이익 기준 등 정의를 바꿔 적용합니다.","example":"기준 100개×10, 실제 120개×12이면 매출 차이 440 = 가격 240 + 수량 200입니다.","check":"계산 순서·기준에 따라 교차효과 귀속이 달라집니다. FPA 손익 변화는 순차대체를 명시하고 재고·배부까지 재계산합니다.","ref":"managerial"}},{"title":"책임중심점과 통제가능성","aliases":["원가중심점","수익중심점","이익중심점","투자중심점"],"body":"원가·수익·이익·투자 책임 범위를 구분하고 관리자에게 통제 가능한 항목을 중심으로 평가합니다.","formula":"","view":"help","group":"원가","lesson":{"section":"원가관리 · 성과","principle":"원가·수익·이익·투자 책임 범위를 구분하고 관리자에게 통제 가능한 항목을 중심으로 평가합니다.","example":"영업부가 공장 유휴설비를 통제하지 못하면 배부된 유휴 고정비만으로 영업 책임자를 평가하는 것이 적정한지 봅니다.","check":"부문 성과와 관리자 성과를 나누고 단기 지표 때문에 장기 가치·품질을 훼손하지 않는지 확인합니다.","ref":"managerial"}},{"title":"투자수익률과 잔여이익","aliases":["ROI","RI","잔여이익","투자중심점평가"],"body":"ROI는 이익/투자자산, 잔여이익은 이익에서 요구수익률×투자자산을 차감합니다. 사용 이익·평균자산 정의를 일관되게 정합니다.","formula":"ROI = 이익 ÷ 투자자산; RI = 이익 − 요구율×투자자산","view":"help","group":"원가","lesson":{"section":"원가관리 · 성과","principle":"ROI는 이익/투자자산, 잔여이익은 이익에서 요구수익률×투자자산을 차감합니다. 사용 이익·평균자산 정의를 일관되게 정합니다.","example":"이익 20, 평균투자자산 100, 요구율 12%면 ROI 20%, RI 8입니다.","check":"현재 ROI보다 낮아도 자본비용보다 높은 투자라면 가치가 늘 수 있습니다. 부문 규모·감가 정책 영향을 봅니다.","ref":"managerial"}},{"title":"경제적부가가치","aliases":["EVA","NOPAT","투하자본","WACC"],"body":"세후영업이익에서 투하자본의 자본비용을 차감해 경제적 초과 성과를 봅니다.","formula":"EVA = NOPAT − 투하자본×WACC","view":"help","group":"원가","lesson":{"section":"원가관리 · 성과","principle":"세후영업이익에서 투하자본의 자본비용을 차감해 경제적 초과 성과를 봅니다.","example":"NOPAT 150, 투하자본 1,000, WACC 10%라면 EVA 50입니다.","check":"순이익과 NOPAT, 총자산과 투하자본을 혼용하지 않습니다. 회계 조정·평균자본·세금·자본비용의 정의를 먼저 맞춥니다.","ref":"managerial"}},{"title":"회수기간과 회계적이익률","aliases":["투자회수기간","ARR","회계적수익률"],"body":"회수기간은 초기 투자를 회수하는 현금흐름 기간이며 ARR은 정의한 평균 회계이익을 투자기준액으로 나눕니다.","formula":"","view":"help","group":"원가","lesson":{"section":"원가관리 · 투자","principle":"회수기간은 초기 투자를 회수하는 현금흐름 기간이며 ARR은 정의한 평균 회계이익을 투자기준액으로 나눕니다.","example":"초기 100, 매년 현금유입 25라면 단순 회수기간은 4년입니다.","check":"단순 회수기간은 화폐시간가치와 회수 이후 현금흐름을 무시합니다. ARR은 현금 기반 NPV와 다른 지표입니다.","ref":"managerial"}},{"title":"목표원가와 카이젠원가","aliases":["허용원가","설계원가","카이젠"],"body":"목표원가는 시장이 허용하는 가격에서 목표이익을 차감해 개발·설계 단계에서 맞추는 원가입니다. 카이젠은 생산 단계의 지속 개선에 초점을 둡니다.","formula":"","view":"help","group":"원가","lesson":{"section":"원가관리 · 활동","principle":"목표원가는 시장이 허용하는 가격에서 목표이익을 차감해 개발·설계 단계에서 맞추는 원가입니다. 카이젠은 생산 단계의 지속 개선에 초점을 둡니다.","example":"시장가격 100, 목표 매출이익 20이면 허용원가 80입니다. 현 원가 90이면 설계·공정 개선 과제 10을 찾습니다.","check":"품질·안전·납기 희생으로 숫자만 낮추지 않습니다. 원가가산 가격결정과 접근 순서가 다릅니다.","ref":"managerial"}},{"title":"품질원가와 수명주기원가","aliases":["예방원가","평가원가","내부실패","외부실패","수명주기"],"body":"품질원가는 예방·평가·내부실패·외부실패로 나눕니다. 수명주기원가는 개발부터 생산·서비스·폐기까지 제품 전체 원가를 봅니다.","formula":"","view":"help","group":"원가","lesson":{"section":"원가관리 · 활동","principle":"품질원가는 예방·평가·내부실패·외부실패로 나눕니다. 수명주기원가는 개발부터 생산·서비스·폐기까지 제품 전체 원가를 봅니다.","example":"검사 인건비는 평가, 출하 전 재작업은 내부실패, 출하 후 보증수리는 외부실패 성격을 검토합니다.","check":"고객 상실·브랜드 손상 같은 숨은 원가와 개발 단계에서 이미 결정되는 미래원가도 함께 봅니다.","ref":"managerial"}},{"title":"상품 외상매출 분개","aliases":["외상매출분개","외상판매분개","상품판매분개"],"body":"통제가 이전되어 수익 인식 요건을 충족한 외상 판매는 채권·매출을 인식하고 판매 재고의 원가를 동시에 비용으로 대체합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 분개","principle":"통제가 이전되어 수익 인식 요건을 충족한 외상 판매는 채권·매출을 인식하고 판매 재고의 원가를 동시에 비용으로 대체합니다.","example":"판매가 150, 판매제품 원가 100: 차변 매출채권 150 / 대변 매출 150. 차변 매출원가 100 / 대변 제품 100.","check":"예시는 VAT·반품·할인·유의적 금융요소가 없습니다. 출고와 수익 인식 시점이 같은지는 계약을 먼저 봅니다.","ref":"revenue"}},{"title":"선급보험료 결산 분개","aliases":["선급보험료","보험료수정분개","선급비용분개"],"body":"선지급 보험료 중 미래 기간에 대응하는 부분은 자산이며 당기 경과 부분을 비용으로 대체합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 분개","principle":"선지급 보험료 중 미래 기간에 대응하는 부분은 자산이며 당기 경과 부분을 비용으로 대체합니다.","example":"1월 1일 1년 보험 120 선지급: 차변 선급보험료 120 / 대변 현금 120. 1개월 경과: 차변 보험료 10 / 대변 선급보험료 10.","check":"생산 관련 보험료는 제조간접원가 성격이 될 수 있습니다. 먼저 전액 비용 처리한 방식이면 미경과분을 자산으로 수정합니다.","ref":"concept"}},{"title":"미지급급여 결산 분개","aliases":["미지급급여","급여미지급분개","미지급비용분개"],"body":"이미 제공받은 당기 근로 용역의 미지급 급여는 비용 또는 적격 원가와 부채를 인식합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 분개","principle":"이미 제공받은 당기 근로 용역의 미지급 급여는 비용 또는 적격 원가와 부채를 인식합니다.","example":"본사 직원의 12월 급여 100을 1월 지급: 12월 차변 급여 100 / 대변 미지급비용 100. 지급 때 차변 미지급비용 100 / 대변 현금 100.","check":"원천징수·사회보험·생산원가 포함 등은 생략한 기본 예시입니다. 지급 시 급여를 다시 인식하지 않습니다.","ref":"employee"}},{"title":"감가상각 분개","aliases":["감가상각분개","감가누계액분개"],"body":"유형자산 원가를 상각기간에 배분해 감가상각비와 감가상각누계액을 인식합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 분개","principle":"유형자산 원가를 상각기간에 배분해 감가상각비와 감가상각누계액을 인식합니다.","example":"본사 기계 연간 감가 20: 차변 감가상각비 20 / 대변 감가상각누계액 20. 현금은 변하지 않습니다.","check":"생산설비 감가는 제조원가를 거쳐 재고·매출원가로 연결합니다. 처분·손상·재평가 분개와 구분하세요.","ref":"asset"}},{"title":"대손충당금 설정 분개","aliases":["대손충당금분개","기대신용손실분개","손실충당금분개"],"body":"보고일에 필요한 손실충당금 잔액과 조정 전 충당금 잔액의 차이를 손상손익으로 조정합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 분개","principle":"보고일에 필요한 손실충당금 잔액과 조정 전 충당금 잔액의 차이를 손상손익으로 조정합니다.","example":"필요 충당금 10, 기존 대변 잔액 4이면 차변 손상차손 6 / 대변 손실충당금 6. 실제 상각은 통상 충당금과 채권을 함께 줄입니다.","check":"필요 잔액 10을 매번 비용 10으로 인식하지 않습니다. 신용위험 모형·제각·추가 회수는 별도입니다.","ref":"financial"}},{"title":"재고 평가손실 분개","aliases":["재고평가손실분개","재고저가법분개"],"body":"원가와 순실현가능가치를 비교해 필요한 재고 감액을 인식합니다. 후속 환입은 이전 평가손실 한도와 회복 조건을 봅니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 분개","principle":"원가와 순실현가능가치를 비교해 필요한 재고 감액을 인식합니다. 후속 환입은 이전 평가손실 한도와 회복 조건을 봅니다.","example":"원가 100, NRV 85: 차변 재고자산평가손실 15 / 대변 재고자산평가충당금 15. 직접 차감 표시 방식도 있습니다.","check":"이미 설정된 충당금과 필요한 기말 잔액을 비교하고, 비정상 감손·수량 부족과 가격 하락을 구분합니다.","ref":"inventory"}},{"title":"유형자산 처분 분개","aliases":["설비매각분개","유형자산처분분개","자산처분손익"],"body":"처분 시 자산 취득원가와 관련 누계액을 제거하고 순처분대가와 장부금액 차이를 처분손익으로 인식합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 분개","principle":"처분 시 자산 취득원가와 관련 누계액을 제거하고 순처분대가와 장부금액 차이를 처분손익으로 인식합니다.","example":"취득 100, 감가누계 60, 현금 처분대가 50: 차변 현금 50·감가누 aliases":[],"body":"생산에 소비되는 보조자재는 제조원가, 사무용품은 판관비입니다. 여러 기간 사용할 중요한 자산이면 소모품이라는 구매 명칭만으로 즉시 비용 처리하지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"소모품비","section":"비용 분류 · 소모품비","kind":"classify","ref":"inventory","topicAliases":["공장 소모품","사무용품"],"linkTitle":""}},{"title":"소모품비는 고정비인가요 변동비인가요?","aliases":[],"body":"생산량에 비례하는 필터와 정기적으로 교체하는 안전용품은 원가행태가 다를 수 있습니다. 발주금액과 당월 실제 소비액을 구분합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"소모품비","section":"비용 분류 · 소모품비","kind":"behavior","ref":"inventory","topicAliases":["공장 소모품","사무용품"],"linkTitle":""}},{"title":"소모품비를 FPA에 반영할 때 주의할 점은 무엇인가요?","aliases":[],"body":"FPA 제품별 소모품비에 입력한 금액을 제조고정비 또는 판관 소모품비에 다시 입력하지 않습니다. BOM에 포함한 재료와 소모품 계정의 경계도 확인합니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"소모품비","section":"비용 분류 · 소모품비","kind":"app","ref":"inventory","topicAliases":["공장 소모품","사무용품"],"linkTitle":""}},{"title":"수도광열비의 비용 분류는 어떻게 판단하나요?","aliases":[],"body":"공장 조업에 필요한 수도·난방은 제조 간접원가, 본사 사용분은 판관비입니다. 전력·용수·스팀을 별도 계정으로 관리한다면 수도광열비에 같은 금액을 남기지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"수도광열비","section":"비용 분류 · 수도광열비","kind":"classify","ref":"inventory","topicAliases":["수도 요금","난방비"],"linkTitle":""}},{"title":"수도광열비는 고정비인가요 변동비인가요?","aliases":[],"body":"기본요금과 사용량 요금이 섞인 혼합원가일 수 있습니다. 냉난방 계절성과 최소요금 때문에 생산량 10% 증가가 비용 10% 증가를 뜻하지는 않습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"수도광열비","section":"비용 분류 · 수도광열비","kind":"behavior","ref":"inventory","topicAliases":["수도 요금","난방비"],"linkTitle":""}},{"title":"수도광열비를 FPA에 반영할 때 주의할 점은 무엇인가요?","aliases":[],"body":"FPA 유틸리티는 생산량×kg당 사용량×단가로 계산합니다. 기본요금은 별도 원가풀로 관리하고 사용량 요금과 중복되지 않도록 대사합니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"수도광열비","section":"비용 분류 · 수도광열비","kind":"app","ref":"inventory","topicAliases":["수도 요금","난방비"],"linkTitle":""}},{"title":"수선비의 비용 분류는 어떻게 판단하나요?","aliases":[],"body":"원래 성능을 유지하는 일상 수선은 비용입니다. 인식 요건을 충족하는 주요 부품 교체·대규모 검사 지출은 자산을 인식하고 관련 기존 장부금액 제거를 검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"수선비","section":"비용 분류 · 수선비","kind":"classify","ref":"asset","topicAliases":["수리비","보수비"],"linkTitle":""}},{"title":"수선비는 고정비인가요 변동비인가요?","aliases":[],"body":"정기 정비는 일정·설비 수에, 소규모 고장 수선은 가동시간·노후도에 영향을 받습니다. 생산량과 항상 정비례하지 않는 준고정·비정기 비용일 수 있습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"수선비","section":"비용 분류 · 수선비","kind":"behavior","ref":"asset","topicAliases":["수리비","보수비"],"linkTitle":""}},{"title":"수선비를 FPA에 반영할 때 주의할 점은 무엇인가요?","aliases":[],"body":"FPA 제품별 수선비와 제조 풀 수선비에 같은 정비 청구서를 중복 반영하지 않습니다. 자본적 지출은 당월 수선비 전액 대신 이후 감가 계획과 연결합니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"수선비","section":"비용 분류 · 수선비","kind":"app","ref":"asset","topicAliases":["수리비","보수비"],"linkTitle":""}},{"title":"시험비의 비용 분류는 어떻게 판단하나요?","aliases":[],"body":"정상 생산에 필요한 품질 검사는 제조 간접원가가 될 수 있습니다. 연구 시험, 판매 인증, 비정상 불량 조사 등은 지출 목적과 자산 인식 요건에 따라 구분합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"시험비","section":"비용 분류 · 시험비","kind":"classify","ref":"inventory","topicAliases":["품질 검사비","분석비"],"linkTitle":""}},{"title":"시험비는 고정비인가요 변동비인가요?","aliases":[],"body":"제품 kg보다 배치 수·시험 횟수가 더 적절한 원가동인일 수 있습니다. 소량 다품종 제품이 공통 비용을 더 많이 유발하는지 확인합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"시험비","section":"비용 분류 · 시험비","kind":"behavior","ref":"inventory","topicAliases":["품질 검사비","분석비"],"linkTitle":""}},{"title":"시험비를 FPA에 반영할 때 주의할 점은 무엇인가요?","aliases":[],"body":"제품 전용 시험은 직접 귀속하고 공동 시험은 원인에 맞춰 배부합니다. FPA 제조 풀의 선택 기준에 시험 횟수가 없다면 사전 산정한 직접비를 사용하는 방법을 검토합니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"시험비","section":"비용 분류 · 시험비","kind":"app","ref":"inventory","topicAliases":["품질 검사비","분석비"],"linkTitle":""}},{"title":"여비교통비의 비용 분류는 어떻게 판단하나요?","aliases":[],"body":"영업 출장은 판매비, 생산 지원 출장은 제조 관련 비용을 검토합니다. 자산 취득에 직접 관련되어 인식 요건을 충족하는 지출은 취득원가 포함 여부를 따로 판단합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"여비교통비","section":"비용 분류 · 여비교통비","kind":"classify","ref":"concept","topicAliases":["출장비","교통비"],"linkTitle":""}},{"title":"여비교통비는 고정비인가요 변동비인가요?","aliases":[],"body":"출장 횟수·거리·체류일이 동인입니다. 생산량이나 매출액 증가율을 그대로 모든 출장비에 적용하기 전에 활동 계획을 확인합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"여비교통비","section":"비용 분류 · 여비교통비","kind":"behavior","ref":"concept","topicAliases":["출장비","교통비"],"linkTitle":""}},{"title":"여비교통비를 FPA에 반영할 때 주의할 점은 무엇인가요?","aliases":[],"body":"공장 방문이라는 장소만으로 제조원가로 단정하지 않습니다. 방문 목적·부서·프로젝트를 증빙하고 FPA에 제품 직접비와 공통비를 나누어 입력합니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"여비교통비","section":"비용 분류 · 여비교통비","kind":"app","ref":"concept","topicAliases":["출장비","교통비"],"linkTitle":""}},{"title":"외주가공비의 비용 분류는 어떻게 판단하나요?","aliases":[],"body":"제품을 현재 상태로 만드는 외부 가공 용역은 제조원가에 포함될 수 있습니다. 원재료 매입과 가공 서비스, 운송료가 섞인 계약이면 구성을 확인합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"외주가공비","section":"비용 분류 · 외주가공비","kind":"classify","ref":"inventory","topicAliases":["임가공비","가공 용역"],"linkTitle":""}},{"title":"외주가공비는 고정비인가요 변동비인가요?","aliases":[],"body":"kg당 가공료는 물량 변동비 성격이나 최소보장 금액·금형·셋업 비용이 있으면 혼합원가입니다. 구매 단가와 총원가의 계약 조건을 구분합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"외주가공비","section":"비용 분류 · 외주가공비","kind":"behavior","ref":"inventory","topicAliases":["임가공비","가공 용역"],"linkTitle":""}},{"title":"외주가공비를 FPA에 반영할 때 주의할 점은 무엇인가요?","aliases":[],"body":"자가제조와 외주 의사결정에서는 회피 가능한 제조비와 외주 추가비만 비교합니다. FPA 제조 풀에 외주비를 입력할 때 BOM 구매단가에 이미 포함된 가공료인지 확인합니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"외주가공비","section":"비용 분류 · 외주가공비","kind":"app","ref":"inventory","topicAliases":["임가공비","가공 용역"],"linkTitle":""}},{"title":"용수비의 비용 분류는 어떻게 판단하나요?","aliases":[],"body":"생산 공정의 용수는 제조원가, 본사 사무용수는 판관비로 나눕니다. 폐수처리 부담금·환경 설비 비용은 사용 목적과 인식 요건을 별도 확인합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"용수비","section":"비용 분류 · 용수비","kind":"classify","ref":"inventory","topicAliases":["공업용수비","물 사용료"],"linkTitle":""}},{"title":"용수비는 고정비인가요 변동비인가요?","aliases":[],"body":"사용량 요금과 기본요금이 섞일 수 있습니다. 누수·재사용률·정제 손실 때문에 판매량과 사용량이 일대일로 움직이지 않을 "faq":{"topic":"매출 환율","section":"FPA 입력 · 매출 환율","kind":"units","ref":"fpa","topicAliases":["판매 환율","수출 환율"],"linkTitle":""}},{"title":"매출 환율를 조정한 뒤 무엇을 검산해야 하나요?","aliases":[],"body":"매출 환율과 BOM 원재료 환율은 독립 입력입니다. 질문이나 명령에서 환율만 말하면 적용 대상을 확인하고, 매출·원재료 둘 다 선택한 때에만 함께 변경합니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"매출 환율","section":"FPA 입력 · 매출 환율","kind":"reconcile","ref":"fpa","topicAliases":["판매 환율","수출 환율"],"linkTitle":""}},{"title":"수율 변경은 손익에 어떤 영향을 주나요?","aliases":[],"body":"생산 900kg, 수율 90%면 총투입 1,000kg입니다. 수율 99%로 10% 상대 증가하면 투입은 약 909.09kg으로 9.09% 감소합니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"수율","section":"FPA 입력 · 수율","kind":"impact","ref":"fpa","topicAliases":["생산 수율","수율 비율"],"linkTitle":""}},{"title":"수율 입력 단위와 실수하기 쉬운 점은 무엇인가요?","aliases":[],"body":"화면에서는 %로 읽되 내부 비율과 구분합니다. 90%에서 91%는 1%p 증가이고 상대 증가는 약 1.111%입니다. 수율 0 또는 100% 초과는 유효하지 않습니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"수율","section":"FPA 입력 · 수율","kind":"units","ref":"fpa","topicAliases":["생산 수율","수율 비율"],"linkTitle":""}},{"title":"수율를 조정한 뒤 무엇을 검산해야 하나요?","aliases":[],"body":"수율 변경은 BOM 총투입량과 재료비를 바꾸지만 FPA 유틸리티는 양품 생산량 기준입니다. 불량 재가공의 추가 전력까지 자동 반영하려면 별도 원단위 조정이 필요합니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"수율","section":"FPA 입력 · 수율","kind":"reconcile","ref":"fpa","topicAliases":["생산 수율","수율 비율"],"linkTitle":""}},{"title":"가동일수 변경은 손익에 어떤 영향을 주나요?","aliases":[],"body":"가동일수를 20일에서 22일로 바꿔도 생산량을 직접 입력하는 현재 FPA에서는 생산량이 자동 증가하지 않습니다. 가동일수 배부 기준을 선택한 공통비의 배부율이 달라질 수 있습니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"가동일수","section":"FPA 입력 · 가동일수","kind":"impact","ref":"fpa","topicAliases":["조업일수","운전 일수"],"linkTitle":""}},{"title":"가동일수 입력 단위와 실수하기 쉬운 점은 무엇인가요?","aliases":[],"body":"월별 일수로 관리하며 생산량·일평균 생산능력과 논리적으로 대사합니다. 일수 배부와 생산량 배부를 동시에 선택한 한 항목으로 중복 적용하지 않습니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"가동일수","section":"FPA 입력 · 가동일수","kind":"units","ref":"fpa","topicAliases":["조업일수","운전 일수"],"linkTitle":""}},{"title":"가동일수를 조정한 뒤 무엇을 검산해야 하나요?","aliases":[],"body":"실제 가동일·계획 가동일의 정의를 공장별로 통일합니다. 생산량을 늘리려는 시나리오라면 생산·판매수량도 따로 조정해야 합니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"가동일수","section":"FPA 입력 · 가동일수","kind":"reconcile","ref":"fpa","topicAliases":["조업일수","운전 일수"],"linkTitle":""}},{"title":"타워 수량 변경은 손익에 어떤 영향을 주나요?","aliases":[],"body":"공통 제조비 100을 타워 수 2:3으로 나누면 단순 비율은 40:60입니다. 실제 FPA에서는 공장 단계·제품 단계의 범위와 선택 기준을 함께 확인합니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"타워 수량","section":"FPA 입력 · 타워 수량","kind":"impact","ref":"fpa","topicAliases":["Tower 수량","타워 수","설비 수"],"linkTitle":""}},{"title":"타워 수량 입력 단위와 실수하기 쉬운 점은 무엇인가요?","aliases":[],"body":"타워 수는 배부 가중치 입력이며 설비 용량·효율·가동률을 자동 나타내지 않습니다. 동일한 1기라도 크기와 역할이 다르면 수량 배부의 적합성을 검토합니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"타워 수량","section":"FPA 입력 · 타워 수량","kind":"units","ref":"fpa","topicAliases":["Tower 수량","타워 수","설비 수"],"linkTitle":""}},{"title":"타워 수량를 조정한 뒤 무엇을 검산해야 하나요?","aliases":[],"body":"같은 공동 설비를 여러 제품 행에 중복 기록하면 배부 가중치가 왜곡될 수 있습니다. 운영상 정의와 제품별 기여량 산정 방식을 통일합니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"타워 수량","section":"FPA 입력 · 타워 수량","kind":"reconcile","ref":"fpa","topicAliases":["Tower 수량","타워 수","설비 수"],"linkTitle":""}},{"title":"전력 사용량 변경은 손익에 어떤 영향을 주나요?","aliases":[],"body":"생산 1,000kg×2kWh/kg×150원/kWh=전력비 300,000원입니다. 원단위만 10% 낮추면 다른 조건 고정 시 전력비는 270,000원이 됩니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"전력 사용량","section":"FPA 입력 · 전력 사용량","kind":"impact","ref":"fpa","topicAliases":["전력 원단위","kWh/kg"],"linkTitle":""}},{"title":"전력 사용량 입력 단위와 실수하기 쉬운 점은 무엇인가요?","aliases":[],"body":"월 전체 kWh를 kg당 사용량 칸에 넣지 않습니다. 계량기 사용량÷같은 기간 양품 kg로 원단위를 산출하고 kW 전력과 kWh 에너지를 구분합니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"전력 사용량","section":"FPA 입력 · 전력 사용량","kind":"units","ref":"fpa","topicAliases":["전력 원단위","kWh/kg"],"linkTitle":""}},{"title":"전력 사용량를 조정한 뒤 무엇을 검산해야 하나요?","aliases":[],"body":"기본요금·피크 요금이 원단위 단가에 포함되어 있는지 확인합니다. 공통 전력비 풀에 같은 사용량 요금을 또 입력하지 않습니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"전력 사용량","section":"FPA 입력 · 전력 사용량","kind":"reconcile","ref":"fpa","topicAliases":["전력 원단위","kWh/kg"],"linkTitle":""}},{"title":"전력 단가 변경은 손익에 어떤 영향을 주나요?","aliases":[],"body":"전력 사용량 2,000kWh에서 단가 150→165원/kWh이면 비용은 300,000→330,000원입니다. 사용량과 단가를 각각 10% 올리면 총비용은 21% 증가합니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"전력 단가","section":"FPA 입력 · 전력 단가","kind":"impact","ref":"fpa","topicAliases":["전기 단가","원/kWh"],"linkTitle":""}},{"title":"전력 단가 입력 단위와 실수하기 쉬운 점은 무엇인가요?","aliases":[],"body":"단가의 세금·부가요금 포함 범위를 사용량 원단위와 일치시킵니다. 외화 유가 상승률이 전기요금 상승률과 자동으로 같지는 않습니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"전력 단가","section":"FPA 입력 · 전력 단가","kind":"units","ref":"fpa","topicAliases":["전기 단가","원/kWh"],"linkTitle":""}},{"title":"전력 단가를 조정한 뒤 무엇을 검산해야 하나요?","aliases":[],"body":"시간대 요금을 하나의 단가로 계획하면 가중평균 가정을 명시합니다. FPA는 공공요금 고지서를 자동 수집하거나 복잡한 요금표를 계산하지 않습니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"전력 단가","section":"FPA 입력 · 전력 단가","kind":"reconcile","ref":"fpa","topicAliases":["전기 단가","원/kWh"],"linkTitle":""}},{"title":"스팀 사용량 변경은 손익에 어떤 영향을 주나요?","aliases":[],"body":"양품 1,000kg×스팀 0.005톤/kg×40,000원/톤이면 200,000원입니다. 생산량이 같을 때 사용량 효율 개선만 따로 조정할 수 있습니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"스팀 사용량","section":"FPA 입력 · 스팀 사용량","kind":"impact","ref":"fpa","topicAliases":["스팀 원단위","가스 사용량"],"linkTitle":""}},{"title":"스팀 사용량 입력 단위와 실수하기 쉬운 점은 무엇인가요?","aliases":[],"body":"스팀 톤·kg·열량 또는 도시가스㎥ 가운데 어떤 단위를 쓰는지 정하고 단가 단위를 맞춥니다. 다른 에너지 단위를 단순 합산하지 않습니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"스팀 사용량","section":"FPA 입력 · 스팀 사용량","kind":"units","ref":"fpa","topicAliases":["스팀 원단위","가스 사용량"],"linkTitle":""}},{"title":"스팀 사용량를 조정한 뒤 무엇을 검산해야 하나요?","aliases":[],"body":"스팀과 도시가스를 같은 입력 블록으로 쓰더라도 선택한 한 가지 기준을 일관되게 적용합니다. 자체 보일러 연료비와 구매 스팀을 중복 원가화하지 않습니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"스팀 사용량","section":"FPA 입력 · 스팀 사용량","kind":"reconcile","ref":"fpa","topicAliases":["스팀 원단위","가스 사용량"],"linkTitle":""}},{"title":"스팀 단가 변경은 손익에 어떤 영향을 주나요?","aliases":[],"body":"스팀 소비 5톤×40,000원/톤=200,000원입니다. 공급단가 5% 인상 시 소비량 고정이면 210,000원입니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"스팀 단가","section":"FPA 입력 · 스팀 단가","kind":"impact","ref":"fpa","topicAliases":["도시가스 단가","스팀 가격"],"linkTitle":""}},{"title":"스팀 단가 입력 단위와 실수하기 쉬운 점은 무엇인가요?","aliases":[],"body":"원/톤, 원/㎥, 원/MJ 등 사용량과 짝을 맞춥니다. 도시가스 공급 가격과 유가 티커는 서로 다른 상품·계약이므로 같은 값으로 대체하지 않습니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"스팀 단가","section":"FPA 입력 · 스팀 단가","kind":"units","ref":"fpa","topicAliases":["도시가스 단가","스팀 가격"],"linkTitle":""}},{"title":"스팀 단가를 조정한 뒤 무엇을 검산해야 하나요?","aliases":[],"body":"생산량·스팀 원단위·스팀 단가를 독립적으로 조정합니다. 외부 시세 조회만으로 이 입력값이 자동 덮어써지지 않습니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"스팀 단가","section":"FPA 입력 · 스팀 단가","kind":"reconcile","ref":"fpa","topicAliases":["도시가스 단가","스팀 가격"],"linkTitle":""}},{"title":"연료 사용량 변경은 손익에 어떤 영향을 주나요?","aliases":[],"body":"생산 1,000kg×0.02L/kg×1,500원/L이면 연료비 30,000원입니다. 사용량을 10% 줄이면 27,000원이 됩니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"연료 사용량","section":"FPA 입력 · 연료 사용량","kind":"impact","ref":"fpa","topicAliases":["연료 원단위","공정 연료량"],"linkTitle":""}},{"title":"연료 사용량 입력 단위와 실수하기 쉬운 점은 무엇인가요?","aliases":[],"body":"L·kg·톤과 단가 기준을 통일합니다. 원유 배럴 시세를 사용량에 곱하기 전에 밀도·수율·제품 가격·조달 조건 등의 환산이 필요합니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"연료 사용량","section":"FPA 입력 · 연료 사용량","kind":"units","ref":"fpa","topicAliases":["연료 원단위","공정 연료량"],"linkTitle":""}},{"title":"연료 사용량를 조정한 뒤 무엇을 검산해야 하나요?","aliases":[],"body":"공정 연료와 차량 주유비를 구분합니다. 재료 BOM에 연료를 포함한 경우 유틸리티 연료비에도 같은 투입을 넣지 않습니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"연료 사용량","section":"FPA 입력 · 연료 사용량","kind":"reconcile","ref":"fpa","topicAliases":["연료 원단위","공정 연료량"],"linkTitle":""}},{"title":"연료 단가 변경은 손익에 어떤 영향을 주나요?","aliases":[],"body":"연료 20L×1,500원/L=30,000원입니다. 연료 단가만 20% 오르면 36,000원이며 전력·스팀 단가는 별도로 유지됩니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"연료 단가","section":"FPA 입력 · 연료 단가","kind":"impact","ref":"fpa","topicAliases":["연료 가격","원/L"],"linkTitle":""}},{"title":"연료 단가 입력 단위와 실수하기 쉬운 점은 무엇인가요?","aliases":[],"body":"실제 구매 연료의 단위를 사용합니다. USD/bbl 원유 현물 티커는 원/L 납품 단가와 다르며 세금·운송·정제 마진까지 자동 반영하지 않습니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"연료 단가","section":"FPA 입력 · 연료 단가","kind":"units","ref":"fpa","topicAliases":["연료 가격","원/L"],"linkTitle":""}},{"title":"연료 단가를 조정한 뒤 무엇을 검산해야 하나요?","aliases":[],"body":"원유 연동 계약이면 계약상 시차와 평균 산식을 별도로 검토해 입력합니다. 유가 티커를 표시하는 것과 제품 원가를 자동 변경하는 것은 구분됩니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"연료 단가","section":"FPA 입력 · 연료 단가","kind":"reconcile","ref":"fpa","topicAliases":["연료 가격","원/L"],"linkTitle":""}},{"title":"용수 사용량 변경은 손익에 어떤 영향을 주나요?","aliases":[],"body":"생산 1,000kg×0.01㎥/kg×1,000원/㎥=10,000원입니다. 재사용 개선으로 원단위 20% 감소 시 8,000원입니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"용수 사용량","section":"FPA 입력 · 용수 사용량","kind":"impact","ref":"fpa","topicAliases":["용수 원단위","물 원단위"],"linkTitle":""}},{"title":"용수 사용량 입력 단위와 실수하기 쉬운 점은 무엇인가요?","aliases":[],"body":"1㎥=1,000L입니다. 10L/kg를 10㎥/kg로 입력하면 비용이 1,000배가 되므로 실제 계량 단위를 확인합니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"용수 사용량","section":"FPA 입력 · 용수 사용량","kind":"units","ref":"fpa","topicAliases":["용수 원단위","물 원단위"],"linkTitle":""}},{"title":"용수 사용량를 조정한 뒤 무엇을 검산해야 하나요?","aliases":[],"body":"공업용수·정제수·폐수의 단가와 처리 범위가 다를 수 있습니다. FPA 단일 용수 항목에 묶을 때 가중평균·추가 처리비의 경계를 명확히 합니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"용수 사용량","section":"FPA 입력 · 용수 사용량","kind":"reconcile","ref":"fpa","topicAliases":["용수 원단위","물 원단위"],"linkTitle":""}},{"title":"용수 단가 변경은 손익에 어떤 영향을 주나요?","aliases":[],"body":"물 사용량 10㎥에서 1,000→1,100원/㎥이면 비용은 10,000→11,000원입니다. 생산량은 이 변경으로 자동 바뀌지 않습니다.","formula":"","view":"help","group":"사용법","
