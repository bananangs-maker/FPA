function sendAssistant(textOverride){const input=document.getElementById('assistant-input');const text=(textOverride??input?.value??'').trim();if(!text)return;assistantUI.draftText='';assistantUI.pending=null;assistantUI.choices={};assistantUI.original=text;assistantSay('<p>'+esc(text)+'</p>','user');if(assistantUI.mode==='help'||/\?|뭐|무엇|왜|어떻게|알려|설명/.test(text)){answerQuestion(text);return;}runChatPreview(text);}
function chooseChatTarget(index,id){assistantUI.choices[index]=id;runChatPreview(assistantUI.original);}
function runChatPreview(text){try{const parsed=parseChatCommand(active(),text,assistantUI.scope,assistantUI.choices);if(parsed.ambiguous.length){assistantUI.pending=null;const a=parsed.ambiguous[0];assistantSay('<p>어느 항목에 적용할까요? 서로 다른 입력값을 임의로 묶어 변경하지 않습니다.</p><div class="chat-suggestions">'+a.options.map(s=>'<button onclick="chooseChatTarget('+a.index+',\''+s.id+'\')">'+esc(s.label)+'</button>').join('')+(a.bothfx?'<button onclick="chooseChatTarget('+a.index+',\'bothfx\')">매출·원재료 둘 다</button>':'')+'</div>');return;}assistantUI.pending=buildChatPreview(active(),parsed);paintAssistant();}catch(e){assistantUI.pending=null;assistantSay('<p>'+esc(e.message)+'</p><button class="mini-button" onclick="openShockDialog()">변수 조정에서 선택</button>');}}
function previewMarkup(preview){const scopes=[...new Set(preview.items.map(x=>scopeLabel(x.request.scope)))];const num=(v,unit)=>v===null?'미입력':fmt(unit==='%'?v*100:v,4)+(unit?' '+unit:'');return '<div class="chat-preview"><strong>적용 미리보기</strong><p>'+esc(preview.caseLabel)+'</p><p>'+esc(scopes.join(' / '))+'</p><p>'+preview.items.length+'개 입력 · 조정 기준값에 '+esc(preview.items[0]?.request.mode==='percent'?'상대 증감 적용':'지정 방식 적용')+'</p>'+safeTable(['입력','현재값','변경값'],preview.items.slice(0,12).map(x=>[x.cell.detail+' '+x.cell.m+'월 · '+x.cell.label,num(x.before,x.cell.unit),num(x.after,x.cell.unit)]))+(preview.items.length>12?'<details><summary>나머지 '+(preview.items.length-12)+'개 입력 보기</summary>'+safeTable(['입력','현재값','변경값'],preview.items.slice(12).map(x=>[x.cell.detail+' '+x.cell.m+'월 · '+x.cell.label,num(x.before,x.cell.unit),num(x.after,x.cell.unit)]))+'</details>':'')+safeTable(['연간 전체 손익','변경 전','변경 후','증감'],[['매출액','revenue'],['영업이익','op'],['EBITDA','ebitda']].map(([label,key])=>[label,fmt(preview.before[key])+' 원',fmt(preview.after[key])+' 원',fmt(preview.after[key]-preview.before[key])+' 원']))+(preview.warnings.length?'<p class="negative">검산 '+preview.warnings.length+'건 · '+esc(preview.warnings[0].message)+'</p>':'')+'<p class="hint">상대 조정은 저장된 기준값 기준입니다. 같은 10%를 다시 적용해도 누적되지 않습니다.</p><div class="tools"><button class="primary" onclick="applyChatPending()">'+(preview.result.count?'변경 적용':'현재 설정과 같음')+'</button><button onclick="assistantUI.pending=null;paintAssistant()">취소</button></div></div>';}
function applyChatPending(){try{const p=assistantUI.pending;if(!p)return;const count=commitChatPreview(p);assistantUI.pending=null;assistantSay('<p>'+count+'개 입력의 조정값을 저장했습니다. 시나리오 설정과 변수 조정 창에서도 확인할 수 있습니다.</p><div class="tools"><button class="mini-button" onclick="undoInput();assistantSay(\'마지막 변경을 되돌렸습니다.\')">마지막 입력 되돌리기</button><button class="mini-button" onclick="openScenarioSettings()">변경 가정 확인</button></div>');}catch(e){assistantUI.pending=null;assistantSay('<p>'+esc(e.message)+'</p>');}}
function paintAssistant(){if(!assistantUI.open)return;const root=document.getElementById('assistant-panel'),c=active();const scope=assistantUI.scope;root.innerHTML='<div class="assistant-head"><strong>도우미</strong><button class="ghost" onclick="closeAssistant()" aria-label="도우미 닫기">×</button></div><div class="assistant-tabs"><button aria-pressed="'+(assistantUI.mode==='command')+'" onclick="assistantUI.mode=\'command\';paintAssistant()">시나리오 수정</button><button aria-pressed="'+(assistantUI.mode==='help')+'" onclick="assistantUI.mode=\'help\';paintAssistant()">질문하기</button></div><div class="assistant-scope"><select aria-label="도우미 공장" onchange="assistantScope(\'site\',this.value)">'+option('','전체 공장',!scope.site)+c.sites.map(s=>option(s.name,s.name,s.name===scope.site)).join('')+'</select><select aria-label="도우미 제품" onchange="assistantScope(\'product\',this.value)">'+option('','전체 제품',!scope.product)+c.products.filter(p=>!scope.site||p.site===scope.site).map(p=>option(p.id,p.name,p.id===scope.product)).join('')+'</select><select aria-label="도우미 기간" onchange="assistantScope(\'months\',this.value)">'+option('all','1~12월',scope.months.length===12)+(scope.months.length>1&&scope.months.length<12?option('custom',scope.months.join(',')+'월',true):'')+chatAllMonths().map(m=>option(m,m+'월',scope.months.length===1&&scope.months[0]===m)).join('')+'</select></div><div class="assistant-log" id="assistant-log" role="log" aria-label="대화 내역"><div class="assistant-welcome"><strong>'+(assistantUI.mode==='command'?'바꿀 가정을 입력하세요':'궁금한 내용을 물어보세요')+'</strong><p>'+(assistantUI.mode==='command'?'항목·대상·기간을 확인한 뒤 적용합니다.':'용어 설명 '+FPA_KNOWLEDGE.length+'개와 현재 입력의 계산 근거를 확인할 수 있습니다.')+'</p><div class="chat-suggestions">'+(assistantUI.mode==='command'?['매출 환율 10% 상승','3분기 전력 단가 5% 상승','수율 2%p 개선']:['BOM이 뭐야?','타워가 뭐야?','영업이익이 왜 이렇게 나왔어?']).map(t=>'<button onclick="sendAssistant('+esc(JSON.stringify(t))+')">'+esc(t)+'</button>').join('')+'</div>'+(assistantUI.mode==='help'?knowledgeCategories():'')+'</div>'+assistantUI.messages.map(m=>'<div class="chat-message '+m.role+'">'+m.html+'</div>').join('')+(assistantUI.pending?previewMarkup(assistantUI.pending):'')+'</div><form class="assistant-compose" onsubmit="event.preventDefault();sendAssistant()"><label class="sr-only" for="assistant-input">명령 또는 질문</label><textarea id="assistant-input" rows="2" maxlength="1500" placeholder="'+(assistantUI.mode==='command'?'예: 3분기 매출 환율 10% 상승':'예: 공장 배부 기준이 뭐야?')+'" oninput="assistantUI.draftText=this.value" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey&&!event.isComposing){event.preventDefault();sendAssistant()}">'+esc(assistantUI.draftText)+'</textarea><button class="primary" type="submit" aria-label="보내기">↑</button></form>';const log=document.getElementById('assistant-log');if(log)log.scrollTop=log.scrollHeight;}
let marketState={quotes:[],loading:false,error:'',fetchedAt:null,warnings:[]},marketPending=null;
function validMarketQuote(q){return q&&['USD','EUR','JPY','CNY','MYR','HUF','WTI','BRENT'].includes(q.code)&&typeof q.name==='string'&&typeof q.unit==='string'&&(q.value===null||(Number.isFinite(q.value)&&q.value>0))&&(!q.date||(/^\d{4}-\d{2}-\d{2}$/.test(q.date)&&Number.isFinite(Date.parse(q.date))))&&['fx','oil'].includes(q.kind);}
function quoteState(q){if(q.value===null)return '조회 불가';if(q.status==='cached')return '이전 조회값';if(q.status==='stale'||Math.floor((Date.now()-Date.parse(q.date+'T00:00:00Z'))/86400000)>7)return '자료 지연';return '일별 참고값';}
function drawTicker(){const el=document.getElementById('market-ticker');if(!el)return;const quotes=marketState.quotes.filter(validMarketQuote);el.innerHTML='<button class="ticker-label" onclick="openMarket()" aria-label="환율 및 유가 상세 열기">환율·유가 <span>'+esc(marketState.loading?'조회 중':marketState.error?'조회 지연':marketState.warnings?.length?'일부 지연':'일별')+'</span></button><div class="ticker-window"><div class="ticker-track">'+(quotes.length?quotes.map(q=>'<button class="ticker-item" onclick="openMarket()" title="'+esc(q.name+' · '+(q.date||'자료 없음')+' · '+quoteState(q))+'"><span>'+esc(q.code)+(q.amount>1?' ×'+q.amount:'')+'</span><strong>'+(q.value===null?'—':fmt(q.value,q.kind==='fx'?2:2))+'</strong><small>'+esc(q.kind==='oil'?'$/bbl':'원')+'</small>'+(Number.isFinite(q.changePct)?'<small class="'+(q.changePct<0?'down':'up')+'">'+(q.changePct>0?'+':'')+fmt(q.changePct,2)+'%</small>':'')+'<time>'+esc(q.date||'미수신')+'</time>'+(quoteState(q)!=='일별 참고값'?'<small>'+esc(quoteState(q))+'</small>':'')+'</button>').join(''):'<button class="ticker-item" onclick="openMarket()">'+esc(marketState.loading?'공개 시세를 불러오는 중…':marketState.error||'시세 불러오기')+'</button>')+'</div></div><button class="ticker-details" onclick="openMarket()">전체 보기</button>';}
async function refreshMarket(){if(marketState.loading)return;marketState.loading=true;drawTicker();try{if(typeof location==='undefined'||!/^https?:$/.test(location.protocol))throw Error('시세 조회는 서버로 접속했을 때 사용할 수 있습니다.');const r=await fetch('/api/market',{method:'GET',credentials:'omit',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(18000)});if(!r.ok)throw Error('시세 조회에 실패했습니다.');const d=await r.json();if(!Array.isArray(d.quotes)||d.quotes.length>12||!d.quotes.every(validMarketQuote))throw Error('시세 응답 형식을 확인할 수 없습니다.');const previous=new Map(marketState.quotes.map(q=>[q.code,q]));d.quotes=d.quotes.map(q=>q.value===null&&previous.get(q.code)?.value>0?{...previous.get(q.code),status:'cached'}:q);marketState={...d,loading:false,error:''};if(marketState.quotes.some(q=>q.value!==null))try{localStorage.setItem(KEY+'-market',JSON.stringify({quotes:marketState.quotes,fetchedAt:d.fetchedAt,warnings:d.warnings||[]}));}catch{}}
catch(e){marketState.loading=false;marketState.error=e.message;marketState.quotes=marketState.quotes.map(q=>({...q,status:q.value===null?'error':'cached'}));}drawTicker();if(document.getElementById('market-body'))paintMarket();}
function marketScope(){return {site:document.getElementById('market-site')?.value||'',product:document.getElementById('market-product')?.value||'',months:document.getElementById('market-month')?.value==='all'?chatAllMonths():[Number(document.getElementById('market-month')?.value)||1]};}
function openMarket(){marketPending=null;modal('환율·유가','<div id="market-body"></div>',()=>{closeModal()},'닫기',false);paintMarket();if(!marketState.quotes.length&&!marketState.loading)refreshMarket();}
function paintMarket(){const el=document.getElementById('market-body');if(!el)return;const savedScope=marketScope(),c=active();el.innerHTML='<div class="market-heading"><p>일별 참고환율 · 유가 현물 / 장중 실시간 시세가 아닙니다.</p><button class="mini-button" onclick="refreshMarket()" '+(marketState.loading?'disabled':'')+'>'+(marketState.loading?'조회 중…':'새로고침')+'</button></div>'+(marketState.error?'<p class="negative">'+esc(marketState.error)+'</p>':'')+(marketState.warnings?.length?'<p class="negative">'+esc(marketState.warnings.join(' · '))+'</p>':'')+'<div class="market-list">'+marketState.quotes.map(q=>'<article><div><strong>'+esc(q.code)+'</strong><span>'+esc(q.name)+'</span></div><b>'+(q.value===null?'—':fmt(q.value,4))+' <small>'+esc(q.unit)+'</small></b><p>'+esc(q.date||'자료 없음')+' · '+esc(quoteState(q))+'</p><details><summary>출처·계산 기준</summary><p>'+esc(q.source)+'</p><p>조회 시각: '+esc(q.fetchedAt?new Date(q.fetchedAt).toLocaleString('ko-KR'):'없음')+'</p><p>비교 기준일: '+esc(q.previousDate||'비교자료 없음')+'</p><p>'+esc(q.method||'')+'</p><a href="'+esc(/^https:\/\/(www\.ecb\.europa\.eu|fred\.stlouisfed\.org)\//.test(q.sourceUrl||'')?q.sourceUrl:'https://www.ecb.europa.eu/')+'" target="_blank" rel="noopener noreferrer">원문 보기</a></details></article>').join('')+'</div><section class="market-apply"><strong>USD 환율을 시나리오에 적용</strong><p>USD 거래 입력에만 적용합니다. 다른 통화는 참고 표시용입니다. 적용 후 환율은 고정됩니다.</p><div class="form-grid"><label class="field">적용 항목<select id="market-target"><option value="sales">매출 환율</option><option value="material">원재료 환율</option><option value="both">매출·원재료 환율 모두</option></select></label><label class="field">공장<select id="market-site" onchange="document.getElementById(\'market-product\').value=\'\';marketPending=null;document.getElementById(\'market-preview\').innerHTML=\'범위가 바뀌었습니다. 다시 미리보기 하세요.\'">'+option('','전체 공장',!savedScope.site)+c.sites.map(s=>option(s.name,s.name,savedScope.site===s.name)).join('')+'</select></label><label class="field">제품<select id="market-product">'+option('','전체 제품',!savedScope.product)+c.products.map(p=>option(p.id,p.name,savedScope.product===p.id)).join('')+'</select></label><label class="field">기간<select id="market-month">'+option('all','1~12월',savedScope.months.length===12)+chatAllMonths().map(m=>option(m,m+'월',savedScope.months.length===1&&savedScope.months[0]===m)).join('')+'</select></label></div><button class="primary" type="button" onclick="previewMarketApply()">적용 미리보기</button><div id="market-preview"></div></section>';
marketPending=null;}
function buildMarketPreview(c,q,target,scope){
 if(!q||!Number.isFinite(q.value)||q.value<=0)throw Error('USD 환율이 없습니다. 직접 입력하거나 다시 조회하세요.');
 if(quoteState(q)!=='일별 참고값')throw Error('지연 또는 이전 조회값은 자동 적용하지 않습니다. 최신 자료를 조회하거나 값을 직접 입력하세요.');
 if(!['sales','material','both'].includes(target))throw Error('적용할 환율 항목을 선택하세요.');
 const choices=target==='both'?['rows:fx','bom:fx']:[target==='sales'?'rows:fx':'bom:fx'];
 const specs=commandSpecs(c),parsed={original:'공표 USD 참고환율 적용 '+q.date+' / '+q.source,parsed:choices.map(id=>({spec:specs.find(s=>s.id===id),scope,mode:'set',value:q.value}))};
 const input=clone(c);for(const cell of adjustmentCatalog(input,scope,false).flatMap(d=>d.cells))if(cell.active&&choices.some(id=>id===cell.table+':'+cell.field)&&input.variableSettings?.cells)delete input.variableSettings.cells[cell.key];
 const p=buildChatPreview(input,parsed);for(const item of p.items){const setting=p.result.data.variableSettings?.cells[item.cell.key];if(setting)setting.base=q.value;}p.fingerprint=JSON.stringify(c);return p;
}
function previewMarketApply(){try{const q=marketState.quotes.find(q=>q.code==='USD'&&q.kind==='fx'),scope=marketScope(),target=document.getElementById('market-target').value;
 const p=buildMarketPreview(active(),q,target,scope);marketPending={preview:p,meta:{code:q.code,value:q.value,date:q.date,source:q.source,sourceUrl:q.sourceUrl,fetchedAt:q.fetchedAt},scope:JSON.stringify(scope),target};document.getElementById('market-preview').innerHTML='<p>'+esc(q.date+' · '+q.source+' · '+fmt(q.value,4)+' 원/USD')+'</p><p>'+esc(scopeLabel(scope))+' · '+p.items.length+'개 입력</p>'+safeTable(['항목','현재값','적용값'],p.items.slice(0,12).map(x=>[x.cell.detail+' '+x.cell.m+'월 · '+x.cell.label,x.before===null?'미입력':fmt(x.before,4),fmt(x.after,4)]))+'<p>총 '+p.items.length+'개 입력에 동일 환율을 지정합니다.</p><button class="primary" type="button" onclick="commitMarketApply()">이 환율로 적용</button>';}
 catch(e){marketPending=null;document.getElementById('market-preview').innerHTML='<p class="negative">'+esc(e.message)+'</p>';}}
function commitMarketApply(){try{if(!marketPending)throw Error('적용 미리보기를 먼저 확인하세요.');if(marketPending.scope!==JSON.stringify(marketScope())||marketPending.target!==document.getElementById('market-target').value)throw Error('적용 범위가 바뀌었습니다. 다시 미리보기 하세요.');const p=marketPending;const count=commitChatPreview(p.preview,p.meta);marketPending=null;closeModal();toast(count+'개 환율 입력에 공표 참고환율을 저장했습니다.');}catch(e){marketPending=null;document.getElementById('market-preview').innerHTML='<p class="negative">'+esc(e.message)+'</p>';}}
function initAssistant(){if(typeof window==='undefined'||!document.createElement)return;try{const stored=JSON.parse(localStorage.getItem(KEY+'-market')||'null');if(stored&&Array.isArray(stored.quotes)&&stored.quotes.length<=12&&stored.quotes.every(validMarketQuote))marketState={...marketState,...stored,quotes:stored.quotes.map(q=>({...q,status:q.value===null?'error':'cached'}))};}catch{}drawTicker();refreshMarket();window.setInterval(()=>{if(!document.hidden)refreshMarket()},15*60000);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&assistantUI.open&&!document.getElementById('modal').open)closeAssistant()});}

render();initAssistant();if(!saveBlocked)document.getElementById('save-status').textContent=state.updated?'저장됨':'입력 준비';
</script></body></html>
