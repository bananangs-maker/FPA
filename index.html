const THEME_KEY=KEY+'-theme';
let themePreference='system';
function themeIsDark(mode,systemDark){return mode==='dark'||(mode==='system'&&systemDark);}
function applyTheme(mode='system',persist=false){if(!['system','light','dark'].includes(mode))mode='system';themePreference=mode;const dark=themeIsDark(mode,typeof window!=='undefined'&&!!window.matchMedia?.('(prefers-color-scheme: dark)').matches);document.documentElement?.setAttribute('data-theme',dark?'dark':'light');document.documentElement?.style?.setProperty('color-scheme',dark?'dark':'light');if(persist)try{localStorage.setItem(THEME_KEY,mode)}catch{}const b=document.getElementById('theme-toggle');if(b){b.setAttribute?.('aria-label',dark?'라이트 테마로 전환':'다크 테마로 전환');b.setAttribute?.('aria-pressed',String(dark));b.title=(mode==='system'?'시스템 설정 · ':'')+(dark?'다크 테마':'라이트 테마');}document.querySelectorAll?.('[data-theme-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeChoice===mode)));}
function toggleTheme(){const current=document.documentElement?.getAttribute('data-theme');applyTheme(current==='dark'?'light':'dark',true);}
function initTheme(){if(typeof window==='undefined')return;let mode='system';try{mode=localStorage.getItem(THEME_KEY)||'system'}catch{}applyTheme(mode);window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(themePreference==='system')applyTheme('system')});}
function openAppInfo(){const build=document.querySelector('meta[name="fpa-build"]')?.content||'알 수 없음';modal('앱 정보','<div class="help-prose"><p>페이지 버전 <b>'+esc(build)+'</b></p>'+(beforeFullSaleBackup()?'<p>전량판매 전환 전 데이터</p><button type="button" onclick="downloadBeforeFullSale()">전환 전 백업 저장</button>':'')+'<p>파비콘 파일 확인</p><img src="./favicon-v181.ico" width="32" height="32" alt="FPA 파비콘"><p><a href="./fpa-icon-172.png" target="_blank" rel="noopener">PNG 아이콘 열기</a> · <a href="./favicon-v181.ico" target="_blank" rel="noopener">현재 탭 아이콘(ICO) 열기</a></p><p>위 이미지가 보여도 Safari 탭 표시까지 확인된 것은 아닙니다. 탭의 웹사이트 아이콘 표시 설정과 브라우저가 보관한 사이트 아이콘 상태를 함께 확인할 수 있습니다.</p><p>데이터는 브라우저에 저장됩니다. 아이콘 확인을 위해 사이트 데이터 전체를 삭제하지 마세요.</p></div>',()=>closeModal(),'닫기',false);}

// FPA assistant: deterministic commands, local knowledge retrieval, public read-only market data.
const FPA_KNOWLEDGE=[{"title":"BOM","aliases":["bom","비오엠","자재명세서","bill of materials"],"body":"제품을 만들 때 필요한 자재와 각 자재의 투입비율을 정리한 목록입니다. FPA에서는 제품·월별 자재, 투입비율, 통화, 단가, 환율을 입력합니다.","formula":"총투입량 × 자재 투입비율 × 원화 단가","view":"materials","group":"원가"},{"title":"수율","aliases":["yield","수율"],"body":"투입한 양 중 제품으로 얻은 양의 비율입니다. FPA의 생산량은 산출 제품량이며, 수율은 0% 초과 100% 이하로 입력합니다. 순도와는 다른 개념입니다.","formula":"총투입량 = 생산량 ÷ 수율","view":"materials","group":"원가"},{"title":"투입비율","aliases":["배합비","조성비","투입비율"],"body":"총투입량에서 해당 자재가 차지하는 비율입니다. FPA는 제품·월별 BOM 투입비율 합계가 100%인지 검산합니다.","formula":"자재 투입량 = 총투입량 × 투입비율","view":"materials","group":"원가"},{"title":"판관비","aliases":["sga","sg&a","판매비와관리비","판관비"],"body":"판매 활동과 회사 관리에 드는 비용입니다. FPA에서는 판관고정비와 운반·포장비를 합산합니다. 생산에 쓰이는 제조경비와 구분합니다.","formula":"판관비 = 판관고정비 + 운반비 + 포장비","view":"sgSum","group":"회계"},{"title":"매출액","aliases":["revenue","매출액"],"body":"제품 판매로 발생하는 금액입니다. FPA는 월별 판매수량과 적용 판매단가를 곱합니다. 부가가치세 입력 항목은 없으므로 세전 공급가액 기준으로 일관되게 입력하세요.","formula":"매출수량 × 원화 판매단가","view":"sales","group":"회계"},{"title":"매출수량","aliases":["판매량","판매수량","매출수량"],"body":"판매한 제품의 수량입니다. FPA는 당월 생산분 전량판매를 가정하므로 판매수량=생산량입니다. 매출 입력과 생산·수율 화면의 생산·판매수량은 하나의 값을 함께 수정합니다.","formula":"매출수량 = 당월 양품 생산량","view":"sales","group":"운영"},{"title":"생산량","aliases":["생산수량","생산량"],"body":"해당 월의 양품 생산수량입니다. FPA는 당월 생산분을 모두 판매한다고 가정하며 생산량이 매출수량·재료비·유틸리티·배부 기준에 함께 사용됩니다. 수율은 양품 생산량을 만들기 위한 투입량을 계산합니다.","formula":"판매수량 = 생산량; 총투입량 = 생산량 ÷ 수율","view":"drivers","group":"운영"},{"title":"판매단가","aliases":["판가","asp","판매가격","판매단가"],"body":"제품 1kg의 판매가격입니다. USD 거래는 USD/kg와 원/USD 환율, KRW 거래는 원/kg를 사용합니다. 선택하지 않은 통화의 단가는 매출 계산에 사용되지 않습니다.","formula":"USD 거래 원화단가 = USD/kg × 원/USD","view":"sales","group":"원가"},{"title":"매출원가","aliases":["cogs","매출원가"],"body":"판매한 제품에 대응하는 원가입니다. 현재 FPA는 기초재고 없이 당월 생산분을 전량 판매하므로 당월 재료비·노무비·제조경비 전액이 매출원가입니다. 재고 이월은 계산하지 않습니다.","formula":"매출원가 = 당월 재료비 + 당월 노무비 + 당월 제조경비","view":"inventory","group":"회계"},{"title":"제조원가","aliases":["생산원가","당월제조원가","제조원가"],"body":"제품을 생산하는 데 발생한 원가입니다. FPA에서는 재료비·배부 노무비·유틸리티·수선/소모품비·제조고정비를 합산합니다.","formula":"재료비 + 노무비 + 제조경비","view":"mfg","group":"원가"},{"title":"재료비","aliases":["원재료비","재료비"],"body":"생산을 위해 투입한 자재의 원가입니다. FPA는 생산량과 수율로 총투입량을 구하고 BOM 투입비율과 자재 단가를 적용합니다.","formula":"Σ(생산량 ÷ 수율 × 투입비율 × 자재 원화단가)","view":"materials","group":"원가"},{"title":"노무비","aliases":["인건비","급여","노무비"],"body":"생산 인력 등에 발생한 비용입니다. FPA에서는 조직·직무별 비용 풀을 등록하고 귀속 구분과 배부 기준에 따라 제품에 반영합니다. 관리부문 직원급여는 판관비로 구분할 수 있습니다.","formula":"월 발생액 × 배부율","view":"labor","group":"원가"},{"title":"제조경비","aliases":["제조간접경비","제조경비"],"body":"재료비와 노무비 외에 제조에 드는 경비입니다. FPA에서는 유틸리티, 수선·소모품비, 제조고정비를 합산합니다.","formula":"유틸리티 + 수선/소모품비 + 제조고정비","view":"mfg","group":"원가"},{"title":"매출총이익","aliases":["gross profit","매출총이익","매출이익"],"body":"매출액에서 판매된 제품의 원가를 뺀 금액입니다. 아직 판관비를 차감하기 전의 이익입니다.","formula":"매출액 − 매출원가","view":"pnl","group":"회계"},{"title":"매출총이익률","aliases":["gross margin","매출총이익률"],"body":"매출액 중 매출총이익의 비중입니다. 기간 합계는 월별 비율의 단순평균보다 합계 매출과 합계 이익으로 계산해야 합니다.","formula":"매출총이익 ÷ 매출액 × 100","view":"pnl","group":"회계"},{"title":"영업이익","aliases":["ebit","영업이익"],"body":"FPA에서는 매출총이익에서 판관비를 차감한 금액입니다. 금융손익과 법인세는 계산 범위에 포함하지 않습니다.","formula":"매출액 − 매출원가 − 판관비","view":"pnl","group":"회계"},{"title":"영업이익률","aliases":["operating margin","영업이익률"],"body":"매출액에 대한 영업이익의 비율입니다. 매출액이 0인 경우 FPA는 계산 오류를 막기 위해 비율을 0으로 표시합니다.","formula":"영업이익 ÷ 매출액 × 100","view":"pnl","group":"회계"},{"title":"EBITDA","aliases":["에비타","에비따","ebitda"],"body":"영업이익에 감가상각비·무형자산상각비 등을 가산해 보는 지표입니다. FPA는 당월 전량판매 가정으로 당월 제조감가와 판관감가를 가산합니다. 현금흐름·법정 손익과는 구분합니다.","formula":"영업이익 + 당월 제조감가 + 판관감가","view":"pnl","group":"회계"},{"title":"EBITDA율","aliases":["ebitda margin","에비따율","ebitda율"],"body":"매출액에 대한 EBITDA의 비중입니다. 연간 값은 연간 EBITDA를 연간 매출액으로 나눠 계산합니다.","formula":"EBITDA ÷ 매출액 × 100","view":"pnl","group":"회계"},{"title":"감가상각비","aliases":["depreciation","감가상각","감가상각비"],"body":"설비 등 장기 사용 자산의 원가를 사용기간에 걸쳐 비용으로 나누는 것입니다. FPA는 감가상각비를 직접 입력받으며 자산별 상각 스케줄은 계산하지 않습니다. 비용 풀 계정명은 정확히 ‘감가상각비’여야 별도로 집계됩니다.","formula":"현재 FPA: 제조감가와 판관감가를 당월 원가에 반영하고 EBITDA에 가산","view":"mfgFixed","group":"회계"},{"title":"제조감가","aliases":["제조감가상각비","제조감가"],"body":"제조고정비에 포함된 당월 감가상각비입니다. FPA에서는 당월 생산분을 모두 판매하므로 제조감가가 전액 매출원가에 포함되고 EBITDA 계산에 전액 가산됩니다.","formula":"EBITDA = 영업이익 + 당월 제조감가 + 판관감가","view":"inventory","group":"원가"},{"title":"판관감가","aliases":["판관감가상각비","판관감가"],"body":"판관고정비 중 감가상각비 계정으로 입력한 금액입니다. FPA에서는 판관비에 포함하고 EBITDA 계산 때 가산합니다.","formula":"EBITDA 가산 대상 = 판관감가 + 판매분 제조감가","view":"sgFixed","group":"회계"},{"title":"재고자산","aliases":["inventory","재고자산","재고"],"body":"아직 판매되지 않은 제품·재공품·원재료 등의 자산입니다. 현재 FPA는 관리손익 시뮬레이션에서 기초재고 없이 당월 생산분 전량판매를 가정하며 재고 수불·평가를 계산하지 않습니다.","formula":"현재 FPA: 판매량 = 생산량, 제조원가 = 매출원가","view":"inventory","group":"회계"},{"title":"기초재고","aliases":["기초재고액","기초재고"],"body":"기간 시작 시 보유한 재고의 수량·금액을 뜻합니다. 현재 FPA는 기초재고를 사용하지 않는 전량판매 모형이며 입력 항목도 없습니다. 이전 저장값은 전환 전 백업으로 보관하고 현재 손익에서 제외합니다.","formula":"현재 FPA 계산: 기초재고 없음","view":"master","group":"운영"},{"title":"기말재고","aliases":["기말재고액","기말재고"],"body":"월말에 남아 있는 재고입니다. 현재 FPA는 당월 생산분 전량판매를 가정하므로 기말재고가 없고 다음 달로 원가를 이월하지 않습니다.","formula":"현재 FPA 계산: 기말재고 없음","view":"inventory","group":"원가"},{"title":"총평균법","aliases":["가중평균법","월별총평균법","총평균법"],"body":"기초재고 원가와 당기 입고·제조원가를 합산한 뒤 가용수량으로 나누는 재고 원가배분 방법입니다. 일반 회계 개념이며 현재 FPA의 전량판매 계산에는 재고 평균법을 적용하지 않습니다.","formula":"일반 개념: (기초재고액 + 당기입고원가) ÷ (기초수량 + 당기입고수량)","view":"inventory","group":"원가"},{"title":"이동평균법","aliases":["moving average","이동평균법"],"body":"입고 때마다 평균단가를 다시 계산하는 재고 평가 방법입니다. 현재 FPA는 기초재고 없이 당월 생산분을 전량 판매하므로 이동평균 재고 계산을 하지 않습니다.","formula":"","view":"inventory","group":"원가"},{"title":"선입선출법","aliases":["fifo","선입선출법"],"body":"먼저 입고한 재고가 먼저 판매된 것으로 보고 원가를 대응시키는 방식입니다. 현재 FPA는 이 방식 대신 월별 총평균법을 사용합니다.","formula":"","view":"inventory","group":"원가"},{"title":"재고증감","aliases":["재고변동","재고증감"],"body":"기말재고와 기초재고의 차이입니다. 현재 FPA는 기초재고와 기말재고를 사용하지 않으므로 재고 증감 조정 없이 당월 제조원가가 매출원가에 전액 반영됩니다.","formula":"현재 FPA: 매출원가 = 당월 제조원가","view":"inventory","group":"원가"},{"title":"kg당 재료비","aliases":["kg당재료비","재료비원단위"],"body":"FPA 화면의 kg당 재료비는 당월 재료비를 생산량으로 나눈 값입니다. 자재 구매단가와 다르며 수율과 배합비 변화도 영향을 줍니다.","formula":"재료비 ÷ 생산량","view":"pnl","group":"원가"},{"title":"원단위","aliases":["unit consumption","원단위"],"body":"제품 1단위를 생산하는 데 필요한 자재·전력·용수 등의 양입니다. FPA 유틸리티 사용량은 완제품 kg당 기준입니다. 단위를 맞추지 않으면 비용이 크게 달라집니다.","formula":"총사용량 = 생산량 kg × kg당 사용량","view":"utility","group":"원가"},{"title":"직접비","aliases":["direct cost","직접비"],"body":"특정 공장이나 제품에 바로 귀속할 수 있는 비용입니다. FPA의 공장 직접비는 공장 안에서 제품에 배부하고, 제품 직접비는 지정 제품에 전액 반영합니다.","formula":"","view":"mfgFixed","group":"원가"},{"title":"간접비","aliases":["overhead","간접비"],"body":"여러 대상이 함께 사용해 직접 대응시키기 어려운 비용입니다. 생산량·가동일수 등 목적에 맞는 기준으로 배부합니다. FPA에서는 비용 풀별로 기준을 지정할 수 있습니다.","formula":"","view":"mfgFixed","group":"원가"},{"title":"공통비","aliases":["전사공통비","공통비"],"body":"여러 공장과 제품이 함께 부담하는 비용입니다. FPA는 전사 공통비를 공장으로 나눈 다음 각 공장 안에서 제품으로 배부합니다.","formula":"공통비 × 공장배부율 × 제품배부율","view":"mfgFixed","group":"원가"},{"title":"공장 배부 기준","aliases":["공장배부기준","공장배부율"],"body":"전사 공통비를 공장 간에 나누는 기준입니다. 생산량·가동일수·설비×가동일수·매출액·균등 중 선택합니다. 가동일수는 제품별 입력값을 공장 안에서 합산하며 공장 달력 일수와 다릅니다.","formula":"해당 공장 기준값 합계 ÷ 전체 공장 기준값 합계","view":"drivers","group":"원가"},{"title":"제품 배부 기준","aliases":["제품배부기준","제품배부율"],"body":"공장에 귀속된 비용을 그 공장 제품끼리 나누는 기준입니다. 제품 직접비에는 적용하지 않습니다. 공장 배부 기준과 서로 다르게 지정할 수 있습니다.","formula":"해당 제품 기준값 ÷ 같은 공장 제품 기준값 합계","view":"drivers","group":"원가"},{"title":"균등배부","aliases":["균등","균등배부"],"body":"동일한 가중치를 적용해 나누는 방법입니다. 현재 FPA는 제품·월 행 하나당 가중치 1을 사용하므로 공장 단계에서는 공장별 제품 수 비중으로 나뉩니다. 공장마다 무조건 동일 금액이 되는 방식은 아닙니다.","formula":"","view":"mfgFixed","group":"원가"},{"title":"배부 기준 0","aliases":["미배부","배부기준0","배부기준이0"],"body":"기준값 합계가 0이거나 대상이 없으면 비율을 계산할 수 없습니다. FPA는 임의로 나누지 않고 미배부 금액과 경고를 표시합니다. 생산량·가동일수·귀속 대상을 확인하세요.","formula":"","view":"checks","group":"사용법"},{"title":"비용 풀","aliases":["cost pool","비용풀"],"body":"배부할 비용을 계정·월·귀속 단위로 묶은 입력 행입니다. 동일한 원천 비용을 공통비와 직접비에 중복 등록하면 원가가 중복됩니다.","formula":"","view":"mfgFixed","group":"사용법"},{"title":"고정비","aliases":["fixed cost","고정비"],"body":"관련 조업 범위 안에서 생산량 변화와 관계없이 총액이 대체로 일정한 비용입니다. FPA 고정비는 입력한 월 발생액을 배부하며 생산량에 자동 비례하지 않습니다.","formula":"","view":"mfgFixed","group":"원가"},{"title":"변동비","aliases":["variable cost","변동비"],"body":"생산량이나 판매량 등 활동량에 따라 총액이 변하는 비용입니다. FPA에서는 BOM 재료비와 kg당 유틸리티 사용량 등이 생산량에 연동됩니다.","formula":"","view":"mfg","group":"원가"},{"title":"혼합원가","aliases":["준변동비","혼합원가"],"body":"기본요금처럼 고정 부분과 사용량에 따른 변동 부분이 함께 있는 원가입니다. FPA에서는 고정 부분은 비용 풀, 변동 부분은 원단위 항목으로 구분 입력할 수 있습니다.","formula":"","view":"utility","group":"원가"},{"title":"공헌이익","aliases":["contribution margin","공헌이익"],"body":"매출액에서 변동비를 차감한 금액입니다. 고정비를 충당하고 이익을 만드는 데 기여하는 금액입니다. FPA 현재 영업이익은 공헌이익과 다르며 변동비·고정비 재분류가 필요합니다.","formula":"매출액 − 변동비","view":"pnl","group":"원가"},{"title":"손익분기점","aliases":["bep","손익분기점","BEP","손익분기수량","손익분기매출"],"body":"고정비를 단위 공헌이익으로 나눈 판매량에서 영업이익이 0입니다. 다품목은 일정 판매믹스 등의 가정이 필요합니다.","formula":"BEP수량 = 고정비 ÷ (단가−단위변동비); BEP매출 = 고정비 ÷ 공헌이익률","view":"pnl","group":"원가","lesson":{"section":"원가관리 · CVP","principle":"고정비를 단위 공헌이익으로 나눈 판매량에서 영업이익이 0입니다. 다품목은 일정 판매믹스 등의 가정이 필요합니다.","example":"고정비 1천만원, 단가 1만원, 단위변동비 6천원이면 BEP는 2,500개입니다.","check":"공헌이익이 0 이하면 이 기본 모형에서 판매량 증가만으로 손익분기점에 도달할 수 없습니다.","ref":"managerial"}},{"title":"가격전가","aliases":["pass through","판가전가","가격전가"],"body":"원재료비·환율 등 원가 변화를 판매가격에 반영하는 것입니다. 비용 증가율과 필요한 판가 증가율은 같은 값이 아닐 수 있습니다. 목표 이익액과 목표 이익률도 구분해야 합니다.","formula":"","view":"scenario","group":"원가"},{"title":"마진과 마크업","aliases":["markup","마크업","마진과마크업"],"body":"마진율은 판매가격이 분모이고 마크업은 원가가 분모입니다. 같은 비율을 입력해도 판매가격이 달라집니다.","formula":"마진율=(판가−원가)/판가; 마크업=(판가−원가)/원가","view":"pnl","group":"원가"},{"title":"민감도 분석","aliases":["sensitivity","민감도"],"body":"다른 조건을 고정하고 특정 변수가 변할 때 결과가 얼마나 달라지는지 보는 분석입니다. 시나리오와 기준 CASE를 비교해 환율·단가·수율의 손익 영향을 확인할 수 있습니다.","formula":"","view":"scenario","group":"사용법"},{"title":"시나리오","aliases":["scenario","시나리오"],"body":"수량·단가·환율·수율·배부 가정 등을 모아 둔 분석 단위입니다. FPA에서는 현재 CASE를 복제하고 기준 CASE를 지정해 변경 가정과 손익을 비교할 수 있습니다.","formula":"","view":"scenario","group":"사용법"},{"title":"CASE","aliases":["케이스","case"],"body":"한 시나리오의 구체적인 입력 묶음입니다. FPA는 시나리오명·CASE명·연도·실적구분을 함께 관리합니다. 변경 전에 복제하면 기준 값을 보존할 수 있습니다.","formula":"","view":"master","group":"사용법"},{"title":"실적과 계획","aliases":["실적구분","경영계획","실적과계획"],"body":"계획은 목표·가정, 실적은 실제 발생 내역, 추정은 현재까지의 정보로 예상한 결과입니다. FPA의 실적구분은 분류값이며 원천 실적을 자동 수집하지는 않습니다.","formula":"","view":"master","group":"사용법"},{"title":"변수 조정 기준값","aliases":["앵커","기준값","변수조정"],"body":"FPA의 상대 조정은 처음 조정 기준값을 기준으로 저장됩니다. 같은 항목에 10%를 다시 적용해도 중복 상승하지 않습니다. 10%를 20%로 바꾸면 처음 기준의 20%가 적용됩니다. 개별 셀 직접 수정은 해당 셀의 새 기준이 됩니다.","formula":"","view":"scenario","group":"사용법"},{"title":"퍼센트포인트","aliases":["%p","pp","퍼센트포인트"],"body":"비율 간의 차이입니다. 수율 90%에서 2%p 개선은 92%입니다. 상대적으로 2% 개선하면 91.8%이므로 구분해야 합니다.","formula":"%p 조정 = 기존 비율 + 조정값/100","view":"drivers","group":"사용법"},{"title":"빈칸과 0","aliases":["미입력","빈칸","빈칸과0"],"body":"빈칸은 아직 값을 넣지 않았다는 뜻이고 0은 실제 값이 0이라는 뜻입니다. 빈칸에 상대 증가율을 적용할 수 없으므로 먼저 값을 지정해야 합니다.","formula":"","view":"scenario","group":"사용법"},{"title":"SITE","aliases":["사이트","site","공장등록"],"body":"FPA에서 공장이나 비용을 구분하는 생산 거점 이름입니다. 기본 공장값은 없으며 직접 등록합니다. 제품은 하나의 SITE에 소속됩니다.","formula":"","view":"master","group":"사용법"},{"title":"백업","aliases":["json","백업","복원"],"body":"입력 데이터는 현재 브라우저 저장소에 저장됩니다. 파일 메뉴에서 JSON 백업을 저장하면 전체 CASE를 보관하거나 복원할 수 있습니다. 배포 서버가 개인 입력 데이터를 저장하는 것은 아닙니다.","formula":"","view":"master","group":"사용법"},{"title":"CSV","aliases":["csv","엑셀내보내기"],"body":"CSV는 행·열 데이터를 텍스트로 저장한 형식입니다. FPA의 CSV 내보내기는 표시 중인 표를 옮기는 용도이고, 전체 시나리오 복원에는 JSON 백업을 사용하세요.","formula":"","view":"help","group":"사용법"},{"title":"일괄 선택","aliases":["범위선택","일괄선택","엑셀선택"],"body":"표의 열 머리글이나 범위 선택 기능으로 여러 입력 셀을 골라 같은 값을 넣을 수 있습니다. 부분 선택과 Ctrl/Command 추가 선택을 지원하며 계산 셀은 수정 대상에서 제외합니다.","formula":"","view":"sales","group":"사용법"},{"title":"검산","aliases":["정합성","검산","오류확인"],"body":"입력과 계산이 서로 맞는지 점검합니다. FPA는 재고 부족, 수율 누락, BOM 합계, 미배부 비용 등을 표시합니다. 경고가 남아 있으면 관련 결과는 가계산으로 해석하세요.","formula":"","view":"checks","group":"사용법"},{"title":"전력비","aliases":["전기요금","전력비"],"body":"FPA는 완제품 kg당 전력 사용량과 kWh 단가를 곱해 전력비를 계산합니다. 기본요금이나 피크요금을 포함하려면 중복 없이 별도 고정비로 관리하세요.","formula":"생산량 × kWh/kg × 원/kWh","view":"utility","group":"원가"},{"title":"스팀비","aliases":["증기비","가스비","스팀비","도시가스비"],"body":"FPA는 스팀/가스 사용량과 단가를 곱합니다. 현재 화면 단위는 t/kg와 원/t이므로 도시가스의 Nm³·열량 단위를 그대로 넣지 말고 동일 기준으로 환산해야 합니다.","formula":"생산량 × kg당 사용량 × 단가","view":"utility","group":"원가"},{"title":"연료비","aliases":["연료비"],"body":"FPA는 생산량에 kg당 연료 사용량(L/kg)과 단가(원/L)를 곱합니다. 유가 티커가 움직여도 연료 단가는 자동으로 변경되지 않습니다.","formula":"생산량 × L/kg × 원/L","view":"utility","group":"원가"},{"title":"용수비","aliases":["수도비","용수비"],"body":"FPA는 생산량에 kg당 용수 사용량(m³/kg)과 단가(원/m³)를 곱합니다. 사용량의 kg·t·m³ 단위를 구분하세요.","formula":"생산량 × m³/kg × 원/m³","view":"utility","group":"원가"},{"title":"유틸리티","aliases":["utilities","유틸리티"],"body":"공정 운영에 필요한 전력·스팀/가스·연료·용수 등입니다. FPA는 네 항목의 사용량과 단가를 각각 입력하며 서로 독립적으로 조정할 수 있습니다.","formula":"전력비 + 스팀/가스비 + 연료비 + 용수비","view":"utility","group":"원가"},{"title":"운반비","aliases":["물류비","운반비"],"body":"제품 운송에 드는 비용입니다. FPA의 운반·포장 화면은 판매 매출액에 운반비율을 곱합니다. 제조고정비의 운반비 계정과 중복 등록하지 않도록 원천 비용을 구분하세요.","formula":"매출액 × 운반비율","view":"logistics","group":"원가"},{"title":"포장비","aliases":["포장비"],"body":"제품을 포장하는 비용입니다. FPA의 운반·포장 화면에서는 매출액 비율로 계산하므로 kg당 포장비와 입력 기준이 다릅니다.","formula":"매출액 × 포장비율","view":"logistics","group":"원가"},{"title":"복리후생비","aliases":["복리후생비"],"body":"직원 복지와 관련된 비용입니다. 생산·관리 등 비용이 발생한 기능에 맞춰 제조비 또는 판관비에 귀속합니다. 같은 비용을 두 곳에 중복 등록하지 마세요.","formula":"","view":"sgFixed","group":"회계"},{"title":"접대비","aliases":["접대비"],"body":"업무상 거래관계 유지 등을 위해 지출하는 비용 계정입니다. FPA는 원가·손익 시뮬레이션용 발생액을 입력받으며 세무상 손금 한도를 계산하지 않습니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"지급임차료","aliases":["임대료","리스료","지급임차료"],"body":"건물·장비 등을 빌려 쓰는 데 지급하는 금액입니다. 재무회계상 리스 회계처리와 관리손익의 현금 임차료는 다를 수 있으므로 입력 기준을 정해 중복을 피해야 합니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"시험비","aliases":["분석비","시험비"],"body":"제품·자재의 품질이나 성능을 시험·분석하는 비용입니다. FPA에서는 발생액을 제조 비용 풀 등 적절한 계정으로 입력할 수 있습니다.","formula":"","view":"mfgFixed","group":"원가"},{"title":"세금과공과","aliases":["제세공과금","세금과공과"],"body":"각종 세금과 공적 부담금에 쓰는 계정입니다. 법인세비용과 구분해 회사의 계정 분류 기준에 맞게 입력하세요. FPA는 법인세 계산을 하지 않습니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"보험료","aliases":["보험료"],"body":"자산·시설·업무 등에 대한 보험 비용입니다. 공장 또는 제품에 직접 대응되는지에 따라 귀속 범위를 지정할 수 있습니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"여비교통비","aliases":["출장비","여비교통비"],"body":"업무 출장과 이동 등에 드는 비용입니다. 발생 기능에 맞게 제조비 또는 판관비에 구분합니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"통신비","aliases":["통신비"],"body":"전화·인터넷 등 통신 서비스 사용 비용입니다. 직접 귀속할 수 없는 공통 부분은 정한 배부 기준을 적용할 수 있습니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"차량유지비","aliases":["차량유지비"],"body":"업무용 차량의 운영·유지에 드는 비용입니다. 제품 운반비 등 다른 계정과 중복되지 않게 원천 비용을 구분하세요.","formula":"","view":"sgFixed","group":"회계"},{"title":"교육훈련비","aliases":["교육비","교육훈련비"],"body":"임직원 업무 교육·훈련에 드는 비용입니다. FPA에서는 계정별 월 발생액을 입력해 배부합니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"도서인쇄비","aliases":["도서비","인쇄비","도서인쇄비"],"body":"업무용 도서·간행물 구입과 인쇄 등에 드는 비용입니다. 회사의 회계 계정 분류를 기준으로 입력하세요.","formula":"","view":"sgFixed","group":"회계"},{"title":"지급수수료","aliases":["수수료","지급수수료"],"body":"외부 기관이나 전문가 등의 서비스를 이용한 수수료입니다. 금융비용·매출 차감 등으로 처리되는 항목과 구분해야 합니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"용역비","aliases":["용역비"],"body":"외부 업체로부터 제공받는 업무·서비스의 대가입니다. 수행 기능에 따라 제조비 또는 판관비로 구분하고 외주가공비와 중복 등록하지 마세요.","formula":"","view":"sgFixed","group":"회계"},{"title":"외주가공비","aliases":["외주비","외주가공비"],"body":"제품 제조 과정의 일부를 외부 업체에 맡긴 대가입니다. FPA는 발생액을 제조고정비 계정으로 입력할 수 있으나 실제 원가 성격은 계약·조업 방식에 따라 달라집니다.","formula":"","view":"mfgFixed","group":"원가"},{"title":"경상연구개발비","aliases":["r&d","연구개발비","경상연구개발비"],"body":"연구·개발 활동과 관련된 비용입니다. 비용 처리와 자산 인식의 판단은 별도 회계 기준에 따르며 FPA는 판관비로 입력한 금액을 계산에 반영합니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"광고선전비","aliases":["광고비","광고선전비"],"body":"제품이나 기업을 알리는 광고·홍보 비용입니다. FPA에서는 판관고정비 비용 풀의 월 발생액으로 관리할 수 있습니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"수선비","aliases":["수리비","수선비"],"body":"설비·시설 등의 성능을 유지하거나 복구하는 비용입니다. FPA는 제품별 직접 수선비와 비용 풀 계정을 지원하므로 같은 지출을 양쪽에 중복 입력하지 마세요.","formula":"","view":"repair","group":"원가"},{"title":"소모품비","aliases":["소모품비"],"body":"업무·생산 과정에서 소모되는 물품 비용입니다. 원재료 BOM에 포함한 자재와 중복 처리하지 않도록 구분하세요.","formula":"","view":"repair","group":"원가"},{"title":"직원급여","aliases":["직원급여"],"body":"관리·판매 등 직원의 급여 계정입니다. FPA에서는 판관고정비로 입력하며 생산직 노무비와 역할을 구분합니다.","formula":"","view":"sgFixed","group":"회계"},{"title":"수도광열비","aliases":["광열비","수도광열비"],"body":"수도·전기·가스 등 사용 비용에 쓰는 계정입니다. 제품 유틸리티에 이미 반영한 비용과 중복 입력하지 않도록 적용 범위를 구분하세요.","formula":"","view":"sgFixed","group":"회계"},{"title":"매출 환율","aliases":["매출환율","수출환율"],"body":"USD 판매단가를 원화로 환산할 때 쓰는 원/USD 환율입니다. USD 거래 매출에만 영향을 주며 원화 거래에는 적용하지 않습니다.","formula":"","view":"sales","group":"환율"},{"title":"원재료 환율","aliases":["재료환율","수입환율","원재료환율"],"body":"USD 자재 구매단가를 원화로 환산할 때 쓰는 원/USD 환율입니다. FPA에서는 매출 환율과 독립적으로 조정합니다.","formula":"","view":"materials","group":"환율"},{"title":"환율 상승","aliases":["원화약세","환율상승"],"body":"원/USD 환율 상승은 같은 1달러를 원화로 환산한 금액이 커지는 뜻입니다. FPA에서는 USD 매출의 원화액과 USD 원재료의 원화원가에 각각 영향을 주며 순효과는 거래구조에 따라 달라집니다.","formula":"","view":"scenario","group":"환율"},{"title":"환율 하락","aliases":["원화강세","환율하락"],"body":"원/USD 환율 하락은 같은 달러 금액의 원화 환산액이 줄어드는 뜻입니다. 매출과 원재료 환율 중 어디에 적용하는지 구분해 시나리오를 만드세요.","formula":"","view":"scenario","group":"환율"},{"title":"매매기준율","aliases":["매매기준율","기준환율"],"body":"환율 비교·환산에 쓰는 기준값입니다. 은행의 실제 송금·환전 적용 환율이나 회사의 계약 환율과 같다고 볼 수는 없습니다. FPA 시장창의 ECB 환율은 원화 교차환산 참고값입니다.","formula":"","view":"sales","group":"환율"},{"title":"교차환율","aliases":["cross rate","교차환율"],"body":"두 통화의 환율을 제3통화 기준 환율로부터 계산한 값입니다. FPA의 ECB 데이터는 EUR 기준 통화값과 KRW 값을 이용해 표시 통화당 원화값으로 환산합니다.","formula":"원/통화 = 원/EUR ÷ 통화/EUR","view":"sales","group":"환율"},{"title":"환율 표시 단위","aliases":["100엔","100동","환율단위"],"body":"티커는 원/1통화를 기본으로 하되 JPY·VND·IDR은 원/100통화로 표시합니다. 시나리오에 적용 가능한 USD 환율은 원/1USD 기준입니다.","formula":"","view":"sales","group":"환율"},{"title":"당일 환율 적용","aliases":["오늘환율","최신환율","당일환율"],"body":"시장창에서 최신 공표 USD 참고환율의 기준일을 확인한 뒤 매출·원재료·제품·기간을 선택해 적용할 수 있습니다. 주말이나 공표 전에는 최근 공표일 자료가 표시됩니다. 적용된 가정은 이후 시세가 바뀌어도 고정됩니다.","formula":"","view":"sales","group":"사용법"},{"title":"환차손익","aliases":["외환차손익","환차손","환차익"],"body":"외화 거래의 결제나 평가 과정에서 환율 차이로 생기는 손익입니다. FPA는 매출·원재료 환산을 시뮬레이션하며 채권·채무 결제 시점별 환차손익은 별도로 계산하지 않습니다.","formula":"","view":"help","group":"회계"},{"title":"환헤지","aliases":["헤징","선물환","환헤지"],"body":"환율 변동에 따른 위험을 줄이는 활동입니다. 선물환 등 계약 조건은 거래와 만기에 따라 다릅니다. FPA에는 헤지 계약 손익·헤지회계 계산 기능이 포함되어 있지 않습니다.","formula":"","view":"help","group":"환율"},{"title":"WTI","aliases":["wti","서부텍사스유"],"body":"미국을 대표하는 원유 가격 지표 중 하나입니다. FPA는 EIA 원천·FRED 제공의 Cushing WTI 일별 현물가격을 USD/bbl로 표시합니다. 선물가격과는 다른 자료입니다.","formula":"","view":"total","group":"시장"},{"title":"Brent","aliases":["brent","브렌트","브렌트유"],"body":"국제 원유 가격의 대표 지표 중 하나입니다. FPA는 EIA 원천·FRED 제공의 Europe Brent 일별 현물가격을 표시합니다. 다른 지역 원유나 개별 자재 계약가격과 같지 않습니다.","formula":"","view":"total","group":"시장"},{"title":"현물과 선물","aliases":["선물가격","현물가격","현물과선물"],"body":"현물은 현재 인도되는 상품의 가격이고 선물은 정한 미래 시점의 인도·결제를 조건으로 한 계약가격입니다. 만기와 거래 조건이 다르므로 서로 섞어 비교하지 마세요.","formula":"","view":"total","group":"시장"},{"title":"배럴","aliases":["bbl","배럴"],"body":"석유의 부피 단위이며 미국 석유 배럴은 42 US gallon, 약 158.987리터입니다. kg으로 바꾸려면 물질의 밀도가 필요합니다. 원유 배럴 가격을 자재 kg단가로 바로 사용할 수 없습니다.","formula":"","view":"total","group":"시장"},{"title":"유가 연동","aliases":["유가연동","원유연동"],"body":"유가 변화가 개별 원재료 가격에 영향을 줄 수 있지만 연동 비율·시차·계약 구조가 따로 필요합니다. 현재 FPA 티커는 참고 정보이며 BOM 단가나 연료 단가를 자동으로 바꾸지 않습니다.","formula":"","view":"materials","group":"시장"},{"title":"전일 대비","aliases":["등락률","전일대비"],"body":"FPA는 같은 시계열의 최근 유효 관측값과 직전 유효 관측값을 비교합니다. 휴일·결측일은 건너뛰며 비교 기준일을 상세창에 표시합니다. 보충 환율처럼 비교자료가 없으면 등락을 표시하지 않습니다.","formula":"(최근값 ÷ 직전값 − 1) × 100","view":"total","group":"시장"},{"title":"시세 기준일","aliases":["기준일","시세기준일","갱신지연"],"body":"가격이 관측·공표된 날짜와 앱이 조회한 시각은 다릅니다. FPA는 둘을 구분해 표시하고, 조회 실패 시 이전 자료임을 표시합니다. 최근 조회에 성공해도 원자료가 오래되면 최신 시세로 표시하지 않습니다.","formula":"","view":"total","group":"사용법"},{"title":"타워","aliases":["tower","타워","탑"],"body":"공정에서 쓰는 탑 형태의 설비를 통칭하는 말입니다. 증류탑·흡수탑 등 역할이 다르므로 이름만으로 세부 기능을 단정할 수 없습니다. FPA의 설비 수는 배부를 위한 입력값이며 실제 처리용량과 같지는 않습니다.","formula":"","view":"drivers","group":"공정"},{"title":"증류","aliases":["distillation","증류"],"body":"혼합물 성분의 휘발도 차이를 이용해 기화와 응축을 반복하며 분리하는 조작입니다. 분리 난이도는 성분·압력·조성 등에 따라 달라지고 단순한 끓는점 차이만으로 모든 운전 조건이 정해지지는 않습니다.","formula":"","view":"help","group":"공정"},{"title":"증류탑","aliases":["distillation column","증류탑"],"body":"증기와 액체의 접촉을 이용해 혼합물 성분을 분리하는 설비입니다. 일반적으로 탑·재비기·응축기 등이 연결되며 에너지 사용량이 원가에 영향을 줍니다.","formula":"","view":"help","group":"공정"},{"title":"흡수탑","aliases":["absorber","흡수탑"],"body":"기체 속 특정 성분을 액체에 흡수시켜 분리하는 설비입니다. 증류탑과 외형이 비슷해도 분리 원리와 비용 동인이 다릅니다.","formula":"","view":"help","group":"공정"},{"title":"탈거","aliases":["stripping","스트리핑","탈거"],"body":"액체에 녹아 있는 성분을 기체 쪽으로 이동시켜 제거하는 조작입니다. 용매·가열·가스 사용량 등 운전 조건이 비용에 영향을 줍니다.","formula":"","view":"help","group":"공정"},{"title":"추출","aliases":["extraction","추출"],"body":"성분이 두 상 사이에 다르게 분배되는 성질을 이용해 분리하는 조작입니다. 사용하는 용매와 회수 공정까지 포함해 원가를 평가해야 합니다.","formula":"","view":"help","group":"공정"},{"title":"흡착","aliases":["adsorption","흡착"],"body":"특정 성분이 고체 등의 표면에 붙는 성질을 이용하는 조작입니다. 흡수와 구분하며 흡착제 교체·재생 비용이 발생할 수 있습니다.","formula":"","view":"help","group":"공정"},{"title":"반응기","aliases":["reactor","반응기"],"body":"원료를 화학 반응시켜 제품을 만드는 설비입니다. 반응 방식·체류시간·열관리 등에 따라 생산능력과 원가 구조가 달라집니다. 실제 운전 조건은 설비별 절차를 따릅니다.","formula":"","view":"help","group":"공정"},{"title":"배치 공정","aliases":["batch","배치","회분식"],"body":"일정량을 투입해 한 회차씩 처리하는 방식입니다. 투입·반응·배출·세정 등 전체 회차 시간이 생산능력에 영향을 줍니다.","formula":"","view":"help","group":"공정"},{"title":"연속 공정","aliases":["continuous","연속공정"],"body":"원료 공급과 제품 배출을 지속하는 방식입니다. 안정 운전 시간·정지·기동 손실을 고려해야 하며 가동일수만으로 실제 생산능력이 결정되지는 않습니다.","formula":"","view":"help","group":"공정"},{"title":"열교환기","aliases":["heat exchanger","열교환기"],"body":"온도가 다른 유체 사이에 열을 전달하는 설비입니다. 가열·냉각·응축·증발 등에 쓰이며 열회수 효율과 오염이 유틸리티 비용에 영향을 줄 수 있습니다.","formula":"","view":"help","group":"공정"},{"title":"재비기","aliases":["reboiler","리보일러","재비기"],"body":"증류 계통 등에서 액체를 가열해 증기를 만드는 열교환 설비입니다. 열원 사용이 스팀·연료 원단위에 영향을 줍니다.","formula":"","view":"help","group":"공정"},{"title":"응축기","aliases":["condenser","콘덴서","응축기"],"body":"증기를 냉각해 액체로 바꾸는 설비입니다. 냉각수나 다른 냉각원이 사용되며 냉각 부하가 관련 비용에 영향을 줍니다.","formula":"","view":"help","group":"공정"},{"title":"환류","aliases":["reflux","환류"],"body":"증류 계통에서 응축된 액체의 일부를 탑으로 돌려보내는 것입니다. 분리와 에너지 사용에 영향을 주지만 최적값은 설비·조성 조건에 따라 달라집니다.","formula":"","view":"help","group":"공정"},{"title":"진공증류","aliases":["감압증류","진공증류"],"body":"압력을 낮춘 조건에서 증류하는 방식입니다. 온도 부담을 줄일 수 있지만 진공계통의 에너지·유지비도 고려해야 합니다.","formula":"","view":"help","group":"공정"},{"title":"트레이","aliases":["tray","트레이"],"body":"탑 안에서 기체와 액체의 접촉을 돕는 판 형태의 내부 구조물입니다. 처리량·압력강하·분리 성능과 관련되며 FPA는 내부 구조를 직접 모델링하지 않습니다.","formula":"","view":"help","group":"공정"},{"title":"충전물","aliases":["packing","패킹","충전물"],"body":"탑 안에서 접촉 면적을 제공하는 내부 재료입니다. 물류 화면의 제품 포장비와는 다른 뜻입니다.","formula":"","view":"help","group":"공정"},{"title":"압력강하","aliases":["pressure drop","차압","압력강하"],"body":"유체가 배관·장치 등을 지나며 압력이 낮아지는 현상입니다. 막힘·오염·유량 변화 등 여러 원인이 있으므로 비용 분석과 설비 진단을 구분해야 합니다.","formula":"","view":"help","group":"공정"},{"title":"열부하","aliases":["heat duty","열부하"],"body":"가열·냉각 등에서 전달해야 하는 열량의 속도 또는 지정 기간 열량입니다. 단위 kW와 kWh는 각각 일률과 에너지로 다릅니다.","formula":"","view":"help","group":"공정"},{"title":"스팀","aliases":["steam","증기","스팀"],"body":"공정 가열 등에 사용하는 수증기입니다. 압력·온도·응축수 회수 등에 따라 유효 열량과 원가가 달라질 수 있습니다.","formula":"","view":"utility","group":"공정"},{"title":"응축수","aliases":["condensate","응축수"],"body":"증기가 열을 전달한 뒤 액체 물로 변한 것입니다. 회수 상태는 보일러 보충수와 에너지 수요에 영향을 줄 수 있습니다.","formula":"","view":"help","group":"공정"},{"title":"냉각수","aliases":["cooling water","냉각수"],"body":"설비의 열을 제거하는 데 쓰이는 물입니다. 순환량과 실제 보충수량은 다르므로 원가 입력의 사용량 기준을 맞춰야 합니다.","formula":"","view":"utility","group":"공정"},{"title":"칠러","aliases":["chiller","냉동기","칠러"],"body":"냉매 사이클 등으로 냉각 유체를 낮은 온도로 만드는 설비입니다. 냉각수 공급 설비와 구분하며 전력 사용이 중요한 비용 동인이 될 수 있습니다.","formula":"","view":"help","group":"공정"},{"title":"펌프","aliases":["pump","펌프"],"body":"주로 액체에 에너지를 주어 이송하는 장치입니다. 유량·양정·효율 등이 전력 소비에 영향을 줍니다.","formula":"","view":"help","group":"공정"},{"title":"압축기","aliases":["compressor","컴프레서","압축기"],"body":"기체의 압력을 높이는 장치입니다. 유량·압력비·효율과 운전 상태가 에너지 사용량에 영향을 줍니다.","formula":"","view":"help","group":"공정"},{"title":"여과","aliases":["filtration","필터","여과"],"body":"여재 등을 이용해 입자나 부유물을 분리하는 조작입니다. 필터 교체·압력손실·제품 손실을 비용 측면에서 함께 볼 수 있습니다.","formula":"","view":"help","group":"공정"},{"title":"건조","aliases":["drying","건조"],"body":"물이나 용매 등 휘발 성분을 제거하는 조작입니다. 열원·전력·배출 처리 비용과 제품 손실 등이 원가에 영향을 줍니다.","formula":"","view":"help","group":"공정"},{"title":"농축","aliases":["concentration","농축"],"body":"용매 등을 제거해 특정 성분의 농도를 높이는 조작입니다. 농도가 높아지는 것과 불순물이 줄어 순도가 높아지는 것은 다를 수 있습니다.","formula":"","view":"help","group":"공정"},{"title":"정제","aliases":["purification","정제"],"body":"원하는 성분에서 불순물을 줄여 품질 조건을 맞추는 과정입니다. 순도 개선과 수율·에너지·검사비 사이의 관계를 함께 분석할 수 있습니다.","formula":"","view":"help","group":"공정"},{"title":"순도","aliases":["purity","순도"],"body":"물질 중 원하는 성분이 차지하는 비중입니다. 질량·몰·면적 등 분석 기준이 다를 수 있습니다. FPA의 수율 입력값을 순도로 대신 입력하면 안 됩니다.","formula":"","view":"help","group":"공정"},{"title":"회수율","aliases":["recovery","회수율"],"body":"기준 투입물 중 목표 성분 등을 회수한 비율입니다. 전체 질량 기준 생산수율과 정의가 다를 수 있으므로 분자·분모를 명시해야 합니다.","formula":"","view":"help","group":"공정"},{"title":"물질수지","aliases":["mass balance","질량수지","물질수지"],"body":"지정한 계 안의 투입·산출·축적을 맞추는 계산입니다. FPA BOM은 완제품·수율 기반의 단순 투입 모델이며 공정 전체의 반응·부산물 물질수지 해석기는 아닙니다.","formula":"투입 − 산출 + 생성 − 소멸 = 축적","view":"materials","group":"공정"},{"title":"에너지수지","aliases":["energy balance","열수지","에너지수지"],"body":"계 안으로 들어오고 나가는 에너지와 축적을 맞추는 계산입니다. FPA는 실제 설비 열수지를 풀지 않고 사용자가 입력한 유틸리티 원단위로 비용을 계산합니다.","formula":"","view":"utility","group":"공정"},{"title":"체류시간","aliases":["residence time","체류시간"],"body":"물질이 장치나 공정 안에 머무는 대표 시간입니다. 반응·분리·생산능력에 영향을 주며 설비별 운전 조건에 따라 정의가 달라질 수 있습니다.","formula":"","view":"help","group":"공정"},{"title":"병목","aliases":["bottleneck","병목공정","병목"],"body":"전체 공정의 처리량을 제한하는 단계나 자원입니다. 설비 수가 많아도 병목 단계의 능력이 낮으면 전체 생산량이 제한될 수 있습니다.","formula":"","view":"drivers","group":"운영"},{"title":"생산능력","aliases":["capacity","캐파","생산능력"],"body":"주어진 설비·시간·제품 조건에서 생산할 수 있는 양입니다. 명목능력과 실제 달성능력은 정지·교체·수율 등으로 달라질 수 있습니다.","formula":"","view":"drivers","group":"운영"},{"title":"가동률","aliases":["utilization","가동률"],"body":"정한 가용시간이나 생산능력 중 실제 사용한 비율입니다. 시간 기준과 생산량 기준이 다르므로 분모를 명시해야 합니다. FPA는 가동률을 자동 산출하는 별도 설비 달력을 갖고 있지 않습니다.","formula":"","view":"drivers","group":"운영"},{"title":"가동일수","aliases":["조업일수","가동일수"],"body":"FPA에서는 제품·월별로 입력하는 가동 일수입니다. 각 값은 0~31일이며 공장 배부 시 제품별 값이 합산될 수 있습니다.","formula":"","view":"drivers","group":"운영"},{"title":"설비 수","aliases":["타워수량","타워수","설비수"],"body":"FPA에서 배부 가중치에 사용하는 제품별 설비 수입니다. 설비 크기·처리용량의 차이를 자동 보정하지 않으므로 입력 기준을 일관되게 관리해야 합니다.","formula":"설비×가동일수 = 설비 수 × 가동일수","view":"drivers","group":"운영"},{"title":"OEE","aliases":["oee","설비종합효율"],"body":"가용성·성능·품질 요인을 결합해 설비 효율을 보는 지표입니다. FPA 현재 입력만으로 OEE를 정확히 산출할 수는 없습니다.","formula":"가용성 × 성능 × 품질","view":"drivers","group":"운영"},{"title":"정기보수","aliases":["turnaround","셧다운","정기보수"],"body":"계획한 설비 점검·보수를 위해 생산을 멈추는 활동입니다. 생산량·가동일수 감소와 수선비 증가를 각각 입력해 손익 영향을 비교할 수 있습니다.","formula":"","view":"repair","group":"운영"},{"title":"기동과 정지","aliases":["스타트업","기동","정지손실"],"body":"공정을 시작하거나 멈출 때 정상 운전과 다른 에너지 사용·제품 손실 등이 발생할 수 있습니다. FPA에서는 실제 수율·원단위·비용 가정에 반영합니다.","formula":"","view":"drivers","group":"운영"},{"title":"제품 믹스","aliases":["product mix","제품믹스"],"body":"전체 판매·생산 중 제품별 구성 비중입니다. 제품별 단가·수율·배부 기준이 다르면 믹스 변화만으로도 총수익성이 바뀔 수 있습니다.","formula":"","view":"items","group":"원가"},{"title":"기회비용","aliases":["opportunity cost","기회비용"],"body":"하나를 선택하면서 포기한 다른 대안의 가치입니다. 장부에 기록된 발생비용과 구분하며 FPA 기본 손익에 자동 포함되지 않습니다.","formula":"","view":"help","group":"원가"},{"title":"매몰원가","aliases":["sunk cost","매몰원가"],"body":"이미 발생해 현재 선택으로 되돌릴 수 없는 원가입니다. 앞으로 바뀔 수 있는 비용과 구분해 의사결정해야 합니다.","formula":"","view":"help","group":"원가"},{"title":"표준원가","aliases":["standard cost","표준원가"],"body":"정한 정상 조건의 수량·단가 등을 기준으로 계산한 원가입니다. 실제 원가와 비교하면 가격·수량·효율 차이를 분석할 수 있습니다. FPA에서 계획과 실적 CASE를 따로 관리할 수 있습니다.","formula":"","view":"scenario","group":"원가"},{"title":"실제원가","aliases":["actual cost","실제원가"],"body":"실제로 발생한 수량과 금액에 따른 원가입니다. 계획 가정과 비교할 때 평가 방법·기간·비용 범위를 같게 맞춰야 합니다.","formula":"","view":"scenario","group":"원가"},{"title":"원가 차이분석","aliases":["variance","원가차이","차이분석"],"body":"계획과 실적 차이를 가격·수량·수율·믹스 등 요인으로 나누는 분석입니다. 여러 변수가 함께 바뀌면 교차 효과가 생길 수 있어 분석 순서를 명확히 해야 합니다.","formula":"","view":"scenario","group":"원가"},{"title":"재무상태표","aliases":["b/s","bs","대차대조표","재무상태표"],"body":"특정 시점의 자산·부채·자본을 보여주는 재무제표입니다. FPA는 제품별 손익 모델로 완전한 재무상태표를 작성하지 않습니다.","formula":"자산 = 부채 + 자본","view":"help","group":"회계"},{"title":"손익계산서","aliases":["i/s","is","손익계산서"],"body":"일정 기간의 수익과 비용, 이익을 보여주는 재무제표입니다. FPA는 제품·공장별 영업손익 중심이며 금융손익·법인세·당기순이익 전체를 구성하지 않습니다.","formula":"","view":"pnl","group":"회계"},{"title":"현금흐름표","aliases":["cash flow","현금흐름표"],"body":"현금의 유입·유출을 영업·투자·재무 활동 등으로 구분해 보여주는 재무제표입니다. 손익과 현금흐름은 매출채권·재고·투자 등 때문에 달라질 수 있습니다.","formula":"","view":"help","group":"회계"},{"title":"발생주의","aliases":["accrual","발생주의"],"body":"현금 수수 시점만이 아니라 수익·비용이 발생한 기간에 인식하는 회계 원칙입니다. FPA에 월 비용을 넣을 때 지급월과 발생월을 구분하세요.","formula":"","view":"help","group":"회계"},{"title":"매출채권","aliases":["accounts receivable","매출채권"],"body":"제품 등을 판매했지만 아직 받지 못한 금액입니다. 매출 인식과 현금 회수의 시차를 만들며 FPA는 회수 일정과 대손을 별도로 모델링하지 않습니다.","formula":"","view":"help","group":"회계"},{"title":"매입채무","aliases":["accounts payable","매입채무"],"body":"원재료 등을 구매하고 아직 지급하지 않은 금액입니다. 원가 발생과 현금 지급 시점은 다를 수 있습니다. FPA에는 지급 일정 모델이 없습니다.","formula":"","view":"help","group":"회계"},{"title":"운전자본","aliases":["working capital","운전자본"],"body":"일상 영업에 묶이는 자금 규모를 보는 개념입니다. 분석 목적에 따라 유동자산−유동부채 또는 영업 관련 항목만을 사용하므로 정의를 먼저 정해야 합니다.","formula":"","view":"help","group":"회계"},{"title":"CAPEX","aliases":["capex","설비투자","자본적지출"],"body":"장기간 사용할 자산의 취득·개선 등에 쓰는 투자 지출입니다. 전액을 즉시 비용 처리하는 운영비와 구분합니다. FPA에서는 투자·상각 스케줄을 직접 생성하지 않습니다.","formula":"","view":"help","group":"회계"},{"title":"OPEX","aliases":["opex","운영비"],"body":"일상 운영에 드는 지출·비용을 뜻하는 표현입니다. 사용 목적에 따라 포함 범위가 달라질 수 있으므로 제조비·판관비 등 구체 계정으로 구분하세요.","formula":"","view":"help","group":"회계"},{"title":"순이익","aliases":["당기순이익","순이익"],"body":"영업손익 외 손익과 법인세 등을 반영한 최종 기간 이익입니다. FPA 화면의 영업이익이나 EBITDA를 순이익으로 해석하면 안 됩니다.","formula":"","view":"pnl","group":"회계"},{"title":"부가가치세","aliases":["vat","부가세","부가가치세"],"body":"거래의 공급가액과 별도로 부과되는 세금입니다. FPA는 부가세 신고·공제 모델이 없으므로 수익·비용 입력 기준을 세전 금액 등으로 일관되게 맞춰야 합니다.","formula":"","view":"help","group":"회계"},{"title":"순현재가치","aliases":["npv","순현재가치","NPV","현금흐름할인","투자경제성"],"body":"초기 투자와 이후 증분 세후 현금흐름의 현재가치를 합산합니다. 적정 할인율하에 NPV가 양수면 가치 증가를 검토합니다.","formula":"NPV = 초기현금흐름 + Σ[기간현금흐름 ÷ (1+r)^t]","view":"help","group":"원가","lesson":{"section":"원가관리 · 투자","principle":"초기 투자와 이후 증분 세후 현금흐름의 현재가치를 합산합니다. 적정 할인율하에 NPV가 양수면 가치 증가를 검토합니다.","example":"초기 100, 1년 후 110, 할인율 10%면 NPV 0입니다.","check":"감가는 현금 유출이 아니지만 세금 효과를 줄 수 있습니다. 매몰 연구비·운전자본 회수·처분가·기회비용·명목/실질 일관성을 확인합니다.","ref":"managerial"}},{"title":"내부수익률","aliases":["irr","내부수익률","IRR","복수IRR","재투자가정"],"body":"NPV를 0으로 만드는 할인율입니다. 일반적인 최초 투자 후 유입 구조에서 요구수익률과 비교합니다.","formula":"","view":"help","group":"원가","lesson":{"section":"원가관리 · 투자","principle":"NPV를 0으로 만드는 할인율입니다. 일반적인 최초 투자 후 유입 구조에서 요구수익률과 비교합니다.","example":"초기 −100, 1년 후 +120이면 IRR은 20%입니다.","check":"부호가 여러 번 바뀌면 IRR이 복수이거나 없을 수 있습니다. 상호배타 투자·규모·기간이 다르면 NPV를 함께 봅니다.","ref":"managerial"}},{"title":"ppm","aliases":["ppm","피피엠"],"body":"백만분율을 뜻합니다. 질량 기준인지 부피·몰 기준인지 명시해야 합니다. 분석값 ppm을 FPA BOM 투입비율의 %와 혼동하지 마세요.","formula":"1% = 10,000 ppm","view":"help","group":"공정"},{"title":"ppb","aliases":["ppb","피피비"],"body":"십억분율을 뜻합니다. ppm보다 작은 비율 단위이며 질량·몰 등 기준을 함께 확인해야 합니다.","formula":"1 ppm = 1,000 ppb","view":"help","group":"공정"},{"title":"밀도","aliases":["density","밀도"],"body":"단위 부피당 질량입니다. 온도와 조성에 따라 달라질 수 있으므로 L·m³와 kg·t를 환산할 때 대상 물질의 조건에 맞는 값을 사용해야 합니다.","formula":"질량 = 밀도 × 부피","view":"help","group":"공정"},{"title":"Nm³","aliases":["nm3","노말루베","표준체적"],"body":"정한 기준 온도·압력으로 환산한 기체 체적입니다. Nm³의 기준 조건은 적용 규격에 따라 확인해야 하며 실제 운전 체적 m³와 다를 수 있습니다.","formula":"","view":"help","group":"공정"},{"title":"kW와 kWh","aliases":["kwh","kw","kW와kWh"],"body":"kW는 순간 전력 등 일률, kWh는 기간 동안 사용한 전기에너지입니다. FPA의 kg당 전력 사용량은 kWh/kg이고 단가는 원/kWh입니다.","formula":"에너지 kWh = 평균전력 kW × 시간 h","view":"utility","group":"공정"},{"title":"공정 안전","aliases":["psm","공정안전","위험물"],"body":"공정 위험을 체계적으로 관리하는 활동입니다. 이 도움말은 용어 이해와 원가 분석을 위한 것으로 실제 운전·정비 조건은 승인된 현장 절차와 담당 전문가를 통해 확인해야 합니다.","formula":"","view":"help","group":"공정"},{"title":"SDS","aliases":["msds","sds","물질안전보건자료"],"body":"물질의 유해성·취급·저장·응급조치 등을 담은 자료입니다. 실제 제품·제조사·버전에 맞는 SDS를 사용해야 하며 FPA는 제품별 안전자료를 제공하지 않습니다.","formula":"","view":"help","group":"공정"},{"title":"세정과 전환","aliases":["세척","세정","제품전환"],"body":"제품 교체 시 설비를 청소·준비하는 과정입니다. 시간·세정제·폐기물·수율 손실을 나눠 보면 제품 믹스와 생산계획의 비용 영향을 분석할 수 있습니다.","formula":"","view":"help","group":"운영"},{"title":"폐기물 처리비","aliases":["폐수처리","폐기물","폐기물처리비"],"body":"공정 배출물 등을 처리하는 비용입니다. 처리량 비례분과 고정비를 구분하고 실제 발생비용을 별도 계정이나 적절한 비용 풀로 입력할 수 있습니다.","formula":"","view":"mfgFixed","group":"원가"},{"title":"부산물","aliases":["byproduct","부산물"],"body":"주제품과 함께 발생하는 부수적인 산출물입니다. FPA는 부산물 수불과 가치 차감 규칙을 자동 계산하지 않으므로 원가 입력·다른 제품 등록 방식의 일관성을 확인해야 합니다.","formula":"","view":"help","group":"원가"},{"title":"재공품","aliases":["wip","재공품"],"body":"생산 중이며 아직 완제품이 되지 않은 재고입니다. FPA 현재 모델은 완제품 월별 재고 중심으로, 공정별 완성도에 따른 재공품 원가 계산은 지원하지 않습니다.","formula":"","view":"inventory","group":"원가"},{"title":"제품 직접비","aliases":["제품직접비"],"body":"특정 제품에 바로 귀속되는 비용입니다. FPA에서는 공장·제품 배부 기준을 모두 거치지 않고 지정 제품에 전액 반영합니다.","formula":"","view":"mfgFixed","group":"사용법"},{"title":"공장 직접비","aliases":["공장직접비"],"body":"특정 공장에 바로 귀속되는 비용입니다. FPA에서는 공장 간 배부를 생략하고 그 공장 제품들에 제품 배부 기준을 적용합니다.","formula":"","view":"mfgFixed","group":"사용법"},{"title":"시나리오 비교","aliases":["기준시나리오","시나리오비교"],"body":"시나리오 설정에서 기준 CASE를 지정하면 입력 차이와 조정 기록을 확인할 수 있습니다. 비교 기준은 저장된 다른 CASE이며 시세가 갱신되어도 자동 변경되지 않습니다.","formula":"","view":"scenario","group":"사용법"},{"title":"필터와 배부","aliases":["필터배부","필터와배부"],"body":"화면에서 공장·제품을 필터링해도 원래 비용 풀의 배부 분모는 바뀌지 않습니다. 보이는 제품만으로 공통비를 다시 나누면 전체 손익과 달라질 수 있어 FPA는 이를 분리합니다.","formula":"","view":"mfgFixed","group":"사용법"},{"title":"입력 순서","aliases":["시작방법","입력순서","어떻게시작"],"body":"공장·제품과 기초재고를 등록한 뒤 매출, 생산량·수율·가동일수, BOM, 유틸리티, 노무비·고정비·판관비를 입력합니다. 마지막으로 검산과 제품별 손익을 확인하세요.","formula":"","view":"master","group":"사용법"},{"title":"채팅 명령","aliases":["명령어","채팅명령","명령사용법"],"body":"항목·변경값·기간·대상을 입력하면 적용 전에 변경 내역과 손익 영향을 보여줍니다. 예: ‘3분기 전력 단가 5% 상승’. 입력 문장은 외부 AI로 보내지 않습니다. 모호한 항목은 선택하고 이해하지 못한 문장은 실행하지 않습니다.","formula":"","view":"scenario","group":"사용법"},{"title":"지원 범위","aliases":["답변범위","챗봇한계","지원범위"],"body":"이 도우미는 검토된 용어 설명 검색, FPA 계산 근거 설명, 정해진 시나리오 수정 명령을 처리합니다. 자유로운 전문가 판단이나 임의의 공정 최적화 답변을 생성하지 않습니다. 연결된 자료와 계산 근거를 확인할 수 있습니다.","formula":"","view":"help","group":"사용법"},{"title":"전부원가계산","aliases":["흡수원가","전부원가계산"],"body":"제조 변동원가와 제조 고정원가를 모두 제품원가에 포함하는 방식입니다. 재고가 증가하면 당월 발생 제조고정비 일부가 다음 기간으로 이연될 수 있습니다. FPA의 생산원가·재고 흐름은 이 관점을 단순화한 관리모델입니다.","formula":"","view":"inventory","group":"원가"},{"title":"변동원가계산","aliases":["직접원가계산","변동원가계산"],"body":"제조 변동원가만 제품원가에 포함하고 제조고정비를 기간비용으로 보는 내부 분석 방식입니다. 전부원가계산과 이익 차이는 재고에 포함된 제조고정비의 이연·환입과 연결됩니다.","formula":"","view":"pnl","group":"원가"},{"title":"제품원가와 기간원가","aliases":["제품원가","기간원가","제품원가와기간원가"],"body":"제품원가는 재고에 포함되었다가 판매 시 비용으로 반영되는 원가이고, 기간원가는 발생 기간에 비용으로 인식하는 원가입니다. 제조·판매 기능과 실제 인식 요건을 함께 봐야 합니다.","formula":"","view":"inventory","group":"원가"},{"title":"관련원가","aliases":["relevant cost","관련원가"],"body":"의사결정 대안에 따라 달라지는 미래 원가입니다. 이미 발생한 매몰원가나 어느 대안에서도 같은 불가피 원가는 보통 차이 비교에서 제외합니다.","formula":"","view":"help","group":"원가"},{"title":"회피가능원가","aliases":["회피가능비용","회피가능원가"],"body":"특정 대안을 선택하면 없앨 수 있는 미래 비용입니다. 고정비라고 모두 회피 불가능한 것은 아니며 계약 해지·인력·설비의 실제 조건을 확인해야 합니다.","formula":"","view":"help","group":"원가"},{"title":"증분원가","aliases":["차액원가","증분비용","증분원가"],"body":"대안 간 총원가 차이를 뜻합니다. 단위평균원가와 다르며 추가 주문·내부 생산·외주 결정에서 실제로 달라지는 항목을 모읍니다.","formula":"","view":"help","group":"원가"},{"title":"특별주문","aliases":["특수주문","추가주문","특별주문","특별가격주문","증분이익"],"body":"증분 수익에서 증분 원가와 기회비용을 차감하고 시장·고객 영향과 생산능력을 검토합니다.","formula":"","view":"scenario","group":"원가","lesson":{"section":"원가관리 · 의사결정","principle":"증분 수익에서 증분 원가와 기회비용을 차감하고 시장·고객 영향과 생산능력을 검토합니다.","example":"주문 100개×가격 80, 단위 증분원가 50, 추가 고정비 1천이면 증분이익 2천입니다.","check":"기존 고정비 배부액 때문에 유리 주문을 거절하거나, 병목과 기존 고객 가격 영향을 빼고 수락하지 않습니다.","ref":"managerial"}},{"title":"자가제조와 외주","aliases":["make or buy","자가제조","외주전환","외주구매"],"body":"자가제조의 회피 가능한 원가·기회비용을 외주구매의 증분 원가와 비교합니다.","formula":"","view":"scenario","group":"원가","lesson":{"section":"원가관리 · 의사결정","principle":"자가제조의 회피 가능한 원가·기회비용을 외주구매의 증분 원가와 비교합니다.","example":"장부상 제조원가 100 중 회피 불가 고정비 30이면 외주가 80과의 단순 비교 대상은 우선 70입니다. 설비 대체 사용 효익은 추가 반영합니다.","check":"품질·공급 안정성·기밀·전환 비용·장기 설비 고정비 변화까지 검토합니다.","ref":"managerial"}},{"title":"제품 중단","aliases":["단종","제품중단","부문폐쇄","공헌이익손실"],"body":"중단으로 절약하는 회피 가능 고정비와 잃는 공헌이익, 다른 제품·대체 사용 영향을 비교합니다.","formula":"","view":"items","group":"원가","lesson":{"section":"원가관리 · 의사결정","principle":"중단으로 절약하는 회피 가능 고정비와 잃는 공헌이익, 다른 제품·대체 사용 영향을 비교합니다.","example":"제품 공헌이익 100, 회피 가능 고정비 60이면 다른 영향이 없을 때 중단으로 이익 40이 감소합니다.","check":"배부 공통비는 중단해도 남을 수 있습니다. 보고서상 적자만으로 중단 결론을 내리지 않습니다.","ref":"managerial"}},{"title":"제약자원 의사결정","aliases":["제약자원","제한요소","병목당공헌이익","병목자원","최적제품믹스"],"body":"제약자원 한 단위당 공헌이익을 비교하고 수요 한도와 여러 제약을 함께 고려합니다.","formula":"제품 공헌이익 ÷ 제품당 병목 사용량","view":"drivers","group":"원가","lesson":{"section":"원가관리 · 의사결정","principle":"제약자원 한 단위당 공헌이익을 비교하고 수요 한도와 여러 제약을 함께 고려합니다.","example":"A 공헌 40·병목 2시간=20/시간, B 공헌 30·1시간=30/시간이면 단순 단일 제약에서 B가 우선입니다.","check":"제품당 이익 순서와 다를 수 있습니다. 다중 제약·최소주문·전환비가 있으면 선형계획 등 다른 접근이 필요합니다.","ref":"managerial"}},{"title":"안전한계","aliases":["안전여유","안전한계","안전한계율","margin of safety"],"body":"현재·예상 매출에서 손익분기 매출을 뺀 여유분입니다. 매출 하락을 얼마나 버틸 수 있는지 기본 CVP 가정하에 봅니다.","formula":"안전한계율 = (매출−BEP매출) ÷ 매출","view":"pnl","group":"원가","lesson":{"section":"원가관리 · CVP","principle":"현재·예상 매출에서 손익분기 매출을 뺀 여유분입니다. 매출 하락을 얼마나 버틸 수 있는지 기본 CVP 가정하에 봅니다.","example":"예상 매출 1억원, BEP매출 8천만원이면 안전한계 2천만원, 안전한계율 20%입니다.","check":"적자 상태는 음수일 수 있습니다. 다품목 믹스·단계고정비·판가 변동이 있으면 다시 계산합니다.","ref":"managerial"}},{"title":"영업레버리지","aliases":["dol","영업레버리지","DOL","영업레버리지도"],"body":"특정 조업 수준에서 공헌이익을 영업이익으로 나눈 민감도입니다. 매출 증감률에 따른 이익 증감률을 작은 변화와 일정 구조 가정하에 해석합니다.","formula":"DOL = 공헌이익 ÷ 영업이익","view":"pnl","group":"원가","lesson":{"section":"원가관리 · CVP","principle":"특정 조업 수준에서 공헌이익을 영업이익으로 나눈 민감도입니다. 매출 증감률에 따른 이익 증감률을 작은 변화와 일정 구조 가정하에 해석합니다.","example":"공헌이익 300, 영업이익 100이면 DOL 3. 매출 5% 증가 시 단순 근사 이익 15% 증가입니다.","check":"손익분기점에서는 분모 0으로 정의되지 않으며 큰 변화·믹스 변화에는 그대로 외삽하지 않습니다.","ref":"managerial"}},{"title":"목표이익 분석","aliases":["목표이익판매량","목표이익분석","목표이익수량","세후목표이익","목표매출"],"body":"목표 영업이익을 고정비에 더해 필요한 공헌이익을 구합니다. 세후 목표는 단순 비례 세율 가정하에서 세전 이익으로 환산합니다.","formula":"필요수량 = (고정비+목표 영업이익) ÷ 단위공헌이익","view":"pnl","group":"원가","lesson":{"section":"원가관리 · CVP","principle":"목표 영업이익을 고정비에 더해 필요한 공헌이익을 구합니다. 세후 목표는 단순 비례 세율 가정하에서 세전 이익으로 환산합니다.","example":"고정비 100, 목표이익 20, 단위 공헌이익 4이면 판매 30단위가 필요합니다.","check":"세후 목표는 세금 구조·금융손익·결손금 등이 있으면 단순 환산을 그대로 적용하지 않습니다.","ref":"managerial"}},{"title":"가중평균 공헌이익률","aliases":["가중평균공헌이익률","다품종손익분기"],"body":"제품별 공헌이익률에 매출 비중을 가중한 값입니다. 제품 믹스가 일정하다는 가정에서 다품종 BEP 매출을 구할 때 사용할 수 있습니다.","formula":"총공헌이익 ÷ 총매출액","view":"items","group":"원가"},{"title":"단계고정비","aliases":["계단원가","단계고정비"],"body":"조업 수준이 특정 구간을 넘으면 인력·설비 추가 등으로 총액이 한 단계 늘어나는 비용입니다. 범위를 넘는 시나리오에서 기존 고정비를 그대로 두면 비용을 과소평가할 수 있습니다.","formula":"","view":"mfgFixed","group":"원가"},{"title":"관련범위","aliases":["relevant range","조업관련범위","관련범위"],"body":"고정비 총액과 단위변동비 등이 가정대로 유지되는 활동량 범위입니다. 설비 증설·교대 추가·단가 할인 등이 생기는 구간에서는 원가식을 재설정해야 합니다.","formula":"","view":"drivers","group":"원가"},{"title":"고저점법","aliases":["high low","고저점법","혼합원가분해","고점저점법"],"body":"활동량이 가장 높은 관측과 낮은 관측의 원가 차이를 활동량 차이로 나눠 변동비율을 추정하고 고정비를 역산합니다.","formula":"단위변동비 = Δ원가 ÷ Δ활동량; 고정비 = 총원가−변동비×활동량","view":"help","group":"원가","lesson":{"section":"원가관리 · CVP","principle":"활동량이 가장 높은 관측과 낮은 관측의 원가 차이를 활동량 차이로 나눠 변동비율을 추정하고 고정비를 역산합니다.","example":"활동 1,000 원가 800, 활동 2,000 원가 1,100이면 단위변동비 0.3, 고정비 500입니다.","check":"원가가 최대·최소인 관측을 고르는 방식이 아닙니다. 이상치·비선형·계절성 때문에 회귀 등 추가 검토가 필요합니다.","ref":"managerial"}},{"title":"활동기준원가","aliases":["abc","활동기준원가","ABC","활동기준원가계산","활동원가풀"],"body":"자원원가를 활동에 모은 뒤 원가동인 사용량으로 원가대상에 배부합니다. 단일 생산량 배부가 놓치는 주문·검사·설정 복잡도를 반영합니다.","formula":"","view":"mfgFixed","group":"원가","lesson":{"section":"원가관리 · 활동","principle":"자원원가를 활동에 모은 뒤 원가동인 사용량으로 원가대상에 배부합니다. 단일 생산량 배부가 놓치는 주문·검사·설정 복잡도를 반영합니다.","example":"설정활동 풀 1억원 / 100회 = 회당 100만원. 제품 A가 20회면 2천만원 배부입니다.","check":"단위·배치·제품유지·시설유지 활동을 구분합니다. 더 많은 동인이 항상 더 정확한 의사결정 정보를 보장하지는 않습니다.","ref":"managerial"}},{"title":"원가동인","aliases":["cost driver","원가동인"],"body":"비용 발생이나 활동량을 설명하는 요인입니다. 배부의 편리함보다 인과관계·측정 가능성·유지 비용을 고려해 선택합니다.","formula":"","view":"drivers","group":"원가"},{"title":"시간동인 활동기준원가","aliases":["tdabc","시간동인abc"],"body":"자원 공급 원가를 실용생산능력 시간으로 나눈 단가와 활동별 소요시간 등을 이용합니다. 미사용 능력 비용을 구분할 수 있으나 FPA는 시간방정식을 자동 추정하지 않습니다.","formula":"","view":"help","group":"원가"},{"title":"정상조업도","aliases":["정상능력","정상조업도"],"body":"여러 기간의 정상 상황과 계획 정비를 고려한 평균 생산능력 개념입니다. 재무보고에서 고정제조간접비를 재고에 배부할 때 사용하며, 저조업 때문에 단위 배부액을 무제한 높이는 것은 적절하지 않습니다. FPA는 현재 등록한 풀을 배부하는 관리모델로 정상조업도 한도는 자동 적용하지 않습니다.","formula":"","view":"mfgFixed","group":"원가"},{"title":"유휴설비 원가","aliases":["유휴능력","유휴설비원가"],"body":"사용하지 않은 설비·능력과 관련된 비용입니다. 정상조업도 배부와 당기비용 처리를 검토하며 생산량이 적다고 모든 고정비를 소량 재고에 몰아넣는 것은 피해야 합니다.","formula":"","view":"mfgFixed","group":"원가"},{"title":"정상감손과 비정상감손","aliases":["정상감손","비정상감손","정상공손","비정상공손","공손품","감손원가","비정상폐기"],"body":"정상적인 생산조건에서 예상되는 감손과 비정상 감손을 나눕니다. 정상감손은 적절한 원가대상에 부담시키고 비정상 낭비는 통상 기간손실로 검토합니다.","formula":"","view":"materials","group":"원가","lesson":{"section":"원가관리 · 계산","principle":"정상적인 생산조건에서 예상되는 감손과 비정상 감손을 나눕니다. 정상감손은 적절한 원가대상에 부담시키고 비정상 낭비는 통상 기간손실로 검토합니다.","example":"검사점이 공정 말기라면 검사에 도달한 양품·재공품 여부에 따라 정상감손 부담 대상이 달라집니다.","check":"정상감손률의 기준수량과 검사점을 먼저 확인합니다. 모든 불량을 양품 원가에 넣어 이익을 미루지 않습니다.","ref":"inventory"}},{"title":"표준 재료가격 차이","aliases":["재료가격차이","표준재료가격차이","재료단가차이","AP SP AQ"],"body":"실제 단가와 표준 단가의 차이에 해당 실제 수량을 곱합니다. 양수 불리, 음수 유리로 표기하는 비용 차이 규약을 먼저 정합니다.","formula":"가격차이 = (실제단가 − 표준단가) × 해당 실제수량","view":"materials","group":"원가","lesson":{"section":"원가관리 · 표준","principle":"실제 단가와 표준 단가의 차이에 해당 실제 수량을 곱합니다. 양수 불리, 음수 유리로 표기하는 비용 차이 규약을 먼저 정합니다.","example":"실제 220kg, 실제단가 110원, 표준단가 100원이면 2,200원 불리입니다.","check":"구매 시 분석이면 구매수량, 사용 시 분석이면 사용수량을 적용합니다. 수량차이와 기준수량을 섞지 않습니다.","ref":"cost"}},{"title":"표준 재료수량 차이","aliases":["재료수량차이","재료능률차이","AQ SQ"],"body":"실제 사용량에서 실제 산출량에 허용된 표준 사용량을 뺀 뒤 표준 단가를 곱합니다.","formula":"수량차이 = (실제사용량 − 허용표준량) × 표준단가","view":"materials","group":"원가","lesson":{"section":"원가관리 · 표준","principle":"실제 사용량에서 실제 산출량에 허용된 표준 사용량을 뺀 뒤 표준 단가를 곱합니다.","example":"표준 허용 200kg, 실제 사용 220kg, 표준단가 100원이면 2,000원 불리입니다.","check":"표준량은 실제 생산량을 기준으로 계산합니다. 단가 변화는 가격차이에 반영하고 수량차이에 중복하지 않습니다.","ref":"cost"}},{"title":"노무 임률 차이","aliases":["임률차이","노무임률차이","노무가격차이"],"body":"실제 임률과 표준 임률 차이에 실제 작업시간을 곱합니다.","formula":"임률차이 = (실제임률 − 표준임률) × 실제시간","view":"labor","group":"원가","lesson":{"section":"원가관리 · 표준","principle":"실제 임률과 표준 임률 차이에 실제 작업시간을 곱합니다.","example":"실제 임률 12,000원, 표준 10,000원, 실제 90시간이면 180,000원 불리입니다.","check":"숙련도·초과근무·배치 변화가 임률과 능률에 함께 영향을 줄 수 있어 각 차이만으로 담당자 책임을 단정하지 않습니다.","ref":"cost"}},{"title":"노무 능률 차이","aliases":["노무능률차이","노동효율차이","작업시간차이"],"body":"실제 시간과 실제 산출량에 허용된 표준 시간 차이에 표준 임률을 곱합니다.","formula":"능률차이 = (실제시간 − 허용표준시간) × 표준임률","view":"labor","group":"원가","lesson":{"section":"원가관리 · 표준","principle":"실제 시간과 실제 산출량에 허용된 표준 시간 차이에 표준 임률을 곱합니다.","example":"허용 표준 100시간, 실제 90시간, 표준 임률 10,000원이면 −100,000원, 즉 10만원 유리입니다.","check":"양수 불리 규약과 영업이익 영향의 부호가 반대입니다. 품질 저하·유휴시간 별도 구분도 확인합니다.","ref":"cost"}},{"title":"고정제조간접비 조업도 차이","aliases":["조업도차이","고정제조간접비조업도차이"],"body":"예산 고정제조간접비와 표준 배부액의 차이 등으로 생산능력 사용 영향을 분석합니다. 변동원가 절감이나 실제 현금 절감과 같은 개념은 아닙니다.","formula":"","view":"mfgFixed","group":"원가"},{"title":"예산차이와 능률차이","aliases":["소비차이","능률차이","예산차이"],"body":"비용 단가·소비 수준의 차이와 허용 활동량 대비 사용량의 차이를 구분합니다. 고정·변동 간접비와 배부 방식에 따라 차이 명칭·산식이 달라질 수 있습니다.","formula":"","view":"scenario","group":"원가"},{"title":"변동예산","aliases":["flexible budget","탄력예산","변동예산"],"body":"실제 활동량에 맞춰 예산을 다시 계산한 비교 기준입니다. 최초 계획량 기준 정태예산과 비교하면 물량 효과와 원가 통제 효과를 구분하는 데 도움이 됩니다.","formula":"","view":"scenario","group":"원가"},{"title":"책임회계","aliases":["책임중심점","책임회계"],"body":"관리자가 통제할 수 있는 권한과 책임 범위에 맞춰 성과를 평가하는 체계입니다. 통제 불가능한 공통비 배부와 실제 운영 성과를 분리해 볼 필요가 있습니다.","formula":"","view":"items","group":"원가"},{"title":"이익중심점과 투자중심점","aliases":["원가중심점","이익중심점","투자중심점"],"body":"원가중심점은 비용, 이익중심점은 수익과 비용, 투자중심점은 투입 자산까지 함께 평가합니다. 권한 범위가 다른 조직을 같은 지표로 단순 비교하면 왜곡될 수 있습니다.","formula":"","view":"help","group":"원가"},{"title":"내부이전가격","aliases":["대체가격","이전가격","내부거래가격","이전가격 범위","최저대체가격"],"body":"판매부문 최소 이전가격은 추가 증분원가와 포기 외부판매 공헌이익을 고려하고 구매부문은 외부구매 대안 등을 봅니다.","formula":"최저이전가격 = 단위 증분원가 + 단위 기회비용","view":"help","group":"원가","lesson":{"section":"원가관리 · 의사결정","principle":"판매부문 최소 이전가격은 추가 증분원가와 포기 외부판매 공헌이익을 고려하고 구매부문은 외부구매 대안 등을 봅니다.","example":"유휴능력이 충분하면 기회비용이 0일 수 있지만 전량 외부판매 가능한 병목이면 포기 공헌이익이 생깁니다.","check":"그룹 전체 이익과 부문 성과가 충돌할 수 있습니다. 국제조세 이전가격 정상가격 판단과는 구분합니다.","ref":"managerial"}},{"title":"연산품과 분리점","aliases":["결합원가","연산품","분리점"],"body":"같은 공정에서 여러 제품이 함께 생산될 때 분리 전 원가를 결합원가라 합니다. 추가 가공 의사결정은 이미 발생한 결합원가보다 분리점 이후 추가 수익과 추가 원가를 비교합니다.","formula":"","view":"help","group":"원가"},{"title":"품질원가","aliases":["예방원가","평가원가","내부실패원가","외부실패원가","품질원가"],"body":"품질 확보를 위한 예방·평가 비용과 불량 때문에 생긴 내부·외부 실패 비용으로 나눠 볼 수 있습니다. 단기 검사비 절감이 전체 품질원가 감소를 뜻하지는 않습니다.","formula":"","view":"help","group":"원가"},{"title":"수명주기원가","aliases":["lifecycle cost","수명주기원가"],"body":"연구·설계·생산·판매·사후관리 등 제품 전 기간의 원가를 봅니다. 생산기간 제조원가만 비교하면 개발·품질·폐기 관련 부담을 놓칠 수 있습니다.","formula":"","view":"help","group":"원가"},{"title":"목표원가","aliases":["target costing","목표원가"],"body":"시장 수용 가격에서 목표이익을 차감해 달성해야 할 원가를 정하는 접근입니다. 원가에 이익률을 더하는 원가가산 가격결정과 순서가 다릅니다.","formula":"목표원가 = 목표판매가격 − 목표이익","view":"help","group":"원가"},{"title":"카이젠 원가","aliases":["지속적원가절감","카이젠원가"],"body":"기존 제품 생산 과정에서 작은 개선을 누적해 원가를 낮추는 접근입니다. 품질·안전·공급 안정성을 함께 유지해야 절감이 지속됩니다.","formula":"","view":"help","group":"원가"},{"title":"예산과 예측","aliases":["budget","forecast","예산과예측"],"body":"예산은 승인한 자원 배분·목표 기준이고 예측은 최신 정보에 따른 예상입니다. 예측 변경이 자동으로 승인 예산을 바꾸는 것은 아닙니다.","formula":"","view":"scenario","group":"사용법"},{"title":"롤링 예측","aliases":["rolling forecast","롤링예측"],"body":"매 기간 예측 구간을 연장하고 최신 정보를 반영하는 방식입니다. 비교를 위해 기준 버전·작성일·실적 확정 월을 함께 보관하면 좋습니다.","formula":"","view":"scenario","group":"사용법"},{"title":"가격과 물량 차이","aliases":["가격효과","물량효과","가격물량차이"],"body":"매출 차이를 단가와 판매량 변화로 나눌 때 교차 효과를 어디에 배정하는지 정해야 합니다. 순차 분석과 중간값 방식은 요인별 금액이 달라도 합계 차이는 일치해야 합니다.","formula":"","view":"scenario","group":"원가"},{"title":"차변과 대변","aliases":["debit","credit","차변","대변"],"body":"분개에서 사용하는 좌우 위치입니다. 자산·비용 증가는 보통 차변, 부채·자본·수익 증가는 보통 대변으로 기록하며 감소는 반대입니다. 현금 유입·유출과 항상 같은 구분은 아닙니다.","formula":"","view":"help","group":"회계"},{"title":"분개","aliases":["journal entry","분개"],"body":"거래를 계정과목의 차변·대변 금액으로 기록하는 것입니다. 일반 개념과 달리 실제 분개에는 거래 시점·계약·세금·적용 회계기준이 필요합니다. FPA는 총계정원장 시스템이 아닙니다.","formula":"","view":"help","group":"회계"},{"title":"미지급비용과 미지급금","aliases":["미지급비용","미지급금"],"body":"이미 발생했지만 지급하지 않은 부채를 나타내며 계정 구분은 거래 성격과 회계정책에 따릅니다. 급여·이자 등 기간 비용의 미지급과 자산 취득 등의 미지급을 구분해 관리할 수 있습니다.","formula":"","view":"help","group":"회계"},{"title":"선급비용과 선급금","aliases":["선급비용","선급금"],"body":"먼저 지급했지만 아직 비용 기간이 도래하지 않았거나 재화·서비스를 받지 않은 금액입니다. 현금 지급 시점과 비용 인식 시점을 구분해야 합니다.","formula":"","view":"help","group":"회계"},{"title":"미수수익과 미수금","aliases":["미수수익","미수금"],"body":"수익이 발생했지만 아직 받지 못한 금액이나 영업 외 거래 등에서 받을 금액을 관리하는 계정입니다. 구체 분류는 거래 성격과 회사 회계정책에 따릅니다.","formula":"","view":"help","group":"회계"},{"title":"선수금과 계약부채","aliases":["선수금","계약부채"],"body":"고객에게서 대가를 먼저 받았거나 받을 권리가 생겼지만 아직 이행하지 않은 부분은 계약부채가 될 수 있습니다. 대금 수령만으로 매출 인식 요건을 충족하는 것은 아닙니다.","formula":"","view":"help","group":"회계"},{"title":"계약자산과 매출채권","aliases":["계약자산","계약자산과매출채권","조건부청구권","무조건적권리"],"body":"이행으로 대가 권리를 얻었으나 시간 경과 외 조건이 남으면 계약자산을, 시간 경과만 필요한 무조건적 권리는 매출채권을 검토합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 수익","principle":"이행으로 대가 권리를 얻었으나 시간 경과 외 조건이 남으면 계약자산을, 시간 경과만 필요한 무조건적 권리는 매출채권을 검토합니다.","example":"추가 검수·후속 이행이 대가 청구 조건이면 단순 미청구 매출채권으로 분류할지 확인해야 합니다.","check":"계약자산도 손상 검토 대상입니다. 선수금·계약부채와 부적절하게 상계하지 않습니다.","ref":"revenue"}},{"title":"수익 인식 5단계","aliases":["ifrs15","수익인식","수익인식5단계","IFRS15","수행의무","고객과의계약"],"body":"계약 식별 → 수행의무 식별 → 거래가격 산정 → 수행의무에 배분 → 통제 이전에 따라 수익 인식의 순서로 검토합니다.","formula":"","view":"sales","group":"회계","lesson":{"section":"재무회계 · 수익","principle":"계약 식별 → 수행의무 식별 → 거래가격 산정 → 수행의무에 배분 → 통제 이전에 따라 수익 인식의 순서로 검토합니다.","example":"제품 100과 별도 용역 20을 묶어 108에 계약했다면 독립 판매가격 비례 배분 등 적정 배분 방법을 먼저 검토합니다.","check":"세금계산서 발행·입금·출고 중 하나가 모든 거래의 수익 시점을 결정하지는 않습니다.","ref":"revenue"}},{"title":"기간에 걸친 수익 인식","aliases":["진행기준","기간에걸친수익","공사진행률","건설계약"],"body":"고객이 수행과 동시에 효익을 소비하거나 고객 통제 자산을 만들거나 대체용도가 없고 수행분 지급청구권이 있는 등 요건을 검토합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 수익","principle":"고객이 수행과 동시에 효익을 소비하거나 고객 통제 자산을 만들거나 대체용도가 없고 수행분 지급청구권이 있는 등 요건을 검토합니다.","example":"적격 원가기준 진행률 40%, 거래가격 1억원이면 누적 수익 4천만원을 검토하되 이행 정도를 나타내지 않는 원가는 조정합니다.","check":"건설계약이라는 명칭만으로 진행기준을 선택하지 않습니다. 미설치 자재·비효율·손실계약을 별도로 봅니다.","ref":"revenue"}},{"title":"본인과 대리인","aliases":["총액순액","본인대리인","대리인","총액매출","순액매출","principal agent"],"body":"고객에게 이전 전 특정 재화·용역을 통제하는 본인은 총액, 다른 당사자의 제공을 주선하는 대리인은 통상 수수료 순액 수익을 검토합니다.","formula":"","view":"sales","group":"회계","lesson":{"section":"재무회계 · 수익","principle":"고객에게 이전 전 특정 재화·용역을 통제하는 본인은 총액, 다른 당사자의 제공을 주선하는 대리인은 통상 수수료 순액 수익을 검토합니다.","example":"물류만 외주 줬다는 이유로 대리인이 되지 않으며, 재고위험 하나만으로 모든 플랫폼 매출을 총액 확정하지 않습니다.","check":"이행 책임·재고위험·가격 재량 등은 통제 판단의 지표입니다. 계약과 제공 대상을 먼저 식별합니다.","ref":"revenue"}},{"title":"반품과 환불","aliases":["반품권","환불부채","반품"],"body":"고객 반품권이 있는 판매는 예상 반품과 관련 회수 자산·환불부채 등을 검토합니다. FPA에는 반품충당이나 환불 스케줄 자동 계산 기능이 없습니다.","formula":"","view":"help","group":"회계"},{"title":"재고자산 저가법","aliases":["저가법","순실현가능가치","nrv","NRV","재고평가손실"],"body":"원가와 순실현가능가치 중 낮은 금액으로 측정합니다. NRV는 예상 판매가격에서 완성·판매에 필요한 원가를 차감한 기업 특정 금액입니다.","formula":"NRV = 예상 판매가 − 완성원가 − 판매원가","view":"inventory","group":"회계","lesson":{"section":"재무회계 · 재고","principle":"원가와 순실현가능가치 중 낮은 금액으로 측정합니다. NRV는 예상 판매가격에서 완성·판매에 필요한 원가를 차감한 기업 특정 금액입니다.","example":"원가 100, 예상판매가 95, 완성·판매원가 10이면 NRV 85, 평가손실 15입니다.","check":"통상 품목별 평가를 검토하며 원재료와 연관 제품의 회수가능성도 함께 봅니다. 시가·공정가치를 그대로 NRV로 대체하지 않습니다.","ref":"inventory"}},{"title":"재고 평가손실 환입","aliases":["재고평가손실","재고평가환입"],"body":"손상·노후화 등으로 회수 가능액이 낮아지면 재고 감액을 검토하고, 이후 회복 시 관련 기준과 최초 감액 한도 내 환입을 검토합니다. 시장가격 상승액을 임의로 재고이익에 반영하는 것은 아닙니다.","formula":"","view":"inventory","group":"회계"},{"title":"유형자산 취득원가","aliases":["자산취득원가","유형자산취득원가","설비 취득원가","자산화","복구충당부채"],"body":"취득대가와 사용 가능한 장소·상태에 이르게 한 직접 원가, 요건을 충족한 해체·복구 의무의 최초 추정액 등을 검토합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 자산","principle":"취득대가와 사용 가능한 장소·상태에 이르게 한 직접 원가, 요건을 충족한 해체·복구 의무의 최초 추정액 등을 검토합니다.","example":"설치·시험가동에 필요한 직접 지출은 검토 대상이나 일반 교육·개업손실은 통상 자산원가가 아닙니다.","check":"설비를 샀다는 사실만으로 관련 지출 전부를 자산화하지 않습니다. 사용 가능 시점과 이후 지출을 구분합니다.","ref":"asset"}},{"title":"내용연수와 잔존가치","aliases":["내용연수","잔존가치"],"body":"내용연수는 기업이 자산을 사용할 것으로 예상하는 기간 등이고, 잔존가치는 사용 종료 시 처분으로 회수할 것으로 예상하는 금액에서 처분비를 차감한 추정입니다. 추정 변경과 오류 수정을 구분합니다.","formula":"","view":"help","group":"회계"},{"title":"정액법과 정률법","aliases":["정액법","정률법","정액상각","정률상각","감가상각 방법"],"body":"소비 형태를 반영하는 상각 방법을 적용합니다. 정액법은 상각대상금액을 내용연수에 균등 배분하며 정률법은 장부금액에 일정률을 적용합니다.","formula":"정액 연간 감가 = (취득원가 − 잔존가치) ÷ 내용연수","view":"help","group":"회계","lesson":{"section":"재무회계 · 자산","principle":"소비 형태를 반영하는 상각 방법을 적용합니다. 정액법은 상각대상금액을 내용연수에 균등 배분하며 정률법은 장부금액에 일정률을 적용합니다.","example":"취득 1천만원, 잔존 100만원, 내용연수 5년이면 정액 연간 감가 180만원입니다.","check":"가동 가능 상태에서 시작하며 월할·연중 취득·잔존가치 변경·손상 영향은 별도 반영합니다.","ref":"asset"}},{"title":"감가상각 시작 시점","aliases":["사용가능시점","감가상각시작"],"body":"자산이 경영진이 의도한 방식으로 사용 가능한 위치·상태가 되면 감가상각 시작을 검토합니다. 실제 가동이나 매출 발생이 시작될 때까지 항상 미룰 수 있는 것은 아닙니다.","formula":"","view":"help","group":"회계"},{"title":"자산 손상","aliases":["손상차손","회수가능액","자산손상","사용가치"],"body":"장부금액이 회수가능액을 초과하면 손상차손을 검토합니다. 회수가능액은 처분부대원가 차감 공정가치와 사용가치 중 큰 금액입니다.","formula":"손상차손 = max(0, 장부금액 − 회수가능액)","view":"help","group":"회계","lesson":{"section":"재무회계 · 자산","principle":"장부금액이 회수가능액을 초과하면 손상차손을 검토합니다. 회수가능액은 처분부대원가 차감 공정가치와 사용가치 중 큰 금액입니다.","example":"장부 100, 처분부대원가 차감 공정가치 70, 사용가치 80이면 회수가능액 80, 손상 20입니다.","check":"현금창출단위, 할인율, 현금흐름 추정과 환입 한도를 확인합니다. 영업권 손상은 환입하지 않습니다.","ref":"impairment"}},{"title":"현금창출단위","aliases":["cgu","현금창출단위"],"body":"다른 자산·집단과 대체로 독립적인 현금유입을 창출하는 식별 가능한 최소 자산집단입니다. 개별 자산의 회수가능액을 산정하기 어려울 때 손상 검토 단위로 사용합니다.","formula":"","view":"help","group":"회계"},{"title":"충당부채와 우발부채","aliases":["충당부채","우발부채","우발자산"],"body":"현재 의무, 자원 유출 가능성, 신뢰성 있는 추정을 검토해 충당부채를 인식합니다. 인식 요건 미충족 잠재 의무 등은 우발부채 공시를 검토합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 부채","principle":"현재 의무, 자원 유출 가능성, 신뢰성 있는 추정을 검토해 충당부채를 인식합니다. 인식 요건 미충족 잠재 의무 등은 우발부채 공시를 검토합니다.","example":"과거 판매 제품의 보증수리 추정은 현재 의무가 될 수 있지만 막연한 다음 해 영업적자 예상은 일반 충당부채가 아닙니다.","check":"발생 가능성·측정·할인·제3자 보상은 각각 검토합니다. 이익을 평준화하려는 임의 충당금을 쌓지 않습니다.","ref":"provisions"}},{"title":"보증 충당부채","aliases":["제품보증","보증충당부채"],"body":"판매 제품의 보증 의무와 예상 지출 등을 반영합니다. 별도 서비스를 제공하는 보증인지 품질 보증인지에 따라 수익 회계와 충당부채 회계가 달라질 수 있습니다.","formula":"","view":"help","group":"회계"},{"title":"손실부담계약","aliases":["onerous contract","손실부담계약","이행원가","계약해지위약금","손실계약"],"body":"계약의 회피 불가능한 의무 이행원가가 예상 효익을 초과하면 손실부담 여부를 검토합니다. 이행과 불이행 비용 중 낮은 회피 불가능 원가를 봅니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 부채","principle":"계약의 회피 불가능한 의무 이행원가가 예상 효익을 초과하면 손실부담 여부를 검토합니다. 이행과 불이행 비용 중 낮은 회피 불가능 원가를 봅니다.","example":"계약 이행 순손실 30, 해지 위약금 20이면 다른 조건이 같을 때 회피 불가능 순원가 20을 검토합니다.","check":"계약 이행에 쓰는 자산의 손상 인식이 먼저 필요한지 확인하고 미래 사업손실 일반과 구분합니다.","ref":"provisions"}},{"title":"리스 회계","aliases":["ifrs16","사용권자산","리스부채","리스이용자"],"body":"리스이용자는 일반적으로 사용권자산과 리스부채를 인식하고 후속 감가·이자·부채 감소를 반영합니다. 단기·소액 예외 선택은 요건을 봅니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 특수","principle":"리스이용자는 일반적으로 사용권자산과 리스부채를 인식하고 후속 감가·이자·부채 감소를 반영합니다. 단기·소액 예외 선택은 요건을 봅니다.","example":"연말 리스료의 현재가치로 부채를 구하고 선급·직접원가·복구의무 등은 사용권자산에 별도 영향을 줄 수 있습니다.","check":"매월 납입액을 모두 임차료로 처리하는 것과 다릅니다. 식별 자산·사용 통제와 변동 대가·옵션·할인율을 확인합니다.","ref":"leases"}},{"title":"리스와 EBITDA","aliases":["리스에비따","리스와ebitda"],"body":"리스료가 감가와 이자로 나뉘면 영업비용·EBITDA의 표시가 달라질 수 있습니다. 현금 지급이 같은데 지표만 달라질 수 있으므로 회계정책과 조정 정의를 비교해야 합니다.","formula":"","view":"pnl","group":"회계"},{"title":"법인세비용과 납부세액","aliases":["법인세비용","당기법인세","이연법인세","유효세율"],"body":"법인세비용은 당기법인세와 이연법인세의 손익 반영액을 포함하며 실제 납부 현금과 다를 수 있습니다.","formula":"유효세율 = 법인세비용 ÷ 세전이익","view":"help","group":"회계","lesson":{"section":"재무회계 · 비용","principle":"법인세비용은 당기법인세와 이연법인세의 손익 반영액을 포함하며 실제 납부 현금과 다를 수 있습니다.","example":"세전이익 100, 당기세금 25, 이연세금 수익 3이면 다른 항목이 없을 때 세금비용 22입니다.","check":"OCI·자본 직접 인식 거래의 세금은 관련 항목과 연결해 표시합니다. FPA는 세후 손익을 자동 계산하지 않습니다.","ref":"tax"}},{"title":"일시적 차이와 영구적 차이","aliases":["일시적차이","영구적차이"],"body":"일시적 차이는 자산·부채의 장부금액과 세무기준액의 차이로 이후 세금에 영향을 줄 수 있는 항목입니다. 영구적 차이는 추후 반전되지 않는 손익·과세소득 차이 등을 말합니다. 구체 세무 판단은 관할 법령을 확인해야 합니다.","formula":"","view":"help","group":"회계"},{"title":"이연법인세자산","aliases":["이연법인세자산"],"body":"차감할 일시적 차이·미사용 결손금 등이 있어도 인식 요건을 검토해야 합니다. 미래 과세소득 가능성 등 회수 가능성 평가가 필요하며 결손이 있다는 이유만으로 전액 자산화하지 않습니다.","formula":"","view":"help","group":"회계"},{"title":"외화 화폐성 항목","aliases":["화폐성항목","외화채권","외화채무","화폐성","기말환산"],"body":"확정·결정 가능한 통화 수량을 수취·지급하는 화폐성 외화 항목은 보고일 마감환율로 환산하는 것이 원칙입니다.","formula":"외화채무 환산손실 = 외화금액 × (기말환율 − 기존환율)","view":"help","group":"회계","lesson":{"section":"재무회계 · 특수","principle":"확정·결정 가능한 통화 수량을 수취·지급하는 화폐성 외화 항목은 보고일 마감환율로 환산하는 것이 원칙입니다.","example":"외화 매입채무 USD 1,000, 최초 1,300원, 기말 1,400원이면 단순 예시 환산손실 10만원입니다.","check":"선급금 등 비화폐성 항목과 구분합니다. 해외사업장·순투자·위험회피 등 표시 예외를 별도 확인합니다.","ref":"fx"}},{"title":"외화 비화폐성 항목","aliases":["비화폐성항목","외화재고"],"body":"역사적 원가로 측정하는 외화 비화폐성 항목은 일반적으로 거래일 환율을 사용합니다. 공정가치 측정 등에서는 적용 시점이 달라질 수 있으므로 측정 기준을 먼저 확인해야 합니다.","formula":"","view":"help","group":"회계"},{"title":"기능통화와 표시통화","aliases":["기능통화","표시통화"],"body":"기능통화는 주된 경제환경의 통화이고 표시통화는 재무제표를 표시하는 통화입니다. 해외 거래가 많다고 기능통화가 자동으로 달러가 되는 것은 아닙니다.","formula":"","view":"help","group":"회계"},{"title":"현금주의와 발생주의","aliases":["현금주의","현금주의와발생주의"],"body":"현금주의는 현금 수수, 발생주의는 수익·비용 발생 및 관련 인식 요건을 중심으로 봅니다. 미수·미지급·선급·선수·감가상각 때문에 같은 기간의 이익과 현금 변화가 다를 수 있습니다.","formula":"","view":"help","group":"회계"},{"title":"현금흐름 간접법","aliases":["간접법","영업현금흐름","운전자본증감"],"body":"출발 이익에 비현금 항목과 투자·재무손익을 조정하고 영업 운전자본 증감을 반영해 영업현금흐름을 계산합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 특수","principle":"출발 이익에 비현금 항목과 투자·재무손익을 조정하고 영업 운전자본 증감을 반영해 영업현금흐름을 계산합니다.","example":"이익 100 + 감가 20 − 매출채권 증가 30 + 매입채무 증가 10이면 다른 조정이 없을 때 100입니다.","check":"감가 가산은 현금 유입이 아닙니다. 처분손익 제거 후 처분대금은 투자활동에 표시하는 등 중복을 피합니다.","ref":"cash"}},{"title":"잉여현금흐름","aliases":["fcf","잉여현금흐름"],"body":"분석 목적에 따라 정의가 다르지만 영업에서 만든 현금에서 유지·성장 투자 등을 차감해 보는 지표입니다. 기업가치 평가에서는 FCFF와 주주 관점 FCFE를 구분합니다.","formula":"","view":"help","group":"회계"},{"title":"연결과 별도","aliases":["연결재무제표","별도재무제표"],"body":"연결은 지배하는 기업집단을 하나의 경제 실체처럼 표시하고 내부 거래 등을 제거합니다. 별도는 해당 법적 실체 중심의 재무제표입니다. 단순 매출 합계가 연결 매출이 되지는 않습니다.","formula":"","view":"help","group":"회계"},{"title":"중요성과 오류","aliases":["중요성","중요한오류"],"body":"정보 누락·왜곡 등이 재무제표 이용자의 의사결정에 영향을 줄 수 있는지를 봅니다. 금액뿐 아니라 성격·상황도 고려하며 작다는 이유만으로 모든 오류를 무시하지 않습니다.","formula":"","view":"help","group":"회계"},{"title":"회계정책과 추정","aliases":["회계정책변경","회계추정변경","소급법","전진법"],"body":"회계정책 변경은 원칙적으로 소급 적용하며 기준별 경과규정·실무 불가능 예외를 봅니다. 새 정보로 인한 추정 변경은 당기와 관련 미래 기간에 전진 반영합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 기본","principle":"회계정책 변경은 원칙적으로 소급 적용하며 기준별 경과규정·실무 불가능 예외를 봅니다. 새 정보로 인한 추정 변경은 당기와 관련 미래 기간에 전진 반영합니다.","example":"기계 잔여 내용연수를 4년에서 2년으로 재추정하면 남은 장부금액의 상각을 앞으로 조정합니다.","check":"잘못된 계산이나 당시 이용 가능한 정보를 오용한 것은 추정 변경이 아니라 오류일 수 있습니다.","ref":"policies"}},{"title":"보고기간후사건","aliases":["후발사건","보고기간후사건","수정후사건","비수정후사건","결산일 이후"],"body":"보고일에 이미 존재한 상황의 증거면 수정후사건, 보고일 이후 새로 발생한 상황이면 비수정후사건을 검토합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 기본","principle":"보고일에 이미 존재한 상황의 증거면 수정후사건, 보고일 이후 새로 발생한 상황이면 비수정후사건을 검토합니다.","example":"결산일 후 고객 파산이 보고일 현재 신용손상을 입증하면 채권 평가에 반영할 수 있습니다. 결산일 후 새 화재는 통상 비수정 사건입니다.","check":"중요한 비수정 사건은 주석 공시를 검토합니다. 계속기업 가정에 대한 영향은 별도로 판단합니다.","ref":"events"}},{"title":"공정가치와 장부금액","aliases":["공정가치","장부금액"],"body":"장부금액은 회계상 인식된 금액이고 공정가치는 측정일 시장참여자 사이 정상 거래의 매각·이전 가격 관점입니다. 둘이 다르다고 항상 손익에 즉시 반영하는 것은 아니며 측정 기준을 따라야 합니다.","formula":"","view":"help","group":"회계"},{"title":"대손과 기대신용손실","aliases":["대손","대손충당금","기대신용손실","ecl"],"body":"채권 등 금융자산의 회수 위험을 평가하는 회계 개념입니다. 연체율만 기계적으로 적용하기보다 적용 모델·과거 경험·현재 상황·미래 전망 등을 검토합니다.","formula":"","view":"help","group":"회계"},{"title":"재무회계와 세무회계","aliases":["세무회계","재무회계와세무회계"],"body":"재무보고 목적의 회계 기준과 세법상 과세소득·신고 기준은 다를 수 있습니다. 판관비 계정으로 회계 처리했다고 전액 세무상 공제되는 것은 아닙니다.","formula":"","view":"help","group":"회계"},{"title":"IFRS 18과 관리손익","aliases":["ifrs18","ifrs 18","관리손익과공시","IFRS18","경영진정의성과측정치","MPM"],"body":"IFRS 18은 손익 표시와 공시 개선을 위한 기준이며 IFRS상 2027년 시작 회계연도부터 적용, 조기 적용이 허용됩니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 기본","principle":"IFRS 18은 손익 표시와 공시 개선을 위한 기준이며 IFRS상 2027년 시작 회계연도부터 적용, 조기 적용이 허용됩니다.","example":"FPA의 영업이익·EBITDA는 내부 시뮬레이션 지표입니다. 회사 공시 영업이익·MPM과의 조정표는 별도로 검토합니다.","check":"국내 채택·적용 일정과 기업 회계정책을 확인해야 합니다. 앱의 손익표를 그대로 기준서 준수 재무제표라고 보지 않습니다.","ref":"ifrs18"}},{"title":"재무보고의 목적","aliases":["일반목적재무보고","재무회계 목적"],"body":"투자자·대여자·그 밖의 채권자가 자원 제공을 판단할 정보를 제공합니다. 재무제표는 기업의 모든 가치나 미래 현금을 직접 산출하는 평가표는 아닙니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 기본","principle":"투자자·대여자·그 밖의 채권자가 자원 제공을 판단할 정보를 제공합니다. 재무제표는 기업의 모든 가치나 미래 현금을 직접 산출하는 평가표는 아닙니다.","example":"매출이 늘어도 회수 지연으로 현금이 부족할 수 있어 손익·재무상태·현금흐름을 함께 읽습니다.","check":"외부 보고는 적용 회계기준과 공시가, 내부 관리는 의사결정 목적에 맞춘 지표가 중요합니다. 동일 거래라도 분석 목적과 표시 단위를 구분하세요.","ref":"concept"}},{"title":"회계정보의 질적특성","aliases":["목적적합성","충실한표현","비교가능성","검증가능성"],"body":"목적적합성과 충실한 표현이 근본 특성입니다. 비교가능성·검증가능성·적시성·이해가능성은 유용성을 높입니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 기본","principle":"목적적합성과 충실한 표현이 근본 특성입니다. 비교가능성·검증가능성·적시성·이해가능성은 유용성을 높입니다.","example":"수율을 높여 이익을 보고하면서 불량 재고를 제외하지 않으면 수치가 빨라도 충실한 표현에 문제가 생깁니다.","check":"중요성은 금액과 성격을 함께 보며 회사마다 일률적인 비율 하나로 결정하지 않습니다.","ref":"concept"}},{"title":"자산과 부채의 정의","aliases":["경제적자원","현재의무","회계요소"],"body":"자산은 과거 사건으로 기업이 통제하는 현재의 경제적 자원입니다. 부채는 과거 사건으로 경제적 자원을 이전해야 하는 현재의 의무입니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 기본","principle":"자산은 과거 사건으로 기업이 통제하는 현재의 경제적 자원입니다. 부채는 과거 사건으로 경제적 자원을 이전해야 하는 현재의 의무입니다.","example":"대금 지급 전이라도 재고를 통제하고 지급의무가 생기면 재고와 매입채무를 인식할 수 있습니다.","check":"현금 지출=비용, 현금 수입=수익으로 바로 연결하지 말고 자산·부채의 변화를 먼저 확인합니다.","ref":"concept"}},{"title":"결산 수정분개","aliases":["수정분개","결산분개","미결산"],"body":"발생주의에 따라 미수·미지급, 선급·선수, 감가·평가를 기간에 귀속시키는 분개입니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 기본","principle":"발생주의에 따라 미수·미지급, 선급·선수, 감가·평가를 기간에 귀속시키는 분개입니다.","example":"12월 사용 전기료 100만원을 1월 지급: 12월 차변 전력비 100 / 대변 미지급비용 100. 지급 때는 미지급비용을 제거합니다.","check":"금액 단위는 예시상 만원입니다. 지급 시 비용을 또 인식하면 중복됩니다. 제조 전력은 재고 원가 흐름도 확인합니다.","ref":"concept"}},{"title":"시산표와 재무제표 연결","aliases":["시산표","총계정원장","결산흐름"],"body":"거래 분개를 계정별 원장에 집계하고 결산 수정 후 시산표에서 재무제표를 작성합니다. 차대 일치는 계산 형식의 점검이며 거래의 적정성 보장은 아닙니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 기본","principle":"거래 분개를 계정별 원장에 집계하고 결산 수정 후 시산표에서 재무제표를 작성합니다. 차대 일치는 계산 형식의 점검이며 거래의 적정성 보장은 아닙니다.","example":"매출채권과 매출을 같은 금액으로 누락하면 시산표는 맞지만 매출과 자산이 모두 과소입니다.","check":"누락·기간 귀속·계정 오분류는 증빙과 보조부 대사로 별도 확인합니다.","ref":"concept"}},{"title":"유동과 비유동 분류","aliases":["유동자산","유동부채","비유동","차입금 유동성"],"body":"정상영업주기, 12개월 이내 실현·결제, 현금 사용 제한, 부채 결제 연기 권리 등을 검토해 분류합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 기본","principle":"정상영업주기, 12개월 이내 실현·결제, 현금 사용 제한, 부채 결제 연기 권리 등을 검토해 분류합니다.","example":"장기차입금 중 다음 해 상환 부분은 통상 유동성 장기부채로 표시합니다.","check":"약정 위반·면제·차환은 보고일 현재 권리와 조건을 봅니다. 만기만으로 모든 사례를 단정하지 않습니다.","ref":"presentation"}},{"title":"기타포괄손익과 당기손익","aliases":["OCI","기타포괄손익","포괄이익"],"body":"당기손익에 포함하지 않고 기타포괄손익으로 표시하도록 정한 항목이 있습니다. 이후 당기손익으로 재분류하는 항목과 재분류하지 않는 항목을 나눕니다.","formula":"총포괄이익 = 당기순이익 + 세후 기타포괄손익","view":"help","group":"회계","lesson":{"section":"재무회계 · 기본","principle":"당기손익에 포함하지 않고 기타포괄손익으로 표시하도록 정한 항목이 있습니다. 이후 당기손익으로 재분류하는 항목과 재분류하지 않는 항목을 나눕니다.","example":"유형자산 재평가잉여금과 확정급여 재측정요소는 일반적으로 당기손익으로 재분류하지 않습니다.","check":"같은 공정가치 변동도 자산 종류·분류·선택에 따라 표시가 다르므로 전부 OCI로 처리하지 않습니다.","ref":"presentation"}},{"title":"특수관계자 공시","aliases":["특수관계자","관계회사거래","주요경영진"],"body":"지배·공동지배·유의적인 영향력·주요 경영진 등 기준에 해당하는 관계와 거래·잔액 등을 공시합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 기본","principle":"지배·공동지배·유의적인 영향력·주요 경영진 등 기준에 해당하는 관계와 거래·잔액 등을 공시합니다.","example":"대표이사가 지배하는 회사와 거래하면 시가 거래라는 설명만으로 공시 검토가 끝나지 않습니다.","check":"모든 대기업 계열 거래를 같은 방식으로 판단하지 말고 관계와 재무제표 보고 범위를 확인하세요.","ref":"related"}},{"title":"중간재무보고","aliases":["분기보고","반기보고","중간결산"],"body":"연차 보고와 일관된 회계정책을 적용하고 연초부터 누적 기준으로 측정합니다. 중간 기간의 중요성도 고려합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 기본","principle":"연차 보고와 일관된 회계정책을 적용하고 연초부터 누적 기준으로 측정합니다. 중간 기간의 중요성도 고려합니다.","example":"연간 유효세율 추정을 이용하는 중간 법인세 측정처럼 연간 추정과 연결되는 항목이 있습니다.","check":"계절 매출을 매 분기 균등 배분하거나 연말에만 발생하는 비용을 임의로 평준화하지 않습니다.","ref":"interim"}},{"title":"전기오류 수정","aliases":["전기오류","소급재작성","오류수정"],"body":"중요한 전기오류는 원칙적으로 비교 재무제표와 필요한 최초 자본을 소급 재작성합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 기본","principle":"중요한 전기오류는 원칙적으로 비교 재무제표와 필요한 최초 자본을 소급 재작성합니다.","example":"전기에 감가 200만원을 누락했다면 당기 감가를 무조건 200만원 더 잡는 방식으로 처리하지 않습니다.","check":"오류의 중요성·귀속 기간·법인세 영향·소급 실무 가능성을 확인합니다. 추정이 나중에 바뀐 것과 구별하세요.","ref":"policies"}},{"title":"현금및현금성자산","aliases":["현금성자산","현금등가물","요구불예금"],"body":"확정 금액으로 쉽게 전환되고 가치변동 위험이 경미한 단기 고유동성 투자 중 단기 현금 수요 충족 목적을 검토합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 금융","principle":"확정 금액으로 쉽게 전환되고 가치변동 위험이 경미한 단기 고유동성 투자 중 단기 현금 수요 충족 목적을 검토합니다.","example":"통상 취득 시 만기 3개월 이내인지 등을 보며 보고일에 남은 만기만으로 분류하지 않습니다.","check":"주식은 보통 현금성자산이 아니며 사용 제한 현금·당좌차월 표시도 조건을 확인합니다.","ref":"cash"}},{"title":"금융자산 분류","aliases":["상각후원가","AC","FVOCI","FVTPL","SPPI"],"body":"채무상품은 계약 현금흐름의 원금·이자 요건과 사업모형을 함께 검토해 상각후원가, FVOCI, FVTPL로 분류합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 금융","principle":"채무상품은 계약 현금흐름의 원금·이자 요건과 사업모형을 함께 검토해 상각후원가, FVOCI, FVTPL로 분류합니다.","example":"원리금 수취 목적의 일반 채권이 요건을 충족하면 상각후원가를 검토합니다. 단순히 오래 보유한다는 사유만으로 결정하지 않습니다.","check":"지분상품 FVOCI 선택은 별도 요건이 있으며 채무상품 FVOCI와 재분류 처리도 다릅니다.","ref":"financial"}},{"title":"유효이자율법","aliases":["유효이자율","상각후원가 계산","할인발행차금"],"body":"기초 상각후원가에 유효이자율을 적용해 이자손익을 계산하고 현금이자와 차이를 장부금액에 반영합니다.","formula":"기말 장부금액 = 기초 장부금액 + 유효이자 − 현금이자","view":"help","group":"회계","lesson":{"section":"재무회계 · 금융","principle":"기초 상각후원가에 유효이자율을 적용해 이자손익을 계산하고 현금이자와 차이를 장부금액에 반영합니다.","example":"할인 발행 사채 기초 950만원, 유효이자율 6%, 지급이자 50만원이면 비용 57만원, 할인차금 상각 7만원으로 장부금액 957만원입니다.","check":"신용손상 금융자산, 수수료·거래원가·중도 변경은 별도 검토합니다.","ref":"financial"}},{"title":"기대신용손실 단계","aliases":["ECL","12개월 기대신용손실","전체기간 기대신용손실"],"body":"일반 모형은 신용위험 증가와 신용손상에 따라 손실충당금 측정·이자수익 기준을 구분합니다. 매출채권 등에는 전체기간 손실의 간편법이 적용될 수 있습니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 금융","principle":"일반 모형은 신용위험 증가와 신용손상에 따라 손실충당금 측정·이자수익 기준을 구분합니다. 매출채권 등에는 전체기간 손실의 간편법이 적용될 수 있습니다.","example":"과거 연체율을 쓰더라도 경기·거래처 전망을 반영해 손실률표를 조정합니다.","check":"채권이 확실히 부도날 때까지 기다리는 방식이 아닙니다. 12개월 ECL은 12개월치 현금부족액만이라는 뜻도 아닙니다.","ref":"financial"}},{"title":"지분상품 FVOCI","aliases":["주식FVOCI","지분상품 평가","기타포괄손익 주식"],"body":"단기매매 목적이 아닌 지분상품에 최초 인식 때 취소 불가능한 FVOCI 표시 선택을 검토할 수 있습니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 금융","principle":"단기매매 목적이 아닌 지분상품에 최초 인식 때 취소 불가능한 FVOCI 표시 선택을 검토할 수 있습니다.","example":"평가이익을 OCI로 쌓은 주식을 처분해도 그 누계액을 당기손익으로 재분류하지 않습니다.","check":"배당은 투자원가 회수 성격 등 예외를 제외하고 통상 당기손익입니다. 채무상품 FVOCI와 혼동하지 않습니다.","ref":"financial"}},{"title":"사채 발행과 상각","aliases":["할인발행","할증발행","사채발행가액","금융부채"],"body":"사채 현금흐름을 시장 유효이자율로 할인해 최초 금액을 구하고, 일반적인 상각후원가 부채는 유효이자율법으로 후속 측정합니다.","formula":"발행가액 = 이자 현금흐름의 현재가치 + 원금 현재가치","view":"help","group":"회계","lesson":{"section":"재무회계 · 금융","principle":"사채 현금흐름을 시장 유효이자율로 할인해 최초 금액을 구하고, 일반적인 상각후원가 부채는 유효이자율법으로 후속 측정합니다.","example":"액면이자율이 시장이자율보다 낮으면 보통 할인 발행됩니다. 할인발행이어도 만기 원금은 계약 액면입니다.","check":"발행원가·전환권·내재파생·보증 등 조건이 있으면 단순 사채와 구분합니다.","ref":"financial"}},{"title":"전환사채 부채와 자본","aliases":["전환사채","CB","복합금융상품","전환권"],"body":"발행자 관점에서 전환권이 지분 분류 요건을 충족하면 부채 요소와 자본 요소를 분리하는 복합금융상품을 검토합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 금융","principle":"발행자 관점에서 전환권이 지분 분류 요건을 충족하면 부채 요소와 자본 요소를 분리하는 복합금융상품을 검토합니다.","example":"먼저 동일 조건의 전환권 없는 부채 공정가치를 구하고 잔액을 자본으로 배분하는 구조가 대표적입니다.","check":"고정 수량 주식·변동 전환가·현금결제·풋옵션 등 조건에 따라 파생부채 등으로 달라집니다. CB라는 이름만으로 자본을 확정하지 않습니다.","ref":"equity"}},{"title":"자기주식과 자기주식 처분","aliases":["자기주식","자사주","자기주식처분손익"],"body":"자기지분상품 취득액은 자본에서 차감하며 매입·매도·소각 손익을 당기손익으로 인식하지 않습니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 자본","principle":"자기지분상품 취득액은 자본에서 차감하며 매입·매도·소각 손익을 당기손익으로 인식하지 않습니다.","example":"자기주식을 취득 100, 재매각 120 하면 차이 20은 자본 내 처리이며 영업이익 20이 아닙니다.","check":"발행주식수·유통주식수·EPS 분모와 관련 자본 변동을 따로 추적합니다.","ref":"equity"}},{"title":"유상증자와 무상증자","aliases":["증자","자본금","주식발행초과금","무상증자"],"body":"유상증자는 대가 유입에 따라 자본이 늘고, 무상증자는 보통 자본 내 항목 대체로 총자본이 직접 증가하지 않습니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 자본","principle":"유상증자는 대가 유입에 따라 자본이 늘고, 무상증자는 보통 자본 내 항목 대체로 총자본이 직접 증가하지 않습니다.","example":"액면 1천원 주식을 3천원에 발행하면 주당 자본금 1천원, 주식발행초과금 2천원입니다. 발행원가 영향은 별도입니다.","check":"주식배당·분할은 현금배당과 다르고 EPS 비교기간 조정 여부도 검토합니다.","ref":"equity"}},{"title":"배당 회계","aliases":["현금배당","배당금","배당부채","주식배당"],"body":"소유주에 대한 배당은 통상 이익잉여금 등 자본의 감소이며 영업비용이 아닙니다. 의무가 성립한 시점을 확인합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 자본","principle":"소유주에 대한 배당은 통상 이익잉여금 등 자본의 감소이며 영업비용이 아닙니다. 의무가 성립한 시점을 확인합니다.","example":"현금배당 100을 적법하게 확정하면 배당부채 인식을 검토하고 지급 시 현금과 부채를 줄입니다.","check":"보고기간 후에 결정된 배당은 보고일 현재 부채인지 별도로 보며 공시도 검토합니다.","ref":"events"}},{"title":"기본주당이익","aliases":["EPS","기본EPS","가중평균유통주식수"],"body":"보통주 귀속 이익을 가중평균 유통 보통주식수로 나눕니다. 자기주식을 제외하고 기중 발행 시 기간 가중을 적용합니다.","formula":"기본 EPS = 보통주 귀속 이익 ÷ 가중평균 유통 보통주식수","view":"help","group":"회계","lesson":{"section":"재무회계 · 자본","principle":"보통주 귀속 이익을 가중평균 유통 보통주식수로 나눕니다. 자기주식을 제외하고 기중 발행 시 기간 가중을 적용합니다.","example":"보통주 귀속 순이익 1억원, 가중평균 5만주면 EPS는 2천원/주입니다.","check":"우선주 배당·주식분할·무상증자에 따른 분자·비교기간 분모 조정 등을 확인합니다.","ref":"eps"}},{"title":"희석주당이익","aliases":["희석EPS","잠재적보통주","반희석"],"body":"전환사채·주식선택권 등 잠재적 보통주가 이익을 희석하는 경우 전환·행사를 가정한 분자와 분모를 반영합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 자본","principle":"전환사채·주식선택권 등 잠재적 보통주가 이익을 희석하는 경우 전환·행사를 가정한 분자와 분모를 반영합니다.","example":"전환사채는 세후 이자 조정과 추가 주식수를 함께 검토합니다. 옵션은 자기주식법 등 적용 방법이 다릅니다.","check":"손실 기간 등 반희석 효과는 제외합니다. 분모만 무조건 늘리는 계산이 아닙니다.","ref":"eps"}},{"title":"재고 취득원가의 범위","aliases":["재고취득원가","매입할인","매입환출"],"body":"매입대가에서 할인·환입 등을 차감하고 현재 장소·상태에 이르게 한 직접 원가를 포함합니다. 회수 가능한 세금은 제외합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 재고","principle":"매입대가에서 할인·환입 등을 차감하고 현재 장소·상태에 이르게 한 직접 원가를 포함합니다. 회수 가능한 세금은 제외합니다.","example":"원재료 1천만원, 매입할인 20만원, 입고운반 30만원이면 다른 요건이 같을 때 취득원가 1,010만원입니다.","check":"비정상 낭비, 일반 보관비, 판매비, 관련 없는 관리비는 통상 재고원가에서 제외합니다.","ref":"inventory"}},{"title":"정상조업도와 고정제조간접비","aliases":["정상조업도","저조업도","고정간접비 배부"],"body":"고정제조간접비는 정상 생산능력을 기준으로 배부합니다. 생산 감소·유휴 때문에 단위당 고정비를 임의로 높이지 않으며 미배부액은 발생 기간 비용을 검토합니다.","formula":"","view":"help","group":"회계","lesson":{"section":"재무회계 · 재고","principle":"고정제조간접비는 정상 생산능력을 기준으로 배부합니다. 생산 감소·유휴 때문에 단위당 고정비를 임의로 높이지 않으며 미배부액은 발생 기간 비용을 검토합니다.","example":"정상 1만개, 고정비 1억원, 실제 5천개이면 단순 예시 배부 5천만원, 미배부 5천만원입니다.","check":"비정상 고조업도에서는 재고 과대평가를 피하도록 단위 배부액을 낮춥니다. FPA 기본 풀 배부는 이 한도를 자동 적용하지 않습니다.","ref":"inventory"}},{"title":"구성요소별 감가상각","aliases":[
