function validateState(s){if(!s||s.version!==VERSION||!Array.isArray(s.cases)||!s.cases.length||s.cases.length>100)return false;let caseIds=new Set();for(const c of s.cases){if(!c.id||caseIds.has(c.id)||!['계획','실적','추정'].includes(c.kind)||typeof c.scenario!=='string'||typeof c.name!=='string'||!Number.isInteger(c.year)||c.year<2000||c.year>2200)return false;caseIds.add(c.id);if(!validScenarioMeta(c))return false;for(const k of ['products','rows','bom','labor','mfgPools','sgPools'])if(!Array.isArray(c[k])||c[k].length>100000)return false;if(!Array.isArray(c.sites))return false;let siteNames=new Set(),siteIds=new Set();for(const site of c.sites){if(!site||typeof site.id!=='string'||!site.id||siteIds.has(site.id)||typeof site.name!=='string'||!site.name.trim()||site.name!==site.name.trim()||site.name.length>80||siteNames.has(site.name))return false;siteNames.add(site.name);siteIds.add(site.id);}if(c.products.some(p=>!siteNames.has(p.site)))return false;let ps=new Set(),rs=new Set();for(const p of c.products){if(!p.id||ps.has(p.id)||typeof p.name!=='string'||!p.name.trim()||typeof p.site!=='string'||!p.site.trim())return false;ps.add(p.id);}for(const r of c.rows){if(!ps.has(r.product)||!Number.isInteger(r.m)||r.m<1||r.m>12||rs.has(r.product+':'+r.m))return false;rs.add(r.product+':'+r.m);for(const k of ['qty','usd','fx','krw','production','yield','days','towers','powerUse','powerPrice','steamUse','steamPrice','fuelUse','fuelPrice','waterUse','waterPrice','repair','consumable','freightRate','packRate'])if(r[k]!==null&&(typeof r[k]!=='number'||!Number.isFinite(r[k])||r[k]<0))return false;if((r.yield!==null&&(r.yield<=0||r.yield>1))||r.days>31||!['USD','KRW'].includes(r.currency))return false;}if(c.rows.length!==c.products.length*12)return false;for(const b of c.bom){if(!ps.has(b.product)||!Number.isInteger(b.m)||b.m<1||b.m>12||typeof b.material!=='string'||!['USD','KRW'].includes(b.currency))return false;for(const k of ['ratio','usd','fx','krw'])if(b[k]!==null&&(typeof b[k]!=='number'||!Number.isFinite(b[k])||b[k]<0))return false;if(b.ratio>1)return false;}for(const key of ['labor','mfgPools','sgPools'])for(const p of c[key]){if(!Number.isInteger(p.m)||p.m<1||p.m>12||!['shared','site','product'].includes(p.scope)||typeof p.account!=='string'||typeof p.target!=='string'||(p.amount!==null&&(typeof p.amount!=='number'||!Number.isFinite(p.amount)||p.amount<0))||!BASES[p.basisSite]||!BASES[p.basisProduct]||(p.scope==='site'&&!siteNames.has(p.target)))return false;}for(const key of ['rows','bom','labor','mfgPools','sgPools']){let ids=new Set();for(const r of c[key]){if(typeof r.id!=='string'||ids.has(r.id))return false;ids.add(r.id)}}}return true;}
function driver(r,b){if(b==='production')return r.production;if(b==='days')return r.days;if(b==='towerDays')return r.towers*r.days;if(b==='revenue')return r.revenue;return 1;}
function calculate(c){let out=[],warnings=[],allocations=[],poolChecks=[];const products=new Map(c.products.map(p=>[p.id,p]));const bomMap=new Map();c.bom.forEach(b=>{let k=b.product+':'+b.m;if(!bomMap.has(k))bomMap.set(k,[]);bomMap.get(k).push(b)});
for(const raw of c.rows){const r={...raw,production:num(raw.production),qty:num(raw.production)};let p=products.get(r.product);if(!p)continue;const bom=bomMap.get(r.product+':'+r.m)||[];let price=r.currency==='USD'?r.usd*r.fx:r.krw;let input=r.yield>0?num(r.production)/r.yield:0;if(r.production>0&&!(r.yield>0))warnings.push({level:'error',m:r.m,product:p.name,message:'수율 미입력 · 생산량에 해당하는 수율을 입력하세요. 현재 원가는 가계산입니다.'});if(r.qty>0&&((r.currency==='USD'&&(!(r.usd>0)||!(r.fx>0)))||(r.currency==='KRW'&&!(r.krw>0))))warnings.push({level:'error',m:r.m,product:p.name,message:'매출단가 또는 적용환율 미입력 · 현재 매출액은 가계산입니다.'});let material=sum(bom.map(b=>input*b.ratio*(b.currency==='USD'?b.usd*b.fx:b.krw)));if((r.production>0||bom.some(b=>b.ratio!==null))&&Math.abs(sum(bom.map(b=>b.ratio))-1)>1e-7)warnings.push({level:'warning',m:r.m,product:p.name,message:'BOM 투입비율 합계 '+percent(sum(bom.map(b=>b.ratio)))+' · 100%로 맞추세요.'});let utility=r.production*(r.powerUse*r.powerPrice+r.steamUse*r.steamPrice+r.fuelUse*r.fuelPrice+r.waterUse*r.waterPrice);out.push({...r,name:p.name,site:p.site,price,revenue:r.qty*price,input,material,utility,laborCost:0,mfgFixed:0,mfgDA:0,sgFixed:0,sgDA:0,freight:r.qty*price*r.freightRate,packing:r.qty*price*r.packRate});}
function allocate(pools,key){for(const pool of pools){let monthRows=out.filter(r=>r.m===pool.m), shares=[];const spread=(rows,amount,basis,stage)=>{let den=sum(rows.map(r=>driver(r,basis)));if(den<=0){if(amount>0)warnings.push({level:'error',m:pool.m,product:pool.account,message:stage+' 배부 기준이 0이거나 대상이 없어 '+fmt(amount)+'원 미배부'});return}rows.forEach(r=>shares.push({r,amount:amount*driver(r,basis)/den,productRate:driver(r,basis)/den,stage}));};
if(pool.scope==='product'){let rows=monthRows.filter(r=>r.product===pool.target);if(rows.length)shares.push({r:rows[0],amount:pool.amount,productRate:1,stage:'제품 직접비'});else if(pool.amount)warnings.push({level:'error',m:pool.m,product:pool.account,message:'직접비 대상 제품 없음 · '+fmt(pool.amount)+'원 미배부'});}else if(pool.scope==='site'){spread(monthRows.filter(r=>r.site===pool.target),pool.amount,pool.basisProduct,'공장→제품');}else {let sites=[...new Set(monthRows.map(r=>r.site))];let d=sum(monthRows.map(r=>driver(r,pool.basisSite)));if(d<=0){if(pool.amount)warnings.push({level:'error',m:pool.m,product:pool.account,message:'공통비 공장 배부 기준 0 · '+fmt(pool.amount)+'원 미배부'});}else for(const site of sites){let rows=monthRows.filter(r=>r.site===site);let siteRate=sum(rows.map(r=>driver(r,pool.basisSite)))/d;spread(rows,pool.amount*siteRate,pool.basisProduct,'공통→공장→제품');}}
for(const a of shares){let r=a.r;r[key]+=a.amount;if(pool.account==='감가상각비'){if(key==='mfgFixed')r.mfgDA+=a.amount;if(key==='sgFixed')r.sgDA+=a.amount;}let siteRows=monthRows.filter(x=>x.site===r.site);let siteRate=pool.scope==='shared'?(sum(siteRows.map(x=>driver(x,pool.basisSite)))/(sum(monthRows.map(x=>driver(x,pool.basisSite)))||1)):1;allocations.push({key,poolId:pool.id,m:pool.m,account:pool.account,scope:pool.scope,target:pool.target,product:r.product,name:r.name,site:r.site,total:pool.amount,siteRate,siteAmount:pool.amount*siteRate,productRate:a.productRate,allocated:a.amount,stage:a.stage});}poolChecks.push({key,id:pool.id,m:pool.m,account:pool.account,total:pool.amount,allocated:sum(shares.map(a=>a.amount))});}}
allocate(c.labor,'laborCost');allocate(c.mfgPools,'mfgFixed');allocate(c.sgPools,'sgFixed');
for(const r of out){r.openQty=0;r.openValue=0;r.openDA=0;r.closeQty=0;r.closeValue=0;r.closeDA=0;r.inventoryChange=0;r.repairCost=num(r.repair)+num(r.consumable);r.mfgExpense=r.utility+r.repairCost+r.mfgFixed;r.mfgCost=r.material+r.laborCost+r.mfgExpense;r.availableQty=num(r.production);r.availableValue=r.mfgCost;r.unitCost=r.production>0?r.mfgCost/r.production:0;r.cogs=r.mfgCost;r.cogsDA=r.mfgDA;r.costGap=r.cogs-r.mfgCost;r.gross=r.revenue-r.cogs;r.logistics=r.freight+r.packing;r.sg=r.sgFixed+r.logistics;r.op=r.gross-r.sg;r.ebitda=r.op+r.mfgDA+r.sgDA;r.opMargin=r.revenue?r.op/r.revenue:0;r.ebitdaMargin=r.revenue?r.ebitda/r.revenue:0;r.matPerKg=r.production?r.material/r.production:0;}

function monthlyPnl(rows,title){let months=Array.from({length:12},(_,i)=>aggregate(rows.filter(r=>r.m===i+1))),total=aggregate(rows);let other=compareId?aggregate(visibleRows(calculate(state.cases.find(c=>c.id===compareId)).rows)):null;return panel(title,'<div class="gridwrap"><table><thead><tr>'+th('항목 · '+(active().year)+'년')+months.map((_,i)=>th((i+1)+'월')).join('')+th('계','total-col')+(other?th('비교 CASE 계')+th('증감'):'' )+'</tr></thead><tbody>'+PNL.map(([k,label,t,cls])=>'<tr class="'+(cls||'')+'">'+td(esc(label))+months.map(a=>td(display(a[k],t),a[k]<0?'negative':'')).join('')+td(display(total[k],t),'total-col '+(total[k]<0?'negative':''))+(other?td(display(other[k],t))+td(t==='rate'?fmt((total[k]-other[k])*100,1)+'%p':display(total[k]-other[k],t),(total[k]-other[k])<0?'negative':''):'')+'</tr>').join('')+'</tbody></table></div><div class="measure">당월 생산분 전량판매 / 금액: '+unitLabel()+' / 수량: kg / kg당 재료비: 원/kg / 비율은 연간 합계 기준</div>','<div class="tools"><span>'+esc(active().scenario+' / '+active().name+' / '+active().kind)+'</span><button class="mini-button" onclick="exportVisible()">CSV 내보내기</button></div>')}

ls></div>';document.getElementById('undo-button').disabled=!editHistory.some(h=>h.data.id===c.id);document.body?.classList?.toggle('dense',compactRows);if(view==='scenario'){root.innerHTML=root.innerHTML.replace(/<select aria-label="표시 단위"[\s\S]*?<\/select>/,'').replace(/<select aria-label="비교 기준"[\s\S]*?<\/select>/,'');}}

function openPageHelp(){const screen=SCREENS.find(a=>a[0]===view);const notes=pageNotes.length?pageNotes.map(n=>'<div class="note">'+n+'</div>').join(''):'<p>표의 숫자를 직접 수정하면 손익이 함께 계산됩니다. 상단 시나리오는 독립 저장되며 파일 메뉴에서 전체 데이터를 백업할 수 있습니다.</p>';modal(VIEW_LABELS[view]+' 도움말','<div class="help-prose"><p>'+esc(screen?.[3]||'')+'</p>'+notes+'</div>',()=>closeModal(),'확인',false);}
function openGuide(){const steps=[['master','공장과 제품을 등록하세요','SITE와 제품을 설정합니다.'],['sales','매출과 생산량을 입력하세요','생산·판매수량과 단가·환율을 넣고 수율을 설정합니다.'],['materials','제조원가를 채우세요','재료비부터 노무비·유틸리티·고정비까지 입력합니다.'],['sgFixed','판관비를 연결하세요','판관고정비와 운반·포장비를 입력합니다.'],['checks','검산하고 손익을 확인하세요','배부와 제조·매출원가 대사를 점검한 후 월별 손익을 확인합니다.']];modal('처음 시작하기','<p class="guide-intro">기준정보부터 손익까지, 다섯 단계로 이어집니다.</p><div class="guide-list">'+steps.map(([v,title,desc],i)=>'<div class="guide-step"><span class="step-number">'+(i+1)+'</span><div><h3>'+title+'</h3><p>'+desc+'</p></div><button type="button" onclick="closeModal();navigate(\''+v+'\')">열기</button></div>').join('')+'</div>',()=>{closeModal();navigate('master')},'공장·제품부터 시작');}

function undoInput(){if(caseIsLocked()){toast('확정된 CASE입니다. 복제해 편집하거나 잠금을 해제하세요.');return;}let index=-1;for(let i=editHistory.length-1;i>=0;i--)if(editHistory[i].data.id===active().id){index=i;break}if(index<0)return;const previous=editHistory.splice(index,1)[0];state.cases[state.cases.findIndex(c=>c.id===previous.data.id)]=previous.data;siteFilter=previous.site;productFilter=previous.product;save();render();toast(previous.label+'을 되돌렸습니다.');}
function render(){const preserve=lastRenderedView===view;const scroll=preserve&&document.querySelectorAll?Array.from(document.querySelectorAll('#content .gridwrap')).map(el=>({x:el.scrollLeft,y:el.scrollTop})):[];gridRegistry={};const group=currentGroup();document.getElementById('page-title').textContent=group.label;nav();context();let html='';try{switch(view){case 'total':html=dashboard();break;case 'pnl':html=monthlyPnl(visibleRows(),productFilter?active().products.find(p=>p.id===productFilter).name+' · 월별 손익':'월별 손익');break;case 'items':html=itemSummary();break;case 'salesSum':html=salesSummary();break;case 'sales':html=salesInput();break;case 'drivers':html=driversInput();break;case 'materials':html=materialInput();break;case 'utility':html=utilityInput();break;case 'repair':html=repairInput();break;case 'labor':html=poolScreen('labor');break;case 'mfgFixed':html=poolScreen('mfgPools');break;case 'sgFixed':html=poolScreen('sgPools');break;case 'mfg':html=mfgSummary();break;case 'sgSum':html=sgSummary();break;case 'sgDrivers':html=sgDrivers();break;case 'logistics':html=logisticsInput();break;case 'inventory':html=inventoryScreen();break;case 'checks':html=checksScreen();break;case 'master':html=masterScreen();break;case 'scenario':html=scenarioSettings();break;case 'help':html=helpScreen();break;}}catch(e){html='<div class="note warning">화면 계산 중 오류: '+esc(e.message)+'</div>';console.error(e)}html=extractNotes(html);if(!active().products.length&&['total','sales','drivers','materials','utility'].includes(view)){const hasSite=active().sites.length>0;html='<div class="empty-start"><div><strong>'+ (hasSite?'제품':'공장')+'을 등록해 시작하세요</strong><p>공장과 제품을 등록한 뒤 실제 수량·단가·비용을 입력하세요.</p></div><button class="primary" onclick="navigate(\'master\');'+(hasSite?'addProduct()':'addSiteDialog()')+'">'+(hasSite?'제품 등록':'공장 등록')+'</button></div>'+html;}document.getElementById('content').innerHTML=(caseIsLocked()?'<div class="case-locked"><p>확정된 CASE · 입력이 잠겨 있습니다.</p><div class="tools"><button type="button" onclick="openCaseDialog()">복제해 편집</button><button type="button" onclick="toggleCaseLock()">잠금 해제</button></div></div>':'')+(loadIssue?'<div class="note warning">'+esc(loadIssue)+'</div>':'')+html+workflowFooter();if(preserve&&document.querySelectorAll)Array.from(document.querySelectorAll('#content .gridwrap')).forEach((el,i)=>{if(scroll[i]){el.scrollLeft=scroll[i].x;el.scrollTop=scroll[i].y}});lastRenderedView=view;refreshRangeUI();paintCaseLock();if(typeof assistantUI!=='undefined'&&assistantUI.open)paintAssistant();}

function dashboard(){let rows=visibleRows(),a=aggregate(rows),compare=compareId?aggregate(visibleRows(calculate(state.cases.find(c=>c.id===compareId)).rows)):null;const cards=[['매출액','revenue','money'],['영업이익','op','money'],['EBITDA','ebitda','money'],['영업이익률','opMargin','rate']];let html='<div class="full-sale-basis">전량판매 기준 · 판매량 = 생산량 · 매출원가 = 당월 제조원가</div><div class="cards">'+cards.map(([label,k,t],i)=>'<div class="card '+(i===1?'focus':'')+'"><div class="card-label">'+label+'</div><div class="card-value '+(a[k]<0?'negative':'')+'">'+display(a[k],t)+(t==='money'?'<small>'+unitLabel()+'</small>':'')+'</div>'+(compare?'<div class="card-note">비교 대비 '+(t==='rate'?fmt((a[k]-compare[k])*100,1)+'%p':display(a[k]-compare[k],t)+' '+unitLabel())+'</div>':'')+'</div>').join('')+'</div>';

function sgDrivers(){let rows=filterMonth(visibleRows());return panel('매출 기준 판관배부율',readonlyTable(['제품','SITE','월','매출액 '+unitLabel(),'전사 매출액','전사 매출액비율','공장 내 매출액비율'],rows.map(r=>{let total=sum(model().rows.filter(x=>x.m===r.m).map(x=>x.revenue)),site=sum(model().rows.filter(x=>x.m===r.m&&x.site===r.site).map(x=>x.revenue));return [r.name,r.site,r.m+'월',display(r.revenue),display(total),total?percent(r.revenue/total):'—',site?percent(r.revenue/site):'—']})))+'<div class="note">기본 판관 배부는 전사 및 제품 모두 매출액 기준입니다. 판관고정비에서 비용 풀별 기준을 바꾸면 실제 배부율도 해당 기준으로 바뀝니다. 매출 기준 0인 경우 자동 균등배부하지 않고 미배부로 표시합니다.</div>';}
function inventoryScreen(){return '<div class="full-sale-basis">당월 생산분 전량판매 · 기초·기말재고를 사용하지 않습니다.</div>'+summaryByRow('제조원가·매출원가 대사',[['production','생산량 kg','qty'],['qty','판매량 kg','qty'],['material','재료비'],['laborCost','노무비'],['mfgExpense','제조경비'],['mfgCost','당월 제조원가'],['cogs','매출원가'],['costGap','원가 대사 차이'],['mfgDA','제조감가'],['cogsDA','매출원가 반영 제조감가']]);}

function checksScreen(){const m=model();let rows=m.warnings.map(w=>[w.level==='error'?'오류':'확인',w.m+'월',w.product,w.message]);let diff=sum(m.poolChecks.map(x=>x.total-x.allocated));let residual=Math.max(0,...m.rows.map(r=>Math.abs(r.mfgCost-r.cogs)));let html='<div class="cards"><div class="card"><div class="card-label">확인 / 오류</div><div class="card-value">'+rows.length+'<small>건</small></div></div><div class="card"><div class="card-label">미배부 비용</div><div class="card-value">'+display(diff)+'<small>'+unitLabel()+'</small></div></div><div class="card"><div class="card-label">제조·매출원가 대사 차이</div><div class="card-value">'+fmt(residual,6)+'<small>원</small></div></div><div class="card"><div class="card-label">제품 × 월</div><div class="card-value">'+m.rows.length+'<small>개</small></div></div></div>';html+=rows.length?panel('정합성 점검 내역',readonlyTable(['구분','월','대상','내용'],rows)):panel('정합성 점검','<div class="validation-ok"><b>✓</b><div><strong>현재 입력값의 계산 정합성을 통과했습니다.</strong><p class="muted">BOM 100% · 전량판매 수량 · 배부 기준 · 비용 풀 합계</p></div></div>');return html+'<div class="note">검산은 계산 구조를 확인합니다. 입력한 단가·수율·계정 귀속의 업무 적정성은 사용자가 확인해야 합니다. 모든 비용은 매출원가 또는 판관비에 한 번만 반영하도록 등록하세요.</div>';}
function masterScreen(){let html=grid('sites',active().sites,[col('name','공장명','text'),col('products','연결 제품 수','ro',{value:r=>siteUsage(active(),r.name).products}),col('pools','공장 직접 비용 풀 수','ro',{value:r=>siteUsage(active(),r.name).pools})],'공장',{canDelete:true,action:'<button class="mini-button" onclick="addSiteDialog()">+ 공장 추가</button>'});html+='<div class="note">SITE 이름을 직접 수정할 수 있습니다. 이름을 바꾸면 현재 CASE의 제품과 공장 직접 비용 풀에도 반영됩니다. 사용 중인 SITE를 삭제할 때는 이동할 SITE를 선택합니다. 이 목록은 CASE별로 독립 저장됩니다.</div>';html+=grid('products',active().products,[col('name','제품명','text'),col('site','SITE','select',{choices:()=>active().sites.map(site=>site.name)})],'제품',{canDelete:true,action:'<button class="mini-button" onclick="addProduct()">+ 제품</button>'});html+='<details class="advanced-section"><summary>시나리오 관리</summary><div class="advanced-content">'+panel('시나리오 목록',readonlyTable(['시나리오','CASE','실적구분','연도','제품수','현재 선택'],state.cases.map(c=>[c.scenario,c.name,c.kind,c.year,c.products.length,c.id===state.active?'사용 중':''])),'<div class="tools"><button class="mini-button" onclick="editCaseDialog()">현재 CASE 이름 / 연도</button><button class="mini-button" onclick="deleteCase()">현재 CASE 삭제</button></div>')+'</div></details>';html+='<div class="note">제품과 월별 입력은 CASE마다 독립적으로 보관됩니다. 제품을 추가하면 12개월 입력행이 생성됩니다. 제품의 SITE 변경은 해당 제품만 이동시키며 공장 직접 비용 풀은 기존 SITE에 유지됩니다. 제품을 삭제하면 해당 제품의 월별 입력과 제품 직접비도 삭제됩니다.</div><details class="advanced-section"><summary>데이터 초기화</summary><div class="advanced-content"><button onclick="resetSample()">전체 데이터를 빈 양식으로 초기화</button></div></details>';return html;}
function migrateSites(s){if(!s||!Array.isArray(s.cases))return;for(const c of s.cases){if(!c||Object.prototype.hasOwnProperty.call(c,'sites'))continue;const names=[...(Array.isArray(c.products)?c.products.map(p=>p?.site):[]),...['labor','mfgPools','sgPools'].flatMap(k=>Array.isArray(c[k])?c[k].filter(p=>p?.scope==='site').map(p=>p.target):[])].filter(n=>typeof n==='string'&&n.trim());c.sites=[...new Set(names)].map(name=>({id:uid(),name}));}}
function siteUsage(c,name){return {products:c.products.filter(p=>p.site===name).length,pools:sum(['labor','mfgPools','sgPools'].map(k=>c[k].filter(p=>p.scope==='site'&&p.target===name).length))};}
function checkedSiteName(c,name,exceptId=''){const value=String(name).trim();if(!value||value.length>80)throw Error('SITE명은 1~80자로 입력하세요.');if(c.sites.some(site=>site.id!==exceptId&&site.name===value))throw Error('동일한 SITE명이 이미 있습니다.');return value;}
function addSite(c,name){ensureCaseEditable(c);const value=checkedSiteName(c,name);const site={id:uid(),name:value};c.sites.push(site);return site;}
function renameSite(c,id,name){ensureCaseEditable(c);const site=c.sites.find(site=>site.id===id);if(!site)throw Error('SITE를 찾을 수 없습니다.');const value=checkedSiteName(c,name,id),old=site.name;site.name=value;c.products.filter(p=>p.site===old).forEach(p=>p.site=value);for(const k of ['labor','mfgPools','sgPools'])c[k].filter(p=>p.scope==='site'&&p.target===old).forEach(p=>p.target=value);return {old,name:value};}
function removeSite(c,id,replacement=''){ensureCaseEditable(c);const site=c.sites.find(site=>site.id===id);if(!site)throw Error('SITE를 찾을 수 없습니다.');const usage=siteUsage(c,site.name);if(c.sites.length===1&&(usage.products||usage.pools))throw Error('연결된 제품과 직접 비용 풀을 먼저 이동하거나 삭제하세요.');if(usage.products||usage.pools){if(!c.sites.some(s=>s.id!==id&&s.name===replacement))throw Error('제품과 비용 풀을 이동할 SITE를 선택하세요.');c.products.filter(p=>p.site===site.name).forEach(p=>p.site=replacement);for(const k of ['labor','mfgPools','sgPools'])c[k].filter(p=>p.scope==='site'&&p.target===site.name).forEach(p=>p.target=replacement);}c.sites=c.sites.filter(s=>s.id!==id);return {old:site.name,replacement:usage.products||usage.pools?replacement:''};}
function addSiteDialog(){if(caseIsLocked()){toast('확정된 CASE입니다. 복제해 편집하거나 잠금을 해제하세요.');return;}modal('공장 추가','<p class="hint" style="margin-bottom:15px">현재 CASE의 SITE 목록에 추가합니다. 제품이 없어도 먼저 등록할 수 있습니다.</p>'+field('siteName','공장명','','text','required maxlength="80"'),data=>{try{checkedSiteName(active(),data.get('siteName'));rememberEdit('공장 추가');const site=addSite(active(),data.get('siteName'));save();closeModal();render();toast(site.name+' SITE를 추가했습니다.')}catch(e){toast(e.message)}},'추가');}
function deleteSiteDialog(id){const c=active(),site=c.sites.find(s=>s.id===id);const usage=siteUsage(c,site.name),used=usage.products||usage.pools;if(c.sites.length===1&&used){toast('연결된 제품과 직접 비용 풀을 먼저 이동하거나 삭제하세요.');return}const body='<p><strong>'+esc(site.name)+'</strong> SITE를 삭제합니다.</p>'+(used?'<div class="note">연결된 제품 '+usage.products+'개와 공장 직접 비용 풀 '+usage.pools+'개를 아래 SITE로 이동합니다. 월별 입력과 비용 금액은 보존됩니다.</div><label class="field">이동할 SITE<select name="replacement">'+c.sites.filter(s=>s.id!==id).map(s=>'<option value="'+esc(s.name)+'">'+esc(s.name)+'</option>').join('')+'</select></label>':'<div class="note">연결된 제품과 공장 직접 비용 풀이 없습니다.</div>');modal('공장 삭제',body,data=>{try{rememberEdit('공장 이동');const result=removeSite(c,id,String(data.get('replacement')||''));if(siteFilter===result.old){siteFilter=result.replacement;productFilter='';}save();closeModal();render();toast('SITE를 삭제했습니다.')}catch(e){toast(e.message)}},used?'이동하고 삭제':'SITE 삭제');}

function helpScreen(){return '<div class="help-grid">'+[
['01 / 기본 입력 순서','기준정보 → 매출·생산 → 제조원가 → 판관비 → 손익·검산 순서로 진행합니다. 상단에서 시나리오·CASE·실적구분을 바꾸면 해당 데이터만 계산합니다.'],
['SITE / 목록 편집','기준정보의 공장·제품 탭에서 SITE를 추가하고 이름을 변경할 수 있습니다. 사용 중인 SITE를 삭제하면 제품과 공장 직접 비용 풀을 선택한 다른 SITE로 이동합니다. 제품만 공장을 바꾸려면 제품 표의 SITE를 선택합니다. 기존 JSON 백업의 SITE 목록은 제품 및 공장 직접 비용 풀에서 자동 구성합니다.'],
['시나리오 설정','상단 작업 시나리오 옆 설정 버튼 또는 기준정보의 시나리오 설정 탭에서 현재 입력값을 확인합니다. 기준 시나리오를 선택하면 기준값·현재값·변동을 비교합니다. 변경된 변수만 모아보거나 공장·제품·월·계정 구분으로 좁힐 수 있습니다. 일괄 조정 기록은 이 버전 이후 실행한 조정부터 저장합니다.'],
['02 / 시나리오와 실적구분','시나리오 복제는 현재 CASE 전체를 독립 복사합니다. 새 시나리오명·CASE명·계획/실적/추정·연도를 지정합니다. 다른 CASE를 비교 기준으로 고르면 연간 손익 증감을 확인할 수 있습니다.'],
['03 / 재료비와 유틸리티','총투입량 = 양품 생산량 ÷ 수율. 자재비 = 총투입량 × 투입비율 × 적용 원화단가. 투입비율 합계는 100%입니다. 유틸리티 = 생산량 × kg당 사용량 × 단가. 원화 거래는 KRW 입력값, 달러 거래는 USD×환율을 적용합니다.'],
['04 / 2단계 비용 배부','공통비는 먼저 공장별 기준 합계 비율로 나누고, 각 공장에서 다시 제품 기준 비율로 나눕니다. 공장 직접비는 그 공장 제품만 대상으로, 제품 직접비는 해당 제품에 전액 귀속합니다. 기준이 0이면 미배부로 표시합니다. 설비×가동일수는 각 제품의 입력값을 사용합니다.'],
['05 / 전량판매와 매출원가','기초재고를 사용하지 않고 당월 생산분을 전량 판매합니다. 판매수량 = 생산량이며 매출원가 = 당월 제조원가입니다. 기말재고와 다음 달 이월은 없습니다. 매출 입력과 생산·수율 화면의 수량은 같은 입력값입니다.'],
['06 / 영업이익과 EBITDA','영업이익 = 매출액−매출원가−판관비. EBITDA = 영업이익+당월 제조감가+판관감가. 당월 제조원가가 전부 매출원가로 반영되므로 감가도 당월 전액 가산합니다. 무형자산 상각은 별도 분류하지 않으므로 필요 시 감가상각비 계정에 포함하여 관리합니다.'],
['07 / 연간 합계와 표시 단위','연간 이익률 = 연간 이익÷연간 매출. kg당 재료비 = 연간 발생재료비÷연간 생산량. 월별 비율의 단순 평균을 사용하지 않습니다. 내부 계산은 원이며 원/천원/백만원/억원 선택은 보고서 표시만 바꿉니다. 입력값은 항상 원입니다.'],
['08 / 저장과 독립 실행','자동 저장은 같은 기기·같은 브라우저에 한정됩니다. 백업 저장은 전체 시나리오가 포함된 JSON 파일입니다. HTML 받기는 외부 라이브러리 없는 독립 프로그램이며 현재 입력값을 포함합니다. 내려받은 HTML을 열어 인터넷 없이 사용할 수 있습니다. 데이터를 옮기거나 보관할 때 JSON 백업도 함께 저장하세요.'],
['09 / 일괄 조정과 표 붙여넣기','변수 조정에서 제품·기간별 판매량, 생산량, 매출 환율, 자재별 환율, 유틸리티별 사용량·단가, 노무 조직·제조·판관 계정별 비용을 독립 설정합니다. 조정값은 저장되며 1%를 2%로 바꾸면 최초 기준의 2%가 됩니다. 같은 값은 중복 적용되지 않습니다. 표의 열 제목을 누르면 표시 중인 행 전체가 선택됩니다. 범위 선택 버튼을 켜고 드래그하거나 Shift로 부분 범위를, Ctrl(맥: ⌘)로 떨어진 셀을 선택한 뒤 하단에서 같은 값을 적용하세요. 전체 월은 월 필터를 전체로 바꾼 후 선택합니다. Esc로 선택을 해제하면 개별 입력할 수 있습니다. 탭·줄바꿈 붙여넣기와 한 번에 되돌리기도 지원합니다.'],
['10 / 운영 범위','단일 사용자의 연간 시뮬레이션 버전입니다. 서버 DB·사용자 권한·동시 편집·수정 이력·ERP 자동 연동은 포함하지 않습니다. VAT·금융손익·법인세·재공품·부산물·표준원가차이·공정 간 대체는 별도 모델이 필요합니다. 당월 생산분 전량판매를 가정하며 기초·기말재고를 입력하지 않습니다.']

function cellValue(col,value){if(col.kind==='select'){let choices=typeof col.choices==='function'?null:col.choices;if(col.key==='m')return Number(value);return String(value)}if(col.kind==='n'){if(String(value).trim()==='')return null;let n=Number(String(value).replace(/,/g,'').trim());if(!Number.isFinite(n)||String(value).trim()==='')throw Error(col.label+'에 유효한 숫자를 입력하세요.');if(n<(col.min??0)||(col.max!==undefined&&n>col.max))throw Error(col.label+'의 범위를 확인하세요.');return col.percent?n/100:n;}let s=String(value).trim();if((col.key==='name'||col.key==='site'||col.key==='material'||col.key==='account')&&!s)throw Error(col.label+'은 비울 수 없습니다.');return s;}

function refreshRangeUI(){if(!document.querySelectorAll)return;const toolbar=document.getElementById('range-toolbar');if(!toolbar)return;if(rangeState.grid&&rangeState.signature!==rangeSignature(rangeState.grid)){rangeState={grid:'',signature:'',cells:new Set(),anchor:null,mode:false,dragging:false,base:new Set(),fillValue:''};}document.querySelectorAll('td[data-range-grid]').forEach(td=>td.classList.toggle('range-selected',td.dataset.rangeGrid===rangeState.grid&&rangeState.cells.has(td.dataset.rangeRow+':'+td.dataset.rangeCol)));document.querySelectorAll('[data-range-toggle]').forEach(button=>{const active=button.dataset.rangeToggle===rangeState.grid&&rangeState.mode;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));});document.body?.classList?.toggle('has-range-selection',rangeState.cells.size>0);if(!rangeState.cells.size){toolbar.hidden=true;return;}const reg=gridRegistry[rangeState.grid],positions=selectedRangePositions(),cols=[...new Set(positions.map(p=>p[1]))];let choices=null;if(cols.every(c=>reg.cols[c].kind==='select')){for(const [r,c] of positions){const source=typeof reg.cols[c].choices==='function'?reg.cols[c].choices(reg.rows[r]):reg.cols[c].choices;const list=source.map(x=>({value:String(typeof x==='object'?x.value:x),label:String(typeof x==='object'?x.label:x)}));choices=choices===null?list:choices.filter(x=>list.some(y=>x.value===y.value));}}
 const editor=choices?.length?'<select id="range-value" aria-label="선택 셀 입력값" onchange="rangeState.fillValue=this.value">'+option('','값 선택',!rangeState.fillValue)+choices.map(x=>option(x.value,x.label,x.value===rangeState.fillValue)).join('')+'</select>':'<input id="range-value" type="text" aria-label="선택 셀 입력값" placeholder="선택 셀에 넣을 값" value="'+esc(rangeState.fillValue)+'" oninput="rangeState.fillValue=this.value" onkeydown="if(event.key===\'Enter\'){event.preventDefault();applyRangeValue()}">';toolbar.hidden=false;toolbar.innerHTML='<div class="range-summary"><strong>'+positions.length+'개 셀 선택</strong><span>'+esc(cols.map(c=>reg.cols[c].label).join(' · '))+'</span></div><div class="range-edit">'+editor+'<button class="primary" onclick="applyRangeValue()">같은 값 적용</button><button onclick="copySelectedRange()">복사</button><button class="ghost" onclick="resetRange()">선택 해제</button></div>';}
function buildGridBatch(c,reg,positions,raw){ensureCaseEditable(c);const work=clone(c),changes=[],seen=new Set();for(const [r,col] of positions){const descriptor=reg.cols[col],row=reg.rows[r];if(!descriptor||!row||descriptor.kind==='ro')continue;const unique=row.id+':'+descriptor.key;if(seen.has(unique))continue;seen.add(unique);const value=cellValue(descriptor,raw);if(descriptor.kind==='select'){const choices=typeof descriptor.choices==='function'?descriptor.choices(row):descriptor.choices;if(!choices.some(x=>String(typeof x==='object'?x.value:x)===String(value)))throw Error(descriptor.label+'에서 선택할 수 없는 값입니다.');}if(!equalScalar(row[descriptor.key],value))changes.push({id:row.id,field:descriptor.key,value});}const targets=new Set(changes.filter(x=>x.field==='target').map(x=>x.id));for(const change of changes){const row=work[reg.source].find(r=>r.id===change.id);if(!row)throw Error('입력 행을 찾을 수 없습니다.');if(reg.source==='sites'&&change.field==='name')renameSite(work,row.id,change.value);else{if(reg.source==='products'&&/^opening/.test(change.field))throw Error('기초재고 입력은 사용하지 않습니다.');row[change.field]=change.value;if(reg.source==='rows'&&change.field==='qty')row.production=change.value;}if(change.field==='scope'&&!targets.has(row.id))row.target=change.value==='shared'?'':change.value==='site'?(work.sites[0]?.name||''):(work.products[0]?.id||'');}
 normalizeFullSaleCase(work);if(!validateState({version:VERSION,active:work.id,cases:[work]}))throw Error('선택 범위의 입력값을 확인하세요. 통화·월 중복·수율 조건을 모두 만족해야 합니다.');return {data:work,count:changes.length};}
function applyRangeValue(raw=rangeState.fillValue){const reg=gridRegistry[rangeState.grid];if(!reg||!rangeState.cells.size)return;if(String(raw).trim()===''){toast('적용할 값을 입력하세요.');return;}try{const result=buildGridBatch(active(),reg,selectedRangePositions(),raw);if(!result.count){toast('현재 값과 같습니다.');return;}rememberEdit('선택 셀 일괄 입력');state.cases[state.cases.findIndex(c=>c.id===result.data.id)]=result.data;save();render();toast(result.count+'개 입력값을 변경했습니다.');}catch(e){toast(e.message);}}
async function copySelectedRange(){const reg=gridRegistry[rangeState.grid],positions=selectedRangePositions();if(!reg||!positions.length)return;const minR=Math.min(...positions.map(p=>p[0])),maxR=Math.max(...positions.map(p=>p[0])),minC=Math.min(...positions.map(p=>p[1])),maxC=Math.max(...positions.map(p=>p[1]));const lines=[];for(let r=minR;r<=maxR;r++){const values=[];for(let c=minC;c<=maxC;c++){if(!rangeState.cells.has(r+':'+c)){values.push('');continue;}const col=reg.cols[c],row=reg.rows[r];values.push(col.percent?row[col.key]*100:row[col.key]);}lines.push(values.join('\t'));}const value=lines.join('\n');try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(value);else{const area=document.createElement('textarea');area.value=value;area.style.position='fixed';area.style.left='-9999px';document.body.append(area);area.select();document.execCommand('copy');area.remove();}toast('선택한 셀을 복사했습니다.');}catch{toast('복사를 허용한 브라우저에서 다시 시도하세요.');}}

document.addEventListener('paste',e=>{if(!rangeState.cells.size||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;const text=e.clipboardData.getData('text/plain');if(text.includes('\t')||text.includes('\n')){const [row,col]=selectedRangePositions()[0];pasteCells(e,{dataset:{grid:rangeState.grid,row:String(row),col:String(col)}});}else{e.preventDefault();applyRangeValue(text);}});

{id:'marginPrice',title:'단순 목표 마진 판가',match:/목표(?:마진|이익률).*판가|목표판가/,fields:['V','F','Q','M'],formula:'판가 = (단위변동비 + 고정비 ÷ 판매수량) ÷ (1 − 목표마진)',hint:'매출 연동 비용이 없는 단일 제품 CVP 모형입니다. 재고·배부·매출 연동 비용이 있는 실제 CASE의 판가와는 차이가 날 수 있습니다.',run:v=>{if(v.Q<=0||v.M>=100)throw Error('수량은 양수, 목표마진은 100% 미만이어야 합니다.');return [['목표 판매단가',(v.V+v.F/v.Q)/(1-v.M/100),'원/개']];}},
{id:'contribution',title:'공헌이익과 영업이익',match:/공헌이익(?:률)?\s*(?:계산|구)|공헌이익.*판매단가/,fields:['P','V','Q','F'],formula:'공헌이익 = 수량 × (판가 − 단위변동비); 영업이익 = 공헌이익 − 고정비',hint:'제조·판매 변동비를 모두 포함한 단위 변동비를 사용합니다.',run:v=>{if(v.P<=0)throw Error('판매단가는 양수여야 합니다.');return [['단위 공헌이익',v.P-v.V,'원/개'],['공헌이익률',(v.P-v.V)/v.P*100,'%'],['공헌이익',v.Q*(v.P-v.V),'원'],['영업이익',v.Q*(v.P-v.V)-v.F,'원']];}},
{id:'safety',title:'안전한계',match:/안전한계/,fields:['S','B'],formula:'안전한계 = 매출 − BEP매출; 안전한계율 = 안전한계 ÷ 매출',hint:'같은 기간·제품 믹스 기준으로 비교합니다. 음수는 손익분기 매출 미달입니다.',run:v=>{if(v.S<=0)throw Error('매출액은 양수여야 합니다.');return [['안전한계',v.S-v.B,'원'],['안전한계율',(v.S-v.B)/v.S*100,'%']];}},
{id:'dol',title:'영업레버리지',match:/영업레버리지|\bdol\b/i,fields:['C','O'],formula:'DOL = 공헌이익 ÷ 영업이익',hint:'특정 조업점의 민감도이며 큰 변화에 그대로 외삽하지 않습니다.',run:v=>{if(v.O===0)throw Error('영업이익이 0이면 DOL이 정의되지 않습니다.');return [['영업레버리지',v.C/v.O,'배']];}},
{id:'depreciation',title:'정액법 감가상각',match:/정액법|정액상각/,fields:['Cost','Residual','Years'],formula:'연간 감가 = (취득원가 − 잔존가치) ÷ 내용연수',hint:'연초부터 사용 가능한 경우의 단순 연간 정액법입니다. 월할·손상·추정 변경은 별도입니다.',run:v=>{if(v.Years<=0||v.Residual>v.Cost)throw Error('내용연수는 양수이고 잔존가치는 취득원가 이하여야 합니다.');const d=(v.Cost-v.Residual)/v.Years;return [['연간 감가',d,'원'],['월평균 감가',d/12,'원']];}},
{id:'impairment',title:'자산 손상',match:/손상차손|회수가능액|자산손상/,fields:['BV','FV','VI'],formula:'회수가능액 = max(순공정가치, 사용가치); 손상 = max(0, 장부−회수가능액)',hint:'개별 자산·CGU 식별, 측정 요건과 재평가자산 표시 등은 별도 검토합니다.',run:v=>[['회수가능액',Math.max(v.FV,v.VI),'원'],['손상차손',Math.max(0,v.BV-Math.max(v.FV,v.VI)),'원']]},
{id:'nrv',title:'재고 저가법',match:/저가법|순실현가능가치|\bnrv\b/i,fields:['Cost','Price','Complete','Sell'],formula:'NRV = 예상판매가 − 완성원가 − 판매원가; 평가손실 = max(0, 원가−NRV)',hint:'동일 품목·동일 수량 기준입니다. 완성·판매원가 0도 직접 입력하세요.',run:v=>{const n=Math.max(0,v.Price-v.Complete-v.Sell);return [['순실현가능가치 (0 하한)',n,'원'],['재고 평가액',Math.min(v.Cost,n),'원'],['평가손실',Math.max(0,v.Cost-n),'원']];}},
{id:'materialVariance',title:'표준 재료·노무 차이',match:/재료(?:가격|수량|단가|능률)차이|노무(?:임률|능률)차이|임률차이|표준원가差異|표준원가차이/,fields:['AQ','SQ','AP','SP'],formula:'가격/임률 = AQ×(AP−SP); 수량/능률 = SP×(AQ−SQ); 총차이 = AQ×AP−SQ×SP',hint:'실제 사용량(노무:시간)과 실제 산출량의 허용 표준량을 씁니다. 양수=불리, 음수=유리. 구매시점 가격차이와는 구분합니다.',run:v=>[['가격·임률 차이',v.AQ*(v.AP-v.SP),'원'],['수량·능률 차이',v.SP*(v.AQ-v.SQ),'원'],['총 원가 차이',v.AQ*v.AP-v.SQ*v.SP,'원']]},
{id:'fixedVariance',title:'고정제조간접비 차이',match:/고정제조간접비.*차이|고정간접비.*차이|조업도차이/,fields:['Actual','Budget','Allocated'],formula:'예산차이 = 실제−예산; 조업도차이 = 예산−표준배부; 총차이 = 실제−표준배부',hint:'2분법 기준, 양수=불리·음수=유리입니다.',run:v=>[['예산 차이',v.Actual-v.Budget,'원'],['조업도 차이',v.Budget-v.Allocated,'원'],['총 차이',v.Actual-v.Allocated,'원']]},
{id:'equivalent',title:'평균법 가공환산량',match:/평균법.*환산|완성품환산량|가공환산량/,fields:['Finished','WIP','Percent'],formula:'가공환산량 = 완성수량 + 기말재공수량 × 가공완성도',hint:'평균법 가공원가 기준입니다. 재료 투입점·FIFO·감손은 별도입니다.',run:v=>{if(v.Percent>100)throw Error('완성도는 100% 이하여야 합니다.');return [['가공 완성품환산량',v.Finished+v.WIP*v.Percent/100,'개']];}},
{id:'abc',title:'ABC 활동원가 배부',match:/abc.*배부|활동원가.*배부|활동기준원가.*계산/i,fields:['Pool','Driver','Use'],formula:'동인율 = 활동원가 ÷ 총동인량; 제품배부 = 동인율 × 제품동인량',hint:'단일 활동 풀 예제이며 모든 제품 동인량과 풀 총액을 대사합니다.',run:v=>{if(v.Driver<=0||v.Use>v.Driver)throw Error('총동인량은 양수, 제품동인량은 총량 이하여야 합니다.');return [['동인 단위당 원가',v.Pool/v.Driver,'원/단위'],['제품 배부액',v.Pool/v.Driver*v.Use,'원']];}},
{id:'interest',title:'유효이자율 상각',match:/유효이자율.*계산|유효이자율법|사채.*상각/,fields:['BV','Rate','CashInterest'],formula:'유효이자 = 기초 장부×유효이자율; 기말장부 = 기초장부+유효이자−현금이자',hint:'일반 상각후원가 사채 부채의 한 회계기간 모형입니다. 기중 상환·신용손상·조건 변경은 제외합니다.',run:v=>[['유효이자비용',v.BV*v.Rate/100,'원'],['상각액',v.BV*v.Rate/100-v.CashInterest,'원'],['기말 장부금액',v.BV*(1+v.Rate/100)-v.CashInterest,'원']]},
{id:'eps',title:'기본 주당이익',match:/기본주당이익|기본eps|\beps\b/i,fields:['Income','Shares'],formula:'EPS = 보통주 귀속 이익 ÷ 가중평균 유통주식수',hint:'우선배당·자기주식·무상증자 등 조정 후 분자·분모를 입력합니다.',run:v=>{if(v.Shares<=0)throw Error('가중평균 주식수는 양수여야 합니다.');return [['기본 EPS',v.Income/v.Shares,'원/주']];}},
{id:'roi',title:'ROI와 잔여이익',match:/잔여이익|\broi\b|투자수익률/i,fields:['Profit','Asset','Rate'],formula:'ROI = 평가이익 ÷ 투자자산; RI = 평가이익 − 투자자산×요구수익률',hint:'이익과 평균 투자자산의 정의를 맞추세요. 음수 평가이익은 영업이익 계산과 별도 검토합니다.',run:v=>{if(v.Asset<=0)throw Error('투자자산은 양수여야 합니다.');return [['ROI',v.Profit/v.Asset*100,'%'],['잔여이익',v.Profit-v.Asset*v.Rate/100,'원']];}},
{id:'eva',title:'경제적부가가치',match:/경제적부가가치|\beva\b/i,fields:['Nopat','Capital','Rate'],formula:'EVA = NOPAT − 투하자본×WACC',hint:'요구수익률에 WACC(%)를 입력합니다. 회계 조정·평균 투하자본 정의를 일관되게 적용하세요.',run:v=>[['자본비용',v.Capital*v.Rate/100,'원'],['EVA',v.Nopat-v.Capital*v.Rate/100,'원']]},
{id:'npv',title:'순현재가치',match:/순현재가치|\bnpv\b/i,fields:['Init','Rate','CF'],formula:'NPV = −초기투자 + Σ[기간말 현금흐름 ÷ (1+할인율)^t]',hint:'초기투자는 양수 지출액입니다. 현금흐름은 1기부터 기간말, 같은 간격이며 세후 증분 현금 기준을 맞춥니다. 목록 구분은 세미콜론(;)입니다.',run:v=>{if(v.Rate<=-100)throw Error('할인율은 −100%보다 커야 합니다.');if(v.CF.length>100)throw Error('현금흐름은 100기간 이내로 입력하세요.');return [['초기투자',-v.Init,'원'],...v.CF.map((cf,i)=>[(i+1)+'기 현재가치',cf/Math.pow(1+v.Rate/100,i+1),'원']),['NPV',-v.Init+sum(v.CF.map((cf,i)=>cf/Math.pow(1+v.Rate/100,i+1))),'원']];}},
{id:'production',title:'생산예산 수량',match:/생산예산.*계산|생산예산수량/,fields:['Q','Begin','End'],formula:'생산예산 = 판매수량 + 목표기말제품 − 기초제품',hint:'완성품 수량만의 단순 계획입니다. 수율·감손·재공·제품별 생산능력 제약은 별도입니다.',run:v=>{if(v.Q+v.End<v.Begin)throw Error('계산 생산량이 음수입니다. 기초 재고와 판매·기말 목표를 확인하세요.');return [['필요 생산량',v.Q+v.End-v.Begin,'개']];}}
];
function formatAccountingNumber(value){return fmt(value,6).replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,'');}
function calculatorValues(spec,raw){const values={},missing=[];for(const id of spec.fields){const f=CALC_FIELDS[id],s=String(raw[id]??'').trim();if(!s){missing.push(f.label);continue;}if(id==='CF'){const parts=s.split(';').map(v=>v.trim());if(parts.some(x=>!x))throw Error('현금흐름 목록에 빈 기간이 있습니다. 0도 직접 입력하세요.');values[id]=parts.map(parseAccountingNumber);if(values[id].some(x=>!Number.isFinite(x)))throw Error('현금흐름을 숫자로 입력하세요.');}else {const n=parseAccountingNumber(s);if(!Number.isFinite(n)||(!f.signed&&n<0))throw Error(f.label+'에 '+(f.signed?'유효한':'0 이상의')+' 숫자를 입력하세요.');values[id]=n;}}return {values,missing};}
function parseAccountingNumber(raw){const s=String(raw).replace(/,/g,'').trim();const m=s.match(/^([+-]?\d+(?:\.\d+)?)\s*(억|천만|백만|십만|만|천)?\s*(?:원|개|주|년|시간|kg|%|단위)?$/i);if(!m)return NaN;return Number(m[1])*({억:1e8,천만:1e7,백만:1e6,십만:1e5,만:1e4,천:1e3}[m[2]]||1);}
function calculateAccounting(id,raw){const spec=CALCULATORS.find(x=>x.id===id);if(!spec)throw Error('계산 도구를 다시 선택하세요.');const p=calculatorValues(spec,raw);if(p.missing.length)return {spec,missing:p.missing,values:p.values};const rows=spec.run(p.values);if(rows.some(r=>!Number.isFinite(r[1])))throw Error('계산 범위를 초과했습니다. 입력 단위를 확인하세요.');return {spec,missing:[],values:p.values,rows};}
function parseAccountingCalculation(query){const q=String(query).normalize('NFKC').toLowerCase().replace(/[\s_·/()]/g,''),spec=CALCULATORS.find(x=>x.match.test(q));if(!spec||!(/계산|구해|얼마|산출|\d/.test(q)))return null;const raw={};for(const id of spec.fields){const f=CALC_FIELDS[id];for(const a of [...f.aliases].sort((a,b)=>b.length-a.length)){const alias=chatNorm(a).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const re=new RegExp(alias+'(?:은|는|이|가)?[:=]?([+-]?\\d[\\d,]*(?:\\.\\d+)?(?:억|천만|백만|십만|만|천)?(?:원|개|주|년|시간|kg|%|단위)?)','i');const m=q.match(re);if(m){raw[id]=m[1];break;}}}if(spec.id==='npv'){const m=query.match(/(?:기간별\s*현금흐름|현금흐름)\s*[:=]?\s*([+\-\d,\.\s;억만천원]+)/);if(m)raw.CF=m[1].trim();}return {id:spec.id,raw};}
function accountingCalculationMarkup(query){const parsed=parseAccountingCalculation(query);if(!parsed)return null;try{const p=calculateAccounting(parsed.id,parsed.raw),payload=esc(JSON.stringify(parsed.raw));return '<strong>'+esc(p.spec.title)+'</strong><div class="chat-formula">'+esc(p.spec.formula)+'</div>'+(p.missing.length?'<p>계산에 필요한 값: '+esc(p.missing.join(', '))+'.</p><p>각 값은 항목명과 함께 입력하세요. 예: 판매단가 100원, 단위변동비 60원, 고정비 1000원.</p>':safeTable(['입력','값'],p.spec.fields.map(id=>[CALC_FIELDS[id].label,Array.isArray(p.values[id])?p.values[id].join('; '):formatAccountingNumber(p.values[id])+' '+CALC_FIELDS[id].unit]))+safeTable(['계산 결과','값'],p.rows.map(([name,value,unit])=>[name,formatAccountingNumber(value)+' '+unit])))+'<p>'+esc(p.spec.hint)+'</p><button onclick="openAccountingCalc(\''+p.spec.id+'\','+payload+')">계산 도구에서 입력</button>';}catch(e){return '<p>'+esc(e.message)+'</p><button onclick="openAccountingCalc(\''+parsed.id+'\')">입력값 확인</button>';}}
function openAccountingCalc(id='bep',prefill={}){const spec=CALCULATORS.find(x=>x.id===id)||CALCULATORS[0];modal('회계 계산 도구','<label class="field">계산 항목<select aria-label="회계 계산 항목" onchange="paintAccountingCalc(this.value)">'+CALCULATORS.map(x=>option(x.id,x.title,x.id===spec.id)).join('')+'</select></label><div id="accounting-calc-body"></div>',()=>closeModal(),'닫기',false);paintAccountingCalc(spec.id,prefill);}
function paintAccountingCalc(id,prefill={}){const spec=CALCULATORS.find(x=>x.id===id);if(!spec)return;document.getElementById('accounting-calc-body').innerHTML='<div class="chat-formula">'+esc(spec.formula)+'</div><p class="hint">'+esc(spec.hint)+'</p><div class="calculator-grid">'+spec.fields.map(key=>{const f=CALC_FIELDS[key];return '<label class="field">'+esc(f.label+' ('+f.unit+')')+'<input data-calc-field="'+key+'" id="calc-'+key+'" type="text" inputmode="'+(key==='CF'?'text':'decimal')+'" value="'+esc(prefill[key]||'')+'" placeholder="'+(key==='CF'?'예: 60000; 60000':'숫자 입력 · 0도 직접 입력')+'"></label>';}).join('')+'</div><button type="button" onclick="runAccountingCalc(\''+id+'\')">계산</button><div id="accounting-calc-result" class="local-calc-result" aria-live="polite">값을 입력해 계산하세요.</div>';}
function runAccountingCalc(id){const spec=CALCULATORS.find(x=>x.id===id),el=document.getElementById('accounting-calc-result');try{const raw=Object.fromEntries(spec.fields.map(k=>[k,document.getElementById('calc-'+k).value])),p=calculateAccounting(id,raw);el.innerHTML=p.missing.length?'추가 입력: '+esc(p.missing.join(', ')):safeTable(['결과','값'],p.rows.map(([label,value,unit])=>[label,formatAccountingNumber(value)+' '+unit]));}catch(e){el.textContent=e.message;}}

function specificAccountingLesson(query){const q=chatNorm(query);if(/손금|익금|세액공제|공제한도|법인세신고|세무분개|세율/.test(q))return null;let found=null,best=0;for(const e of FPA_KNOWLEDGE.filter(e=>e.lesson)){for(const alias of [e.title,...e.aliases]){const key=chatNorm(alias);if(key.length>=4&&q.includes(key)&&key.length>best){found=e;best=key.length;}}}return found;}

// Local planning tools. Full-model recalculation; no financial inputs leave the browser.
function caseIsLocked(c=active()){return c.isLocked===true;}
function ensureCaseEditable(c=active()){if(caseIsLocked(c))throw Error('확정된 CASE입니다. 복제해 편집하거나 시나리오 설정에서 잠금을 해제하세요.');}
function setCaseLock(c,locked){if(typeof locked!=='boolean')throw Error('잠금 상태가 올바르지 않습니다.');c.isLocked=locked;if(locked)c.lockedAt=new Date().toISOString();else delete c.lockedAt;}
function toggleCaseLock(){const c=active();const locked=caseIsLocked(c);modal(locked?'기준 CASE 잠금 해제':'기준 CASE 확정', '<p><strong>'+esc(c.scenario+' / '+c.name)+'</strong></p><p>'+(locked?'잠금을 해제하면 입력과 비교 기준을 수정할 수 있습니다. 이 CASE를 참조하는 시나리오의 비교 결과도 바뀔 수 있습니다.':'현재 입력을 확정하고 편집·삭제·일괄 조정을 잠급니다. 새 가정은 이 CASE를 복제해 수정하세요.')+'</p><p class="hint">잠금은 이 브라우저의 편집 실수 방지 기능입니다. 접근 권한이나 서버 보관 기능은 아닙니다.</p>',()=>{setCaseLock(c,!locked);editHistory=editHistory.filter(h=>h.data.id!==c.id);save();closeModal();render();toast(locked?'잠금을 해제했습니다.':'기준 CASE를 확정했습니다.');},locked?'잠금 해제':'확정하고 잠금');}
function paintCaseLock(){if(!caseIsLocked())return;document.getElementById('undo-button').disabled=true;if(!document.querySelectorAll)return;for(const el of document.querySelectorAll('#content .data-grid input,#content .data-grid select,#content .data-grid .delete,#content [data-case-edit],#content select[aria-label="시나리오 기준"]')){el.disabled=true;el.setAttribute('title','확정된 CASE · 복제해 편집하세요');}for(const el of document.querySelectorAll('#content button[onclick]'))if(/(?:addPool|addProduct|addBom|addSiteDialog|deleteRow|editCaseDialog|applyGrid)/.test(el.getAttribute('onclick')||''))el.disabled=true;}
function planningScope(){return {site:siteFilter,product:productFilter,months:(!MONTHLY_VIEWS.has(view)&&view!=='scenario')||monthFilter==='all'?Array.from({length:12},(_,i)=>i+1):[Number(monthFilter)||1]};}
function planningRows(c,scope){const months=scope.months||Array.from({length:12},(_,i)=>i+1);return calculate(c).rows.filter(r=>(!scope.site||r.site===scope.site)&&(!scope.product||r.product===scope.product)&&months.includes(r.m));}
function planningScopeLabel(c,scope){return (c.products.find(p=>p.id===scope.product)?.name||scope.site||'전체 공장·제품')+' · '+(scope.months.length===12?'1~12월':scope.months.join(', ')+'월');}
function solveTargetPrice(c,target,scope){ensureCaseEditable(c);if(!Number.isFinite(target)||target<0||target>=1)throw Error('목표 영업이익률은 0% 이상, 100% 미만으로 입력하세요.');const work=clone(c),products=new Map(c.products.map(p=>[p.id,p]));const selected=work.rows.filter(r=>(!scope.site||products.get(r.product)?.site===scope.site)&&(!scope.product||r.product===scope.product)&&scope.months.includes(r.m)&&num(r.production)>0);if(!selected.length)throw Error('선택 기간에 판매량이 있는 제품이 없습니다.');if(selected.some(r=>!(num(r.currency==='USD'?r.usd:r.krw)>0)||(r.currency==='USD'&&!(num(r.fx)>0))))throw Error('판매량이 있는 모든 입력에 양수 판가와 필요한 환율을 먼저 등록하세요.');const prices=selected.map(r=>num(r.currency==='USD'?r.usd:r.krw));const evaluate=factor=>{selected.forEach((r,i)=>r[r.currency==='USD'?'usd':'krw']=prices[i]*factor);const a=aggregate(planningRows(work,scope));if(!Number.isFinite(a.op)||!Number.isFinite(a.revenue))throw Error('입력값이 너무 커서 계산할 수 없습니다.');return {a,error:a.op-target*a.revenue};};const before=aggregate(planningRows(c,scope));let lo=0,hi=1,L=evaluate(lo),H=evaluate(hi);if(L.error>1e-6)throw Error('판가를 0까지 낮춰도 목표를 만족시킬 수 없습니다. 비용과 배부를 확인하세요.');while(H.error<0&&hi<1048576){hi*=2;H=evaluate(hi);}if(H.error<0)throw Error('현재 원가·매출 연동 비용 구조에서는 목표 이익률에 도달할 수 없습니다.');for(let i=0;i<70;i++){const mid=(lo+hi)/2,E=evaluate(mid);if(E.error>=0)hi=mid;else lo=mid;}const factor=(lo+hi)/2,after=evaluate(factor).a;if(!(after.revenue>0)||Math.abs(after.opMargin-target)>1e-7)throw Error('양수 매출에서 목표 이익률을 찾지 못했습니다. 비용·판관비율을 확인하세요.');const draft={},items=[];for(let i=0;i<selected.length;i++){const r=selected[i],field=r.currency==='USD'?'usd':'krw',key=adjustmentCellKey('rows',r.id,field),value=r[field];draft[key]={mode:'set',value,label:r.currency==='USD'?'판매단가 USD':'판매단가 KRW',group:'매출',detail:products.get(r.product)?.name||r.product,unit:r.currency==='USD'?'USD/kg':'원/kg'};items.push({id:r.id,product:r.product,m:r.m,currency:r.currency,before:prices[i],after:value});}const result=applyFixedOperators(c,draft,scope);return {caseId:c.id,fingerprint:JSON.stringify(c),scope:clone(scope),target,factor,before,after,items,result,warnings:calculate(result.data).warnings};}

function previewTargetPrice(){pricePending=null;const el=document.getElementById('target-price-result');try{const raw=document.getElementById('target-price-margin').value;if(raw.trim()==='')throw Error('목표 영업이익률을 입력하세요.');const p=solveTargetPrice(active(),Number(raw)/100,priceSolverScope());pricePending=p;el.innerHTML='<div class="chat-preview"><strong>현재 판가 대비 '+(p.factor>=1?'+':'')+fmt((p.factor-1)*100,3)+'%</strong>'+safeTable(['선택 범위','현재','계산 후'],[['영업이익률',percent(p.before.opMargin),percent(p.after.opMargin)],['매출액',fmt(p.before.revenue)+' 원',fmt(p.after.revenue)+' 원'],['영업이익',fmt(p.before.op)+' 원',fmt(p.after.op)+' 원']])+safeTable(['제품 / 월','통화','현재 판가','계산 판가'],p.items.map(r=>[active().products.find(x=>x.id===r.product)?.name+' / '+r.m+'월',r.currency+'/kg',fmt(r.before,6),fmt(r.after,6)]))+(p.warnings.length?'<p class="negative">검산 '+p.warnings.length+'건이 있습니다. 검산을 해결한 후 적용하세요. '+esc(p.warnings[0].message)+'</p>':'<p>계산한 판가는 원래 통화로 저장합니다. 실제 거래에 사용할 반올림 단위는 별도로 검토하세요.</p>')+'</div>';}catch(e){el.textContent=e.message;}}
function commitTargetPrice(p,target,scope=null){ensureCaseEditable();if(active().id!==p.caseId||JSON.stringify(active())!==p.fingerprint||target!==p.target||(scope&&JSON.stringify(scope)!==JSON.stringify(p.scope)))throw Error('입력·범위 또는 목표가 바뀌었습니다. 다시 계산하세요.');if(p.warnings.length)throw Error('검산 경고를 해결한 뒤 판가를 적용하세요.');rememberEdit('목표 판가 적용');state.cases[state.cases.findIndex(c=>c.id===p.caseId)]=p.result.data;save();}

function buildProfitBridge(reference,current,scope){if(reference.year!==current.year)throw Error('같은 연도의 CASE를 선택하세요.');let work=clone(reference);const start=aggregate(planningRows(reference,scope)),end=aggregate(planningRows(current,scope));let previous=start.op;const steps=[];let intermediateWarnings=0;for(const [label,table,fields] of BRIDGE_GROUPS){const key=r=>table==='rows'?r.product+':'+r.m:r.id;const targets=new Map(current[table].map(r=>[key(r),r]));let changed=0;for(const row of work[table]){const target=targets.get(key(row));if(!target)continue;for(const field of fields)if(!equalScalar(row[field],target[field])){row[field]=target[field];changed++;}}if(changed){intermediateWarnings+=calculate(work).warnings.length;const now=aggregate(planningRows(work,scope)).op;steps.push({label,amount:now-previous,from:previous,to:now,changes:changed});previous=now;}}const structural=end.op-previous;steps.push({label:'배부·구조 및 기타',amount:structural,from:previous,to:end.op,changes:null});return {start,end,steps,scope:clone(scope),intermediateWarnings,reference:reference.scenario+' / '+reference.name,current:current.scenario+' / '+current.name,warnings:[...calculate(reference).warnings,...calculate(current).warnings],reconciliation:end.op-start.op-sum(steps.map(s=>s.amount))};}
function openProfitBridge(period){const c=active(),reference=state.cases.find(x=>x.id===(compareId||c.referenceId)&&x.id!==c.id);if(!reference){toast('시나리오 설정에서 기준 CASE를 선택하거나 상단 비교 기준을 선택하세요.');openScenarioSettings();return;}try{const scope=planningScope();if(period!==undefined)scope.months=period==='all'?Array.from({length:12},(_,i)=>i+1):[Number(period)];const b=buildProfitBridge(reference,c,scope),max=Math.max(1,...b.steps.map(s=>Math.abs(s.amount)));modal('손익 변화 분석','<p>'+esc(b.reference)+' → '+esc(b.current)+'</p><p>'+esc(planningScopeLabel(c,b.scope))+'</p><label class="field">대상 기간<select aria-label="손익 분석 기간" onchange="openProfitBridge(this.value)">'+planningPeriodOptions(b.scope.months)+'</select></label><div class="bridge-summary"><span>기준 영업이익 <b>'+fmt(b.start.op)+'원</b></span><span>현재 영업이익 <b>'+fmt(b.end.op)+'원</b></span><span>차이 <b>'+fmt(b.end.op-b.start.op)+'원</b></span></div><div class="profit-bridge">'+b.steps.filter(s=>Math.abs(s.amount)>1e-7||s.changes).map(s=>'<div class="bridge-row"><span>'+esc(s.label)+'</span><div class="bridge-track"><i class="'+(s.amount<0?'negative':'positive')+'" style="width:'+Math.max(0.5,Math.abs(s.amount)/max*100)+'%"></i></div><b>'+(s.amount>0?'+':'')+fmt(s.amount)+' 원</b></div>').join('')+'</div><details><summary>계산 내역</summary>'+safeTable(['항목','이익 증감 원','누적 영업이익 원'],b.steps.map(s=>[s.label,fmt(s.amount,4),fmt(s.to,4)]))+'</details><p>합계 검산 차이 '+fmt(b.reconciliation,Math.abs(b.reconciliation)<.000001?0:6)+'원</p><p class="hint">순차대체법: 표시 순서대로 기준 CASE 입력을 현재 값으로 바꿉니다. 상호작용 효과는 뒤 항목에 귀속되므로 순서에 따라 기여액은 달라집니다. 신규·삭제 제품, 비용 귀속·배부 기준, 기타 조건 등은 마지막 항목에 포함합니다. 조회 필터가 배부 분모를 바꾸지 않습니다.</p>'+(b.warnings.length?'<p class="negative">두 CASE에 검산 '+b.warnings.length+'건이 있어 가계산입니다.</p>':'')+(b.intermediateWarnings?'<p class="hint">순차대체 중 임시 상태에도 검산 경고가 발생했습니다. 항목별 효과는 실제 실행 가능한 생산계획을 의미하지 않습니다.</p>':''),()=>closeModal(),'닫기',false);}catch(e){toast(e.message);}}
