합계 경고와 실제 kg를 확인합니다. 다른 자재 비율을 함께 조정하고, 수율까지 올려 같은 개선 효과를 중복 반영하지 않습니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"투입비율","section":"FPA 입력 · 투입비율","kind":"reconcile","ref":"fpa","topicAliases":["BOM 비율","배합비"],"linkTitle":""}},{"title":"노무비 월금액 변경은 손익에 어떤 영향을 주나요?","aliases":[],"body":"월 노무비 1,000,000원을 5% 올리면 풀 총액은 1,050,000원입니다. 제품 배부액은 범위·공장 및 제품 기준에 따라 나뉩니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"노무비 월금액","section":"FPA 입력 · 노무비 월금액","kind":"impact","ref":"fpa","topicAliases":["월 인건비","배부 노무비"],"linkTitle":""}},{"title":"노무비 월금액 입력 단위와 실수하기 쉬운 점은 무엇인가요?","aliases":[],"body":"월 총액과 1인당 급여·kg당 노무비를 구분합니다. 역할별로 입력한다면 인원수와 단가가 이미 곱해진 금액인지 확인합니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"노무비 월금액","section":"FPA 입력 · 노무비 월금액","kind":"units","ref":"fpa","topicAliases":["월 인건비","배부 노무비"],"linkTitle":""}},{"title":"노무비 월금액를 조정한 뒤 무엇을 검산해야 하나요?","aliases":[],"body":"생산량 증감은 배부율을 바꿀 수 있지만 월 급여 풀을 자동 증감하지 않습니다. 잔업·신규 채용·교대 변경이 있으면 해당 월 노무비도 별도로 조정합니다.","formula":"","view":"help","group":"사용법","faq":{"topic":"노무비 월금액","section":"FPA 입력 · 노무비 월금액","kind":"reconcile","ref":"fpa","topicAliases":["월 인건비","배부 노무비"],"linkTitle":""}},{"title":"12월 급여를 1월에 지급하면 언제 비용인가요?","aliases":[],"body":"12월 근로에 대한 의무라면 12월 급여 비용과 미지급 부채를 인식합니다. 1월 지급은 부채 결제로 구분하므로 현금 지급월과 비용 귀속월이 다릅니다.","formula":"","view":"help","group":"회계","faq":{"topic":"발생주의","section":"재무 · 결산","kind":"scenario","ref":"concept","topicAliases":[],"linkTitle":""}},{"title":"선급 보험료 120만원을 12개월 보장받으면 월 비용은 얼마인가요?","aliases":[],"body":"보장 효익이 균등하다는 단순 가정에서 월 10만원입니다. 지급 시 선급비용 120만원을 인식하고 기간 경과에 따라 비용으로 대체합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"발생주의","section":"재무 · 결산","kind":"scenario","ref":"concept","topicAliases":[],"linkTitle":""}},{"title":"매출대금을 받았는데 매출이 아닐 수 있나요?","aliases":[],"body":"제품·서비스를 아직 이전하지 않았다면 선수금 또는 계약부채일 수 있습니다. 현금 수령 사실만으로 수행의무가 충족되지는 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"발생주의","section":"재무 · 결산","kind":"scenario","ref":"concept","topicAliases":[],"linkTitle":""}},{"title":"감가상각비는 현금이 안 나가는데 왜 비용인가요?","aliases":[],"body":"이미 취득한 자산의 감가상각대상금액을 효익 소비 기간에 배분하기 때문입니다. 당월 현금 유출은 없어도 이익은 줄며 현금흐름 간접법에서는 비현금 조정을 합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"발생주의","section":"재무 · 결산","kind":"scenario","ref":"concept","topicAliases":[],"linkTitle":""}},{"title":"출고했으면 무조건 매출인가요?","aliases":[],"body":"출고는 판단 지표일 뿐입니다. 고객에게 통제가 이전되었는지 계약 조건·인도 조건·검수·대금 청구권 등을 함께 확인합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"수익 인식 시점","section":"재무 · 수익","kind":"scenario","ref":"revenue","topicAliases":[],"linkTitle":""}},{"title":"세금계산서 발행일과 매출 인식일은 항상 같나요?","aliases":[],"body":"항상 같지는 않습니다. 회계상 수익은 수행의무 충족과 통제 이전 기준이고 세금계산서 발행은 세법상 공급시기 규정을 별도로 확인합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"수익 인식 시점","section":"재무 · 수익","kind":"scenario","ref":"revenue","topicAliases":[],"linkTitle":""}},{"title":"위탁판매처에 물건을 보내면 매출인가요?","aliases":[],"body":"반품·재고 위험과 통제가 계속 위탁자에게 있다면 운송만으로 매출을 인식하지 않습니다. 최종 판매 등 계약상 통제 이전 시점을 확인합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"수익 인식 시점","section":"재무 · 수익","kind":"scenario","ref":"revenue","topicAliases":[],"linkTitle":""}},{"title":"고객 검수가 형식적인 경우에도 검수일까지 매출을 미뤄야 하나요?","aliases":[],"body":"객관적 규격 충족을 이미 입증하고 검수가 실질적 통제 이전 조건이 아니라면 다른 통제 지표를 검토합니다. 검수 조항이 실질적인지 사실관계에 따라 판단합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"수익 인식 시점","section":"재무 · 수익","kind":"scenario","ref":"revenue","topicAliases":[],"linkTitle":""}},{"title":"반품이 예상되는 판매에서 매출 전액을 잡나요?","aliases":[],"body":"반품되지 않을 것으로 예상되는 부분의 수익, 환불부채, 반품 제품 회수권 자산을 구분합니다. 추정은 각 보고기간 말 갱신합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"반품권","section":"재무 · 수익","kind":"scenario","ref":"revenue","topicAliases":[],"linkTitle":""}},{"title":"100만원 판매 중 5만원 환불 예상이면 수익은 얼마인가요?","aliases":[],"body":"다른 변동대가 제약이 없다는 단순 예에서 수익 95만원, 환불부채 5만원입니다. 재고 회수권 자산은 해당 제품 원가와 회수 비용 등을 별도로 반영합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"반품권","section":"재무 · 수익","kind":"scenario","ref":"revenue","topicAliases":[],"linkTitle":""}},{"title":"반품 회수권 자산은 환불부채와 같은 금액인가요?","aliases":[],"body":"아닙니다. 환불부채는 고객에게 돌려줄 판매대가 기준이고 회수권 자산은 회수할 제품의 기존 장부금액에서 예상 회수 비용·가치 하락 등을 고려합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"반품권","section":"재무 · 수익","kind":"scenario","ref":"revenue","topicAliases":[],"linkTitle":""}},{"title":"반품 추정률이 바뀌면 과거 매출도 수정하나요?","aliases":[],"body":"새 정보에 따른 추정 변경이면 현재 기간과 향후 영향을 반영합니다. 과거에 이용 가능한 정보를 잘못 적용한 오류인지와 구분해야 합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"반품권","section":"재무 · 수익","kind":"scenario","ref":"revenue","topicAliases":[],"linkTitle":""}},{"title":"연말 매출 리베이트는 판관비인가요?","aliases":[],"body":"고객에게 지급하는 대가가 구별되는 재화·서비스의 공정가치에 대한 지급이 아니라면 일반적으로 거래가격과 수익의 감소를 검토합니다. 무조건 판매비로 처리하지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"고객 리베이트","section":"재무 · 수익","kind":"scenario","ref":"revenue","topicAliases":[],"linkTitle":""}},{"title":"물량 할인 가능성이 있으면 정가로 매출을 잡나요?","aliases":[],"body":"예상 할인은 변동대가를 추정하고 유의적인 수익 환원이 발생하지 않을 가능성이 매우 높은 범위에서 거래가격에 포함합니다. 계약별 조건을 검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"고객 리베이트","section":"재무 · 수익","kind":"scenario","ref":"revenue","topicAliases":[],"linkTitle":""}},{"title":"판매 장려금과 광고 용역비는 어떻게 구분하나요?","aliases":[],"body":"고객이 실제로 구별되는 광고 서비스를 제공하는지, 그 공정가치를 합리적으로 측정할 수 있는지 봅니다. 용역을 받는다는 명칭만으로 수익 차감 예외가 되지는 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"고객 리베이트","section":"재무 · 수익","kind":"scenario","ref":"revenue","topicAliases":[],"linkTitle":""}},{"title":"변동대가 추정은 계약 체결 때만 하나요?","aliases":[],"body":"보고기간 말마다 추정과 제약을 재평가합니다. 후속 리베이트 정산·실적·반품 정보가 최초 예상과 달라졌는지 확인합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"고객 리베이트","section":"재무 · 수익","kind":"scenario","ref":"revenue","topicAliases":[],"linkTitle":""}},{"title":"상품을 중개하면 판매대금 전체가 매출인가요?","aliases":[],"body":"고객 이전 전에 특정 재화·서비스를 통제하는 본인이면 총액, 다른 당사자의 공급을 주선하는 대리인이면 통상 수수료 순액을 수익으로 인식합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"본인과 대리인","section":"재무 · 수익","kind":"scenario","ref":"revenue","topicAliases":[],"linkTitle":""}},{"title":"거래대금이 제 계좌를 거치면 본인인가요?","aliases":[],"body":"현금 수납 경로만으로 판단하지 않습니다. 특정 재화의 통제, 이행 책임, 재고 위험, 가격 결정 재량 등 관련 지표를 종합합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"본인과 대리인","section":"재무 · 수익","kind":"scenario","ref":"revenue","topicAliases":[],"linkTitle":""}},{"title":"본인에서 대리인으로 바뀌면 이익률이 왜 높아질 수 있나요?","aliases":[],"body":"동일 이익이어도 매출 표시가 총액에서 순액으로 줄면 이익률 분모가 작아집니다. 사업 수익성 개선인지 표시 기준 변화인지 비교 기준을 맞춥니다.","formula":"","view":"help","group":"회계","faq":{"topic":"본인과 대리인","section":"재무 · 수익","kind":"scenario","ref":"revenue","topicAliases":[],"linkTitle":""}},{"title":"수수료 10만원인데 고객 결제액 100만원이면 매출은 얼마인가요?","aliases":[],"body":"대리인이고 받을 권리가 수수료 10만원뿐이라는 단순 조건에서는 수익은 10만원입니다. 나머지 금액의 정산 부채를 별도로 봅니다.","formula":"","view":"help","group":"회계","faq":{"topic":"본인과 대리인","section":"재무 · 수익","kind":"scenario","ref":"revenue","topicAliases":[],"linkTitle":""}},{"title":"계약을 따면 지급하는 영업 수수료는 무조건 즉시 비용인가요?","aliases":[],"body":"계약을 체결하지 않았다면 발생하지 않았을 증분원가이고 회수될 것으로 예상되면 계약 취득 원가 자산을 검토합니다. 상각 기간 1년 이하의 간편법 적용 여부도 확인합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"계약 취득 원가","section":"재무 · 수익","kind":"scenario","ref":"revenue","topicAliases":[],"linkTitle":""}},{"title":"입찰에 실패해도 드는 제안서 비용은 계약 자산인가요?","aliases":[],"body":"계약 성사 여부와 관계없이 발생하는 비용은 통상 계약 취득 증분원가가 아닙니다. 다른 자산 기준 적용 가능성이 없는 경우 비용 처리합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"계약 취득 원가","section":"재무 · 수익","kind":"scenario","ref":"revenue","topicAliases":[],"linkTitle":""}},{"title":"계약 취득 원가 자산과 계약자산은 같은 말인가요?","aliases":[],"body":"다릅니다. 전자는 수수료 등 원가의 자산화이고 계약자산은 이전한 재화·서비스에 대한 대가 권리에 시간 경과 외 조건이 남은 수익 관련 자산입니다.","formula":"","view":"help","group":"회계","faq":{"topic":"계약 취득 원가","section":"재무 · 수익","kind":"scenario","ref":"revenue","topicAliases":[],"linkTitle":""}},{"title":"계약 수수료 자산은 언제 상각하나요?","aliases":[],"body":"그 원가와 관련된 재화·서비스를 고객에게 이전하는 형태에 맞춰 체계적으로 상각합니다. 예상 갱신 계약 관련성·손상 가능성도 검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"계약 취득 원가","section":"재무 · 수익","kind":"scenario","ref":"revenue","topicAliases":[],"linkTitle":""}},{"title":"매출채권이 100만원 증가하면 영업현금흐름은 어떻게 되나요?","aliases":[],"body":"다른 변화가 없고 매출채권 증가가 영업 거래에 따른 것이라면 간접법에서 이익으로부터 100만원 차감합니다. 인식한 매출 중 현금을 못 받은 부분을 조정하는 것입니다.","formula":"","view":"help","group":"회계","faq":{"topic":"현금흐름 조정","section":"재무 · 현금","kind":"scenario","ref":"cash","topicAliases":[],"linkTitle":""}},{"title":"매입채무가 늘면 이익도 증가하나요?","aliases":[],"body":"구매·원가가 같다면 지급 시점 지연만으로 이익이 증가하지 않습니다. 영업 매입채무 증가는 간접법 영업현금흐름 조정에서 통상 가산 요소입니다.","formula":"","view":"help","group":"회계","faq":{"topic":"현금흐름 조정","section":"재무 · 현금","kind":"scenario","ref":"cash","topicAliases":[],"linkTitle":""}},{"title":"설비를 외상으로 사면 투자현금유출인가요?","aliases":[],"body":"취득 시 현금이 오가지 않았다면 당기 현금흐름표의 현금 유출로 포함하지 않고 중요한 비현금 거래를 공시합니다. 이후 결제 분류는 거래 실질을 검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"현금흐름 조정","section":"재무 · 현금","kind":"scenario","ref":"cash","topicAliases":[],"linkTitle":""}},{"title":"EBITDA가 플러스인데 현금이 줄 수 있나요?","aliases":[],"body":"채권·재고 증가, 설비투자, 세금·이자 지급, 차입 원금 상환 등이 원인일 수 있습니다. EBITDA는 현금흐름표와 같은 지표가 아닙니다.","formula":"","view":"help","group":"회계","faq":{"topic":"현금흐름 조정","section":"재무 · 현금","kind":"scenario","ref":"cash","topicAliases":[],"linkTitle":""}},{"title":"대손충당금이 있는데 실제 대손이 나면 비용을 또 잡나요?","aliases":[],"body":"이미 손실을 충당금으로 반영했다면 제각 시 통상 충당금을 사용합니다. 필요 충당금 부족분·추가 추정 변경이 있는지 별도로 확인합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"매출채권 회수","section":"재무 · 금융","kind":"scenario","ref":"financial","topicAliases":[],"linkTitle":""}},{"title":"연체가 없으면 대손충당금이 0인가요?","aliases":[],"body":"반드시 그렇지는 않습니다. 기대신용손실은 과거 사건뿐 아니라 현재 상황과 합리적 전망 정보를 반영하며 연체가 없어도 신용손실이 예상될 수 있습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"매출채권 회수","section":"재무 · 금융","kind":"scenario","ref":"financial","topicAliases":[],"linkTitle":""}},{"title":"매출채권 100에서 기대손실 3이면 순장부금액은 얼마인가요?","aliases":[],"body":"다른 조정이 없다면 채권 총액 100에서 손실충당금 3을 차감한 순액 97입니다. 현금 회수 예상 시점과 총매출은 별도입니다.","formula":"","view":"help","group":"회계","faq":{"topic":"매출채권 회수","section":"재무 · 금융","kind":"scenario","ref":"financial","topicAliases":[],"linkTitle":""}},{"title":"팩토링하면 매출채권을 무조건 제거하나요?","aliases":[],"body":"위험·보상의 이전 및 통제 등 금융자산 제거 요건을 검토합니다. 상환청구권·보증·계속관여가 있으면 단순 매각이라는 계약 명칭만으로 판단하지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"매출채권 회수","section":"재무 · 금융","kind":"scenario","ref":"financial","topicAliases":[],"linkTitle":""}},{"title":"채권을 만기까지 보유하면 무조건 상각후원가인가요?","aliases":[],"body":"사업모형이 계약상 현금흐름 수취 목적이고 계약상 현금흐름이 원금과 이자만으로 구성되는지 등 IFRS 9 요건을 함께 충족해야 합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"금융자산 측정","section":"재무 · 금융","kind":"scenario","ref":"financial","topicAliases":[],"linkTitle":""}},{"title":"채권 가격이 올랐는데 상각후원가 자산의 평가이익을 잡나요?","aliases":[],"body":"상각후원가 분류라면 단순 시장가격 상승을 당기 평가이익으로 반영하는 모형이 아닙니다. 유효이자·손상·제거 등 관련 처리를 별도로 검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"금융자산 측정","section":"재무 · 금융","kind":"scenario","ref":"financial","topicAliases":[],"linkTitle":""}},{"title":"주식 투자 배당은 항상 투자 장부금액을 줄이나요?","aliases":[],"body":"IFRS 9 지분상품의 배당은 수취 권리 확정 등 요건에 따라 통상 당기손익을 검토합니다. 지분법 투자 배당은 투자 장부금액 감소라는 다른 모형입니다.","formula":"","view":"help","group":"회계","faq":{"topic":"금융자산 측정","section":"재무 · 금융","kind":"scenario","ref":"financial","topicAliases":[],"linkTitle":""}},{"title":"FVOCI 지분상품을 팔면 누적 OCI를 손익으로 돌리나요?","aliases":[],"body":"IFRS 9의 취소불가능한 FVOCI 선택 지분상품은 처분 시 누적 OCI를 당기손익으로 재분류하지 않습니다. FVOCI 채무상품의 재분류와 구분합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"금융자산 측정","section":"재무 · 금융","kind":"scenario","ref":"financial","topicAliases":[],"linkTitle":""}},{"title":"액면 100에 할인발행 95면 최초 부채는 100인가요?","aliases":[],"body":"일반 상각후원가 부채라면 최초 공정가치와 직접 거래원가를 고려한 금액을 검토합니다. 할인 5를 즉시 전액 이자 비용으로 처리하는 단순 방식과 다릅니다.","formula":"","view":"help","group":"회계","faq":{"topic":"사채와 이자","section":"재무 · 금융","kind":"scenario","ref":"financial","topicAliases":[],"linkTitle":""}},{"title":"사채 장부 95에 유효이자 10%, 지급이자 8이면 기말 장부는 얼마인가요?","aliases":[],"body":"한 기간의 단순 예에서 이자비용 9.5, 현금 지급 8, 할인 상각 1.5이므로 기말 장부금액은 96.5입니다. 기중 발행·상환은 제외합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"사채와 이자","section":"재무 · 금융","kind":"scenario","ref":"financial","topicAliases":[],"linkTitle":""}},{"title":"차입 원금 100을 상환하면 비용이 100 늘어나나요?","aliases":[],"body":"원금 상환은 부채 감소와 현금 감소 거래입니다. 이자·상환손익·수수료 등 별도 요소가 없다면 원금 자체가 손익 비용은 아닙니다.","formula":"","view":"help","group":"회계","faq":{"topic":"사채와 이자","section":"재무 · 금융","kind":"scenario","ref":"financial","topicAliases":[],"linkTitle":""}},{"title":"금융부채를 조기 상환하면 무엇을 비교하나요?","aliases":[],"body":"제거하는 부채 장부금액과 지급 대가 등을 비교해 제거손익을 검토합니다. 미상각 거래원가와 상환 수수료를 빠뜨리지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"사채와 이자","section":"재무 · 금융","kind":"scenario","ref":"financial","topicAliases":[],"linkTitle":""}},{"title":"자기주식을 사면 투자자산으로 잡나요?","aliases":[],"body":"자기지분상품의 재취득은 통상 자본 차감입니다. 자사주를 금융자산처럼 평가하고 평가손익을 인식하는 방식이 아닙니다.","formula":"","view":"help","group":"회계","faq":{"topic":"자기주식과 배당","section":"재무 · 자본","kind":"scenario","ref":"equity","topicAliases":[],"linkTitle":""}},{"title":"자기주식 처분 차익은 당기순이익인가요?","aliases":[],"body":"자기지분상품 거래에서 발생한 차액은 자본에서 처리하며 통상 당기손익을 인식하지 않습니다. 다른 회사 주식 매각과 구분합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"자기주식과 배당","section":"재무 · 자본","kind":"scenario","ref":"equity","topicAliases":[],"linkTitle":""}},{"title":"현금배당을 결의하면 비용이 생기나요?","aliases":[],"body":"주주에 대한 이익 분배로서 일반 영업 비용이 아닙니다. 배당 의무 성립 시점의 부채 인식과 이익잉여금 감소를 검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"자기주식과 배당","section":"재무 · 자본","kind":"scenario","ref":"equity","topicAliases":[],"linkTitle":""}},{"title":"유상증자 100을 받으면 매출이 100인가요?","aliases":[],"body":"소유주로서의 자본 출자는 수익과 다릅니다. 현금과 자본이 증가하며 발행 관련 직접 거래원가 등도 별도로 검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"자기주식과 배당","section":"재무 · 자본","kind":"scenario","ref":"equity","topicAliases":[],"linkTitle":""}},{"title":"기중 7월 1일 100주를 증자하면 가중평균 주식수는 어떻게 되나요?","aliases":[],"body":"기초 100주, 1년의 절반 뒤 100주 추가라는 단순 가정에서 100×1년+100×0.5년=150주입니다. 실제 날짜·무상요소는 별도 조정합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"주당이익 사례","section":"재무 · 자본","kind":"scenario","ref":"eps","topicAliases":[],"linkTitle":""}},{"title":"무상증자를 하면 비교 EPS도 바꾸나요?","aliases":[],"body":"대응 자원 증가 없이 주식수가 바뀌는 무상증자·주식분할 등은 비교기간 가중평균 주식수의 소급 조정을 검토합니다. 단순 유상증자와 다릅니다.","formula":"","view":"help","group":"회계","faq":{"topic":"주당이익 사례","section":"재무 · 자본","kind":"scenario","ref":"eps","topicAliases":[],"linkTitle":""}},{"title":"적자인데 전환사채를 희석 EPS에 포함하나요?","aliases":[],"body":"전환 가정이 주당손실을 줄여 반희석 효과를 낸다면 희석 EPS 계산에서 제외합니다. 모든 잠재적 보통주를 기계적으로 넣지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"주당이익 사례","section":"재무 · 자본","kind":"scenario","ref":"eps","topicAliases":[],"linkTitle":""}},{"title":"우선주 배당은 기본 EPS 분자에서 빼나요?","aliases":[],"body":"보통주주 귀속 이익을 산정하기 위해 우선배당 성격과 누적 여부 등 IAS 33 요건에 따른 조정이 필요합니다. 전체 순이익을 그대로 쓰지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"주당이익 사례","section":"재무 · 자본","kind":"scenario","ref":"eps","topicAliases":[],"linkTitle":""}},{"title":"원재료 매입 운송료는 재료비에 들어가나요?","aliases":[],"body":"재고를 현재 장소와 상태로 가져오는 데 직접 관련된 운송·취급 비용은 취득원가에 포함될 수 있습니다. 고객 배송비와 구분합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"재고 취득원가","section":"재무 · 재고","kind":"scenario","ref":"inventory","topicAliases":[],"linkTitle":""}},{"title":"회수 가능한 부가세도 재고 원가인가요?","aliases":[],"body":"과세당국에서 회수 가능한 세금은 통상 재고 취득원가에서 제외합니다. 환급 불가능한 세금과 할인·리베이트는 성격에 맞춰 취득원가에 반영합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"재고 취득원가","section":"재무 · 재고","kind":"scenario","ref":"inventory","topicAliases":[],"linkTitle":""}},{"title":"비정상 폐기 손실도 정상 제품에 배부하나요?","aliases":[],"body":"비정상적으로 낭비된 재료·노무·생산 원가는 재고 원가에서 제외하고 발생 기간 비용으로 인식하는 원칙을 검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"재고 취득원가","section":"재무 · 재고","kind":"scenario","ref":"inventory","topicAliases":[],"linkTitle":""}},{"title":"재고 원가 100, 판매가 95, 판매비용 5면 평가액은 얼마인가요?","aliases":[],"body":"추가 완성원가가 없으면 순실현가능가치 90으로 원가보다 낮아 평가액은 90, 평가손실은 10입니다. FPA 전량판매 모형의 재고 기능과는 별도 학습 사례입니다.","formula":"","view":"help","group":"회계","faq":{"topic":"재고 취득원가","section":"재무 · 재고","kind":"scenario","ref":"inventory","topicAliases":[],"linkTitle":""}},{"title":"새 기계 운송비와 설치비는 취득원가인가요?","aliases":[],"body":"경영진이 의도한 방식으로 가동할 수 있는 장소와 상태에 이르게 하는 직접 관련 원가는 자산 취득원가에 포함될 수 있습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"설비 취득원가","section":"재무 · 자산","kind":"scenario","ref":"asset","topicAliases":[],"linkTitle":""}},{"title":"기계 사용법 교육비도 기계 원가인가요?","aliases":[],"body":"직원 교육비는 보통 자산을 의도한 장소·상태로 만드는 직접 관련 원가로 포함하지 않습니다. 기계 설치·필수 시험과 구분합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"설비 취득원가","section":"재무 · 자산","kind":"scenario","ref":"asset","topicAliases":[],"linkTitle":""}},{"title":"기계 가동 전 초기 영업손실도 자산인가요?","aliases":[],"body":"의도한 방식으로 가동 가능한 상태에 이른 뒤의 저조한 초기 실적·운영 손실은 자산 취득원가에 포함하지 않습니다. 정상 생산원가 여부는 별도 검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"설비 취득원가","section":"재무 · 자산","kind":"scenario","ref":"asset","topicAliases":[],"linkTitle":""}},{"title":"설비 철거 의무는 취득 시 아무것도 안 잡나요?","aliases":[],"body":"현재 의무와 충당부채 요건을 충족하면 최초 복구·철거 의무 추정치의 현재가치를 자산 원가와 관련 부채에 반영할 수 있습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"설비 취득원가","section":"재무 · 자산","kind":"scenario","ref":"asset","topicAliases":[],"linkTitle":""}},{"title":"기계의 주요 부품 수명이 다르면 어떻게 상각하나요?","aliases":[],"body":"전체 취득원가에서 중요한 구성요소의 효익 소비 형태·내용연수가 다르면 별도 감가상각을 적용합니다. 주요 부품 교체 시 기존 구성요소 제거도 검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"부품과 감가 추정","section":"재무 · 자산","kind":"scenario","ref":"asset","topicAliases":[],"linkTitle":""}},{"title":"기계를 쉬게 하면 정액법 감가를 중단하나요?","aliases":[],"body":"유휴 상태라는 이유만으로 정액법 감가를 통상 중단하지 않습니다. 매각예정 분류·제거·전액 상각 여부와 생산량비례법의 특성은 따로 확인합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"부품과 감가 추정","section":"재무 · 자산","kind":"scenario","ref":"asset","topicAliases":[],"linkTitle":""}},{"title":"내용연수를 5년에서 8년으로 바꾸면 과거 감가도 고치나요?","aliases":[],"body":"새 정보에 따른 추정 변경이면 변경 시점 장부금액과 잔여 효익에 근거해 당기·미래 기간에 전진 적용합니다. 과거 오류와 구분합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"부품과 감가 추정","section":"재무 · 자산","kind":"scenario","ref":"asset","topicAliases":[],"linkTitle":""}},{"title":"잔존가치가 장부금액보다 높아지면 감가는 어떻게 되나요?","aliases":[],"body":"잔존가치가 장부금액 이상이면 감가상각비는 통상 0이 됩니다. 이후 잔존가치가 장부금액 아래로 낮아지는지 주기적으로 재검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"부품과 감가 추정","section":"재무 · 자산","kind":"scenario","ref":"asset","topicAliases":[],"linkTitle":""}},{"title":"건물 가격이 오르면 임의로 자산을 올려도 되나요?","aliases":[],"body":"적용 회계기준과 원가·재평가 정책을 확인합니다. 재평가모형을 선택하면 공정가치를 신뢰성 있게 측정하고 같은 자산 종류 전체에 일관되게 적용하는 등 요건을 따릅니다.","formula":"","view":"help","group":"회계","faq":{"topic":"재평가 모형","section":"재무 · 자산","kind":"scenario","ref":"asset","topicAliases":[],"linkTitle":""}},{"title":"재평가 증가액은 무조건 당기이익인가요?","aliases":[],"body":"보통 OCI와 재평가잉여금으로 반영하되 동일 자산의 과거 손익 인식 감소분 환입 등 예외를 검토합니다. 단순 처분이익과 다릅니다.","formula":"","view":"help","group":"회계","faq":{"topic":"재평가 모형","section":"재무 · 자산","kind":"scenario","ref":"asset","topicAliases":[],"linkTitle":""}},{"title":"재평가 감소액은 어디에 반영하나요?","aliases":[],"body":"통상 손익이지만 동일 자산 관련 재평가잉여금 잔액이 있다면 그 범위에서 OCI 감소를 검토합니다. 자산별 이력을 확인합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"재평가 모형","section":"재무 · 자산","kind":"scenario","ref":"asset","topicAliases":[],"linkTitle":""}},{"title":"토지를 재평가하면 감가상각이 생기나요?","aliases":[],"body":"통상 내용연수가 비한정인 토지는 감가하지 않습니다. 재평가 여부보다 자산의 내용연수·효익 소비 특성이 감가 판단의 출발점입니다.","formula":"","view":"help","group":"회계","faq":{"topic":"재평가 모형","section":"재무 · 자산","kind":"scenario","ref":"asset","topicAliases":[],"linkTitle":""}},{"title":"장부 100, 순공정가치 80, 사용가치 90이면 손상은 얼마인가요?","aliases":[],"body":"회수가능액은 두 금액 중 큰 90이고 장부 100을 초과하므로 손상차손은 10입니다. 회수가능액을 평균 85로 계산하지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"손상 회수가능액","section":"재무 · 자산","kind":"scenario","ref":"impairment","topicAliases":[],"linkTitle":""}},{"title":"개별 설비 현금흐름을 구분하기 어려우면 어떻게 하나요?","aliases":[],"body":"다른 자산과 대체로 독립적인 현금유입을 창출하는 최소 단위인 현금창출단위에서 손상 검사를 검토합니다. 임의의 큰 조직으로 손상을 숨기지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"손상 회수가능액","section":"재무 · 자산","kind":"scenario","ref":"impairment","topicAliases":[],"linkTitle":""}},{"title":"영업권 손상차손은 나중에 환입할 수 있나요?","aliases":[],"body":"영업권에 인식한 손상차손은 후속 기간에 환입하지 않습니다. 일반 자산의 제한적 손상환입과 구분합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"손상 회수가능액","section":"재무 · 자산","kind":"scenario","ref":"impairment","topicAliases":[],"linkTitle":""}},{"title":"일반 설비 손상환입은 한도가 없나요?","aliases":[],"body":"손상이 없었다면 감가 후 남았을 장부금액 등을 한도로 검토합니다. 회수가능액이 올랐다고 원래 장부를 무제한 초과해 손익 환입하지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"손상 회수가능액","section":"재무 · 자산","kind":"scenario","ref":"impairment","topicAliases":[],"linkTitle":""}},{"title":"직접 만든 브랜드를 자산으로 잡을 수 있나요?","aliases":[],"body":"내부 창출 브랜드·고객목록 등은 사업 전체 개발원가와 구분해 측정하기 어렵기 때문에 일반적으로 무형자산으로 인식하지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"무형자산 식별","section":"재무 · 자산","kind":"scenario","ref":"research","topicAliases":[],"linkTitle":""}},{"title":"소프트웨어를 샀다면 모두 즉시 비용인가요?","aliases":[],"body":"통제하는 식별가능 자원과 인식 요건을 충족하면 무형자산을 검토합니다. 단순 클라우드 서비스 이용권과 소유·통제하는 소프트웨어 자산을 구분합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"무형자산 식별","section":"재무 · 자산","kind":"scenario","ref":"research","topicAliases":[],"linkTitle":""}},{"title":"내용연수 비한정 무형자산도 매년 상각하나요?","aliases":[],"body":"비한정 내용연수 자산은 상각하지 않고 매년 및 징후가 있을 때 손상을 검사합니다. 비한정 판단이 계속 적절한지도 재검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"무형자산 식별","section":"재무 · 자산","kind":"scenario","ref":"research","topicAliases":[],"linkTitle":""}},{"title":"예전에 비용 처리한 개발 지출을 나중에 자산으로 복원하나요?","aliases":[],"body":"과거에 비용으로 인식한 지출은 나중에 자산 인식 요건을 충족했다고 무형자산 원가로 다시 인식하지 않습니다. 요건 충족 이후 지출을 구분합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"무형자산 식별","section":"재무 · 자산","kind":"scenario","ref":"research","topicAliases":[],"linkTitle":""}},{"title":"연구 성공 확률이 높으면 연구비를 자산화하나요?","aliases":[],"body":"연구단계 지출은 성공 기대가 높아도 비용입니다. 개발단계에서 IAS 38의 모든 인식 요건을 입증하는 것과 구분합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"연구와 개발 사례","section":"재무 · 자산","kind":"scenario","ref":"research","topicAliases":[],"linkTitle":""}},{"title":"개발비 요건을 7월에 충족했으면 1월 비용까지 자산화하나요?","aliases":[],"body":"통상 요건을 처음 충족한 날 이후의 적격 지출을 자산 원가에 포함합니다. 1~6월에 비용 처리한 지출을 소급해 되살리지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"연구와 개발 사례","section":"재무 · 자산","kind":"scenario","ref":"research","topicAliases":[],"linkTitle":""}},{"title":"개발비를 자산화하면 EBITDA가 좋아질 수 있나요?","aliases":[],"body":"당기 지출 전액을 비용 처리하는 경우보다 당기 손익 비용이 줄 수 있습니다. 현금 유출은 남고 이후 상각·손상 가능성이 있어 자본화 정책을 비교해야 합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"연구와 개발 사례","section":"재무 · 자산","kind":"scenario","ref":"research","topicAliases":[],"linkTitle":""}},{"title":"연구개발 단계 구분이 안 되면 어떻게 하나요?","aliases":[],"body":"개발단계와 연구단계를 구분할 수 없다면 해당 프로젝트 지출을 연구단계에서 발생한 것처럼 처리하는 원칙을 검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"연구와 개발 사례","section":"재무 · 자산","kind":"scenario","ref":"research","topicAliases":[],"linkTitle":""}},{"title":"공장 공사가 중단되면 이자를 계속 자본화하나요?","aliases":[],"body":"장기간 적극적인 개발 활동이 중단되면 통상 자본화를 일시 중단합니다. 필요한 일시 지연·기술 행정 작업이 계속되는 경우 등 사실관계를 구분합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"차입원가 사례","section":"재무 · 자산","kind":"scenario","ref":"borrowing","topicAliases":[],"linkTitle":""}},{"title":"공장 완공 후 대출이 남으면 이자도 계속 자산인가요?","aliases":[],"body":"의도한 사용·판매를 준비하는 데 필요한 활동이 실질적으로 완료되면 자본화를 종료하는 원칙을 검토합니다. 대출 잔존 여부만으로 계속 자본화하지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"차입원가 사례","section":"재무 · 자산","kind":"scenario","ref":"borrowing","topicAliases":[],"linkTitle":""}},{"title":"모든 장기 자산이 차입원가 적격자산인가요?","aliases":[],"body":"의도한 사용·판매가 가능해지기까지 상당한 기간이 필요한 자산인지 봅니다. 즉시 사용 가능한 설비를 샀다는 이유만으로 모두 적격자산이 되지는 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"차입원가 사례","section":"재무 · 자산","kind":"scenario","ref":"borrowing","topicAliases":[],"linkTitle":""}},{"title":"특정 차입금의 일시 운용 이익은 자본화에 어떤 영향을 주나요?","aliases":[],"body":"특정 차입 자금의 적격자산 지출 전 일시 운용에서 생긴 투자수익은 관련 차입원가에서 차감하는 요건을 검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"차입원가 사례","section":"재무 · 자산","kind":"scenario","ref":"borrowing","topicAliases":[],"linkTitle":""}},{"title":"정부지원금 입금만 되면 바로 이익인가요?","aliases":[],"body":"관련 조건을 준수하고 보조금을 수취할 것이라는 합리적 확신 등 인식 요건을 확인합니다. 입금만으로 모든 조건 충족을 단정하지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"정부보조금","section":"재무 · 자산","kind":"scenario","ref":"grants","topicAliases":[],"linkTitle":""}},{"title":"설비 보조금은 무조건 취득원가에서 빼나요?","aliases":[],"body":"자산 관련 보조금은 이연수익 표시 또는 자산 장부금액 차감 등 IAS 20 허용 방식을 검토합니다. 선택 정책을 일관되게 적용합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"정부보조금","section":"재무 · 자산","kind":"scenario","ref":"grants","topicAliases":[],"linkTitle":""}},{"title":"보조금으로 산 자산은 감가상각이 없나요?","aliases":[],"body":"보조금 표시 방식과 상관없이 자산의 효익 소비를 반영합니다. 이연수익 방식은 감가와 보조금 수익을 대응하고 차감 방식은 순장부 기준 감가를 검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"정부보조금","section":"재무 · 자산","kind":"scenario","ref":"grants","topicAliases":[],"linkTitle":""}},{"title":"인건비 보조금은 받은 달에 모두 수익인가요?","aliases":[],"body":"보상하려는 관련 원가를 비용으로 인식하는 기간에 걸쳐 체계적으로 손익 반영하는 원칙을 검토합니다. 반환 조건·미사용 잔액을 확인합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"정부보조금","section":"재무 · 자산","kind":"scenario","ref":"grants","topicAliases":[],"linkTitle":""}},{"title":"리스료 100을 냈으면 비용도 100인가요?","aliases":[],"body":"사용권자산·리스부채를 인식하는 계약이면 원금 감소와 이자, 사용권 감가가 구분됩니다. 현금 지급액과 손익 비용은 일치하지 않을 수 있습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"리스 이용자 사례","section":"재무 · 리스","kind":"scenario","ref":"leases","topicAliases":[],"linkTitle":""}},{"title":"보증금은 전부 임차료 비용인가요?","aliases":[],"body":"반환 받을 권리가 있는 보증금은 보통 금융자산 성격을 검토합니다. 장기 무이자 보증금의 현재가치와 리스 관련 조정은 별도로 판단합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"리스 이용자 사례","section":"재무 · 리스","kind":"scenario","ref":"leases","topicAliases":[],"linkTitle":""}},{"title":"계약 기간이 11개월이면 무조건 단기리스 예외인가요?","aliases":[],"body":"리스기간은 연장·해지 선택권의 행사 가능성 등을 반영합니다. 매수선택권이 있는지 등 단기리스 정의와 기업의 선택 정책을 함께 확인합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"리스 이용자 사례","section":"재무 · 리스","kind":"scenario","ref":"leases","topicAliases":[],"linkTitle":""}},{"title":"리스 도입 전후 EBITDA는 그대로 비교해도 되나요?","aliases":[],"body":"임차료 비용이 감가·이자로 바뀌면서 EBITDA가 상승할 수 있습니다. 사업 현금창출력이 같은지 리스 현금 지급·부채·회계정책을 함께 비교합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"리스 이용자 사례","section":"재무 · 리스","kind":"scenario","ref":"leases","topicAliases":[],"linkTitle":""}},{"title":"미사용 연차는 사용 전에도 부채가 생기나요?","aliases":[],"body":"누적 유급휴가라면 근로 제공으로 향후 휴가 권리가 증가할 때 관련 원가·부채를 검토합니다. 소멸·이월·현금 정산 조건과 추정 사용액을 확인합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"종업원급여 사례","section":"재무 · 급여","kind":"scenario","ref":"employee","topicAliases":[],"linkTitle":""}},{"title":"확정기여형 퇴직연금 납입액은 투자자산인가요?","aliases":[],"body":"기업의 추가 의무가 납입액으로 한정되는 확정기여형이라면 근로 제공에 따른 납입 의무를 비용·미지급액 등으로 검토합니다. 별도 기업 자산으로 단순 누적하지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"종업원급여 사례","section":"재무 · 급여","kind":"scenario","ref":"employee","topicAliases":[],"linkTitle":""}},{"title":"확정급여 재측정손실은 영업비용인가요?","aliases":[],"body":"IAS 19의 확정급여 순부채 재측정요소는 OCI에 인식하고 후속 손익으로 재분류하지 않습니다. 근무원가·순이자와 표시를 구분합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"종업원급여 사례","section":"재무 · 급여","kind":"scenario","ref":"employee","topicAliases":[],"linkTitle":""}},{"title":"퇴직금 현금 지급액과 퇴직급여 비용이 다른 이유는 무엇인가요?","aliases":[],"body":"현금 지급은 누적 의무의 결제이고 당기 비용은 당기 근로·이자 등 해당 기간 인식분입니다. 충당 의무·사외적립자산·재측정을 함께 대사합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"종업원급여 사례","section":"재무 · 급여","kind":"scenario","ref":"employee","topicAliases":[],"linkTitle":""}},{"title":"스톡옵션은 현금이 안 나가니 비용이 없나요?","aliases":[],"body":"지분결제형 보상도 종업원 근로를 대가로 받으면 관련 보상비용과 자본을 인식합니다. 비현금이라는 이유만으로 비용이 사라지지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"주식기준보상","section":"재무 · 급여","kind":"scenario","ref":"sharepay","topicAliases":[],"linkTitle":""}},{"title":"지분결제 보상은 매년 주가로 다시 평가하나요?","aliases":[],"body":"종업원 지분결제형은 통상 부여일 공정가치를 기준으로 인식합니다. 현금결제형 부채의 후속 공정가치 재측정과 구분합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"주식기준보상","section":"재무 · 급여","kind":"scenario","ref":"sharepay","topicAliases":[],"linkTitle":""}},{"title":"근무조건 미충족 퇴사자가 생기면 보상비용은 어떻게 되나요?","aliases":[],"body":"가득될 것으로 예상하는 수량을 근무조건 등 비시장 가득조건에 맞춰 수정합니다. 시장조건 처리와 다르므로 옵션 조건을 확인합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"주식기준보상","section":"재무 · 급여","kind":"scenario","ref":"sharepay","topicAliases":[],"linkTitle":""}},{"title":"현금결제형 주가연동 보상 부채는 언제 재측정하나요?","aliases":[],"body":"부채를 각 보고기간 말과 결제일에 공정가치로 재측정하고 변동을 통상 손익에 반영합니다. 지분결제형과 같은 고정 금액 모형이 아닙니다.","formula":"","view":"help","group":"회계","faq":{"topic":"주식기준보상","section":"재무 · 급여","kind":"scenario","ref":"sharepay","topicAliases":[],"linkTitle":""}},{"title":"내년 정기 수선 예산이 있으면 올해 충당부채인가요?","aliases":[],"body":"계획만으로 현재 의무가 생기지는 않습니다. 과거 사건으로 인한 법적·의제 의무, 자원 유출 가능성, 신뢰성 있는 추정 요건을 충족해야 합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"충당부채 사례","section":"재무 · 부채","kind":"scenario","ref":"provisions","topicAliases":[],"linkTitle":""}},{"title":"소송 패소 가능성이 있으면 무조건 부채인가요?","aliases":[],"body":"현재 의무와 유출 가능성·추정 가능성을 평가합니다. 충당부채 인식 요건을 충족하지 않는 우발부채는 공시 여부를 따로 검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"충당부채 사례","section":"재무 · 부채","kind":"scenario","ref":"provisions","topicAliases":[],"linkTitle":""}},{"title":"충당부채로 비용을 잡은 후 지급하면 비용을 다시 잡나요?","aliases":[],"body":"처음 인식한 의무의 결제라면 관련 충당부채를 사용합니다. 새 의무·추정 차이가 있는 부분을 구분해 중복 비용을 피합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"충당부채 사례","section":"재무 · 부채","kind":"scenario","ref":"provisions","topicAliases":[],"linkTitle":""}},{"title":"미래 영업손실을 충당부채로 미리 쌓아도 되나요?","aliases":[],"body":"미래 영업손실 자체는 일반적으로 현재 의무가 아니므로 충당부채를 인식하지 않습니다. 손실부담계약·자산 손상 징후는 별도로 검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"충당부채 사례","section":"재무 · 부채","kind":"scenario","ref":"provisions","topicAliases":[],"linkTitle":""}},{"title":"감가상각 세무 한도 차이는 영구적 차이인가요?","aliases":[],"body":"회계와 세무 장부 차이가 미래에 해소될 수 있다면 일시적 차이를 검토합니다. 영구적 손금불산입과 달리 이연법인세가 관련될 수 있습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"이연법인세 사례","section":"재무 · 법인세","kind":"scenario","ref":"tax","topicAliases":[],"linkTitle":""}},{"title":"벌금 손금불산입도 이연법인세자산인가요?","aliases":[],"body":"미래에도 공제되지 않는 영구적 차이라면 통상 이연법인세자산을 만들지 않습니다. 실제 세법상 성격·가산조정 내용을 확인합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"이연법인세 사례","section":"재무 · 법인세","kind":"scenario","ref":"tax","topicAliases":[],"linkTitle":""}},{"title":"적자 회사도 이연법인세자산을 잡을 수 있나요?","aliases":[],"body":"차감할 일시적 차이·이월결손금 등이 이용될 과세소득 발생 가능성 등 인식 요건을 충족하는 범위에서 검토합니다. 결손이 있다는 이유만으로 전액 인식하지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"이연법인세 사례","section":"재무 · 법인세","kind":"scenario","ref":"tax","topicAliases":[],"linkTitle":""}},{"title":"법인세 비용은 납부세액과 같은가요?","aliases":[],"body":"당기법인세와 이연법인세의 손익 반영분 등을 포함하므로 실제 납부액과 다를 수 있습니다. OCI·자본 관련 세효과의 귀속도 구분합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"이연법인세 사례","section":"재무 · 법인세","kind":"scenario","ref":"tax","topicAliases":[],"linkTitle":""}},{"title":"달러 매출채권은 기말에 환율을 다시 적용하나요?","aliases":[],"body":"외화 화폐성 항목인 매출채권은 통상 기말 마감환율로 환산하고 환산 차이를 손익에 반영합니다. 외화 매출 인식 시 거래일 환율과 구분합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"외화 결산 사례","section":"재무 · 외화","kind":"scenario","ref":"fx","topicAliases":[],"linkTitle":""}},{"title":"외화 선급금도 매출채권처럼 기말 재평가하나요?","aliases":[],"body":"재화·서비스를 받을 권리인 비화폐성 선급금은 통상 같은 화폐성 재평가 모형이 아닙니다. 환급 권리 등 계약 실질을 확인합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"외화 결산 사례","section":"재무 · 외화","kind":"scenario","ref":"fx","topicAliases":[],"linkTitle":""}},{"title":"달러로 산 기계는 환율이 오르면 장부도 매년 오르나요?","aliases":[],"body":"역사적 원가로 측정하는 비화폐성 자산은 통상 거래일 환율을 사용합니다. 관련 외화 채무의 결산 환산과 기계 장부를 구분합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"외화 결산 사례","section":"재무 · 외화","kind":"scenario","ref":"fx","topicAliases":[],"linkTitle":""}},{"title":"원달러 환율 상승은 수출 기업에 무조건 이익인가요?","aliases":[],"body":"달러 매출뿐 아니라 달러 원재료·차입·헤지·가격 전가를 함께 봐야 합니다. FPA는 판매·BOM 환율 민감도를 비교하지만 외화 채무 환차손익까지 자동 계산하지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"외화 결산 사례","section":"재무 · 외화","kind":"scenario","ref":"fx","topicAliases":[],"linkTitle":""}},{"title":"모회사에서 자회사에 팔면 연결 매출도 늘어나나요?","aliases":[],"body":"그룹 내부 거래의 수익·비용·채권·채무는 연결에서 제거합니다. 최종 외부 고객과의 거래를 기준으로 그룹 성과를 봅니다.","formula":"","view":"help","group":"회계","faq":{"topic":"내부거래 제거","section":"재무 · 연결","kind":"scenario","ref":"consolidation","topicAliases":[],"linkTitle":""}},{"title":"내부 매출 100의 이익 20이 기말재고에 남으면 어떻게 하나요?","aliases":[],"body":"연결에서 내부거래를 제거하고 외부 판매 전 재고에 포함된 미실현이익 20을 조정합니다. 관련 세효과·비지배지분 등은 거래 방향에 따라 검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"내부거래 제거","section":"재무 · 연결","kind":"scenario","ref":"consolidation","topicAliases":[],"linkTitle":""}},{"title":"지분 50% 미만이면 연결을 안 하나요?","aliases":[],"body":"지분율만으로 판단하지 않습니다. 관련 활동에 대한 힘, 변동이익 노출·권리, 그 힘으로 이익에 영향을 줄 능력 등 지배력 요건을 검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"내부거래 제거","section":"재무 · 연결","kind":"scenario","ref":"consolidation","topicAliases":[],"linkTitle":""}},{"title":"별도 재무제표 이익과 연결 이익이 다른 이유는 무엇인가요?","aliases":[],"body":"연결 범위, 내부거래 제거, 취득 회계, 회계정책 통일, 비지배지분 등이 다릅니다. 단순히 모든 법인 순이익을 더한 값이라고 볼 수 없습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"내부거래 제거","section":"재무 · 연결","kind":"scenario","ref":"consolidation","topicAliases":[],"linkTitle":""}},{"title":"관계기업이 이익 100을 내고 지분 30%면 무조건 이익 30인가요?","aliases":[],"body":"기본 지분 몫은 30이지만 취득 시 공정가치 차이 상각·미실현손익·회계정책 차이 등을 조정할 수 있습니다. 단순 지분 곱만으로 확정하지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"지분법 사례","section":"재무 · 투자","kind":"scenario","ref":"associate","topicAliases":[],"linkTitle":""}},{"title":"관계기업 배당 10을 받으면 지분법 이익도 10인가요?","aliases":[],"body":"지분법에서는 통상 배당 수령이 투자 장부금액 감소입니다. 관계기업 이익에 대한 지분법 손익과 현금 배당을 중복 수익으로 잡지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"지분법 사례","section":"재무 · 투자","kind":"scenario","ref":"associate","topicAliases":[],"linkTitle":""}},{"title":"지분율 20%면 무조건 관계기업인가요?","aliases":[],"body":"유의적인 영향력에 관한 반증 가능한 추정과 이사회 참여·정책 결정 등 사실관계를 봅니다. 지분율 기준만으로 모든 경우를 확정하지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"지분법 사례","section":"재무 · 투자","kind":"scenario","ref":"associate","topicAliases":[],"linkTitle":""}},{"title":"관계기업 손실로 투자 장부가 0이면 계속 손실을 잡나요?","aliases":[],"body":"순투자의 범위·장기지분·추가 법적 또는 의제 의무 등을 검토합니다. 투자 장부금액을 무제한 음수로 만드는 단순 처리와 다릅니다.","formula":"","view":"help","group":"회계","faq":{"topic":"지분법 사례","section":"재무 · 투자","kind":"scenario","ref":"associate","topicAliases":[],"linkTitle":""}},{"title":"감가상각 방법 변경은 회계정책 변경인가요?","aliases":[],"body":"효익 소비 형태에 대한 새 추정에 따른 변경이면 일반적으로 회계추정 변경으로 전진 적용합니다. 정책 변경·오류 수정과 구분합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"정책 추정 오류","section":"재무 · 결산","kind":"scenario","ref":"policies","topicAliases":[],"linkTitle":""}},{"title":"작년 매출 누락을 올해 매출로 넣어도 되나요?","aliases":[],"body":"중요한 과거기간 오류라면 비교 재무제표 재작성 등 소급 수정 원칙을 검토합니다. 발견 연도 매출에 단순 합산하면 기간별 성과가 왜곡됩니다.","formula":"","view":"help","group":"회계","faq":{"topic":"정책 추정 오류","section":"재무 · 결산","kind":"scenario","ref":"policies","topicAliases":[],"linkTitle":""}},{"title":"나중에 결과가 달라졌으면 과거 추정은 모두 오류인가요?","aliases":[],"body":"당시 이용 가능한 신뢰성 있는 정보를 합리적으로 사용했다면 후속 새 정보에 따른 추정 변경일 수 있습니다. 사후 결과만으로 오류라고 단정하지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"정책 추정 오류","section":"재무 · 결산","kind":"scenario","ref":"policies","topicAliases":[],"linkTitle":""}},{"title":"원가 산정 방법을 바꾸면 언제부터 적용하나요?","aliases":[],"body":"회계정책 변경인지 추정 변경인지 먼저 분류합니다. 정책 변경의 소급 적용 원칙·경과규정·실무상 불가능 조건 등을 확인하고 임의로 현재부터만 바꾸지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"정책 추정 오류","section":"재무 · 결산","kind":"scenario","ref":"policies","topicAliases":[],"linkTitle":""}},{"title":"결산 후 고객 파산은 전기 대손에 반영하나요?","aliases":[],"body":"보고기간 말 이미 존재한 신용손상 상태에 대한 추가 증거라면 수정사건을 검토합니다. 결산 후 새 사건만으로 발생한 손실인지 구분합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"보고기간 후 사건","section":"재무 · 결산","kind":"scenario","ref":"events","topicAliases":[],"linkTitle":""}},{"title":"결산 후 화재가 났으면 전기 자산을 줄이나요?","aliases":[],"body":"통상 보고기간 후 새로 발생한 비수정사건으로 보되 중요하면 성격·재무 영향을 공시합니다. 계속기업 판단에 미치는 영향은 별도로 검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"보고기간 후 사건","section":"재무 · 결산","kind":"scenario","ref":"events","topicAliases":[],"linkTitle":""}},{"title":"결산 후 배당을 결의하면 기말 부채인가요?","aliases":[],"body":"보고기간 말 현재 배당 의무가 없었다면 통상 기말 부채로 인식하지 않습니다. 재무제표 발행 승인 전 결의 배당의 공시 요건을 검토합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"보고기간 후 사건","section":"재무 · 결산","kind":"scenario","ref":"events","topicAliases":[],"linkTitle":""}},{"title":"재무제표 승인 후 생긴 정보도 무조건 전기에 반영하나요?","aliases":[],"body":"보고기간 후 사건의 평가 기간은 재무제표 발행 승인일까지가 기본입니다. 승인 후 발견된 과거 오류나 재발행 문제는 별도 기준과 절차를 확인합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"보고기간 후 사건","section":"재무 · 결산","kind":"scenario","ref":"events","topicAliases":[],"linkTitle":""}},{"title":"특수관계자면 거래 가격이 같아도 공시하나요?","aliases":[],"body":"특수관계자 관계·거래·잔액·약정 등 해당 공시 요건을 검토합니다. 정상 가격 거래였다는 주장만으로 관련 공시가 없어지는 것은 아닙니다.","formula":"","view":"help","group":"회계","faq":{"topic":"특수관계자 거래","section":"재무 · 공시","kind":"scenario","ref":"related","topicAliases":[],"linkTitle":""}},{"title":"임원에게 빌려준 돈은 일반 채권과 같나요?","aliases":[],"body":"금융자산 인식·측정과 별개로 특수관계자 거래 공시·승인·이해상충 통제 등을 검토합니다. 명목만 일반 채권으로 바꿔 관계가 사라지지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"특수관계자 거래","section":"재무 · 공시","kind":"scenario","ref":"related","topicAliases":[],"linkTitle":""}},{"title":"연결에서 제거한 내부거래도 모두 공시하나요?","aliases":[],"body":"해당 재무제표가 연결인지 별도인지와 IAS 24의 요구·면제 범위를 확인합니다. 내부 제거와 특수관계자 공시 판단을 같은 문제로 단정하지 않습니다.","formula":"","view":"help","group":"회계","faq":{"topic":"특수관계자 거래","section":"재무 · 공시","kind":"scenario","ref":"related","topicAliases":[],"linkTitle":""}},{"title":"특수관계자 거래가 있으면 곧바로 부정인가요?","aliases":[],"body":"관계 자체가 부정을 뜻하지는 않습니다. 거래 실질·조건·승인·공시·회수 가능성을 확인해 재무제표 이용자가 영향을 판단할 수 있도록 해야 합니다.","formula":"","view":"help","group":"회계","faq":{"topic":"특수관계자 거래","section":"재무 · 공시","kind":"scenario","ref":"related","topicAliases":[],"linkTitle":""}},{"title":"판가 100원 변동비 60원이면 단위 공헌이익은 얼마인가요?","aliases":[],"body":"100−60=40원입니다. 한 개 더 팔 때 고정비 회수와 이익에 기여하는 금액이며 제조·판매 변동비를 모두 포함한 변동비를 써야 합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"공헌이익 사례","section":"관리 · CVP","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"공헌이익이 플러스인데 영업손실이 날 수 있나요?","aliases":[],"body":"가능합니다. 총공헌이익이 고정비보다 작으면 영업손실입니다. 단위 공헌 40원×10개−고정비 500원=영업손실 100원입니다.","formula":"","view":"help","group":"원가","faq":{"topic":"공헌이익 사례","section":"관리 · CVP","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"매출총이익과 공헌이익은 언제 다른가요?","aliases":[],"body":"매출총이익은 매출에서 매출원가를, 공헌이익은 매출에서 제조·판매 변동비를 차감합니다. 고정 제조원가와 변동 판매비의 포함 위치가 다릅니다.","formula":"","view":"help","group":"원가","faq":{"topic":"공헌이익 사례","section":"관리 · CVP","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"할인하면 판매량이 늘 텐데 공헌이익도 늘어나나요?","aliases":[],"body":"단위 공헌 감소와 수량 증가를 함께 비교합니다. 100→90원 할인, 변동비 60원이라면 총공헌 유지에 기존 판매량의 40÷30=1.3333배가 필요합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"공헌이익 사례","section":"관리 · CVP","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"단위 공헌 40원 고정비 1000원 목표이익 200원이면 몇 개 팔아야 하나요?","aliases":[],"body":"(1,000+200)÷40=30개입니다. 판매량에 따른 단가·변동비·고정비 변화가 없다는 관련 범위 가정입니다.","formula":"","view":"help","group":"원가","faq":{"topic":"목표이익 사례","section":"관리 · CVP","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"목표이익이 세후 금액이면 바로 CVP에 넣어도 되나요?","aliases":[],"body":"단순 일정 세율 t 가정에서는 세전 목표이익=세후 목표이익÷(1−t)로 바꿉니다. 실제 세금·금융비용·결손 공제 등 복합 조건은 따로 고려합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"목표이익 사례","section":"관리 · CVP","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"원가 100원에 이익률 20%면 판가가 120원인가요?","aliases":[],"body":"원가 대비 가산율 20%면 120원이지만 매출 대비 마진 20%라면 100÷0.8=125원입니다. 이익률의 분모를 명확히 해야 합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"목표이익 사례","section":"관리 · CVP","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"매출 연동 수수료 5%와 목표마진 20%가 있으면 판가는 어떻게 구하나요?","aliases":[],"body":"단위당 다른 원가 C라면 P=C÷(1−0.05−0.20)입니다. 수수료가 이미 C에 포함되어 있지 않은지, 고정비를 어떤 수량으로 나눴는지 확인합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"목표이익 사례","section":"관리 · CVP","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"제품 A 공헌 40원 B 공헌 20원을 1대1로 팔면 평균 공헌은 얼마인가요?","aliases":[],"body":"단위 수량 믹스가 1:1이면 가중평균 단위 공헌은 30원입니다. 매출액 비율로 가중하는 공헌이익률과 혼동하지 않습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"판매 믹스","section":"관리 · CVP","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"여러 제품의 BEP는 제품별 BEP를 더하면 되나요?","aliases":[],"body":"공통 고정비와 일정 판매 믹스 가정에서 복합단위 공헌이익 또는 가중평균 공헌이익률로 계산합니다. 공통 고정비를 중복 사용해 개별 BEP를 합산하지 않습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"판매 믹스","section":"관리 · CVP","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"매출액은 같은데 이익이 줄면 믹스 때문일 수 있나요?","aliases":[],"body":"고공헌 제품 비중이 낮아지면 같은 매출액에서도 총공헌이익이 줄 수 있습니다. 판가·원가·수량과 별도로 구성비 효과를 비교합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"판매 믹스","section":"관리 · CVP","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"고마진율 제품만 늘리면 최적 믹스인가요?","aliases":[],"body":"제약 자원이 있으면 단위 제품 마진율보다 제약 자원 1단위당 공헌이익이 중요할 수 있습니다. 수요 상한·가동능력·필수 제품도 고려합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"판매 믹스","section":"관리 · CVP","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"판가와 단위변동비가 같으면 손익분기 수량은 얼마인가요?","aliases":[],"body":"단위 공헌이 0이므로 양의 고정비를 회수할 유한한 판매량이 없습니다. 고정비÷0을 0으로 처리하면 안 됩니다.","formula":"","view":"help","group":"원가","faq":{"topic":"손익분기 경계","section":"관리 · CVP","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"판가가 단위변동비보다 낮아도 많이 팔면 흑자가 되나요?","aliases":[],"body":"추가 판매마다 공헌손실이 커지므로 같은 조건에서는 양의 고정비를 회수하지 못합니다. 전략적 예외는 연계 매출 등 증분 효과를 별도 입증해야 합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"손익분기 경계","section":"관리 · CVP","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"BEP가 25.2개면 25개만 팔아도 되나요?","aliases":[],"body":"분할 판매가 불가능하고 조건이 일정하면 손실을 피하기 위해 최소 26개가 필요합니다. 소수 수량을 허용하는 kg 기준과 구분합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"손익분기 경계","section":"관리 · CVP","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"생산능력이 BEP보다 낮으면 무엇을 조정해야 하나요?","aliases":[],"body":"현 판매 구조로는 가동만 늘려 손익분기에 도달하기 어렵습니다. 가격·변동비·고정비·믹스·외주·능력 확대의 증분 효과를 비교합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"손익분기 경계","section":"관리 · CVP","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"매출 1000 손익분기매출 800이면 안전한계율은 얼마인가요?","aliases":[],"body":"(1,000−800)÷1,000=20%입니다. 같은 가격·원가·믹스 조건에서 손익분기까지 매출이 감소할 여유를 나타냅니다.","formula":"","view":"help","group":"원가","faq":{"topic":"안전한계와 레버리지","section":"관리 · CVP","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"공헌이익 400 영업이익 100이면 영업레버리지는 얼마인가요?","aliases":[],"body":"400÷100=4배입니다. 현 조업점 근처에서 매출 1% 변동에 영업이익이 약 4% 변하는 민감도로 보며 큰 변화에 그대로 외삽하지 않습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"안전한계와 레버리지","section":"관리 · CVP","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"영업이익이 0이면 레버리지도 0인가요?","aliases":[],"body":"공헌이익÷영업이익의 분모가 0이므로 정의되지 않습니다. 손익분기점 부근의 높은 민감도를 0배로 표시하면 해석이 반대가 됩니다.","formula":"","view":"help","group":"원가","faq":{"topic":"안전한계와 레버리지","section":"관리 · CVP","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"고정비가 높은 사업은 왜 이익 변동이 큰가요?","aliases":[],"body":"고정비가 단기적으로 유지되면 매출 증감에 따른 공헌이익 변화가 작은 영업이익에 크게 작용할 수 있습니다. 실제 변동비율·현재 조업점을 함께 봅니다.","formula":"","view":"help","group":"원가","faq":{"topic":"안전한계와 레버리지","section":"관리 · CVP","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"이미 쓴 개발비는 신규 주문 판단에 넣나요?","aliases":[],"body":"회수 불가능한 과거 지출은 매몰원가로서 미래 대안 간 차이가 없습니다. 다만 추가 개발·수정·납기 비용은 증분원가로 포함합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"관련원가","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"장부가가 있는 설비를 놀리면 기회원가는 얼마인가요?","aliases":[],"body":"장부가 자체와 달리 최선의 대체 사용에서 포기하는 순현금 유입이 기회원가입니다. 팔 수 있는 순처분가나 다른 제품 공헌을 검토합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"관련원가","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"회계에 기록되지 않은 비용도 의사결정에 필요한가요?","aliases":[],"body":"포기하는 대체 이익인 기회원가는 장부 비용이 아니어도 관련원가입니다. 회계 장부 대사와 경제적 대안 비교의 목적을 구분합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"관련원가","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"고정비는 모두 의사결정과 무관한가요?","aliases":[],"body":"대안 선택으로 회피하거나 추가 발생하면 고정비도 관련원가입니다. 공통 배부액이 남는지 실제 계약·인력·설비 지출이 사라지는지를 확인합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"관련원가","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"유휴설비 특별주문 가격은 총원가보다 낮으면 거절하나요?","aliases":[],"body":"유휴능력과 정상 판매 잠식이 없으면 추가 수익과 증분원가·기회비용을 비교합니다. 이미 발생하는 공통 고정비 배부액만으로 거절하지 않습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"특별주문","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"특별주문 100개에 개당 70원 증분비 50원이면 이익 효과는 얼마인가요?","aliases":[],"body":"추가 셋업·판매 잠식이 없으면 100×(70−50)=2,000원 증가입니다. 주문 전용 고정비가 있으면 추가 차감합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"특별주문","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"정상 판매를 포기해야 하는 특별주문은 무엇을 더 보나요?","aliases":[],"body":"포기한 정상 판매의 공헌이익을 기회비용에 포함합니다. 가격이 변동비보다 높다는 사실만으로 주문이 유리하다고 할 수 없습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"특별주문","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"특별주문이 단기 흑자면 항상 받아야 하나요?","aliases":[],"body":"고객 가격 노출·정상시장 잠식·품질·납기·장기계약·신용 위험을 함께 검토합니다. 단기 증분이익은 필요 판단 요소지만 전체 전략 결론은 아닙니다.","formula":"","view":"help","group":"원가","faq":{"topic":"특별주문","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"배부 고정비가 20원인데 외주 전환 때 절약되나요?","aliases":[],"body":"실제로 없어지는 지출인지 확인해야 합니다. 공통 공장 임차료가 남는다면 제품 배부액 20원은 외주 전환의 절감액이 아닙니다.","formula":"","view":"help","group":"원가","faq":{"topic":"자가제조와 구매","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"자가제조 회피원가 80 외주가격 90이면 무조건 제조인가요?","aliases":[],"body":"외주로 비운 자원을 다른 곳에 써 얻을 공헌, 품질·운송·검수 비용 등도 포함합니다. 다른 차이가 없다면 회피원가 80인 제조가 10 유리합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"자가제조와 구매","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"유휴능력에 대체 용도가 없으면 외주의 기회편익이 있나요?","aliases":[],"body":"대체 용도의 순편익이 없다면 그 항목은 0일 수 있습니다. 단순 장부 감가를 외주로 절약하는 현금으로 보지 않습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"자가제조와 구매","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"외주 비교에서 매입 가격 외에 무엇을 넣나요?","aliases":[],"body":"운송·관세·검수·불량·안전재고·공급 중단 위험·계약 최소 물량과 회피 가능한 내부 지출을 같은 수량·기간 기준으로 비교합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"자가제조와 구매","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"제품 영업이익이 적자면 바로 중단해야 하나요?","aliases":[],"body":"공통비 배부 후 적자일 수 있습니다. 중단으로 잃는 공헌이익과 실제 회피 가능한 고정비, 연계 판매·대체 사용의 효과를 비교합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"제품 중단","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"공헌이익 100 회피고정비 60이면 중단 효과는 얼마인가요?","aliases":[],"body":"다른 효과가 없다면 고정비 60을 절약하지만 공헌 100을 잃어 전체 이익은 40 감소합니다. 남는 공통비를 절감으로 세지 않습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"제품 중단","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"제품 중단 후 다른 제품 이익이 줄어 보이는 이유는 무엇인가요?","aliases":[],"body":"없어진 제품이 부담하던 공통 고정비가 다른 제품에 재배부될 수 있습니다. 표시상 배부 변화와 회사 전체의 실제 비용 절감을 구분합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"제품 중단","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"중단 제품이 다른 제품 매출을 돕는다면 어떻게 하나요?","aliases":[],"body":"연계 판매를 잃는 증분 공헌이익을 중단 비용에 포함합니다. 해당 고객·제품 간 관계를 추정하고 중복 집계하지 않습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"제품 중단","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"A 공헌 60에 기계 3시간 B 공헌 50에 1시간이면 우선 제품은 무엇인가요?","aliases":[],"body":"기계시간이 유일한 제약이고 수요·기타 조건이 같으면 A는 시간당 20, B는 50이므로 B가 우선입니다. 제품당 공헌액만 비교하지 않습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"병목자원","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"병목이 두 개면 시간당 공헌 순서만으로 최적화되나요?","aliases":[],"body":"복수 자원 제약에서는 단일 순위법이 최적을 보장하지 않습니다. 수요 상한과 자원별 소요량을 포함한 선형계획 등의 방법을 검토합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"병목자원","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"병목 1시간을 추가 구매할 최대 금액은 무엇인가요?","aliases":[],"body":"추가 시간으로 얻는 최선의 증분 공헌이 기회가치의 출발점입니다. 다른 자원·수요가 새 제약이 되는 범위와 추가 비용을 고려합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"병목자원","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"타워 수만 알면 생산능력을 자동 계산할 수 있나요?","aliases":[],"body":"타워별 처리량·배치 시간·제품 수율·세정·교대·공동 사용 제약이 추가로 필요합니다. FPA 타워 수 입력은 배부 가중치이며 자동 최적 생산계획 엔진은 아닙니다.","formula":"","view":"help","group":"원가","faq":{"topic":"병목자원","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"분리점 매출 100 추가가공 후 140 추가비 25면 가공하나요?","aliases":[],"body":"증분 수익 40에서 추가가공비 25를 빼면 15 유리합니다. 분리점 전 공통 결합원가는 두 대안에 동일하면 판단에서 제외합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"추가가공","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"결합원가 배부액이 크면 추가가공을 거절하나요?","aliases":[],"body":"결합원가는 이미 발생한 공통 원가일 수 있어 추가가공 판단에는 증분 수익·추가 원가·기회비용을 사용합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"추가가공","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"추가가공에 병목 설비가 필요하면 무엇을 더 차감하나요?","aliases":[],"body":"그 설비를 다른 최선 용도에 사용할 때 얻을 공헌이익을 기회비용으로 포함합니다. 단순 추가 재료·노무만으로 판단하지 않습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"추가가공","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"추가가공 판매가격 상승이 모두 이익인가요?","aliases":[],"body":"추가 수율 손실·포장·판매수수료·가공·보관·품질 비용과 판매 가능 수량 변화를 차감한 순증분 효과를 봅니다.","formula":"","view":"help","group":"원가","faq":{"topic":"추가가공","section":"관리 · 의사결정","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"결합원가 100을 판매가치 60대40으로 배부하면 얼마인가요?","aliases":[],"body":"같은 분리점 판매가치 기준이라면 60과 40입니다. 배부 방법은 재고 평가 목적이며 추가가공 의사결정의 관련원가와 구분합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"결합원가 배부","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"분리점 시장가격이 없으면 어떻게 배부하나요?","aliases":[],"body":"최종 판매가치에서 분리 후 추가 원가를 차감한 순실현가능가치 등 합리적 방법을 검토합니다. 수량·원가 범위를 일관되게 맞춥니다.","formula":"","view":"help","group":"원가","faq":{"topic":"결합원가 배부","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"물량 기준과 판매가치 기준은 같은 결과인가요?","aliases":[],"body":"제품별 물리적 수량과 경제적 가치가 다르면 크게 달라질 수 있습니다. kg·L 등 물량 단위의 비교 가능성도 확인합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"결합원가 배부","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"부산물 매각대금은 모두 주제품 매출인가요?","aliases":[],"body":"중요성과 회계정책에 따라 부산물 측정·주제품 원가 차감 등의 처리를 검토합니다. 부산물 수익과 원가 차감을 동시에 반영하지 않습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"결합원가 배부","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"셋업 원가 100만원 총 50회 A가 10회면 배부액은 얼마인가요?","aliases":[],"body":"회당 2만원이고 A에 20만원을 배부합니다. 원가풀의 활동·기간과 총 셋업 횟수를 일치시킵니다.","formula":"","view":"help","group":"원가","faq":{"topic":"활동기준원가 사례","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"검사비를 생산 kg로 배부하면 왜 왜곡될 수 있나요?","aliases":[],"body":"소량 배치라도 같은 검사 횟수가 필요할 수 있습니다. 검사 건수·시간 같은 원가동인을 쓰면 물량과 무관한 활동 소비 차이를 보여줍니다.","formula":"","view":"help","group":"원가","faq":{"topic":"활동기준원가 사례","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"ABC면 공통비가 전부 정확한 직접비가 되나요?","aliases":[],"body":"활동과 동인 선택의 추정·측정 한계가 남습니다. 기업 유지 활동·유휴능력 비용을 제품에 어떻게 표시할지도 정책이 필요합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"활동기준원가 사례","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"ABC 도입 때 원가풀과 배부액 합계는 어떻게 검산하나요?","aliases":[],"body":"활동별 원가풀 총액과 제품 배부액 및 별도 유휴·미배부 금액의 합계가 일치하는지 확인합니다. 활동 간 같은 지출 중복을 제거합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"활동기준원가 사례","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"직접배부법은 보조부문 간 서비스를 반영하나요?","aliases":[],"body":"보조부문 상호 서비스를 무시하고 제조부문에 직접 배부합니다. 단순하지만 상호 용역이 크면 왜곡될 수 있습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"보조부문 배부 사례","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"단계배부법에서 순서가 왜 중요한가요?","aliases":[],"body":"먼저 배부한 부문을 다시 열지 않아 후순위에서 선순위로 제공한 용역이 반영되지 않을 수 있습니다. 순서에 따라 결과가 달라집니다.","formula":"","view":"help","group":"원가","faq":{"topic":"보조부문 배부 사례","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"상호배부법은 무엇을 연립방정식으로 푸나요?","aliases":[],"body":"각 보조부문의 원래 원가에 다른 보조부문에서 받은 용역 원가를 더한 총원가를 구한 뒤 제조부문으로 배부합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"보조부문 배부 사례","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"FPA 공장·제품 2단계 배부가 상호배부법인가요?","aliases":[],"body":"아닙니다. 현재 공통 풀을 공장과 제품에 순차 배부하는 구조이며 보조부문 상호 용역 연립방정식을 자동 계산하는 모형은 아닙니다.","formula":"","view":"help","group":"원가","faq":{"topic":"보조부문 배부 사례","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"작업별 재료 100 노무 50 간접배부 30이면 작업원가는 얼마인가요?","aliases":[],"body":"합계 180입니다. 예정배부액이라면 실제 제조간접비와의 차이를 기말에 별도로 정산하는지 확인합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"개별원가 사례","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"예정배부율은 언제 계산하나요?","aliases":[],"body":"일반적으로 예산 제조간접비를 예정 배부기준량으로 나누어 기간 전에 설정합니다. 실제 비용과 실제 활동으로 사후 계산한 비율과 구분합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"개별원가 사례","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"예산간접비 1000 예정시간 100 실제작업 8시간이면 배부액은 얼마인가요?","aliases":[],"body":"예정배부율은 시간당 10이고 해당 작업 배부액은 80입니다. 실제 총발생액이 다르면 과대·과소배부를 별도로 분석합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"개별원가 사례","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"과소배부는 작업원가가 실제보다 낮았다는 뜻인가요?","aliases":[],"body":"총 실제 제조간접비가 총배부액보다 크다는 뜻입니다. 중요성·원인에 따라 매출원가 또는 재공·제품 등 배분 처리를 검토합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"개별원가 사례","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"완성 80개 기말재공 20개 가공도 50%면 평균법 가공환산량은 얼마인가요?","aliases":[],"body":"80+20×50%=90개입니다. 재료를 공정 초기에 전량 투입했다면 재료환산량은 100개가 될 수 있어 가공과 구분합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"종합원가 평균법 사례","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"평균법은 기초재공 원가를 당기 원가와 섞나요?","aliases":[],"body":"기초재공 원가와 당기 발생원가를 합쳐 원가요소별 평균 단가를 계산합니다. FIFO의 당기 작업량·당기 원가 분리와 다릅니다.","formula":"","view":"help","group":"원가","faq":{"topic":"종합원가 평균법 사례","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"재료를 공정 말에 넣으면 기말재공 재료환산량도 100%인가요?","aliases":[],"body":"투입점에 도달하지 않은 기말재공은 해당 재료의 투입을 반영하지 않습니다. 재료 투입 시점과 가공완성도를 별도로 봅니다.","formula":"","view":"help","group":"원가","faq":{"topic":"종합원가 평균법 사례","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"현재 FPA도 재공품 환산량을 계산하나요?","aliases":[],"body":"현재 손익은 당월 양품 생산분 전량판매 모형입니다. 재공품·완성품 재고 평가와 종합원가 환산량 계산은 일반 학습·별도 계산 도구와 구분됩니다.","formula":"","view":"help","group":"원가","faq":{"topic":"종합원가 평균법 사례","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"기초 20개 가공도 40%를 완성하면 당기 가공량은 얼마인가요?","aliases":[],"body":"FIFO에서 기초재공 완성에 필요한 당기 작업은 20×60%=12개 환산량입니다. 이미 전기에 수행한 40%는 당기 작업에서 제외합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"종합원가 FIFO 사례","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"FIFO는 기초재공 원가를 평균 단가에 섞나요?","aliases":[],"body":"기초재공의 이월 원가와 당기 원가를 구분하며 당기 단가는 당기 원가÷당기 환산량으로 계산합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"종합원가 FIFO 사례","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"기초 20 완성 80 기말 20이면 당기착수완성은 몇 개인가요?","aliases":[],"body":"기초재공이 모두 먼저 완성되었다는 단순 가정에서 80−20=60개입니다. 감손·추가 투입 등은 별도로 조정합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"종합원가 FIFO 사례","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"원가가 오르면 평균법과 FIFO 단가가 왜 다르나요?","aliases":[],"body":"평균법은 전기 원가와 당기 원가를 섞고 FIFO는 당기 원가를 분리하므로 시점별 원가 차이가 결과에 반영됩니다. 물량 흐름과 계산 가정을 일치시킵니다.","formula":"","view":"help","group":"원가","faq":{"topic":"종합원가 FIFO 사례","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"정상공손은 누가 부담하나요?","aliases":[],"body":"정상적으로 발생하는 공손 원가는 해당 공손을 부담해야 하는 양품·재공 등에 검사 시점·공정 진행도를 고려해 배부합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"공손과 감손","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"비정상공손도 양품 단가에 모두 넣나요?","aliases":[],"body":"비정상적으로 낭비된 원가는 재고 원가에서 제외하고 기간 비용으로 인식하는 원칙을 검토합니다. 정상 손실과 분리해야 효율 비교가 가능합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"공손과 감손","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"검사점 전 기말재공도 공손을 부담하나요?","aliases":[],"body":"검사점 도달 여부와 원가계산 방법에 따라 부담 범위가 달라질 수 있습니다. 공정 완성도만 보고 모든 재공에 일률 배부하지 않습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"공손과 감손","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"수율 개선 90%에서 95%면 투입량이 5% 줄어드나요?","aliases":[],"body":"동일 양품량에서 투입 비율은 90÷95≈94.7368%이므로 약 5.2632% 감소합니다. 5%p 상승과 투입량 감소율은 다릅니다.","formula":"","view":"help","group":"원가","faq":{"topic":"공손과 감손","section":"관리 · 원가계산","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"실제 사용 100kg 실제단가 12 표준단가 10이면 가격차이는 얼마인가요?","aliases":[],"body":"사용시점 분석에서는 100×(12−10)=200 불리입니다. 구매 시점 분석은 구매수량을 사용하는 별도 기준일 수 있습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"재료가격 차이 사례","section":"관리 · 차이분석","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"재료를 120kg 사고 100kg 썼으면 가격차이 수량은 어느 것인가요?","aliases":[],"body":"구매 시 가격차이를 인식하는 체계면 구매 120kg, 사용 시 분석이면 사용 100kg입니다. 수량차이와 총차이 대사에 어떤 체계를 쓰는지 명시합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"재료가격 차이 사례","section":"관리 · 차이분석","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"구매 단가가 싸면 반드시 유리한 의사결정인가요?","aliases":[],"body":"낮은 품질로 투입량·불량·검사·정지 비용이 증가할 수 있습니다. 가격차이만 보지 말고 수량차이와 총증분원가를 함께 봅니다.","formula":"","view":"help","group":"원가","faq":{"topic":"재료가격 차이 사례","section":"관리 · 차이분석","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"가격차이 양수가 왜 불리인가요?","aliases":[],"body":"실제−표준 방식에서는 실제 단가가 높아 원가 초과가 양수입니다. 보고서가 표준−실제를 쓰는 경우 부호가 반대이므로 정의를 먼저 확인합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"재료가격 차이 사례","section":"관리 · 차이분석","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"실제 투입 110kg 표준허용 100kg 표준단가 10이면 수량차이는 얼마인가요?","aliases":[],"body":"10×(110−100)=100 불리입니다. 허용 표준량은 예산 생산량이 아니라 실제 산출량에 허용된 표준 투입량입니다.","formula":"","view":"help","group":"원가","faq":{"topic":"재료수량 차이 사례","section":"관리 · 차이분석","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"실제 생산이 늘면 표준허용수량도 늘어나나요?","aliases":[],"body":"단위당 표준 투입량이 같다면 실제 산출량 증가에 맞춰 허용 표준량도 증가합니다. 단순 정태 예산 투입량과 비교하면 물량 효과가 섞입니다.","formula":"","view":"help","group":"원가","faq":{"topic":"재료수량 차이 사례","section":"관리 · 차이분석","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"가격차이 200 수량차이 100이면 총차이는 얼마인가요?","aliases":[],"body":"동일한 사용시점 체계와 수량 범위라면 총재료 원가차이는 300 불리입니다. 구매시점 가격차이와는 재고 수량 차이를 대사해야 합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"재료수량 차이 사례","section":"관리 · 차이분석","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"배합 변화와 수율 변화는 같은 차이인가요?","aliases":[],"body":"재료 투입 구성비 변화인 배합차이와 총투입 대비 산출 효율인 수율차이를 구분할 수 있습니다. 같은 총차이를 중복 합산하지 않습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"재료수량 차이 사례","section":"관리 · 차이분석","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"실제 100시간 임률 12 표준임률 10이면 임률차이는 얼마인가요?","aliases":[],"body":"100×(12−10)=200 불리입니다. 숙련 인력·초과근무 가산·인력 믹스 등의 원인을 확인합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"노무 차이 사례","section":"관리 · 차이분석","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"실제 110시간 허용 100시간 표준임률 10이면 능률차이는 얼마인가요?","aliases":[],"body":"10×(110−100)=100 불리입니다. 허용 시간은 실제 생산량 기준이며 계획 생산량 기준 시간과 비교하지 않습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"노무 차이 사례","section":"관리 · 차이분석","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"고임금 숙련자를 쓰면 임률차이가 불리하니 나쁜가요?","aliases":[],"body":"시간·불량·정지 감소로 능률차이가 더 유리해질 수 있습니다. 임률과 능률의 합 및 품질·납기 효과를 함께 비교합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"노무 차이 사례","section":"관리 · 차이분석","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"작업 대기시간도 노무능률차이인가요?","aliases":[],"body":"분석 체계에 따라 유휴시간 차이 등을 별도 구분할 수 있습니다. 설비 고장·자재 지연·인력 효율을 원인별로 나누고 책임을 일괄 작업자에게 돌리지 않습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"노무 차이 사례","section":"관리 · 차이분석","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"실제 110시간 표준율 3 실제변동간접비 350이면 소비차이는 얼마인가요?","aliases":[],"body":"실제액−실제시간×표준율=350−330=20 불리입니다. 시간 기준 변동간접비의 2분법 단순 예입니다.","formula":"","view":"help","group":"원가","faq":{"topic":"변동간접비 차이","section":"관리 · 차이분석","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"허용 100시간 실제 110시간 표준율 3이면 변동간접비 능률차이는 얼마인가요?","aliases":[],"body":"3×(110−100)=30 불리입니다. 실제 산출량의 허용 표준시간을 사용합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"변동간접비 차이","section":"관리 · 차이분석","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"변동간접비 소비차이 20 능률차이 30이면 총차이는 얼마인가요?","aliases":[],"body":"같은 시간 기준과 2분법에서는 50 불리입니다. 실제액 350−표준배부액 300과 일치합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"변동간접비 차이","section":"관리 · 차이분석","kind":"scenario","ref":"cost","topicAliases":[],"linkTitle":""}},{"title":"전력비 topicAliases":[],"linkTitle":""}},{"title":"예산을 초과했는데 효율이 좋아질 수 있나요?","aliases":[],"body":"실제 물량이 예상보다 많이 늘면 총비용은 커져도 같은 실제 물량 기준 변동예산보다 비용이 적을 수 있습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"변동예산 사례","section":"관리 · 예산","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"변동예산은 고정비도 판매량 비율로 늘리나요?","aliases":[],"body":"관련 범위 안에서는 고정비 총액을 유지합니다. 추가 교대조·설비 등으로 범위를 벗어나면 단계별 고정비를 재설정합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"변동예산 사례","section":"관리 · 예산","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"예산 100개 10원 실제 120개 11원이면 가격효과는 얼마인가요?","aliases":[],"body":"실제수량 기준 분해에서는 120×(11−10)=120 유리입니다. 단위가 원이면 금액도 원이며 다른 분해 순서와 혼용하지 않습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"매출 가격 물량 차이","section":"관리 · 차이분석","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"예산 100개 실제 120개 예산단가 10원이면 물량효과는 얼마인가요?","aliases":[],"body":"예산단가 기준으로 (120−100)×10=200 유리입니다. 가격효과 120과 합하면 매출 차이 320입니다.","formula":"","view":"help","group":"원가","faq":{"topic":"매출 가격 물량 차이","section":"관리 · 차이분석","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"가격효과와 수량효과 합이 왜 매출 차이와 안 맞나요?","aliases":[],"body":"교차효과의 귀속 기준·통화·제품 믹스·누락 행이 다를 수 있습니다. 실제수량 가격효과와 예산단가 수량효과처럼 일관된 분해를 사용합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"매출 가격 물량 차이","section":"관리 · 차이분석","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"환율효과와 판가효과를 각각 실제수량으로 계산하면 되나요?","aliases":[],"body":"USD 단가×환율의 교차효과가 있어 순서를 정한 연결 분해가 필요합니다. 각 요인을 독립 증감액으로 더하면 교차효과를 중복 또는 누락할 수 있습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"매출 가격 물량 차이","section":"관리 · 차이분석","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"매출 100 중 당월 회수 60%면 현금 유입은 얼마인가요?","aliases":[],"body":"해당 매출에서 당월 회수액은 60입니다. 전월 채권 회수·선수금·부가세 등은 별도 현금 항목으로 반영합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"현금예산 사례","section":"관리 · 예산","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"감가상각비는 현금 지출 예산에 넣나요?","aliases":[],"body":"감가 자체는 당기 현금 지급이 아닙니다. 설비 취득 현금 지출·리스 원금·유지투자 등 실제 현금 항목을 별도로 편성합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"현금예산 사례","section":"관리 · 예산","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"현금예산 부족액은 곧 당기 적자인가요?","aliases":[],"body":"아닙니다. 흑자라도 채권 회수 지연·재고·설비투자로 현금이 부족할 수 있고 적자라도 차입·자산 매각으로 현금이 늘 수 있습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"현금예산 사례","section":"관리 · 예산","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"최저 현금 20 기말 예상 5면 필요 차입은 얼마인가요?","aliases":[],"body":"이자·수수료·차입 단위 제약이 없다는 단순 가정에서 15입니다. 실제로는 차입 시점·한도·이자 지급도 함께 계획합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"현금예산 사례","section":"관리 · 예산","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"매출채권 100 연매출 1200이면 DSO는 얼마인가요?","aliases":[],"body":"같은 기간·부가세 범위와 365일 가정에서 100÷1,200×365≈30.42일입니다. 가능하면 평균 매출채권과 외상 매출 기준을 맞춥니다.","formula":"","view":"help","group":"원가","faq":{"topic":"회전일수 사례","section":"관리 · 운전자본","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"재고일수는 매출액으로 나누나요?","aliases":[],"body":"일반적으로 평균재고를 같은 원가 기준 매출원가로 나눠 일수를 곱합니다. 매출채권 일수의 매출액 분모와 구분합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"회전일수 사례","section":"관리 · 운전자본","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"DSO 30 DIO 40 DPO 25면 현금전환주기는 얼마인가요?","aliases":[],"body":"30+40−25=45일입니다. 회계 분류·기간·평균잔액과 매입채무 분모의 일관성을 확인합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"회전일수 사례","section":"관리 · 운전자본","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"FPA에서 현금전환주기를 자동 계산할 수 있나요?","aliases":[],"body":"현재 모형은 채권·채무·재고 잔액과 회수·지급 일정을 수집하지 않습니다. 전량판매 손익만으로 운전자본·현금전환주기를 확정할 수 없습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"회전일수 사례","section":"관리 · 운전자본","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"초기투자 100 1년 후 현금 110 할인율 10%면 NPV는 얼마인가요?","aliases":[],"body":"−100+110÷1.1=0입니다. 이 조건에서 정확히 요구수익률을 충족하며 투자 시점은 0기, 수입은 1기 말로 가정합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"NPV 사례","section":"관리 · 투자","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"투자분석에 회계이익 대신 현금흐름을 쓰는 이유는 무엇인가요?","aliases":[],"body":"가치 평가는 시점별 실제 자원 유출입의 현재가치를 비교하기 때문입니다. 감가·운전자본·세금·잔존가치와 증분 효과를 구분합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"NPV 사례","section":"관리 · 투자","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"설비투자에 기존 본사 배부비도 현금 유출로 넣나요?","aliases":[],"body":"투자 때문에 실제로 늘거나 회피되는 현금인지 봅니다. 기존 공통비 배부액이 그대로 남으면 증분 투자 현금흐름이 아닐 수 있습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"NPV 사례","section":"관리 · 투자","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"투자 종료 시 운전자본 회수는 넣나요?","aliases":[],"body":"실제로 회수 가능한 증분 운전자본은 종료 현금 유입에 반영합니다. 회수 시점·대손·폐기·세효과를 검토하고 투자 때 넣은 금액과 대사합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"NPV 사례","section":"관리 · 투자","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"IRR이 WACC보다 높으면 항상 최선 투자안인가요?","aliases":[],"body":"독립적 정상 현금흐름에서는 수용 판단에 도움되지만 상호배타안의 규모·시점 차이에는 NPV 순위와 충돌할 수 있습니다. 기업가치 증분을 함께 봅니다.","formula":"","view":"help","group":"원가","faq":{"topic":"IRR와 회수기간","section":"관리 · 투자","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"현금흐름 부호가 여러 번 바뀌면 IRR은 어떻게 되나요?","aliases":[],"body":"복수 IRR 또는 해가 없는 경우가 생길 수 있습니다. NPV 프로파일·적절한 할인율을 사용한 가치 판단을 확인합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"IRR와 회수기간","section":"관리 · 투자","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"단순 회수기간은 돈의 시간가치를 반영하나요?","aliases":[],"body":"할인하지 않는 단순 회수기간은 시간가치를 반영하지 않고 회수 이후 현금흐름도 무시합니다. 할인 회수기간과 NPV를 함께 봅니다.","formula":"","view":"help","group":"원가","faq":{"topic":"IRR와 회수기간","section":"관리 · 투자","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"초기 100 매년 40 현금이면 단순 회수기간은 얼마인가요?","aliases":[],"body":"연중 현금 유입이 균등하다는 보간 가정에서 2.5년입니다. 연말에만 유입되고 분할 회수가 불가하다고 보는 가정이면 3번째 유입 시점에 회수됩니다.","formula":"","view":"help","group":"원가","faq":{"topic":"IRR와 회수기간","section":"관리 · 투자","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"부문이익 20 평균자산 100이면 ROI는 얼마인가요?","aliases":[],"body":"20÷100=20%입니다. 이익의 세전·세후 정의와 자산의 평균·기말·장부·경제가치 기준을 일치시킵니다.","formula":"","view":"help","group":"원가","faq":{"topic":"ROI와 RI 사례","section":"관리 · 성과평가","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"현재 ROI 20%인 부문이 15% 투자안을 거절할 수 있나요?","aliases":[],"body":"요구수익률이 10%라면 회사에 유리해도 부문 평균 ROI를 낮춰 관리자가 거절할 유인이 있습니다. 잔여이익 등 보완 지표를 검토합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"ROI와 RI 사례","section":"관리 · 성과평가","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"이익 20 자산 100 요구수익률 10%면 잔여이익은 얼마인가요?","aliases":[],"body":"20−100×10%=10입니다. 요구수익을 초과한 이익이며 규모가 다른 부문을 단독 절대액으로 비교하는 한계도 있습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"ROI와 RI 사례","section":"관리 · 성과평가","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"오래된 설비 부문 ROI가 높은 이유는 무엇인가요?","aliases":[],"body":"감가로 장부 자산 분모가 작아져 동일 이익에서도 ROI가 높아질 수 있습니다. 설비 연령·교체 투자·평균 자산 측정 기준을 함께 비교합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"ROI와 RI 사례","section":"관리 · 성과평가","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"유휴능력에서 내부 공급 최저가격은 무엇인가요?","aliases":[],"body":"다른 영향이 없다면 증분원가와 기회비용의 합이 경제적 하한입니다. 유휴능력이라도 운송·검수·추가 고정비 등 차이를 포함합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"이전가격","section":"관리 · 성과평가","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"외부 판매를 포기하면 내부 이전가격 하한은 달라지나요?","aliases":[],"body":"포기하는 외부 공헌이익이 기회비용에 추가됩니다. 증분원가만 보상하면 공급 부문의 경제적 희생을 반영하지 못할 수 있습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"이전가격","section":"관리 · 성과평가","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"내부 이전가격을 올리면 연결 이익도 늘어나나요?","aliases":[],"body":"같은 그룹 내 이익 배분만 달라지는 경우 연결 총이익은 변하지 않습니다. 외부 세금·관세·행동 변화 등의 실제 효과는 별도 검토합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"이전가격","section":"관리 · 성과평가","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"원가 기준 이전가격은 항상 공정한가요?","aliases":[],"body":"비효율 원가 전가·고정비 회수·부문 동기 문제를 만들 수 있습니다. 시장가격·협상·표준원가·이중가격 등 목적과 자율성에 맞는 정책을 검토합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"이전가격","section":"관리 · 성과평가","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"예산과 최신 전망은 같은 숫자로 계속 바꾸나요?","aliases":[],"body":"승인 예산은 책임·목표의 기준으로 보존하고 최신 전망은 현재 정보의 예상 결과로 별도 관리하는 편이 비교에 유리합니다. 버전·기준일을 구분합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"시나리오와 예측","section":"관리 · 계획","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"시나리오에서 같은 10%를 두 번 적용하면 21% 오르나요?","aliases":[],"body":"현재 FPA 변수 조정은 저장된 기준값에 대한 상대 조정이므로 같은 10%를 다시 적용해도 누적 21%가 되지 않습니다. 직접 수정·기준 변경과는 구분합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"시나리오와 예측","section":"관리 · 계획","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"환율 시나리오를 만들 때 어떤 값을 고정해야 하나요?","aliases":[],"body":"판매·원재료 통화와 환율 적용 범위, 물량·판가·수율·기타 원단위 가정을 명시합니다. 환율 영향만 볼지 연동 판가까지 바꿀지 목적을 먼저 정합니다.","formula":"","view":"help","group":"원가","faq":{"topic":"시나리오와 예측","section":"관리 · 계획","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}},{"title":"낙관 시나리오에서 모든 변수를 유리하게 바꾸면 되나요?","aliases":[],"body":"수요 증가에 따른 추가 인력·원재료 조달·능력 제약 같은 상관관계를 함께 검토합니다. 현재 FPA는 사용자가 정한 가정을 계산하며 현실 가능성을 자동 보증하지 않습니다.","formula":"","view":"help","group":"원가","faq":{"topic":"시나리오와 예측","section":"관리 · 계획","kind":"scenario","ref":"managerial","topicAliases":[],"linkTitle":""}}];
